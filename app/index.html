<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>districtry</title>
<!-- THE INSTALLED APP'S LAUNCHER. The web app manifest (/manifest.webmanifest)
     opens here, and this page opens the state the reader used last: every app
     writes its two-letter tag under districtry-last-app when it boots
     (engine/index.html/install-app.txt), and scripts/build_manifests.py --check
     holds this page to that key. It is a redirect, so it is kept out of search
     (noindex, no canonical, so build_sitemap.py does not list it) and it carries
     no counter: the state's own page counts the visit a moment later, and the
     app counts the launch itself. It contacts nobody but this site.

     It is also where a place SHARED INTO the app arrives: the manifest's
     share_target puts districtry in Android's Share menu and sends what was
     shared here (the script at the foot of this page). -->
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#6d3fd1" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<!-- The Google Play app's mark, the same block every page with a support link
     carries (scripts/compose_app.py fills it). This page shows no support
     link; it carries the block because a place shared into the Play app
     arrives here with the app as this page's referrer, and the page this one
     opens sees this page as its referrer instead, so the mark has to be set
     here or it is lost. -->
<script>
/* ==== ENGINE:BEGIN play-app ==== */
/* THE GOOGLE PLAY APP'S MARK, in ONE copy, for the pages that show a
   support link: every app, every sources page, the front page and the
   sponsorship page. The installed app's launcher (/app/) carries it too,
   though it shows no support link, because a place shared into the app
   arrives there (see below).

   districtry's Android app on Google Play is this site in a full-screen
   Chrome window (a Trusted Web Activity), so it shows these same pages.
   Google Play's Payments policy does not let an app lead a reader to a
   payment method other than Google's own billing, and Google applies that
   to donations: in February 2022 it rejected an update of StreetComplete,
   an open-source map app, for asking for donations, rejected it again once
   the donation links were gone and a link to the project's GitHub page,
   which asks for donations, was left, and accepted it when that link went
   too (github.com/streetcomplete/StreetComplete/issues/3768). So inside the
   Play app the links to GitHub Sponsors and to the sponsorship page are
   hidden. The website keeps them, and so does a copy installed from the
   browser's own menu, which no store reviews.

   THE LINKS TO THIS PROJECT'S CODE ON GITHUB STAY, and that is a judgement
   rather than a measurement. They sit in no sentence about money, which the
   StreetComplete link did, but the repository's page shows a Sponsor
   button. If a review objects to them, they join the rule below and the app
   itself needs no rebuild, because it loads these pages.

   THIS BLOCK IS ITS OWN <script> ELEMENT on every page, never a second
   block inside the theme script, because scripts/question_page.py copies a
   sources page's theme script into the question pages it generates, and
   those pages carry no support link.

   HOW A WINDOW IS KNOWN TO BE THE PLAY APP. The app is built to open
   /app/?ref=play, and the launcher passes ref=play on, and nothing else, to
   the page it opens: a URL is how the Trusted Web Activity documentation
   says an app passes data to its pages. A page whose referrer is the app
   itself (android-app://com.districtry.app, the package name the setup
   guide builds) is marked too. Chrome names the Android app that opened a
   page as its referrer, which is how a link tapped in Gmail arrives as
   android-app://com.google.android.gm, so this should cover a shared link
   opened straight into the app rather than through its icon. A place shared
   from another app's Share menu takes that path into the LAUNCHER (the
   manifest's share_target), which hands on with location.replace, so the
   page it opens sees the launcher as its referrer rather than the app: the
   launcher carries this block for that reason, and passes ref=play on when
   it finds the mark. The referrer path is not yet measured on a phone; the
   first is the one the app's own launches take, and both are tested here
   with the referrer stood in for. Either sets a mark in session
   storage, so every later page in the same window (another state, a sources
   page, the front page) hides the links as well, and the mark goes when the
   app is closed. Session storage belongs to one window, so the mark never
   reaches the reader's ordinary browser tabs.

   WHAT IS HIDDEN is matched by address rather than by a class, so a support
   link added later to any page carrying this block is hidden in the Play app
   without anyone remembering to mark it: every link to github.com/sponsors
   or to sponsorship.html, and the paragraph or list item around one, because
   a sentence asking for sponsorship reads wrong with its link taken out.
   The :has() selectors are a rule of their own because a browser that does
   not know :has() drops every selector in a rule that names it, and the
   app panel's sponsorship sentence, .dpf-support, is named by class in the
   first rule for that browser.

   It runs in the head, before first paint, so the links never flash, and an
   ordinary visit adds no style at all. */
(function () {
  var opened = /(?:^|&)ref=play(?:&|$)/.test(location.search.slice(1)) ||
    /^android-app:\/\/com\.districtry\.app(?:\/|$)/.test(document.referrer || "");
  var marked = opened;
  try {
    if (opened) sessionStorage.setItem("districtry-play-app", "1");
    else marked = sessionStorage.getItem("districtry-play-app") === "1";
  } catch (e) { /* blocked storage: only the page the app opened is marked */ }
  if (!marked) return;
  document.documentElement.classList.add("dst-play-app");
  var css = document.createElement("style");
  css.textContent =
    ".dst-play-app a[href*=\"github.com/sponsors\"]," +
    ".dst-play-app a[href*=\"sponsorship.html\"]," +
    ".dst-play-app .dpf-support{display:none!important}" +
    ".dst-play-app p:has(a[href*=\"github.com/sponsors\"])," +
    ".dst-play-app li:has(a[href*=\"github.com/sponsors\"])," +
    ".dst-play-app li:has(a[href*=\"sponsorship.html\"]){display:none!important}";
  document.head.appendChild(css);
})();
/* ==== ENGINE:END play-app ==== */
</script>
<style>
  /* The manifest's splash colour, so the step from the splash to this page to
     the map shows no flash; the dark tier's --paper where the system is dark. */
  html { background: #F4F7F9; color: #17161c; }
  @media (prefers-color-scheme: dark) { html { background: #15131b; color: #ece9f4; } }
  body {
    margin: 0;
    min-height: 100vh;
    box-sizing: border-box;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  a { color: inherit; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <p id="opening">Opening districtry&hellip;</p>
  <p id="offline" hidden>districtry needs a connection the first time it opens.
    <a id="retry" href="/app/">Try again</a></p>
  <noscript><p><a href="/">Open districtry</a></p></noscript>
</main>
<script>
(function () {
  "use strict";
  // Which state's map was open last. Two lowercase letters or nothing: the
  // value is only ever written by this site's own apps, and the test keeps a
  // stray value from turning into a path.
  var tag = null;
  try { tag = localStorage.getItem("districtry-last-app"); } catch (e) { tag = null; }
  var to = /^[a-z]{2}$/.test(tag || "") ? "/" + tag + "/" : "/";
  // The Google Play app is built to open /app/?ref=play, and a place shared
  // into it arrives with the app as this page's referrer instead; the
  // Play-app block in the head reads both and marks this window. ref=play is
  // passed on, and nothing else from this address, so the page it opens
  // knows it is inside the Play app (engine/shared/play-app.txt) and the
  // traffic report can tell a launch from Google Play from one installed
  // through the browser.
  var fromPlay = document.documentElement.classList.contains("dst-play-app");

  // A PLACE SHARED INTO THE APP. The manifest's share_target
  // (scripts/build_manifests.py) sends what was shared here as
  // ?title=...&text=...&url=... . Android puts a shared link in `text`, often
  // after the place's name and address, and leaves `url` empty, so all three
  // are read. What the text IS (a Google Maps or Apple Maps link, a short
  // link, coordinates or an address) is not decided here: the map's own
  // search box reads it exactly as if it had been pasted there.
  var params = new URLSearchParams(location.search);
  var text = (params.get("text") || "").trim();
  var url = (params.get("url") || "").trim();
  var shared = text;
  if (url && text.indexOf(url) < 0) shared = text ? text + " " + url : url;
  if (!shared) shared = (params.get("title") || "").trim();
  shared = shared.replace(/\s+/g, " ").trim().slice(0, 2000);
  // What was shared leaves this page's address before anything else happens:
  // that address is the referrer the next page is sent, and the visit counter
  // there reports a referrer. It goes on in the HASH, which never leaves the
  // browser, and a reload here does not search it again.
  if (location.search) history.replaceState(null, "", "/app/" + (fromPlay ? "?ref=play" : ""));
  var hash = shared ? "#q=" + encodeURIComponent(shared) : "";
  // The map it opens counts that a share arrived, by state and never by
  // place (engine/index.html/install-app.txt), and removes this mark.
  if (shared) {
    try { sessionStorage.setItem("districtry-share-in", "1"); } catch (e) { /* not counted */ }
  }

  var gone = false;
  function go() {
    if (gone) return;
    gone = true;
    location.replace((fromPlay ? to + "?ref=play" : to) + hash);
  }
  // The front page keeps no offline copy, so with no state remembered and no
  // connection, going there would end on the browser's own error page. Say so
  // here instead, and go as soon as the connection is back.
  if (to === "/" && navigator.onLine === false) {
    document.getElementById("opening").hidden = true;
    document.getElementById("offline").hidden = false;
    if (fromPlay) document.getElementById("retry").setAttribute("href", "/app/?ref=play");
    window.addEventListener("online", go);
  }
  if (!("serviceWorker" in navigator)) {
    if (!(to === "/" && navigator.onLine === false)) go();
    return;
  }
  // This page's own worker keeps a copy of it, so the installed app opens with
  // no connection, and a share is answered from that copy rather than sent to
  // the host (app/sw.js); each state's map has its own worker for the rest.
  var registered = navigator.serviceWorker.register("/app/sw.js", { scope: "/app/" });
  if (to === "/" && navigator.onLine === false) return;
  if (navigator.serviceWorker.controller) { go(); return; }
  // The first launch: give the worker a moment to finish installing, so the
  // next launch works offline, but never hold the reader for long.
  registered.then(function () { return navigator.serviceWorker.ready; }).then(go, go);
  setTimeout(go, 1500);
})();
</script>
</body>
</html>
