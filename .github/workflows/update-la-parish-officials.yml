name: Update Louisiana parish, town and school board officials

# Weekly refresh of three rosters from the Secretary of State's list of elected
# officials, each opening a PR rather than committing directly to main when it
# changes — officeholder data gets a look before it ships:
#   - every parish's governing body and its parish president or mayor
#     (la/data/app/la-parish-officials.json, fetched by la/index.html's Parish
#     and Police Jury or Council District cards), rebuilt by
#     la/scripts/build_la_parish_officials.py;
#   - every city's, town's and village's mayor, council or board of aldermen
#     and chief of police or marshal (la/data/app/la-municipal-officials.json,
#     the City, Town or Village card), and every school board's members
#     (la/data/app/la-school-board-members.json, the School District card),
#     rebuilt by la/scripts/build_la_local_officials.py.
# The list is read as eight CSV exports from voterportal.sos.la.gov, one per
# office, two seconds apart, by the parish builder, which keeps them in the
# runner's temporary directory (--save) for the second builder to read
# (--exports), so the list is fetched once a week. The second builder also
# asks TIGERweb for Louisiana's incorporated places and school districts, which
# its records are keyed by.
#
# The list is the Secretary of State's live record rather than a dated
# edition, so the file carries the day it was read, and a run whose records
# are unchanged keeps the previous day: most weeks change nothing and open no
# PR. A seat changing hands, a resignation or a special election is what this
# job exists to catch.
#
# Each builder FAILS rather than writing when the exports stop reading the way
# they were measured on 2026-10-20: for the parishes, all 64 matched to the
# Census's parishes, one kind of body per parish, every member with a name and
# a seat, no telephone on two members' rows, the member and executive floors,
# and the share of members carrying a telephone and a party; for the towns and
# school boards, every municipality and board the list names matched to
# exactly one Census place or school district, all 69 boards, the mayor,
# member, officer and board-member floors, and the same two shares.
# A red run is the signal that a person needs to read the list.
#
# They read each row's office, seat, name, telephone, party and term, and
# never the race or gender the same rows print. An address ships only as a
# body's office, where at least three of its officials print the same one and
# no official outside it does.
#
# THE PARISH DISTRICT FILE IS HELD TO THIS ROSTER, so the validate step runs
# both builders' --check: la-parish-districts.json carries a district only
# where the list names a seat for it, and a week in which a drawn parish's
# seats change shape fails here, before a PR, rather than on the bot PR.
#
# robots.txt: voterportal.sos.la.gov permits every path under
# /ElectedOfficials/, and tigerweb.geo.census.gov publishes none (it answers
# that path with a 189-byte HTML page), which permits every path; both read
# 2026-10-20 with the builders' own client. Each builder reads the policy
# before its first fetch of a host through scraper_common. www.sos.la.gov and
# electionstatistics.sos.la.gov refuse every client and are never read.
#
# It regenerates the per-parish pages (la/parish-government/<parish>.html)
# and the files that count them in the same PR, since Louisiana's go-live
# gave scripts/build_county_pages.py its adapter.

on:
  schedule:
    - cron: "23 19 * * 3" # Wednesday 19:23 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR runs CI; see
      # update-la-legislature-roster.yml for why.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # requests for the three exports (the builder retries a reset or a
      # timeout); the CSV is read with the stdlib. shapely is not used by the
      # district builder's --check below, only by its build, which reads the
      # Census's rings; it is installed because validate_workflow_deps.py reads
      # every import in a script this workflow runs and cannot tell which
      # functions run.
      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests shapely

      - name: Rebuild the parish governing bodies
        run: python3 la/scripts/build_la_parish_officials.py --save "$RUNNER_TEMP/la-sos"

      - name: Rebuild the town officials and school boards
        run: python3 la/scripts/build_la_local_officials.py --exports "$RUNNER_TEMP/la-sos"

      - name: Validate app + data files
        run: |
          python3 la/scripts/build_la_parish_officials.py --check
          python3 la/scripts/build_la_parish_districts.py --check
          python3 la/scripts/build_la_local_officials.py --check
          python3 la/scripts/validate_index.py la/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- la/data/app/la-parish-officials.json \
              la/data/app/la-municipal-officials.json la/data/app/la-school-board-members.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/la-parish-officials-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut from main's current tip, with full history; the rebuilt file is
          # carried over the checkout as an uncommitted change.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-parish pages (la/parish-government/) are GENERATED from the
          # parish roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members.
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          # llms.txt COUNTS the per-parish pages, so a parish dropping out of
          # the roster would move it.
          python3 scripts/build_llms_txt.py
          # docs/EAM_STATUS.md counts the districts the parish roster names and
          # the towns the town roster names, so either one changing moves it.
          python3 scripts/build_eam_status.py
          git add la/data/app/la-parish-officials.json la/data/app/la-municipal-officials.json la/data/app/la-school-board-members.json la/parish-government la/parish-government.html about.html sitemap.xml llms.txt docs/EAM_STATUS.md
          git commit -m "Update Louisiana parish, town and school board officials"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Louisiana parish, town and school board officials" \
              --body "Automated weekly refresh from the Secretary of State's list of elected officials: every Louisiana parish's police jury, council or commission and its parish president or mayor (\`la/scripts/build_la_parish_officials.py\`), and every city's, town's and village's mayor, council or aldermen and chief of police or marshal, and every school board's members (\`la/scripts/build_la_local_officials.py\`). Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
