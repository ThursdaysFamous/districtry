name: Update U.S. House (KY) roster

# Weekly refresh of the Kentucky congress card's roster
# (ky/data/app/congress-roster.json, fetched by ky/index.html). Rebuilds KY's 6
# U.S. House reps from unitedstates/congress-legislators and, if anything
# changed, opens a PR rather than committing directly to main — officeholder
# data should get a human look before it ships.
#
# NO PAGE REGENERATION STEP, and that is a measurement rather than an omission:
# the sibling congress workflows also run build_officeholder_tables.py, because
# each of their instances ships a congress.html carrying a GENERATED table of
# the same roster. This instance ships no sub-pages at all yet, so no page
# reads this file and there is nothing to regenerate. The day ky/congress.html
# lands, those three steps and the wider `git add` land with it.

on:
  schedule:
    - cron: "55 13 * * 1" # Monday 13:55 UTC (staggered after the IL/NY congress refreshes)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # No third-party deps: the builder downloads the canonical
      # legislators-current.json with stdlib urllib and filters it to KY (the
      # state code comes from ky/data/state/state.json, which is why that
      # directory ships in the repo while being excluded from the Pages deploy).
      - name: Rebuild congress roster data file
        run: python3 ky/scripts/build_congress_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present
      # and well formed. node is preinstalled on ubuntu-latest.
      - name: Validate app + data files
        run: python3 ky/scripts/validate_index.py ky/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- ky/data/app/congress-roster.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/ky-congress-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with, so the branch differs from main in its data file
          # alone and a push cannot read as updating a workflow.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          git add ky/data/app/congress-roster.json
          git commit -m "Update U.S. House (KY) roster from congress-legislators"
          git push -u origin "$branch" --force
          # Only open a PR if one isn't already open for this branch; if it is,
          # the force-push above already updated it.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update U.S. House (KY) roster from congress-legislators" \
              --body "Automated weekly refresh of the Kentucky congress district card's roster, generated by \`ky/scripts/build_congress_roster.py\` from unitedstates/congress-legislators. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
