name: Update U.S. House (Wyoming) roster

# Weekly refresh of the Wyoming congress card's roster
# (wy/data/app/congress-roster.json, fetched by wy/index.html). Rebuilds
# Wyoming's one at-large U.S. House member from unitedstates/congress-legislators and,
# if anything changed, opens a PR rather than committing directly to main —
# officeholder data should get a human look before it ships. A seat the
# dataset lists no member for is written as vacant only where the Clerk of the
# House's vacancy page lists it too; otherwise the build refuses. The
# seat had a member on 2026-11-12, so the Clerk is read only when it
# does not.
#
# THE PAGE STEPS LANDED WITH THE GO-LIVE CHANGE (batch 4 of the state-level
# launch). `wy/congress.html` carries a GENERATED table of this roster, and
# `about.html` and `sitemap.xml` count it, so all three are regenerated here
# and staged in the same `git add` — otherwise this workflow's own bot PR
# fails those pages' `--check` on numbers the PR is not about.
#
# THE MAP IS THE WHOLE STATE: Wyoming elects its one member at large, so
# TIGERweb's layer 0 draws one district, and the roster's one record is
# keyed "0", the code the Census gives an at-large district.

on:
  schedule:
    - cron: "51 23 * * 3" # Wednesday 23:51 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # No third-party deps: the builder downloads the canonical
      # legislators-current.json with stdlib urllib and filters it to Wyoming (the
      # state code comes from wy/data/state/state.json, which is why that
      # directory ships in the repo while being excluded from the Pages deploy).
      - name: Rebuild congress roster data file
        run: python3 wy/scripts/build_congress_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present
      # and well formed.
      - name: Validate app + data files
        run: python3 wy/scripts/validate_index.py wy/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- wy/data/app/congress-roster.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/wy-congress-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with: a branch that also differs from main in
          # .github/workflows/ reads to GitHub as the push updating a workflow
          # and is refused for a token without `workflow` scope. Full history,
          # because `git fetch --depth=1` RE-SHALLOWS a clone that was fetched
          # complete.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          python3 wy/scripts/build_congress_roster.py
          python3 scripts/build_officeholder_tables.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add wy/data/app/congress-roster.json wy/congress.html about.html sitemap.xml
          git commit -m "Update U.S. House (Wyoming) roster from congress-legislators"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update U.S. House (Wyoming) roster from congress-legislators" \
              --body "Automated weekly refresh of the Wyoming congress district card's roster, generated by \`wy/scripts/build_congress_roster.py\` from unitedstates/congress-legislators. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
