name: Update U.S. House (Connecticut) roster

# Weekly refresh of the Connecticut congress card's roster
# (ct/data/app/congress-roster.json, fetched by ct/index.html). Rebuilds
# Connecticut's 5 U.S. House reps from unitedstates/congress-legislators and,
# if anything changed, opens a PR rather than committing directly to main —
# officeholder data should get a human look before it ships. A district the
# dataset lists no member for is written as vacant only where the Clerk of the
# House's vacancy page lists it too; otherwise the build refuses. Every
# district had a member on 2026-11-12, so the Clerk is read only when one
# does not.
#
# THE PAGE STEPS LANDED WITH THE GO-LIVE CHANGE (batch 3 of the state-level
# launch). `ct/congress.html` carries a GENERATED table of this roster, and
# `about.html` and `sitemap.xml` count it, so all three are regenerated here
# and staged in the same `git add` — otherwise this workflow's own bot PR
# fails those pages' `--check` on numbers the PR is not about.
#
# THE MAP THESE MEMBERS ARE JOINED TO IS TIGERweb'S LAYER 0, which is the
# same 5 districts as layer 4 (the 119th Congress's), so nothing changes on 3
# January 2027 but the members; ct/scripts/build_legislative_boundaries.py
# refuses on or after 3 January 2029, when a person reads which map the 2028
# election used.

on:
  schedule:
    - cron: "7 23 * * 1" # Monday 23:07 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # No third-party deps: the builder downloads the canonical
      # legislators-current.json with stdlib urllib and filters it to Connecticut (the
      # state code comes from ct/data/state/state.json, which is why that
      # directory ships in the repo while being excluded from the Pages deploy).
      - name: Rebuild congress roster data file
        run: python3 ct/scripts/build_congress_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present
      # and well formed.
      - name: Validate app + data files
        run: python3 ct/scripts/validate_index.py ct/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- ct/data/app/congress-roster.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/ct-congress-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with: a branch that also differs from main in
          # .github/workflows/ reads to GitHub as the push updating a workflow
          # and is refused for a token without `workflow` scope. Full history,
          # because `git fetch --depth=1` RE-SHALLOWS a clone that was fetched
          # complete.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          python3 ct/scripts/build_congress_roster.py
          python3 scripts/build_officeholder_tables.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add ct/data/app/congress-roster.json ct/congress.html about.html sitemap.xml
          git commit -m "Update U.S. House (Connecticut) roster from congress-legislators"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update U.S. House (Connecticut) roster from congress-legislators" \
              --body "Automated weekly refresh of the Connecticut congress district card's roster, generated by \`ct/scripts/build_congress_roster.py\` from unitedstates/congress-legislators. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
