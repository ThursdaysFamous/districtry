name: Probe credentials

# TEMPORARY. Answers one question and is deleted before merge: which of the
# analytics credentials exist as REPO SECRETS, as opposed to as a session
# environment variable. GOAT_COUNTER has only ever been the latter, and it is
# absent from the current session, which is why the 2026-09-14 traffic refresh
# could not run at all.
#
# IT PRINTS NO CREDENTIAL — not a value, not a field of one, not a length.
# Only "set" or "unset", which is the whole question.
#
# The branch-scoped trigger is the same device update-search-performance.yml
# used to prove itself before merging, and carries the same obligation: delete
# it with this file once the answer is in. A branch trigger that outlives its
# branch is a line nobody can test and nobody deletes.

on:
  push:
    branches: [claude/goat-counter-data-access-g5ycax]

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Which analytics secrets are configured on this repository
        env:
          GOAT_COUNTER: ${{ secrets.GOAT_COUNTER }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: |
          for name in GOAT_COUNTER BING_API_KEY GOOGLE_SA_KEY; do
            if [ -n "${!name}" ]; then echo "$name: set"; else echo "$name: unset"; fi
          done

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -c scripts/requirements.txt requests
      - name: Look at the GoatCounter dashboard's shape
        env:
          GOAT_COUNTER: ${{ secrets.GOAT_COUNTER }}
        run: python3 scripts/goatcounter_fetch.py --explore
