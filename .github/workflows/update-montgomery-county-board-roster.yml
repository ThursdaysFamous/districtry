name: Update Montgomery County Board roster

# Weekly refresh of the Montgomery County Board District card's member roster
# (il/data/app/montgomery-county-board-members.json, fetched by index.html).
# Re-scrapes the county's board page (district, name, phone(s), county e-mail,
# Board Chairman role) and, if anything changed, opens a PR rather than
# committing directly to main — officeholder data should get a human look
# before it ships.
#
# Only the ROSTER is on a cron. The other half of this county's card —
# il/data/app/montgomery-county-board-districts.json — is the county's own GIS
# export, an operator step rather than a weekly one: refreshing it means asking
# Montgomery County GIS for a new file, exactly as Ogle's and Henry's do.
# scripts/build_montgomery_boundaries.py --check guards the shipped copy against
# the archived source in this workflow (the stark pattern — offline, reading the
# committed .gdb archive, so it runs beside the roster rebuild rather than in
# the monthly network gate). An earlier version of this comment claimed the
# check ran "on every pull request"; it ran nowhere until the 2026-08-24
# scripts audit wired it here.
#
# WHY THE PAGE AND NOT THE PDF. The Clerk also publishes a "County Board
# Districts/Members" PDF (revised 12/2024) that lists the same fourteen seats,
# and that document is the source for the DISTRICT COMPOSITION the boundary
# builder asserts. It is not the source for the roster: checked 2026-08-06, it
# still named Bill Bergen (District 5) and Andy Ritchie (District 7) where the
# page has Cody Gudgel and Roy Schieferdecker. Two county sources, and the
# fresher one wins for names.

on:
  schedule:
    - cron: "0 18 * * 3" # Wednesday 18:00 UTC (after CCPSA 13, municipal 14, Winnebago 15, Rock Island 16, Grundy 17)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # A static, server-rendered WPBakery page — no JS and no challenge — so
        # requests alone, parsed with the stdlib re module. pyogrio/pyproj/
        # shapely are for the boundary --check below, not the scrape.
        run: pip install -c scripts/requirements.txt requests pyogrio pyproj shapely

      - name: Scrape Montgomery County Board member roster
        run: python3 scripts/montgomery_county_board_scraper.py /tmp/montgomery_county_board_raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_montgomery_board_roster.py /tmp/montgomery_county_board_raw.json

      # The district boundaries change on reapportionment, not weekly — but the
      # shipped copy should never drift from what the builder derives from the
      # archived county GIS export in data/source/raw. Offline.
      - name: Re-check the shipped boundary against the archived export
        run: python3 scripts/build_montgomery_boundaries.py --check

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present and
      # well formed.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/montgomery-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add il/data/app/montgomery-county-board-members.json il/county-board il/county-board.html about.html sitemap.xml
          git commit -m "Update Montgomery County Board roster from montgomerycountyil.gov"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Montgomery County Board roster from montgomerycountyil.gov" \
              --body "Automated weekly refresh of the Montgomery County Board District card's member roster (district, name, phone, second published number where the county prints one, county e-mail, Board Chairman role), generated by \`scripts/montgomery_county_board_scraper.py\` + \`scripts/build_montgomery_board_roster.py\`. Please review the diff before merging — this changes data about real officeholders. The floors are exact rather than one-under: the county seats two members per district and publishes a phone and an e-mail for all fourteen, so there is no partial state worth shipping, and a genuine vacancy is meant to need a human to lower them. The scraper also prints a NOTE for any member whose published e-mail does not match their published surname — District 5's is listed at \`cody.gudel@\` — and carries such an address exactly as the county publishes it rather than correcting it." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
