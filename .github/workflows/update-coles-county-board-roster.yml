name: Update Coles County Board roster

# Weekly refresh of the Coles County Board District card's member roster
# (il/data/app/coles-county-board-members.json), fetched by index.html. Re-scrapes
# the county's own board page (12 single-member districts, e-mail and phone per
# member) plus its committees page, and — if anything changed — opens a PR
# rather than committing directly to main.
#
# WHY THIS JOB EXISTS AT ALL, since Coles's boundary layer looks like it carries
# its own roster. It does carry one, and the roster is wrong: the county's
# County_Board_District_View attribute table was published 2022-04-23 and never
# refreshed, so it names SIX members who have since left the board, still reads
# term "2022" for District 11, and carries 2010 census populations. The app
# reads GEOMETRY from that service and PEOPLE from here. If this job ever
# stops, the card degrades to district identity — never to the layer's names.
# The six-name diff is recorded in scripts/coles_county_board_scraper.py.
#
# THE FETCH SUPPLIES A CERTIFICATE THE COUNTY OMITS. colesco.illinois.gov sends
# only its leaf certificate, so requests/curl/urllib all fail verification while
# browsers succeed by chasing the leaf's AIA extension. The scraper does that
# chase itself — downloading the GoDaddy intermediate, checking it against a
# pinned SHA-256, and then verifying the full chain — so nothing here disables
# TLS verification. A run that fails on the pin means the county changed CA and
# wants a human, not a looser check.
#
# THE COMMITTEES PAGE IS THE CROSS-CHECK, and it fails the run rather than
# warning: a name on one page and not the other means the county's two roster
# surfaces disagree, which is exactly the state where shipping "whichever page
# the scraper read" would be worst (the Tazewell lesson).

on:
  schedule:
    - cron: "0 18 * * 0" # Sunday 18:00 UTC (after DuPage 13, Stephenson 14, LaSalle/De Witt 15, Washington 16, Cass 17)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI; falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # Static server-rendered pages — no JS and no challenge — so requests
        # alone, parsed with the stdlib re module. certifi is named explicitly
        # even though requests already pulls it in: the scraper imports it
        # DIRECTLY, to build the verification bundle the AIA chase needs, and a
        # direct import belongs on a declared dependency.
        run: pip install -c scripts/requirements.txt requests certifi

      - name: Scrape Coles County board + committees pages
        run: python3 scripts/coles_county_board_scraper.py /tmp/coles_county_board_raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_coles_board_roster.py /tmp/coles_county_board_raw.json

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present and
      # well formed.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/coles-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add il/data/app/coles-county-board-members.json il/county-board il/county-board.html about.html sitemap.xml
          git commit -m "Update Coles County Board roster from colesco.illinois.gov"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Coles County Board roster from colesco.illinois.gov" \
              --body "Automated weekly refresh of the Coles County Board District card's member roster (12 single-member districts), generated by \`scripts/coles_county_board_scraper.py\` + \`scripts/build_coles_board_roster.py\`. Please review the diff before merging — this changes data about real officeholders. Note that the county's own board-district GIS layer carries a competing member column which this pipeline deliberately ignores: it is a 2022-04-23 snapshot that gets six of the twelve names wrong. The page publishes no party, no term and no chair, so none ships; home addresses are printed under most members and are never parsed. The county's committees page cross-checks the roster in both directions and a disagreement fails the run rather than picking a side." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
