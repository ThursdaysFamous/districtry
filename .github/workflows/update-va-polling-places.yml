# Daily refresh of each Virginia precinct's Election Day polling place, read
# from the Department of Elections' own polling-location map service
# (Current_Voter_Polling_Locations, one point per building naming the precinct
# it serves) and joined to the precinct map by the Department's precinct
# number, by va/scripts/build_va_polling_places.py, which writes
# va/data/app/va-polling-places.json.
#
# THE SERVICE AND NOT THE SPREADSHEET: the Department's polling place workbook
# sits under a path its robots.txt closes to every crawler (*.xlsx), so nothing
# here reads it; the service is the same Department's own publication of the
# same assignments, on the host the precinct map is read from.
#
# DAILY, NOT WEEKLY: a polling place that moves in the last week before an
# election is exactly when a reader needs the change. Added on Election Day,
# 2026-11-03, on Adam's ask to make polling places live on every map that
# could carry them, on the model of North Carolina's daily check.
#
# THE TRIPWIRE: the build fails unless every point of the service lands on
# exactly one precinct of the map and at least 90% of the map's precincts are
# named. What it cannot see: a building the Department moves without
# re-writing the service, and the precincts the service names no point for
# (133 on 2026-11-03), whose cards say so and link the Department's lookup.
#
# AFTER ELECTION DAY the Department may clear or repoint the service. A failed
# read then is expected, so the job stays green and changes nothing; on or
# before the shipped election date a failed read fails the job.

name: Update Virginia polling places

on:
  schedule:
    - cron: "50 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-polling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install builder dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Rebuild the polling place file from the Department's service
        id: build
        continue-on-error: true
        run: python3 va/scripts/build_va_polling_places.py

      - name: Fail a missed read before Election Day
        if: steps.build.outcome == 'failure'
        run: |
          git checkout -- va/data/app/
          election=$(python3 -c "import json;print(json.load(open('va/data/app/va-polling-places.json'))['electionDate'])")
          today=$(TZ=America/New_York date +%F)
          if [[ "$today" > "$election" ]]; then
            echo "The service could not be read, and the shipped election ($election) is past; nothing to refresh."
          else
            echo "The service could not be read on $today, on or before the shipped election date $election."
            exit 1
          fi

      - name: Validate app + data files
        run: |
          python3 va/scripts/build_va_polling_places.py --check
          python3 va/scripts/validate_index.py va/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- va/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/va-polling-places-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp va/data/app/va-polling-places.json /tmp/va-polling-places.json
          git stash
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          cp /tmp/va-polling-places.json va/data/app/va-polling-places.json
          git add va/data/app/va-polling-places.json
          git commit -m "Update Virginia polling places from the Department of Elections' map service"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Virginia polling places from the Department of Elections' map service" \
              --body "Automated daily refresh of each Virginia precinct's Election Day polling place, generated by \`va/scripts/build_va_polling_places.py\` from the Department of Elections' own polling-location map service. Please review the diff before merging — it changes where the map tells voters to go. The build fails if a point of the service lands on no precinct of the map or too few precincts are named." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
