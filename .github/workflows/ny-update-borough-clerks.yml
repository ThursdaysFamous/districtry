name: Update borough County Clerks

# Weekly refresh of the County Clerk row in ny/data/app/borough-officials.json
# from the City of New York's own staff directory — the Green Book, Socrata
# dataset mdcw-n682. Opens a PR, never commits to main.
#
# WHY THIS JOB EXISTS. NYC County Clerks are APPOINTED by the Appellate
# Division, so there is no certified election return behind them. The only
# source that had ever named one for this project is nycourts.gov, which
# publishes the incumbent in two boroughs of five and has been behind a
# Cloudflare managed challenge since 2026-09-26 — an access control, never
# worked around — so three boroughs named nobody. Adam ruled on 2026-09-29
# that the Green Book may fill those absences.
#
# THE BOROUGH PRESIDENT AND DISTRICT ATTORNEY ROWS ARE NOT TOUCHED BY THIS
# JOB. They are elected, they change every four years, and they stay the
# operator step they have always been in ny/scripts/borough_officials_source.json.
# build_borough_officials.py fills a clerk whose name in that file is null and
# NEVER overwrites one that is set, so the Bronx — where the two publishers
# disagree — is untouched by construction rather than by a rule this workflow
# has to remember.
#
# THE `ny-` PREFIX IS LOAD-BEARING. GitHub Actions reads workflows only from
# the repository ROOT's .github/workflows, so this file has to live here to run
# at all — and at the root it shares a namespace with the other five instances.
# A basename collision is worse than a duplicate: the root copy wins, so NYC's
# refresh would look present and quietly run another instance's. Every path
# below is instance-scoped for the same reason.

on:
  schedule:
    - cron: "0 12 * * 2" # Tuesday 12:00 UTC — a free slot, clear of every other weekly job
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every bot PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the refresh still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # FULL history, because this job regenerates sitemap.xml and
          # build_sitemap.py reads each page's lastmod from that file's own last
          # commit. Under the default depth-1 checkout git reports the single
          # fetched commit as the last commit of EVERY file, so every entry takes
          # today's date. A bot run on 2026-09-17 shipped 241 wrong dates that way.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Read the Green Book
        run: python3 ny/scripts/greenbook_clerk_scraper.py
      - name: Rebuild borough officials
        run: python3 ny/scripts/build_borough_officials.py
      - name: Validate app + data files
        run: python3 ny/scripts/validate_index.py ny/index.html
      - name: Check for changes
        id: diff
        run: git diff --quiet -- ny/data/app/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/ny-borough-clerks-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with, so the branch differs from main in its rebuilt
          # files alone. Full history, for the same reason as fetch-depth: 0
          # above — `git fetch --depth=1` RE-SHALLOWS a complete clone, so the
          # two have to move together.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # ny/borough.html carries a GENERATED table of all fifteen borough
          # officers, built from the roster this job just rewrote, so regenerate
          # it here or the smoke gate's `build_officeholder_tables.py --check`
          # fails on this PR with a table naming last week's clerks. Two
          # generators write that page — the table and the page around it — and
          # the sitemap follows, because the page is in it and its lastmod is
          # the file's own last commit.
          python3 scripts/build_officeholder_tables.py
          python3 scripts/build_concept_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add ny/data/app/borough-officials.json ny/borough.html about.html sitemap.xml
          git commit -m "Update borough County Clerks from the NYC Green Book"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --title "Update borough County Clerks" \
              --body "Automated weekly refresh of the County Clerk row on the five borough cards, from the City of New York's Green Book (\`ny/scripts/greenbook_clerk_scraper.py\` + \`build_borough_officials.py\`). The Borough President and District Attorney rows are operator-maintained and are not touched. A clerk already named in \`ny/scripts/borough_officials_source.json\` is never overwritten; check the build step's log for a PUBLISHERS DISAGREE line. Review before merging." \
              --base main --head "$branch"
          fi
