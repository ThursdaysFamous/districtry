name: Update Rhode Island legislature roster

# Weekly refresh of the Rhode Island Senate + House of Representatives rosters
# (ri/data/app/ri-senate-members.json and ri-house-members.json, fetched by
# ri/index.html's chamber cards). Rebuilds both chambers from the General Assembly's own
# pages and, if anything changed, opens a PR rather than committing
# directly to main.
#
# The General Assembly's member pages fill themselves in from one member
# list on rilegislature.gov, which the builder asks the way the page asks:
# each member's party, e-mail address, page and, where printed, telephone.
# The list's town column is never read.
#
# robots.txt: www.rilegislature.gov's policy is read before the first fetch, with the
# User-Agent the fetches send, and a stated Crawl-delay is honoured; the
# builder paces the host regardless.
#
# THE REBUILT FILES ARE CARRIED ACROSS THE BRANCH CUT RATHER THAN FETCHED A
# SECOND TIME, the update-ilga-roster.yml pattern. A run where main changed
# those same files meanwhile errors at the checkout instead of pushing, which
# is right.
#
# THE PAGE STEPS LANDED WITH THE GO-LIVE CHANGE (batch 4 of the state-level
# launch). `ri/state-legislature.html` carries a GENERATED table of both rosters, and
# `about.html` and `sitemap.xml` count them, so all three are
# regenerated here and staged in the same `git add`.

on:
  schedule:
    - cron: "3 23 * * 4" # Thursday 23:03 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # requests, which the shared robots.txt reader can use; the builder itself
      # fetches with the standard library.
      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Rebuild Rhode Island Senate + House rosters
        run: python3 ri/scripts/build_ri_legislature_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, every data/app file must be present and
      # well formed, and every seat must carry a record.
      - name: Validate app + data files
        run: |
          python3 ri/scripts/validate_index.py ri/index.html
          python3 scripts/validate_chamber_rosters.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- ri/data/app/ri-senate-members.json ri/data/app/ri-house-members.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/ri-legislature-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut from main's current tip, with full history — see the sibling
          # workflows' own comments for why both halves matter. The two rebuilt
          # files ride across the checkout as working-tree changes.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          python3 scripts/build_officeholder_tables.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add ri/data/app/ri-senate-members.json ri/data/app/ri-house-members.json ri/state-legislature.html about.html sitemap.xml
          git commit -m "Update Rhode Island Senate + House rosters from the General Assembly's own site"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Rhode Island Senate + House rosters" \
              --body "Automated weekly refresh of the Rhode Island Senate and House chamber cards' rosters, from the General Assembly's own site, generated by \`ri/scripts/build_ri_legislature_roster.py\`. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
