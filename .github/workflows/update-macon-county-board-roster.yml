name: Update Macon County Board roster

# Weekly refresh of the Macon County Board District card's member roster
# (il/data/app/macon-county-board-members.json, fetched by index.html).
# Re-scrapes the county's board-members page (district, name, party, phone(s),
# county e-mail, term-expiry, Chairman/Vice-Chairman role) and, if anything
# changed, opens a PR rather than committing directly to main — officeholder
# data should get a human look before it ships.
#
# THIS PAGE IS THE ONLY PLACE MACON PUBLISHES A MEMBER'S DISTRICT. The county's
# GIS carries five board district shapes with every attribute null, so the
# numbers on the map come from the Clerk's colour-coded map instead
# (il/data/app/macon-board-district-labels.json). Party and district arrive here as
# one token: "D-1" is a Democrat in District 1.
#
# THE 3-3-3-3-3 SPLIT IS A CHECK ON MORE THAN THIS PAGE. Macon seats three
# members per district; if a future scrape does not divide evenly across the
# five, that is a signal about the district LABELS as much as about the page,
# and the builder's failure message says so.
#
# THE DOMAIN IS maconcounty.illinois.gov. maconcountyil.gov has no DNS record at
# all — not a redirect, no address — and this project shipped it as a live card
# link for three days. The scraper's zero-row failure message names the right
# domain first, because that is the mistake most likely to recur.

on:
  schedule:
    - cron: "0 17 * * 5" # Friday 17:00 UTC (after CCBR 13, DeKalb 14, Peoria 15, Tazewell 16)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # FULL history, because this job regenerates sitemap.xml and
          # build_sitemap.py reads each page's lastmod from that file's own last
          # commit. Under the default depth-1 checkout git reports the single
          # fetched commit as the last commit of EVERY file, so every one of the
          # 243 entries takes today's date. Measured 2026-09-19 by building the
          # sitemap in a depth-1 clone: 243 of 243 lastmods moved, against 0 in a
          # full clone, where `build_sitemap.py --check` passes. A bot run on
          # 2026-09-17 shipped 241 wrong dates this way.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # A static, server-rendered WPBakery page — no JS and no challenge — so
        # requests alone, parsed with the stdlib re module.
        run: pip install -c scripts/requirements.txt requests

      - name: Scrape Macon County Board roster
        run: python3 scripts/macon_county_board_scraper.py /tmp/macon_county_board_raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_macon_board_roster.py /tmp/macon_county_board_raw.json

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present and
      # well formed.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/macon-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          # Full history, for the same reason as fetch-depth: 0 above. `git fetch
          # --depth=1` RE-SHALLOWS a clone that was fetched complete (measured:
          # 512 commits down to 13), so the two have to move together — deepening
          # the checkout alone would be undone here.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add il/data/app/macon-county-board-members.json il/county-board il/county-board.html about.html sitemap.xml
          git commit -m "Update Macon County Board roster from maconcounty.illinois.gov"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Macon County Board roster from maconcounty.illinois.gov" \
              --body "Automated weekly refresh of the Macon County Board District card's member roster (district, name, party, phone, county e-mail, term-expiry, Chairman/Vice-Chairman role), generated by \`scripts/macon_county_board_scraper.py\` + \`scripts/build_macon_board_roster.py\`. Please review the diff before merging — this changes data about real officeholders. This page is the ONLY place Macon publishes which district a member sits for; the county's own GIS carries five board shapes with every attribute null. The builder asserts 15 members splitting 3-3-3-3-3, which is a check on the district LABELS as well as on the page. Phones ship as the seven digits the county publishes — Macon is entirely area code 217, but a member mobile can be from anywhere and a wrong prefix would reach a stranger."  \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
