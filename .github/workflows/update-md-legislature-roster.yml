name: Update Maryland legislature roster

# Weekly refresh of the Maryland Senate + House of Delegates rosters
# (md/data/app/md-senate-members.json and md-house-members.json, fetched by
# md/index.html's chamber cards). Rebuilds both chambers from the General Assembly's own site
# and, if anything changed, opens a PR rather than committing directly to
# main.
#
# The Senate's and House's member indexes on mgaleg.maryland.gov, and each
# member's own page, give the member's district, party, Annapolis office,
# telephone and e-mail address. Maryland elects one senator and three
# delegates from each of 47 districts, the delegates either together or from
# subdistricts drawn inside it, so the House roster is keyed by the 71
# districts and subdistricts the map draws.
#
# robots.txt: mgaleg.maryland.gov's policy is read before the first fetch,
# with the User-Agent the fetches send, and a stated Crawl-delay is honoured;
# the builder fetches one page a second regardless.
#
# THE REBUILT FILES ARE CARRIED ACROSS THE BRANCH CUT RATHER THAN FETCHED A
# SECOND TIME, the update-ilga-roster.yml pattern. A run where main changed
# those same files meanwhile errors at the checkout instead of pushing, which
# is right.
#
# THE PAGE STEPS LANDED WITH THE GO-LIVE CHANGE (batch 3 of the state-level
# launch). `md/state-legislature.html` carries a GENERATED table of both
# rosters, and `about.html` and `sitemap.xml` count them, so all three are
# regenerated here and staged in the same `git add`.

on:
  schedule:
    - cron: "31 22 * * 2" # Tuesday 22:31 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # requests, which the shared robots.txt reader can use; the builder itself
      # fetches with the standard library.
      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Rebuild Maryland Senate + House of Delegates rosters
        run: python3 md/scripts/build_md_legislature_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, every data/app file must be present and
      # well formed, and every seat must carry a record.
      - name: Validate app + data files
        run: |
          python3 md/scripts/validate_index.py md/index.html
          python3 scripts/validate_chamber_rosters.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- md/data/app/md-senate-members.json md/data/app/md-house-members.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/md-legislature-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut from main's current tip, with full history — see the sibling
          # workflows' own comments for why both halves matter. The two rebuilt
          # files ride across the checkout as working-tree changes.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          python3 scripts/build_officeholder_tables.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add md/data/app/md-senate-members.json md/data/app/md-house-members.json md/state-legislature.html about.html sitemap.xml
          git commit -m "Update Maryland Senate + House of Delegates rosters from the General Assembly's own site"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Maryland Senate + House of Delegates rosters" \
              --body "Automated weekly refresh of the Maryland Senate and House of Delegates chamber cards' rosters, from the General Assembly's own site, generated by \`md/scripts/build_md_legislature_roster.py\`. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
