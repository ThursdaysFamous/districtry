name: Update IA county auditor roster

# Weekly refresh of Iowa's 99 county auditors
# (ia/data/app/ia-county-auditors.json, read by ia/index.html's County card).
# Iowa Code 47.2 designates the auditor as each county's own election
# commissioner. TWO SOURCES, because neither is complete on its own: the
# auditors' own trade association (iowaauditors.org/find/directory/) publishes
# name, party, office address and phone but NO E-MAIL; the Secretary of State's
# own auditors page (sos.iowa.gov/auditors/) publishes name, party and an
# e-mail for all 99 — Cloudflare-obfuscated, decoded at scrape time — but no
# usable office address. The scraper merges them and GATES the merge on the two
# naming the same person; where they disagree, the county's own site decides
# and the answer is pinned per county in DIVERGENCE_RESOLVED (3 measured, and
# they do NOT all resolve the same way, which is why it is a table and not a
# rule about which publisher to prefer).

on:
  schedule:
    - cron: "30 14 * * 3" # Wednesday 14:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # FULL history, because this job now regenerates sitemap.xml and
          # build_sitemap.py reads each page's lastmod from that file's own last commit.
          # Under a depth-1 checkout every entry takes today's date and the sitemap check
          # passes on it anyway — the measurement is in update-wi-circuit-court-roster.yml.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -c ia/scripts/requirements.txt requests

      # One step, two sites: the scraper fetches the association directory
      # and the Secretary of State's page and merges them.
      - name: Scrape the auditor directories (association + Secretary of State)
        run: python3 ia/scripts/ia_county_auditor_scraper.py

      - name: Rebuild the county auditor roster
        run: python3 ia/scripts/build_ia_county_auditors.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present
      # and well formed. node is preinstalled on ubuntu-latest.
      - name: Validate app + data files
        run: python3 ia/scripts/validate_index.py ia/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- ia/data/app/ia-county-auditors.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/ia-county-auditor-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          # NOT depth-limited: a shallow fetch would re-shallow the clone the
          # checkout above deepened, and date every page in the sitemap today.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # REGENERATED HERE, AFTER THE CUT, AND NOT BEFORE IT. ia/county-auditor.html
          # states counts read off the roster this job just rewrote and carries its
          # officeholder table, so it must be rebuilt in the same run or the smoke gate
          # fails on this job's own pull request. Building before the cut leaves shared
          # files dirty, where `git checkout -B` refuses to move onto main's new tip.
          python3 scripts/build_concept_pages.py
          python3 scripts/build_officeholder_tables.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add ia/data/app/ia-county-auditors.json ia/county-auditor.html about.html sitemap.xml
          git commit -m "Update IA county auditor roster from iowaauditors.org"
          git push -u origin "$branch" --force
          # Only open a PR if one isn't already open for this branch; if it is,
          # the force-push above already updated it.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update IA county auditor roster from iowaauditors.org" \
              --body "Automated weekly refresh of the Iowa County card's auditor roster, generated by \`ia/scripts/build_ia_county_auditors.py\` from the Iowa State Association of County Auditors' own directory (\`ia_county_auditor_scraper.py\`). Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
