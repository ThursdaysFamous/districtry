name: Update California county supervisors

# Weekly check of the County card's roster outside San Francisco
# (ca/data/app/ca-county-officials.json, fetched by ca/index.html). Rebuilds
# each county's board of supervisors from the County Officials Directory of
# the California Secretary of State's California Roster and, if anything
# changed, opens a PR rather than committing directly to main.
#
# MOST WEEKS THIS CHANGES NOTHING, AND THAT IS THE DESIGN. The Roster is a
# yearly publication the Secretary of State also corrects in place, and the
# builder writes a pure function of the file it read (no run date), so a week
# with no new file leaves the roster byte-identical and opens no PR. What the
# job is for is the week the file does change: a new edition, or a correction
# to this year's.
#
# THE `ca-` PREFIX IS LOAD-BEARING. GitHub Actions reads workflows only from
# the repository ROOT's .github/workflows, so this file shares a namespace
# with every other instance's, and a basename collision is worse than a
# duplicate: the root copy wins. Every path below is instance-scoped for the
# same reason, and the PR branch is `bot/ca-…`.

on:
  schedule:
    - cron: "0 13 * * 4" # Thursday 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers). Falls back to github.token
      # when the secret is absent, so the workflow still runs — it just goes
      # back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          # Pinned below 3.15, as update-chicago-candidates.yml is: the
          # runner's newest Python can arrive before the wheels pdfplumber's
          # dependencies need.
          python-version: "3.14"

      # requests for the two fetches (robots.txt is read first, with the same
      # client), pdfplumber for the directory itself, which is a PDF.
      - name: Install scraper dependencies
        run: pip install -c scripts/requirements.txt requests pdfplumber

      - name: Rebuild California county supervisors data file
        run: python3 ca/scripts/build_ca_county_officials.py

      # Gate the regenerated data before it can reach a PR: the roster's own
      # shape (57 counties, five seats each, every name a person's), then the
      # app and every ca/data/app file, then the fleet's test that no shipped
      # officeholder name is an office, a placeholder or a fragment.
      - name: Validate roster + app + data files
        run: |
          python3 ca/scripts/build_ca_county_officials.py --check
          python3 ca/scripts/validate_index.py ca/index.html
          python3 scripts/validate_officeholder_names.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- ca/data/app/ca-county-officials.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/ca-county-officials-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with: if main gained a .github/workflows/ change
          # meanwhile, the branch would differ from main THERE too, which
          # GitHub reads as the push updating a workflow and refuses for a
          # token without `workflow` scope (measured 2026-09-02 on
          # update-municipal-officials). The rebuilt file is carried across.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # NOTHING ELSE IS REGENERATED, and that is measured rather than
          # skipped (2026-11-16): no page prints these names yet. California's
          # county pages are held (build_county_pages.NOT_COUNTY_BOARDS), no
          # question-page table reads this roster, and about.html and
          # docs/EAM_STATUS.md count neither. The change that adds the county
          # pages adds their regeneration here, and build_county_pages.py
          # --check fails this job's PR until it does.
          git add ca/data/app/ca-county-officials.json
          git commit -m "Update California county supervisors from the Secretary of State's California Roster"
          git push -u origin "$branch" --force
          # Only open a PR if one isn't already open for this branch; if it is,
          # the force-push above already updated it.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update California county supervisors from the Secretary of State's California Roster" \
              --body "Automated weekly check of the County card's roster outside San Francisco, generated by \`ca/scripts/build_ca_county_officials.py\` from the County Officials Directory of the California Secretary of State's California Roster. The Roster is published yearly and corrected in place, so this opens only when the Secretary of State's file changed. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
