name: Update Illinois county clerk roster

# Weekly refresh of the County card's clerk roster
# (il/data/app/il-county-clerks.json, fetched by index.html). Re-scrapes the
# State Board of Elections' election-authority directory and, if anything
# changed, opens a PR rather than committing directly to main — officeholder
# data should get a human look before it ships.

on:
  schedule:
    - cron: "0 13 * * 6" # Saturday 13:00 UTC (staggered from the Mon-Fri roster jobs)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # FULL history, because this job regenerates sitemap.xml and
          # build_sitemap.py reads each page's lastmod from that file's own last
          # commit. Under the default depth-1 checkout git reports the single
          # fetched commit as the last commit of EVERY file, so every one of the
          # 243 entries takes today's date. Measured 2026-09-19 by building the
          # sitemap in a depth-1 clone: 243 of 243 lastmods moved, against 0 in a
          # full clone, where `build_sitemap.py --check` passes.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # Version-pinned via scripts/requirements.txt (constraints). Playwright
        # joined the list on 2026-07-28: elections.il.gov was a plain ASP.NET
        # form with no challenge until Cloudflare started 403ing this runner's
        # network (it still answers a developer machine 200), so the scraper
        # now falls back to a browser rung.
        run: pip install -c scripts/requirements.txt requests beautifulsoup4 playwright

      - name: Install Chromium for the browser rung
        # Only the fallback needs it; the requests rung runs first and is free.
        run: python3 -m playwright install --with-deps chromium

      - name: Scrape the ISBE election-authority directory
        run: python3 scripts/il_county_clerk_scraper.py --out /tmp/il_county_clerks.json

      - name: Rebuild roster data file
        # --verify-mx asks (over DNS-over-HTTPS, because runners commonly block
        # plain DNS and SMTP) whether every shipped address's domain still has a
        # live mail route. It is a REPORT, never a gate: a flaky runner must not
        # look like a dead county, so network trouble is skipped and counted.
        # The bounce guard proper (KNOWN_UNDELIVERABLE in the builder) needs no
        # network — it drops addresses a real send has proven undeliverable.
        run: |
          python3 scripts/build_county_clerk_roster.py /tmp/il_county_clerks.json \
            --verify-mx --report /tmp/bounce-guard.md

      - name: Surface bounce-guard findings
        # Onto the job summary so a withheld address or a RETIRE line is visible
        # without opening logs — and into the PR body below when there's a diff.
        run: cat /tmp/bounce-guard.md >> "$GITHUB_STEP_SUMMARY"

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present
      # and well formed. node is preinstalled on ubuntu-latest.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/county-clerk-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          # Full history for the same reason as fetch-depth: 0 above — the
          # sitemap's lastmods come from per-file git history, which a shallow
          # fetch does not carry.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # REGENERATED AFTER THE CUT, on top of main's current tree. Before
          # 2026-09-19 these ran before it, which left il/history.html and
          # sitemap.xml dirty at the checkout — and `git checkout -B` ABORTS when
          # a dirty file differs between HEAD and FETCH_HEAD, so any other
          # workflow merging a shared page mid-crawl killed this run. These jobs
          # take tens of minutes, which is what makes the window wide. The
          # history page's stat tiles are MEASURED from the roster this job
          # rewrites, and that page is in the sitemap, so both are regenerated
          # here or the smoke gate's own --check fails on this PR.
          python3 scripts/build_history_page.py
          python3 scripts/build_sitemap.py
          # sitemap.xml is added now. It was regenerated before the cut and never
          # added, so the one file whose lastmod this job moves went uncommitted.
          git add il/data/app/il-county-clerks.json il/history.html sitemap.xml
          git commit -m "Update Illinois county clerk roster from the ISBE directory"
          git push -u origin "$branch" --force
          # Only open a PR if one isn't already open for this branch; if it is,
          # the force-push above already updated it.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            {
              echo "Automated weekly refresh of the County card's clerk roster, generated by \`scripts/il_county_clerk_scraper.py\` + \`scripts/build_county_clerk_roster.py\` from the State Board of Elections' election-authority directory. Please review the diff before merging — this changes data about real officeholders."
              echo
              cat /tmp/bounce-guard.md
            } > /tmp/pr-body.md
            gh pr create \
              --title "Update Illinois county clerk roster from the ISBE directory" \
              --body-file /tmp/pr-body.md \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
