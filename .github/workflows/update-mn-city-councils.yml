name: Update city councils (MN)

# Weekly refresh of the Minnesota City card's mayor and council names for the
# 43 cities above 25,000 people (mn/data/app/mn-city-councils.json, fetched by
# mn/index.html). The names are the winners of each seat's most recent election
# in the Secretary of State's city results files, each dated to that election,
# rebuilt by mn/scripts/build_mn_city_councils.py. If anything changed it opens
# a PR rather than committing directly to main — officeholder data gets a look
# before it ships. A new result reaches this file once it is CANVASS_DAYS old,
# so the November 2026 general lands here about three weeks after election day.

on:
  schedule:
    - cron: "10 14 * * 2" # Tuesday 14:10 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR runs CI; see
      # update-mn-congress-roster.yml for why.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests

      # Asks every Tuesday's results directory since the 2022 general (about
      # 200 requests, paced half a second apart).
      - name: Rebuild city council roster
        run: python3 mn/scripts/build_mn_city_councils.py

      - name: Validate app + data files
        run: |
          python3 mn/scripts/build_mn_city_councils.py --check
          python3 mn/scripts/validate_index.py mn/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- mn/data/app/mn-city-councils.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/mn-city-councils-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          python3 scripts/build_about_page.py
          python3 scripts/build_eam_status.py
          git add mn/data/app/mn-city-councils.json about.html docs/EAM_STATUS.md
          git commit -m "Update Minnesota city councils from the Secretary of State's results"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Minnesota city councils from election results" \
              --body "Automated weekly refresh of the mayor and council names for Minnesota's 43 cities above 25,000 people, generated by \`mn/scripts/build_mn_city_councils.py\` from the Secretary of State's city results files. Each name is the winner of that seat's most recent election and is dated to it. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
