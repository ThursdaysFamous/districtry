name: Update WI municipal executive roster

# Weekly refresh of the City or Village card's officeholder rows
# (wi/data/app/wi-municipal-executives.json) — Milwaukee County's 19 mayors
# and village presidents, from the county's own GIS & Land Information layer.
#
# THE WITNESS IS THE POINT OF THIS JOB, not a nicety. The county layer is the
# only source in Wisconsin that names these officers as data, and its own
# dataLastEditDate is 2024-07-30 — before the April 2026 election that fills
# them (Wis. Stat. 8.11, every even April). So the scraper fetches each
# municipality's OWN page and a NAME ships only where that page names the
# person beside the word mayor or president. At first build 9 of 19 witnessed;
# the other 10 ship their office and the reason instead, which is the answer
# rather than a blank.
#
# WHAT A WEEKLY RUN IS ACTUALLY FOR HERE: municipalities whose sites currently
# 403 or whose links 404 can start answering, and a withheld name becomes a
# shown one with no code change. The reverse is the alarm — a name that stops
# witnessing is an election or a resignation, and the diff is where it shows.
#
# A THIRD DIFF SHAPE EXISTS FROM 2026-09-18 and it is the one to read carefully:
# a `carriedFrom` date appearing on a municipality means its page did not answer
# at all this run and the last witnessed name was KEPT rather than deleted. That
# is not an election and not a recovery; it is a webserver that was down, and the
# card says so in the reader's own sentence. The date is the day the carry began,
# so a municipality carried several weeks running shows an old date and not a
# fresh one, and the run that removes the field is the record of the recovery.
#
# The builder REFUSES below MIN_WITNESSED rather than shipping a thin roster, and
# refuses again above MAX_CARRIED — more than a couple of municipalities
# unreachable in one run is this end failing rather than theirs, and a red run
# that leaves last week's file alone is the right outcome. Read the
# per-municipality log before touching either.

on:
  schedule:
    - cron: "30 16 * * 4" # Thursday 16:30 UTC (an hour after the alderperson run)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Scrape the county layer and witness each name
        run: python3 wi/scripts/wi_municipal_executive_scraper.py

      - name: Rebuild the municipal executive roster
        run: python3 wi/scripts/build_wi_municipal_executives.py

      - name: Validate app + data files
        run: python3 wi/scripts/validate_index.py wi/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- wi/data/app/wi-municipal-executives.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/wi-municipal-executive-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          git add wi/data/app/wi-municipal-executives.json
          git commit -m "Update WI municipal executive roster from the county layer, witnessed per municipality"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update WI municipal executive roster from the county layer, witnessed per municipality" \
              --body "Automated weekly refresh of the City or Village card's officeholder rows, generated by \`wi/scripts/build_wi_municipal_executives.py\` from \`wi_municipal_executive_scraper.py\`. A name ships only where the municipality's own page witnessed it; the diff's most interesting rows are a name that STOPPED witnessing (an election or a resignation) and a municipality that started (its site became readable). A \`carriedFrom\` date is the third shape: that municipality's page did not answer this run, so the last witnessed name was kept rather than deleted, and the card says so — check the run log's NOT RE-READ line for which and how old. Please review before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
