name: Update Illinois court justices

# Weekly refresh of il/data/app/il-court-justices.json — the Supreme and
# Appellate Court justices of each of the five Illinois judicial districts,
# read from illinoiscourts.gov and joined to the PA 102-0011 district geometry
# the `il-supreme-court` card already draws.
#
# ONE FILE ANSWERS FOR BOTH COURTS because one set of districts serves both:
# Illinois Constitution art. VI, sec. 2 divides the State into five Judicial
# Districts "for the selection of Supreme and Appellate Court Judges", 705 ILCS
# 25/1(a) establishes a branch of the appellate court in each of them "as such
# districts are determined by law" and defines none of its own, and 705 ILCS 23
# (which IS PA 102-0011) determines them county by county. So the appellate
# districts are the geometry already shipped and no second polygon layer exists
# to refresh.
#
# THIS RUN IS ALSO THE REDISTRICTING TRIPWIRE. The builder carries the county
# lists 705 ILCS 23 assigns and refuses to write unless the counties the
# court's own five district pages name are exactly those, in those districts.
# A redraw, a page rewrite or a parser fault therefore surfaces as a FAILING
# refresh rather than as a quietly wrong card — which matters more here than
# for most rosters, because this layer redistricts almost never (PA 102-0011
# was the first change since 1964) and nobody is watching it for one.
#
# www.illinoiscourts.gov serves the districtry token a full page (measured
# 2026-09-15, and recorded `token-ok` in user-agent-measurements.json), so this
# scraper sends the token and no browser string.

on:
  schedule:
    - cron: "0 12 * * 3" # Wednesday 12:00 UTC — a free slot, clear of every other weekly job
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers). Falls back to github.token when
      # the secret is absent, so the refresh still runs — it just goes back to
      # opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # illinoiscourts.gov is a plain ASP.NET site with no JS challenge, so
        # no Playwright; the parsers are stdlib re, so no BeautifulSoup.
        run: pip install -c scripts/requirements.txt requests

      - name: Read the courts' own justice pages
        run: |
          python3 scripts/il_court_justices_scraper.py \
            --out /tmp/il_court_justices_raw.json

      - name: Rebuild roster data file
        run: |
          python3 scripts/build_il_court_justices.py \
            /tmp/il_court_justices_raw.json

      # Gate the regenerated data before it can reach a PR.
      - name: Validate app + data files
        run: |
          python3 scripts/build_il_court_justices.py \
            /tmp/il_court_justices_raw.json --check
          python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR.
          branch="bot/il-court-justices-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with — a workflow-scope refusal otherwise when main
          # moves mid-run.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          git add il/data/app/il-court-justices.json
          git commit -m "Update Illinois court justices from illinoiscourts.gov"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Illinois court justices from illinoiscourts.gov" \
              --body "Automated weekly refresh of the Supreme and Appellate Court justices on each judicial district's card, generated by \`scripts/il_court_justices_scraper.py\` + \`scripts/build_il_court_justices.py\` from the courts' own pages. The build also re-checks the county composition of all five districts against 705 ILCS 23, so a failing run here can mean a redraw rather than a broken parser. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
