name: Update IA county officers roster

# Weekly refresh of the other five elected county offices in all 99 Iowa
# counties (ia/data/app/ia-county-officers.json, read by ia/index.html's County
# card): treasurer, recorder, sheriff, county attorney and the board of
# supervisors. The AUDITOR has its own workflow, because Iowa Code 47.2 makes
# that office the county's commissioner of elections and it has sources the
# others do not.
#
# TWO SCRAPE STEPS, BECAUSE NO ONE PUBLISHER COVERS ALL FIVE:
#   ia_county_officers_scraper.py         ISAC's member portal, one page per
#                                         county (99 requests, 1s apart) --
#                                         the only source for the TREASURER
#                                         and for the SUPERVISORS.
#   ia_county_officer_sources_scraper.py  the recorder's, sheriff's and county
#                                         attorney's own statewide directories,
#                                         two of which are PDFs.
#
# The builder refuses to write a board of supervisors whose size is illegal
# under Iowa Code 331.201, or that disagrees with the district geometry this
# repo already ships; and it withholds any office whose two publishers name
# different people. Those refusals are the point of the job -- a red run here
# means a source moved, not that the data is missing.

on:
  schedule:
    - cron: "30 17 * * 5" # Friday 17:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # pdfplumber, not pypdf: the sheriff and county-attorney rosters are
      # MULTI-COLUMN PDFs, and a line-flattened read interleaves the columns --
      # it puts one county's sheriff on a line with two other counties' text,
      # and glues the ICAA's APPOINTED assistants onto the elected county
      # attorney's name. Both parses work from each word's x/y, which
      # pdfplumber exposes (extract_words) and pypdf does not.
      - name: Install dependencies
        run: pip install -c ia/scripts/requirements.txt requests pdfplumber

      - name: Scrape the ISAC county directory (treasurer, supervisors)
        run: python3 ia/scripts/ia_county_officers_scraper.py

      - name: Scrape the per-office directories (recorder, sheriff, attorney)
        run: python3 ia/scripts/ia_county_officer_sources_scraper.py

      # The treasurer has NO statewide directory carrying an address (the ISAC
      # portal has no e-mail column at all), and the ISSDA sheriff PDF has gaps,
      # so those two offices' addresses come from the counties' own sites. ~114
      # county pages at 0.6s apart, so this is the long step.
      - name: Scrape treasurer and sheriff e-mail addresses from the county sites
        run: python3 ia/scripts/ia_county_officer_email_scraper.py

      - name: Rebuild the county officer roster
        run: python3 ia/scripts/build_ia_county_officers.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present
      # and well formed. node is preinstalled on ubuntu-latest.
      - name: Validate app + data files
        run: python3 ia/scripts/validate_index.py ia/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- ia/data/app/ia-county-officers.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/ia-county-officers-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          # AFTER the branch cut, never before: the re-cut above resets the
          # tree to main, so pages regenerated earlier would be thrown away and
          # the commit would carry the new roster beside the old pages. The
          # per-county pages read this roster, so they are rebuilt here and
          # staged with it.
          python3 scripts/build_county_pages.py
          # about.html counts the people these rosters name, so a refresh that
          # changes the count must regenerate it in the same commit or its own
          # --check fails on the bot's PR, over a number the PR is not about.
          python3 scripts/build_about_page.py
          git add ia/data/app/ia-county-officers.json ia/county-supervisor about.html
          git commit -m "Update IA county officer roster"
          git push -u origin "$branch" --force
          # Only open a PR if one isn't already open for this branch; if it is,
          # the force-push above already updated it.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update IA county officer roster" \
              --body "Automated weekly refresh of the Iowa County card's treasurer, recorder, sheriff, county attorney and board-of-supervisors rows, generated by \`ia/scripts/build_ia_county_officers.py\` from ISAC's member portal plus each office's own statewide directory. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
