name: Smoke test

# Headless boot + behaviour check on every pull request: serves the real
# index.html and drives it in Chromium (scripts/smoke_test.mjs) to confirm the
# app boots, registers every layer (the worksheet-generated EXPECT_LAYERS
# count), classifies a known point with the no-API anchor layers, and degrades
# gracefully when a data source fails. This is the
# validation the README describes; it runs before merge so a change that breaks
# boot or the data files can't land unnoticed.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

# One pin, two consumers: the npm install and the browser-cache key below must
# name the same Playwright version, or a bump re-downloads Chromium forever
# against a stale cache key. Defined once so they cannot drift.
env:
  PLAYWRIGHT_VERSION: "1.56.1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    # A CEILING ON THE WHOLE JOB, added 2026-08-18 after three runs in two days
    # sat "in_progress" long enough to look hung — 57 minutes, then 35, then 16,
    # every one of them on the Playwright install below. THEY WERE NOT UNBOUNDED
    # HANGS, which is the thing worth knowing: the install's first retry ladder
    # was bounded but could stack ~30 minutes of grinding that reports nothing
    # and, on deploy-pages, holds the Pages concurrency slot so every
    # later deploy queues behind it. A bounded-but-half-hour step is
    # indistinguishable from a hang to anyone watching, and the only thing that
    # caught all three was comparing the live site against the repo by hand.
    # This makes that state VISIBLE — a red run a human can act on — instead of
    # silent. The install step now sizes its phase budgets to fail NAMED under
    # its own 15-minute cap, so this ceiling guards the OTHER steps and true
    # catastrophes, not the install's ordinary sick days.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The retention gate below reads each roster file as it stands at
          # the base of this change, so it needs history, not a shallow tip.
          fetch-depth: 0

      # Conversion 2 drift gate (docs/MECHANIZATION_PLAYBOOK.md): every
      # GENERATED region must match what metro-worksheet.json generates.
      # Hand-editing a generated region fails here — edit the worksheet and
      # run scripts/generate_metro_files.py instead.
      - name: Generated regions match the worksheet
        run: |
          pip install -c scripts/requirements.txt jsonschema
          python3 scripts/generate_metro_files.py --check

      # The Data gaps panel is driven by il/data/app/coverage-gaps.json, emitted
      # from the guidebook's gaps block. This is the drift gate: editing the
      # guidebook without regenerating (or the reverse) fails here rather than
      # shipping a panel that disagrees with the document of record. Stdlib only.
      - name: Coverage gaps match the guidebook
        run: |
          python3 scripts/build_coverage_gaps.py --check
          python3 scripts/build_coverage_gaps.py --check --metro wisconsin --out wi/data/app/coverage-gaps.json
          python3 scripts/build_coverage_gaps.py --check --metro iowa --out ia/data/app/coverage-gaps.json
          python3 scripts/build_coverage_gaps.py --check --metro michigan --out mi/data/app/coverage-gaps.json
          # ny/ and ca/ ship a gaps file too; until 2026-09-02 only three of the
          # five keys were gated here, and drift in the other two surfaced only in
          # the weekly fleet-status notice.
          python3 scripts/build_coverage_gaps.py --check --metro nyc --out ny/data/app/coverage-gaps.json
          python3 scripts/build_coverage_gaps.py --check --metro sf --out ca/data/app/coverage-gaps.json

      # Wisconsin's county-board-directory.json carries each county's board
      # SIZE, and it reads that number back from the shipped supervisory
      # geometry rather than restating it — so the only way the two can
      # disagree is if one is rebuilt and the other is not. This is that gate.
      # Local files only: the builder's --check re-derives the seat counts from
      # data/app and compares, and fetches nothing.
      - name: WI county board directory matches the shipped districts
        run: python3 wi/scripts/build_wi_county_board_directory.py --check

      # Wisconsin's 72 county containment outlines are SLICED from the same
      # state-counties.json the county card renders, so the two can only
      # disagree if one is rebuilt and the other is not — and a stale outline
      # silently mis-answers "does this gap apply where you clicked" rather
      # than failing. Local files only; the builder's own containment and
      # exclusivity gates re-run on every check.
      - name: WI county outlines match the shipped county fabric
        run: python3 wi/scripts/build_wi_county_outlines.py --check

      # districtry/tokens/districtry.tokens.css is the ONE source of the brand
      # surface, and this is what makes that true rather than aspirational. The
      # fleet was carrying one palette under two vocabularies and four hand-kept
      # copies; the copies had already diverged on three values, including a
      # dark link colour that differed between the root pages and the app. It
      # checks every consumer through an explicit alias table — a consumer keeps
      # its own NAMES, never its own values — and covers the metric-matched
      # fallback face, which four surfaces named in --font-body and never
      # defined. Runs BEFORE compose_app because it writes what that splices.
      # EXTENDED 2026-09-02 after two weeks green over two live drifts it could
      # not see: it checked the skin's LIGHT neutrals and a hand-kept list of
      # three worksheets, while the skin's dark block restated all four accents
      # by hand (one of them two hex digits off) and Iowa's worksheet — the
      # fourth of five — had carried two off-fleet values since the day it
      # shipped. Both tiers of the skin are checked now, presence required,
      # and the worksheets are discovered rather than listed. Stdlib only.
      - name: Brand tokens have one source
        run: python3 scripts/build_brand_tokens.py --check

      # The token file is the one source of the brand surface; this is the one
      # MEASUREMENT of it. Every text colour the palette paints is tested
      # against the ground it sits on, in both tiers, at the floor WCAG sets for
      # its role — the pairs mapped from every CSS surface rather than guessed,
      # the dark tier composed over the light one exactly as the cascade does
      # it. It exists because the palette had 54 aria attributes of care behind
      # it and not one number saying its footer meta was legible: light --faint
      # reads 2.5:1 on white, below even the bar for LARGE text, dark mode
      # paints white on violets that hold it at 2.7:1 and 1.9:1, and the skip
      # link was 1.2:1 in dark until this gate found it. Known shortfalls are
      # recorded WITH their measured value and printed on every run; the gate
      # fails on anything new, on a recorded value that moves in either
      # direction, and on an accepted entry that nothing tests. Stdlib only.
      - name: Brand text is legible on the grounds it is painted on
        run: python3 scripts/validate_contrast.py

      # There is ONE copy of each engine block, under engine/, and every
      # instance's index.html/sw.js is composed from it (R3). This is that
      # invariant's gate: an ENGINE fence hand-edited inside an instance file,
      # or an engine/ block edited without recomposing, fails here. It replaces
      # the cross-repo release channel that used to keep N copies in step —
      # there is no longer more than one copy to keep. Stdlib only.
      - name: Instances carry exactly the shared engine
        run: python3 scripts/compose_app.py --check

      # (The state-template gate was retired in R2.1 — the template repo is
      # archived and a new state is now a folder in this repo, not a generated
      # sibling. docs/DEV_PROCESS_ASSESSMENT.md.)

      # The per-county completion table (docs/COUNTY_STATUS.md) is generated
      # from the coverage-ring lists, index.html's dispatch tables,
      # coverage-gaps.json and the commissioners roster. This is its drift
      # gate: a county change that skips the regenerate fails here rather
      # than letting the table rot the way prose counts do. Stdlib only.
      - name: County status matches its sources
        run: python3 scripts/build_county_status.py --check

      # Three counties' rosters carry a `seats` value their blocked scrapers
      # cannot re-stamp (DeKalb behind a captcha, Kendall and McHenry blocking
      # every automated client — see scripts/backfill_board_seats.py). This is
      # that invariant's gate: it fails if a shipped roster loses `seats` or
      # holds more members in a district than the builder's own
      # SEATS_PER_DISTRICT allows. It advertised --check from the day it was
      # written and no workflow ran it until the 2026-08-24 scripts audit.
      # Stdlib only.
      - name: Backfilled board seats still stamped
        run: python3 scripts/backfill_board_seats.py --check

      # Dark mode's map palette is DERIVED from the app's own layer colours, not
      # hand-picked (scripts/build_dark_map_palette.py carries the method and the
      # measurements). This is its drift gate: change a layer colour without
      # re-deriving and the dark counterpart silently keeps the old hue, which
      # is invisible in light mode and wrong in dark. Stdlib only.
      - name: Dark map palette matches the app's layer colours
        run: python3 scripts/build_dark_map_palette.py --check

      # The root landing page is GENERATED from metros.json + the Districtry
      # tokens (R4). This is its drift gate: hand-editing the page, or adding a
      # place to the fleet without regenerating, fails here rather than shipping
      # a front door that disagrees with the manifest. It is also what catches a
      # renamed design token — the builder names the ones it needs. Stdlib only.
      - name: Landing page matches the fleet manifest
        run: python3 scripts/build_landing_page.py --check

      # The coverage map the landing page embeds is generated from the SAME
      # manifest plus each instance's own outline files, so it drifts for one
      # more reason than the page above: an instance that moves or renames its
      # data/app outline. The builder resolves every one of those paths, so
      # this fails by name rather than shipping a map with a place missing —
      # which on a coverage map reads as "we don't cover there". Stdlib only.
      - name: Coverage map matches the fleet manifest and the instances' outlines
        run: python3 scripts/build_coverage_map.py --check

      # The privacy page is GENERATED, and uniquely among these gates it is
      # generated by MEASURING the apps rather than by reading a manifest: it
      # regexes each shipped index.html for its analytics, its browser-storage
      # keys, its geocoders and whether any layer sends the selected point to a
      # server. So this step fails on two quite different things, and both are
      # worth failing on — someone hand-edited a page of factual claims, or an
      # APP changed what it does and the published privacy claims are now
      # wrong. It also gates the fleet-wide sentences (the analytics event list
      # and the two-decimal coordinate rounding) as IDENTICAL across the three
      # apps, so a divergence cannot be published as a shared fact. Stdlib only.
      - name: Privacy page matches what the apps actually do
        run: python3 scripts/build_privacy_page.py --check

      # The deployment-history pages (opt-in per instance): the stat tiles are
      # MEASURED from the shipped data files, so any change that moves a number
      # regenerates the page or fails here — a history page that has drifted
      # from the data it describes is worse than no history page.
      - name: History pages match the instances' own data
        run: python3 scripts/build_history_page.py --check

      # The web app manifest is the surface NO other gate could see, and it
      # rotted for exactly that reason: after the rebrand every generated
      # surface said districtry while il/manifest.webmanifest still read
      # "Chicago District Explorer" in the pre-rebrand navy, so installing to
      # an Android home screen produced the old name and the old icon. NY and
      # SF were the same. It is generated from each worksheet's brand block
      # now, and this is the gate that keeps it that way. It also refuses to
      # name an icon that is not on disk — a manifest pointing at a missing
      # PNG installs a blank square and nothing else notices. Stdlib only.
      - name: Install manifests match the brand keys
        run: python3 scripts/build_manifests.py --check

      # The favicon is the one branded asset whose audience is a CRAWLER, and it
      # was the one nobody could see was broken: every page carried the mark
      # inline as a data: URI, which renders perfectly in a browser tab and is
      # invisible to Googlebot-Image, so districtry.com showed the generic globe
      # beside its search result. /favicon.ico 404'd too. This checks that the
      # root pages name a favicon that is a real, existing, square file — not a
      # data: URI — because "it looks right in my tab" is exactly the evidence
      # that misled here. Stdlib only.
      - name: Home page declares a favicon a crawler can fetch
        run: python3 scripts/validate_favicon.py

      # A `#` comment between two backslash-continued lines does not annotate
      # the command, it TERMINATES it — bash joins the continuation first. Six
      # lines of well-meant explanation inside the deploy's rsync invocation
      # stopped the site publishing on 2026-08-24 while every gate here stayed
      # green, because the assemble step only runs on main, AFTER the merge.
      # This is the cheap guard that reaches the PR. Stdlib only.
      - name: No comment inside a shell line-continuation
        run: python3 scripts/validate_shell_continuations.py

      # Every script a workflow runs must import under the dependencies that
      # workflow installs. This catches the seam no other gate looks at: the
      # five derived-boundary roster refreshes (Cass, De Witt, Marshall, Mason,
      # Washington) were dead from the day they shipped because their builders
      # imported a composition constant from a module that pulled in shapely at
      # module scope, which those jobs correctly never install. Scrapers fine,
      # data fine, validate_index fine, every local run fine. Stdlib only, so it
      # runs before anything is installed.
      - name: Workflow scripts import under their declared dependencies
        run: python3 scripts/validate_workflow_deps.py

      # scripts/undeliverable.py withholds addresses that cannot receive mail
      # from every card. Its risk is the one every exception list has: an entry
      # outliving its reason, silently. The first draft printed a RETIRE line
      # from the builders and returned a list every caller discarded, which is
      # the permanent-silent-hole shape check_roster_retention.py records having
      # had to fix in ACCEPTED_DROPS. This reads the shipped tree instead and
      # fails on an orphaned scope or on an address the withhold stopped
      # dropping. The third test — a withheld domain that comes back — needs DNS
      # and runs monthly in validate_card_links.py.
      - name: The undeliverable-address list has not gone stale
        run: python3 scripts/undeliverable.py

      # A skill under .claude/skills/ is prose an agent loads at the moment it
      # starts a task, and prose that names scripts, tables, guide sections and
      # flags is a copy of facts that live elsewhere — the drift class every
      # other gate here exists for. The steward skill's own preamble says why a
      # skill carries only what CLAUDE.md does not; this is what keeps the
      # pointers it does carry pointing at things: every backticked path
      # exists, every §N.N is a heading in docs/EXPANSION_GUIDE.md, every
      # --flag after a script is one the script mentions, every ALL_CAPS table
      # name lives in a file the skill names, and the description fits the
      # trigger surface. It found its first stale path in the first skill
      # written against it. Stdlib only.
      - name: Skills point at things that exist
        run: python3 scripts/validate_skills.py

      # No app may ask an ArcGIS service for f=geojson. The export unnests a
      # feature's interior rings, so a publisher's cutout becomes ground the
      # layer claims — measured 2026-09-05 at 41 of 153 live polygon layers,
      # 1,376 rings and 298.2 km². fetchArcGISAsGeoJSON refuses such a url at
      # fetch time, but that is a card a reader has to reach first, and a
      # failed fetch renders as the honest "data source didn't respond" state,
      # so nothing looks wrong. This is the static half.
      - name: No app requests the lossy ArcGIS GeoJSON export
        run: python3 scripts/validate_arcgis_format.py

      # The nesting itself, on fixtures rather than on whichever county server
      # happens to answer. Every ArcGIS response the smoke tests touch is
      # stubbed, so before this the polygon path — orphan CCW rings, collapsed
      # rings, a shell no larger than its hole — ran in CI only by accident.
      - name: Esri ring nesting behaves on fixtures
        run: node scripts/esri_rings_test.mjs

      # ADDING A STATE IS NOT ONE EDIT. The instance is a folder, and a dozen
      # other places have to learn its tag — the generator's table, the fleet
      # manifest, four hand-kept tables in four builders, and the three literal
      # per-instance lists in THIS file. Five consumers discover the fleet from
      # the tree and need nothing; the rest are lists somebody wrote once, and
      # nothing measured that they agree. Twice the miss shipped: 303 URLs went
      # unwatched when validate_card_links.py named four instances out of five,
      # and a bot PR stripped three fields from all 213 New York legislators
      # while the retention gate, pointed at il/data/app alone, reported "222
      # roster files, no field lost its records". This takes the TREE as
      # canonical — a top-level dir with index.html and data/app/ IS an
      # instance — so a sixth folder nobody registered fails here instead of
      # being quietly untested. Stdlib only.
      - name: Every instance is registered everywhere
        run: python3 scripts/validate_instance_registration.py

      # EVERY SAME-ORIGIN FILE A PAGE ASKS FOR MUST BE IN THE TREE. Michigan's
      # go-live found two of these by hand, minutes apart, in an instance that
      # had already passed this whole battery twice: mi/index.html declared 18
      # @font-face rules reading `url(fonts/*.woff2)` against an mi/fonts/ that
      # did not exist, and named an og-image.png that did not exist. The first
      # would have served the app in system fonts forever with no error and no
      # red gate; the second would have broken every social preview. Nothing
      # was going to catch either — validate_card_links.py probes ABSOLUTE urls
      # over the network monthly (a relative href "is not its subject at all",
      # in landing_test.mjs's own words) and an absolute url on our own
      # not-yet-published path is indistinguishable from a site that is down;
      # landing_test.mjs boots browsers only for the ROOT's pages; and a 404 on
      # a font throws no console error, so no smoke test fails either. Surface
      # is DISCOVERED from the tree, so a new instance is covered the day its
      # folder exists. Stdlib only.
      - name: Every same-origin asset a page names is in the tree
        run: python3 scripts/validate_instance_assets.py

      # THE COVERAGE WASH IS A CLAIM, AND ITS GATE WAS IN NO WORKFLOW. Each
      # statewide instance ships a dissolved outline of its served counties;
      # --check validates that shipped ring against the instance's hand-listed
      # INSIDE/OUTSIDE anchors, and nothing ran it. It also cannot rebuild
      # (that needs TIGERweb), so a county added to METRO_COUNTY_FIPS without
      # an anchor was green by construction — the ring simply never got asked
      # about it. That is how Wisconsin greyed out seven counties for two days
      # with every gate passing. check_anchor_registry(), added 2026-09-02 and
      # run on both the check and build paths, makes the anchor list track the
      # county list offline: one anchor per served county, no county doubled,
      # none both inside and outside. Stdlib only, no network.
      - name: Coverage ring anchors track the served-county list
        run: |
          # --check reads the shipped ring and the anchor lists and fetches
          # nothing, but validate_workflow_deps.py walks an entry point WITH its
          # function-local imports — running a script runs its functions, and it
          # cannot know which argv path CI takes. requests is real for the
          # rebuild path, so it is installed here rather than the check being
          # split into a second entry point to dodge a true dependency.
          pip install -c scripts/requirements.txt requests
          python3 scripts/build_metro_outline.py --check
          python3 wi/scripts/build_metro_outline.py --check
          python3 ia/scripts/build_metro_outline.py --check
          python3 mi/scripts/build_metro_outline.py --check

      # docs/PRESS_LIST.md carries a --check in its own header calling it the
      # drift gate, and until now nothing ran it — a generated file gated in
      # name only, which is the shape this repo keeps finding (a measurement
      # filed somewhere no pass repeats). It matters more than a doc usually
      # would: the page is the send ledger for outreach to strangers, so a
      # stale copy is what makes someone pitch the same tips inbox twice.
      # Stdlib only.
      - name: Press list matches its data
        run: python3 scripts/build_press_list.py --check

      # "N layers" is the fleet's most-repeated number and, until this gate,
      # its least watched: 32 claims across 77 documents and nothing compared
      # one against a worksheet. The adjacent gates miss it by construction —
      # build_landing_page.py generates the root page's six aria-labels from
      # len(worksheet["layers"]), and fleet_status.py diffs layer IDS against
      # the guidebook matrix weekly and WARN-only, which says nothing about a
      # number typed into a sentence. Four were wrong on introduction, two of
      # them in docs/press-list.json — the outbound press list, i.e. the number
      # a journalist would have been handed. Stdlib only.
      - name: Layer counts in prose match the worksheets
        run: python3 scripts/validate_doc_counts.py

      # The Jasper test decides whether a county's precinct fabric is still the
      # Census 2020 fabric, and its five reconciliation causes are the
      # difference between reading a county as re-precincted and reading it as
      # buildable — measured, ten counties were false-rejected in one sweep.
      # Each cause is safe only because of a guard (exactly 17 characters; no
      # other ordinal on the stem; the roman alphabet restricted to I/V/X so
      # DIX survives), and a guard nothing exercises is a guard that erodes.
      # This runs those guards against the worked examples. Stdlib only, and no
      # network: --jasper is the networked mode and is deliberately not run here.
      - name: Precinct-fabric reconciliation causes still hold
        run: python3 scripts/isbe_precinct_fabric.py --selftest

      # The Iowa board-chair minutes parser refuses four things, and every one
      # of them was a wrong answer first: a role claimed from BOTH sides of a
      # flattened signature block (Des Moines prints `Shane McCampbell, Chair`
      # above `Tom Broeker, Vice Chair`, so one reading names each man), a role
      # preceded by `Vice`, a role whose nearest name is 18 characters away
      # across `to authorize the`, and `presiding`, which is who gavelled a
      # meeting rather than who holds the office. Those refusals are what stand
      # between the County Supervisor card and a confidently wrong name, and
      # they live in one regex pair that any edit can loosen. This runs them
      # against the lines the counties really print — no network, and every
      # case is a literal string.
      #
      # pdfplumber is installed even though --selftest never opens a PDF, for
      # the reason the coverage-ring step gives about requests:
      # validate_workflow_deps.py walks an entry point WITH its function-local
      # imports and cannot know which argv path CI takes, and pdfplumber is a
      # real dependency of the scrape path. Installing it is the honest fix;
      # splitting the self-test into a second entry point to dodge a true
      # dependency is not.
      - name: Iowa board-chair minutes parser still refuses its traps
        run: |
          pip install -c ia/scripts/requirements.txt pdfplumber
          python3 ia/scripts/ia_county_minutes_chair_scraper.py --selftest

      # A roster's count guard proves it still has twelve members; it proves
      # nothing about whether those twelve still carry an e-mail. On 2026-08-08
      # Cloudflare's e-mail obfuscation quietly emptied all seven of Brown
      # County's addresses and every existing guard passed, because seven rows
      # went in and seven came out. This compares each roster field against the
      # same file at the base of the change and fails when one stops being
      # published — including per county inside a shared file, which is where
      # that near-miss actually lived. Stdlib only.
      - name: Roster fields still published
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "comparing roster fields against $BASE"
          python3 scripts/check_roster_retention.py --base "$BASE"

      # A CACHE-FIRST data file that changes without a CACHE_NAME bump reaches
      # nobody who has already visited. Wisconsin added seven counties across
      # five PRs on 2026-09-02, every one rewriting the cache-first coverage
      # ring, and none bumped the cache: returning visitors got the new
      # supervisors on their cards (rosters are network-first) and the old wash
      # on the map, greying out the very counties that had just been added.
      # sw.js says to bump it; nothing checked that anyone had.
      - name: Cache-first data carries a cache bump
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "comparing cache-first data against $BASE"
          python3 scripts/check_cache_version.py --base "$BASE"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Pinned to the version the test was authored against; installs into the
      # ephemeral workspace only (node_modules is never committed — this repo
      # has no build step).
      #
      # Chromium (~170 MB) used to be re-fetched from Playwright's CDN on every
      # run, and on 2026-08-18 that fetch hung twice — 28 and 14 minutes
      # against a normal ~23 s step — each needing a manual cancel + re-run.
      # Two guards, either sufficient alone: the browser build is CACHED keyed
      # on the pinned version (a hit skips the CDN entirely; only the apt-side
      # install-deps still runs, and the runner image pre-satisfies most of
      # it), and every phase runs under its own budget — sized in the install
      # step to fail NAMED inside that step's 15-minute cap, with apt outside
      # the retry entirely, because a timeout-killed apt orphans the dpkg lock
      # and poisons every retry (observed live in the SF fork's first cached
      # run). deploy-pages.yml and release-engine.yml run this same
      # toolchain and carry the same pair, pointing here for the story.
      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.PLAYWRIGHT_VERSION }}-${{ runner.os }}

      - name: Install Playwright + Chromium
        # Backstop for a multi-phase failure day. The ladder inside is sized to
        # fail NAMED under this cap when any ONE phase is sick (budgets in the
        # run body); two-plus sick phases at once is what this cap is for.
        timeout-minutes: 15
        run: |
          # Phase budgets, sized so any SINGLE sick phase fails with a NAMED
          # error inside the step's 15-minute cap — the cap stays the
          # multi-phase backstop, never the first line of defence:
          #   npm      3 x 60s   (normally ~2 s; lock-free, retry-safe)
          #   apt      1 x 420s  (normally seconds; NEVER retried in-process —
          #            a timeout-killed apt orphans apt-get still holding
          #            /var/lib/dpkg/lock-frontend, so every in-job retry dies
          #            on the corpse's lock, proven live in the SF fork. A
          #            mirror too sick for 7 minutes needs a fresh runner,
          #            and only a re-run provides one.)
          #   browser  2 x 300s  on a cache miss only (the CDN fetch that hung
          #            28 minutes in the Chicago fork; lock-free, retry-safe)
          retry() {
            local attempts=$1 budget=$2; shift 2
            for i in $(seq 1 "$attempts"); do
              timeout "$budget" "$@" && return 0
              echo "::warning::attempt $i/$attempts of '$*' hung or failed"
              sleep 5
            done
            echo "::error::'$*' failed $attempts time(s) at ${budget}s each"
            return 1
          }
          retry 3 60 npm install "playwright@${PLAYWRIGHT_VERSION}"
          retry 1 420 npx playwright install-deps chromium
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            retry 2 300 npx playwright install chromium
          fi

      # Static merge gate, once per instance. Each instance's validate_index.py
      # resolves data/app relative to the index it is handed, so every instance runs
      # from the repo root. Stdlib only, so this sits before the browser work
      # and fails fast.
      - name: Each instance's index validates
        run: |
          python3 scripts/validate_index.py il/index.html
          python3 ca/scripts/validate_index.py ca/index.html
          python3 ny/scripts/validate_index.py ny/index.html
          python3 wi/scripts/validate_index.py wi/index.html
          python3 ia/scripts/validate_index.py ia/index.html
          python3 mi/scripts/validate_index.py mi/index.html

      # ONE server, EVERY instance. Until R3 this ran il alone, which is what
      # the repo had — ca and ny were separate repos with their own CI. They
      # are folders here now, and an ungated folder is worse than an ungated
      # repo: it merges through this workflow while nothing looks at it. The
      # first run of this step found the defect that proves the point — both
      # imported smoke tests read "data/app/coverage-gaps.json" relative to the
      # process CWD, correct when you ran them from their own repo root and
      # ENOENT here. Each instance keeps its own smoke test because each
      # describes a different city; what is shared is the server and the gate.
      - name: Serve app and run every instance's smoke test
        run: |
          python3 -m http.server 8000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/il/ >/dev/null && break
            sleep 0.5
          done
          status=0
          # Run every instance even if an early one fails, so a PR sees every broken
          # instance in one go rather than one per push.
          BASE_URL=http://localhost:8000/il/  node scripts/smoke_test.mjs     || status=1
          BASE_URL=http://localhost:8000/ca/  node ca/scripts/smoke_test.mjs  || status=1
          BASE_URL=http://localhost:8000/ny/  node ny/scripts/smoke_test.mjs  || status=1
          BASE_URL=http://localhost:8000/wi/  node wi/scripts/smoke_test.mjs  || status=1
          BASE_URL=http://localhost:8000/ia/  node ia/scripts/smoke_test.mjs  || status=1
          BASE_URL=http://localhost:8000/mi/  node mi/scripts/smoke_test.mjs  || status=1
          # The root landing page and — the part that matters — its forwarding
          # guard, which is what keeps every already-distributed share link and
          # embed snippet built from the OLD root URL reaching the app. A regex
          # typo there breaks other people's pages silently, on a page that still
          # looks right and still passes its drift check.
          BASE_URL=http://localhost:8000        node scripts/landing_test.mjs || status=1

          # Every page in the sitemap carries the same brand and the same
          # standing links. This exists because three published pages were found
          # on 2026-08-24 still serving the PRE-REBRAND skin — Inter, no theme
          # boot, no mark — having survived two consecutive stages whose whole
          # subject was the rebrand. Nothing caught them because nothing
          # COMPARED them: the composer checks the apps, the generator checks
          # generated regions, the link gate checks that links resolve, and not
          # one of them asks whether two published documents look like the same
          # product. It derives its page list from sitemap.xml and its
          # expectations from the tree, so a new page is covered the day it
          # ships and a correct change cannot fail it.
          BASE_URL=http://localhost:8000        node scripts/page_consistency_test.mjs || status=1

          # Which layers send the reader's SELECTED POINT to a government
          # server. The privacy page publishes that number per app, and until
          # 2026-09-05 it counted `loadArcGISPointGeoJSON(` call sites —
          # Illinois published 10 against a true 19, New York City "None."
          # against a true 4.
          #
          # NEITHER A REGEX NOR A STRUCTURAL READ CAN BE RIGHT. A registration
          # factory serves as many layers as it is CALLED from one occurrence,
          # and registerCountyLayer CLOSES OVER its entries, so two Illinois
          # layers are invisible even to a full walk of the live module graph.
          # And a layer that merely CARRIES an `.atPoint` hook may never fire
          # it: the hook is invoked in exactly one place, inside
          # queryFeatureAt, and the nearest-point factory and several NYC/SF
          # layers call their loader directly. Counting carriage overcounts,
          # which on this page is a false statement in the other direction.
          #
          # So the probe REPLACES every hook with a recorder, switches on every
          # layer, selects points inside the instance's own coverage, and
          # counts the hooks that FIRE. build_privacy_page.py — which has no
          # browser in its own step — reads the artifact and refuses to publish
          # when the apps have moved under it.
          BASE_URL=http://localhost:8000        node scripts/probe_point_transmission.mjs --check || status=1
          exit $status
