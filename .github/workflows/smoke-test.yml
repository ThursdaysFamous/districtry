name: Smoke test

# Headless boot + behaviour check on every pull request: serves the real
# index.html and drives it in Chromium (scripts/smoke_test.mjs) to confirm the
# app boots, registers every layer (the worksheet-generated EXPECT_LAYERS
# count), classifies a known point with the no-API anchor layers, and degrades
# gracefully when a data source fails. This is the
# validation the README describes; it runs before merge so a change that breaks
# boot or the data files can't land unnoticed.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

# One pin, two consumers: the npm install and the browser-cache key below must
# name the same Playwright version, or a bump re-downloads Chromium forever
# against a stale cache key. Defined once so they cannot drift.
env:
  PLAYWRIGHT_VERSION: "1.56.1"

# SUPERSEDED PR RUNS ARE CANCELLED; MAIN'S ARE NOT.
#
# Measured on 2026-09-22: runs 2726 (00:39:06) and 2727 (00:42:15) were the
# same branch three minutes apart, and 2726 ran to completion at 00:52:59 —
# fourteen minutes of runner time on a commit that was obsolete before it
# finished, producing a red-or-green signal for code nobody would look at
# again. With five sessions pushing, that is the largest pure waste in this
# file.
#
# THE GROUP IS PER-PR AND DELIBERATELY NOT PER-BRANCH-ON-MAIN. A push to main
# is the merge record and the input to the deploy, so cancelling one would
# lose the only run that says whether what merged is green. Giving those runs
# a group keyed on the run id rather than the ref keeps them ungrouped in
# effect — they neither cancel each other nor QUEUE behind each other, which a
# shared group would silently make them do.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    # A CEILING ON THE WHOLE JOB, added 2026-08-18 after three runs in two days
    # sat "in_progress" long enough to look hung — 57 minutes, then 35, then 16,
    # every one of them on the Playwright install below. THEY WERE NOT UNBOUNDED
    # HANGS, which is the thing worth knowing: the install's first retry ladder
    # was bounded but could stack ~30 minutes of grinding that reports nothing
    # and, on deploy-pages, holds the Pages concurrency slot so every
    # later deploy queues behind it. A bounded-but-half-hour step is
    # indistinguishable from a hang to anyone watching, and the only thing that
    # caught all three was comparing the live site against the repo by hand.
    # This makes that state VISIBLE — a red run a human can act on — instead of
    # silent. The install step now sizes its phase budgets to fail NAMED under
    # its own 15-minute cap, so this ceiling guards the OTHER steps and true
    # catastrophes, not the install's ordinary sick days.
    timeout-minutes: 30
    # EVERY STEP BUT THE CHECKOUT CARRIES `if: ${{ !cancelled() }}`, so one
    # red gate no longer hides the other seventy-eight answers.
    #
    # The browser step below already aggregates, with its reasoning written
    # out: `|| status=1` on each instance "so a PR sees every broken instance
    # in one go rather than one per push." That reasoning was never applied to
    # the steps AHEAD of it, where it is cheaper and worth more — the whole
    # static block is 90s (measured 2026-09-22 on run 35805094847), and it
    # holds 74 independent answers against that step's six. A change breaking
    # three unrelated gates cost three ~14-minute round trips to find out.
    #
    # THE JOB STILL FAILS: `!cancelled()` runs the step, it does not forgive
    # it, and a job with a failed step is red however many steps followed it.
    # `always()` is deliberately not used — it would also run these while the
    # job is being cancelled, which is the one time nobody wants the answer.
    #
    # The cost is that a break in an early generation gate now shows up again
    # in whatever downstream gate reads what it generates. That is the right
    # trade: several red steps with one root cause are read in a minute, where
    # one red step and 78 unknowns are another push.
    steps:
      - uses: actions/checkout@v4
        with:
          # The retention gate below reads each roster file as it stands at
          # the base of this change, so it needs history, not a shallow tip.
          fetch-depth: 0

      # Conversion 2 drift gate (docs/MECHANIZATION_PLAYBOOK.md): every
      # GENERATED region must match what metro-worksheet.json generates.
      # Hand-editing a generated region fails here — edit the worksheet and
      # run scripts/generate_metro_files.py instead.
      - name: Generated regions match the worksheet
        if: ${{ !cancelled() }}
        run: |
          pip install -c scripts/requirements.txt jsonschema
          python3 scripts/generate_metro_files.py --check

      # The Data gaps panel is driven by il/data/app/coverage-gaps.json, emitted
      # from the guidebook's gaps block. This is the drift gate: editing the
      # guidebook without regenerating (or the reverse) fails here rather than
      # shipping a panel that disagrees with the document of record. Stdlib only.
      - name: Coverage gaps match the guidebook
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/build_coverage_gaps.py --check
          python3 scripts/build_coverage_gaps.py --check --metro wisconsin --out wi/data/app/coverage-gaps.json
          python3 scripts/build_coverage_gaps.py --check --metro iowa --out ia/data/app/coverage-gaps.json
          python3 scripts/build_coverage_gaps.py --check --metro michigan --out mi/data/app/coverage-gaps.json
          # ny/ and ca/ ship a gaps file too; until 2026-09-02 only three of the
          # five keys were gated here, and drift in the other two surfaced only in
          # the weekly fleet-status notice.
          python3 scripts/build_coverage_gaps.py --check --metro nyc --out ny/data/app/coverage-gaps.json
          python3 scripts/build_coverage_gaps.py --check --metro sf --out ca/data/app/coverage-gaps.json

      # A number a gap record STATES must equal the file it describes.
      # ia-board-chair told readers "43 of Iowa's 99 counties" for eleven days
      # while the file held 38, and #1034 fixed the number without adding a
      # gate — so the next weekly run could make it stale again in silence.
      # The record declares which number is backed by what; nothing is inferred,
      # because only 3 of the 153 numbers in the reader fields are file-backed.
      - name: Stated gap counts match their sources
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/validate_gap_counts.py --selftest
          python3 scripts/validate_gap_counts.py

      # mi/data/source/mi-county-board-probe.json records which unserved Michigan
      # counties publish a district-keyed board page, and its --check re-audits
      # that file against the tree offline: a county that has since shipped or
      # been recorded shut must be pruned, an untried one must be present, every
      # named URL must carry the robots reading a later run can diff against,
      # and the host generator must still find all its known hosts. IT HAD
      # EXISTED SINCE 2026-09-18 AND RUN IN NO WORKFLOW, which is how the
      # artifact it guards went a tranche out of date in the first place.
      # Stdlib only, no network.
      - name: The Michigan board probe's artifact still describes the tree
        if: ${{ !cancelled() }}
        run: python3 mi/scripts/probe_mi_county_boards.py --check

      # Adam opened the certified-returns route on 2026-09-22 on ONE condition:
      # a name from the state's election column may ship only where the row
      # says what it is. This gate is that condition, enforced -- it fails on a
      # record with no `lede`, on the two rosters overlapping, and on the cohort
      # drifting from the counties the gap records name. Offline, stdlib only.
      - name: Michigan's certified-returns roster still says what its names are
        if: ${{ !cancelled() }}
        run: python3 mi/scripts/build_mi_returns_roster.py --check

      # The weekly Detroit roster PR's title and body are written by this
      # script, and a reviewer acts on "no officeholder changed" by NOT reading
      # the diff — so a wrong summary is worse than the static paragraph it
      # replaced. The selftest holds it to the stamp-only, rung-changed,
      # seat-changed, at-large, link-only, unknown-field, new-roster and
      # identical cases, and to the shipped roster carrying no field the
      # summariser cannot classify. That last one is why it belongs in CI
      # rather than only in the weekly job: a field added to the builder makes
      # this fail HERE, on the PR that adds it, instead of silently widening
      # what a Wednesday summary quietly leaves out.
      # Stdlib only, no network.
      - name: The Detroit roster summariser still describes that roster
        if: ${{ !cancelled() }}
        run: python3 mi/scripts/summarize_detroit_roster_change.py --selftest

      # Wisconsin's county-board-directory.json carries each county's board
      # SIZE, and it reads that number back from the shipped supervisory
      # geometry rather than restating it — so the only way the two can
      # disagree is if one is rebuilt and the other is not. This is that gate.
      # Local files only: the builder's --check re-derives the seat counts from
      # data/app and compares, and fetches nothing.
      - name: WI county board directory matches the shipped districts
        if: ${{ !cancelled() }}
        run: python3 wi/scripts/build_wi_county_board_directory.py --check

      # Wisconsin's 72 county containment outlines are SLICED from the same
      # state-counties.json the county card renders, so the two can only
      # disagree if one is rebuilt and the other is not — and a stale outline
      # silently mis-answers "does this gap apply where you clicked" rather
      # than failing. Local files only; the builder's own containment and
      # exclusivity gates re-run on every check.
      - name: WI county outlines match the shipped county fabric
        if: ${{ !cancelled() }}
        run: python3 wi/scripts/build_wi_county_outlines.py --check

      # THE GAP-LOCATION OUTLINES, both directions. A `counties` tag is a
      # promise the Data gaps panel can locate that county: it fetches
      # data/app/<slug>-county-outline.json to decide whether a gap is where a
      # reader clicked, and a tag with no outline 404s while the panel's
      # `mappable` flag flips true anyway — so the lede claims "Nothing
      # recorded is missing where you clicked" inside a county the gap covers.
      # build_coverage_gaps.py refuses the tag; these refuse the reverse, an
      # outline whose county is served or no longer named. Offline: each
      # re-runs the build's own internal-point cross-check from a recorded
      # artifact. Michigan's shipped on 2026-09-22 IN NO WORKFLOW, which is the
      # same "a gate nothing runs" hole build_metro_outline.py --check sat in.
      - name: MI gap outlines match the counties that need them
        if: ${{ !cancelled() }}
        run: python3 mi/scripts/build_mi_gap_outlines.py --check

      - name: IA gap outlines match the counties its gap records name
        if: ${{ !cancelled() }}
        run: python3 ia/scripts/build_ia_gap_outlines.py --check

      # districtry/tokens/districtry.tokens.css is the ONE source of the brand
      # surface, and this is what makes that true rather than aspirational. The
      # fleet was carrying one palette under two vocabularies and four hand-kept
      # copies; the copies had already diverged on three values, including a
      # dark link colour that differed between the root pages and the app. It
      # checks every consumer through an explicit alias table — a consumer keeps
      # its own NAMES, never its own values — and covers the metric-matched
      # fallback face, which four surfaces named in --font-body and never
      # defined. Runs BEFORE compose_app because it writes what that splices.
      # EXTENDED 2026-09-02 after two weeks green over two live drifts it could
      # not see: it checked the skin's LIGHT neutrals and a hand-kept list of
      # three worksheets, while the skin's dark block restated all four accents
      # by hand (one of them two hex digits off) and Iowa's worksheet — the
      # fourth of five — had carried two off-fleet values since the day it
      # shipped. Both tiers of the skin are checked now, presence required,
      # and the worksheets are discovered rather than listed. Stdlib only.
      - name: Brand tokens have one source
        if: ${{ !cancelled() }}
        run: python3 scripts/build_brand_tokens.py --check

      # The token file is the one source of the brand surface; this is the one
      # MEASUREMENT of it. Every text colour the palette paints is tested
      # against the ground it sits on, in both tiers, at the floor WCAG sets for
      # its role — the pairs mapped from every CSS surface rather than guessed,
      # the dark tier composed over the light one exactly as the cascade does
      # it. It exists because the palette had 54 aria attributes of care behind
      # it and not one number saying its footer meta was legible: light --faint
      # reads 2.5:1 on white, below even the bar for LARGE text, dark mode
      # paints white on violets that hold it at 2.7:1 and 1.9:1, and the skip
      # link was 1.2:1 in dark until this gate found it. Known shortfalls are
      # recorded WITH their measured value and printed on every run; the gate
      # fails on anything new, on a recorded value that moves in either
      # direction, and on an accepted entry that nothing tests. Stdlib only.
      - name: Brand text is legible on the grounds it is painted on
        if: ${{ !cancelled() }}
        run: python3 scripts/validate_contrast.py

      # There is ONE copy of each engine block, under engine/, and every
      # instance's index.html/sw.js is composed from it (R3). This is that
      # invariant's gate: an ENGINE fence hand-edited inside an instance file,
      # or an engine/ block edited without recomposing, fails here. It replaces
      # the cross-repo release channel that used to keep N copies in step —
      # there is no longer more than one copy to keep. Stdlib only.
      - name: Instances carry exactly the shared engine
        if: ${{ !cancelled() }}
        run: python3 scripts/compose_app.py --check

      # The same invariant read from the other side, plus the one thing the
      # step above cannot say. compose_app splices by MARKER PRESENCE, so a
      # block carried by three instances and absent from three is not wrong and
      # is reported by nothing: county-layer-dispatcher is in il, ia and mi and
      # absent from ca, ny and wi by design, because those three register no
      # county-dispatched concept. --fleet states that shape instead of leaving
      # a reader to infer it from a fence count, and it FAILS on any block whose
      # interior differs between instances, comparing EVERY occurrence of a
      # block rather than one per instance: the first version of this step kept
      # one slot per instance, so a shared block spliced into several sub-pages
      # was only compared in the sorted-last one, and doctoring il/faq.html's
      # footer-byline fence passed. That failure is belt-and-braces behind the
      # step above, which caught every doctoring this one missed. Instances are
      # discovered from the TREE, never a table, and it refuses on fewer than
      # two. Every count it prints is measured at run time and none is written
      # down here, because the fleet's file list moves. Stdlib only.
      - name: Every instance's fences agree, and partial blocks are named
        if: ${{ !cancelled() }}
        run: python3 scripts/check_engine_parity.py --fleet

      # (The state-template gate was retired in R2.1 — the template repo is
      # archived and a new state is now a folder in this repo, not a generated
      # sibling. docs/DEV_PROCESS_ASSESSMENT.md.)

      # The per-county completion table (docs/COUNTY_STATUS.md) is generated
      # from the coverage-ring lists, index.html's dispatch tables,
      # coverage-gaps.json and the commissioners roster. This is its drift
      # gate: a county change that skips the regenerate fails here rather
      # than letting the table rot the way prose counts do. Stdlib only.
      - name: County status matches its sources
        if: ${{ !cancelled() }}
        run: python3 scripts/build_county_status.py --check

      # E.A.M. — whether each state is Examined, Answered and Maintained, which
      # is what "done" means here and what moves a session from expansion to
      # maintenance. Computed from the adapters, the gap records and the
      # scheduled workflows on every run, so the mark GOES BACKWARD when a
      # tranche lands without records or a roster loses its job. Counting gaps
      # instead would invert the incentive: the deepest instance carries the
      # most records. Stdlib only.
      - name: E.A.M. status matches its sources
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/build_eam_status.py --selftest
          python3 scripts/build_eam_status.py --check

      # Three counties' rosters carry a `seats` value their blocked scrapers
      # cannot re-stamp (DeKalb behind a captcha, Kendall and McHenry blocking
      # every automated client — see scripts/backfill_board_seats.py). This is
      # that invariant's gate: it fails if a shipped roster loses `seats` or
      # holds more members in a district than the builder's own
      # SEATS_PER_DISTRICT allows. It advertised --check from the day it was
      # written and no workflow ran it until the 2026-08-24 scripts audit.
      # Stdlib only.
      - name: Backfilled board seats still stamped
        if: ${{ !cancelled() }}
        run: python3 scripts/backfill_board_seats.py --check

      # Illinois's shared board-office fallback. 33 districted board cards name
      # an office only because the state's County Officers Book does, and that
      # document's OTHER column — the chair's name — disagrees with the
      # counties' own rosters at 23 of 75 comparable (30.7%, 2026-09-06), so
      # the file is licensed by measurement rather than by the publisher's
      # standing.
      #
      # WHAT --check ACTUALLY RE-RUNS IS THE AGREEMENT TEST AGAINST A FROZEN
      # SNAPSHOT, not a re-reading of ISBE: the document is a committed file
      # (il/data/source/isbe-county-board-chairs.json) and nothing here fetches
      # it. So this does not catch ISBE changing. What it DOES catch is the
      # other side moving, which is the side that moves weekly: a county board
      # roster refresh that gives a county its OWN published address, or edits
      # one it already had, turns an agreement into a disagreement or an
      # overlap — and the builder then refuses to write, which fails here.
      # Sixty roster workflows open bot PRs into this gate, so that is the
      # realistic failure and it is the one worth guarding. Stdlib only.
      - name: Shared board-office addresses still corroborated
        if: ${{ !cancelled() }}
        run: python3 scripts/build_county_board_offices.py --check

      # Dark mode's map palette is DERIVED from the app's own layer colours, not
      # hand-picked (scripts/build_dark_map_palette.py carries the method and the
      # measurements). This is its drift gate: change a layer colour without
      # re-deriving and the dark counterpart silently keeps the old hue, which
      # is invisible in light mode and wrong in dark. Stdlib only.
      - name: Dark map palette matches the app's layer colours
        if: ${{ !cancelled() }}
        run: python3 scripts/build_dark_map_palette.py --check

      # The root landing page is GENERATED from metros.json + the Districtry
      # tokens (R4). This is its drift gate: hand-editing the page, or adding a
      # place to the fleet without regenerating, fails here rather than shipping
      # a front door that disagrees with the manifest. It is also what catches a
      # renamed design token — the builder names the ones it needs. Stdlib only.
      - name: Landing page matches the fleet manifest
        if: ${{ !cancelled() }}
        run: python3 scripts/build_landing_page.py --check

      # The coverage map the landing page embeds is generated from the SAME
      # manifest plus each instance's own outline files, so it drifts for one
      # more reason than the page above: an instance that moves or renames its
      # data/app outline. The builder resolves every one of those paths, so
      # this fails by name rather than shipping a map with a place missing —
      # which on a coverage map reads as "we don't cover there". Stdlib only.
      - name: Coverage map matches the fleet manifest and the instances' outlines
        if: ${{ !cancelled() }}
        run: python3 scripts/build_coverage_map.py --check

      # The privacy page is GENERATED, and uniquely among these gates it is
      # generated by MEASURING the apps rather than by reading a manifest: it
      # regexes each shipped index.html for its analytics, its browser-storage
      # keys, its geocoders and whether any layer sends the selected point to a
      # server. So this step fails on two quite different things, and both are
      # worth failing on — someone hand-edited a page of factual claims, or an
      # APP changed what it does and the published privacy claims are now
      # wrong. It also gates the fleet-wide sentences (the analytics event list
      # and the two-decimal coordinate rounding) as IDENTICAL across the three
      # apps, so a divergence cannot be published as a shared fact. Stdlib only.
      - name: Privacy page matches what the apps actually do
        if: ${{ !cancelled() }}
        run: python3 scripts/build_privacy_page.py --check

      # /about.html states this project's own size — how many places it answers
      # in, how many officeholders it names, how many gaps it has recorded — and
      # a stated size is the claim that goes stale first: every one of those
      # numbers has moved inside a fortnight in this repo's history. So the page
      # carries no number the generator did not read from a shipped file on the
      # run that wrote it, and this fails when the tree moves under it. It
      # shares the root pages' shell with the privacy page, so it also fails if
      # that shell is edited for one page and not the other.
      - name: About page matches the tree it describes
        if: ${{ !cancelled() }}
        run: python3 scripts/build_about_page.py --check

      # /feedback.html, the report form every page's footer links (the apps
      # carry their own, opened by #feedback). It is generated on the same root
      # shell, so it also fails if that shell moves and this page is not rebuilt.
      - name: Feedback page matches its generator
        if: ${{ !cancelled() }}
        run: python3 scripts/build_feedback_page.py --check

      # /ai.html, how districtry uses AI. Its prose carries no number, so the
      # drift half of this guards the shared root shell; the rest checks the
      # page's own claims: no served file names an AI service's API host, no
      # workflow or script uses one, every workflow that pushes opens a pull
      # request unless DIRECT_PUSH records why, and robots.txt's Content-Signal
      # still says what the page says about AI systems reading the site.
      - name: AI page matches its generator, and its claims still hold
        if: ${{ !cancelled() }}
        run: python3 scripts/build_ai_page.py --check

      # Which analytics host each page loads, held to the worksheet that
      # declares it. `brand.analytics` is the one place that says whether an
      # instance runs Google Analytics, and the generator emits the tag into
      # that instance's index.html and nowhere else — every sub-page's was a
      # hand-written copy, and two of them (ca/sources.html, wi/sources.html)
      # were reporting into Chicago's property while their own apps declare no
      # ga_id. It also held the counter figure: 192 of 236 pages carry no
      # counter at all, including all 183 per-county pages, so the traffic
      # report has never counted the largest page set on the site.
      - name: Analytics match the worksheets that declare them
        if: ${{ !cancelled() }}
        run: python3 scripts/validate_analytics.py

      # The deployment-history pages (opt-in per instance): the stat tiles are
      # MEASURED from the shipped data files, so any change that moves a number
      # regenerates the page or fails here — a history page that has drifted
      # from the data it describes is worse than no history page.
      - name: History pages match the instances' own data
        if: ${{ !cancelled() }}
        run: python3 scripts/build_history_page.py --check

      # The web app manifest is the surface NO other gate could see, and it
      # rotted for exactly that reason: after the rebrand every generated
      # surface said districtry while il/manifest.webmanifest still read
      # "Chicago District Explorer" in the pre-rebrand navy, so installing to
      # an Android home screen produced the old name and the old icon. NY and
      # SF were the same. It is generated from each worksheet's brand block
      # now, and this is the gate that keeps it that way. It also refuses to
      # name an icon that is not on disk — a manifest pointing at a missing
      # PNG installs a blank square and nothing else notices. Stdlib only.
      - name: Install manifests match the brand keys
        if: ${{ !cancelled() }}
        run: python3 scripts/build_manifests.py --check

      # sitemap.xml is GENERATED, and it is the last hand-kept surface on the
      # site. Measured on 2026-09-12, 32 of its 36 entries carried a lastmod
      # OLDER than the page's own last commit -- median 18 days, worst 25 --
      # because a hand-typed date is right only on the day it is typed. On a
      # site whose whole claim is that it knows who holds a seat today, that
      # signal was telling crawlers not to come back. Several gates already
      # READ this file to discover pages and not one looked at its dates.
      # Inclusion is derived too, so a new topic page joins the day it ships
      # rather than when somebody remembers. Stdlib only.
      # The per-county board pages across Illinois, Wisconsin and Iowa, and
      # four things at once: that each is byte-identical to what its roster
      # generates, that every name in that roster actually appears on the page
      # (byte-equality cannot see an empty template), that every weekly job
      # rewriting one of those rosters regenerates the pages in the same run and
      # stages its OWN instance's, and that no county officeholder roster in the
      # tree is going unread — a new state's roster fails this gate until an
      # adapter reads it or a reason is recorded.
      - name: County board pages match their rosters
        if: ${{ !cancelled() }}
        run: python3 scripts/build_county_pages.py --check

      # The seven Illinois counties whose board MEMBERS ride the same GIS
      # feature as the boundary, so the app fetches both in one request and no
      # roster file ever existed — which meant the gate above, which enumerates
      # roster FILES, gave none of them a page. This asks the question that gate
      # cannot: is every county with a board card either snapshotted here or
      # recorded with a reason why it cannot be. Offline; it reads il/index.html
      # and the tree and fetches nothing.
      - name: Every Illinois board card has a roster or a recorded reason
        if: ${{ !cancelled() }}
        run: python3 scripts/build_il_gis_board_rosters.py --check

      # /llms.txt, the guide robots.txt points a client at. GENERATED, because
      # the llms.txt convention is a hand-written markdown file and a
      # hand-written one here would list the instances, their layer counts,
      # their topic pages and the number of per-county pages — every one of
      # which moves. Its page set comes from sitemap.xml, so it cannot name a
      # page that does not exist, and it refuses to write a districtry.com link
      # the sitemap does not list.
      - name: llms.txt matches the fleet it describes
        if: ${{ !cancelled() }}
        run: python3 scripts/build_llms_txt.py --check

      # docs/ENDPOINT_INVENTORY.md — every host the apps contact while a reader
      # uses them, every dataset the build depends on, and where the terms on
      # each are recorded. GENERATED, because every figure in it moves: the
      # runtime host list grows whenever a county ships a layer that loads live
      # from its own GIS, the dataset counts move weekly, and the
      # point-transmission figures move whenever a loader is rerouted. It
      # IMPORTS build_privacy_page.py rather than re-deciding who receives what,
      # and holds the two readers to each other per app on CARTO, cdnjs and the
      # geocoders — the case neither can see alone. Its "not recorded anywhere in
      # this repository" claims are re-audited every run and FAIL once the repo
      # starts recording one, because that claim rots in the dangerous
      # direction. Offline; it reads the tree and fetches nothing.
      - name: The endpoint and dataset inventory matches the tree it describes
        if: ${{ !cancelled() }}
        run: python3 scripts/build_endpoint_inventory.py --check

      # Both halves matter. The dates are why this gate was written; the PARSE
      # is why it was rewritten. sitemap.xml shipped with a double hyphen inside
      # its own header comment (2026-09-12, the commit that first generated it),
      # which XML forbids, so Google, Bing and every browser rejected the whole
      # document and all 110 URLs with it — and this step stayed green, because
      # it read the file with a regex that matched each <url> block one at a time
      # and never asked whether the file around them parsed.
      - name: Sitemap parses, and its lastmods match each page's last commit
        if: ${{ !cancelled() }}
        run: python3 scripts/build_sitemap.py --check

      # The eight root redirect shells and the 404 are generated from one
      # template plus metros.json, so a new instance reaches the 404's list and
      # a retitled page reaches its shell's wording without anybody remembering.
      # Two of the eight were simply MISSING until 2026-09-15 — /ward.html and
      # /precinct.html both 404'd while six siblings had shells — which is what
      # eight near-identical hand-written files produce.
      - name: Redirect shells and the 404 match their sources
        if: ${{ !cancelled() }}
        run: python3 scripts/build_redirect_stubs.py --check

      # The address box on the eleven question pages. It is one form generated
      # eleven times, and every per-page fact in it — the layers it opens, the
      # button's own words, the place named in the placeholder — is read off
      # that page's .cta link and metros.json. A page that changes which layers
      # it opens, or a new question page that ships without a form, fails here
      # rather than serving a box that hands the app the wrong layers.
      - name: Question pages carry the address box their own CTA describes
        if: ${{ !cancelled() }}
        run: python3 scripts/build_question_forms.py --check

      # The district-name search index ("33rd ward"). Offline and stdlib-only:
      # every district in a shipped boundary file must be present, its point
      # INSIDE it and its extent matching, and the two live layers must still
      # load the dataset the index was built from. Rebuilding needs the
      # network and shapely, so it is an operator step, not this one.
      - name: District search index matches the boundaries it names
        if: ${{ !cancelled() }}
        run: python3 scripts/build_district_search.py --check

      # The city rosters in the served bytes. build_county_pages.py put 2,650
      # county officeholders where a crawler can read them and left the city
      # seats behind a JSON fetch: measured 2026-09-15, NYC's 51 Council
      # Members and SF's 11 Supervisors appeared in no served byte of this
      # site. This gates the tables against the rosters they are built from,
      # FAILS on a weekly roster workflow that rewrites one without
      # regenerating the page, and re-audits the seats recorded as not tabled
      # yet — Chicago's 50 alderpeople, whose roster is a live Socrata call
      # rather than a shipped file.
      # The twelve legislator pages. Every app already carried its state's two
      # chambers and its U.S. House districts with a named member on each card
      # — 1,058 people across eighteen rosters — and measured 2026-09-15 not one
      # of them appeared in any served byte, on a site with no page at all for
      # "who is my state representative". This gates the pages against the
      # rosters and the worksheets they are built from, and fails on a page
      # naming a layer its own instance does not register.
      - name: Legislator pages match their rosters
        if: ${{ !cancelled() }}
        run: python3 scripts/build_legislator_pages.py --check

      # The four concept pages — circuit court, township, school board and
      # judicial subcircuit. Three name people who had shipped as data/app files
      # for months and reached a reader only after JavaScript fetched them; the
      # fourth names nobody, because an Illinois judge is elected FROM a
      # subcircuit and then sits circuit-wide, and its inventory table is parsed
      # out of il/index.html's own dispatch entries rather than kept by hand.
      - name: Concept pages match their rosters
        if: ${{ !cancelled() }}
        run: python3 scripts/build_concept_pages.py --check

      - name: City officeholder tables match their rosters
        if: ${{ !cancelled() }}
        run: python3 scripts/build_officeholder_tables.py --check

      # The favicon is the one branded asset whose audience is a CRAWLER, and it
      # was the one nobody could see was broken: every page carried the mark
      # inline as a data: URI, which renders perfectly in a browser tab and is
      # invisible to Googlebot-Image, so districtry.com showed the generic globe
      # beside its search result. /favicon.ico 404'd too. This checks that the
      # root pages name a favicon that is a real, existing, square file — not a
      # data: URI — because "it looks right in my tab" is exactly the evidence
      # that misled here. Stdlib only.
      - name: Home page declares a favicon a crawler can fetch
        if: ${{ !cancelled() }}
        run: python3 scripts/validate_favicon.py

      # A `#` comment between two backslash-continued lines does not annotate
      # the command, it TERMINATES it — bash joins the continuation first. Six
      # lines of well-meant explanation inside the deploy's rsync invocation
      # stopped the site publishing on 2026-08-24 while every gate here stayed
      # green, because the assemble step only runs on main, AFTER the merge.
      # This is the cheap guard that reaches the PR. Stdlib only.
      - name: No comment inside a shell line-continuation
        if: ${{ !cancelled() }}
        run: python3 scripts/validate_shell_continuations.py

      # Every script a workflow runs must import under the dependencies that
      # workflow installs. This catches the seam no other gate looks at: the
      # five derived-boundary roster refreshes (Cass, De Witt, Marshall, Mason,
      # Washington) were dead from the day they shipped because their builders
      # imported a composition constant from a module that pulled in shapely at
      # module scope, which those jobs correctly never install. Scrapers fine,
      # data fine, validate_index fine, every local run fine. Stdlib only, so it
      # runs before anything is installed.
      - name: Workflow scripts import under their declared dependencies
        if: ${{ !cancelled() }}
        run: python3 scripts/validate_workflow_deps.py

      # A workflow that regenerates and commits sitemap.xml must check out FULL
      # history and must not re-shallow it. build_sitemap.py takes each page's
      # lastmod from that file's own last commit, and in a depth-1 clone there is
      # one commit, so all 243 entries take the run date. A bot run on
      # 2026-09-17 shipped 241 wrong dates that way. build_sitemap.py --check is
      # structurally blind to it: it fails on a date that is BEHIND, and this
      # moves every date forward to today. Stdlib only, no network.
      - name: Sitemap-committing workflows check out full history
        if: ${{ !cancelled() }}
        run: python3 scripts/validate_workflow_checkout.py

      # scripts/undeliverable.py withholds addresses that cannot receive mail
      # from every card. Its risk is the one every exception list has: an entry
      # outliving its reason, silently. The first draft printed a RETIRE line
      # from the builders and returned a list every caller discarded, which is
      # the permanent-silent-hole shape check_roster_retention.py records having
      # had to fix in ACCEPTED_DROPS. This reads the shipped tree instead and
      # fails on an orphaned scope or on an address the withhold stopped
      # dropping. The third test — a withheld domain that comes back — needs DNS
      # and runs monthly in validate_card_links.py.
      - name: The undeliverable-address list has not gone stale
        if: ${{ !cancelled() }}
        run: python3 scripts/undeliverable.py

      # A skill under .claude/skills/ is prose an agent loads at the moment it
      # starts a task, and prose that names scripts, tables, guide sections and
      # flags is a copy of facts that live elsewhere — the drift class every
      # other gate here exists for. The steward skill's own preamble says why a
      # skill carries only what CLAUDE.md does not; this is what keeps the
      # pointers it does carry pointing at things: every backticked path
      # exists, every §N.N is a heading in docs/EXPANSION_GUIDE.md, every
      # --flag after a script is one the script mentions, every ALL_CAPS table
      # name lives in a file the skill names, and the description fits the
      # trigger surface. It found its first stale path in the first skill
      # written against it. Stdlib only.
      - name: Skills point at things that exist
        if: ${{ !cancelled() }}
        run: python3 scripts/validate_skills.py

      # Two defects that ship green in Python, both of them live in this repo
      # the same week. A name used and imported nowhere raises NameError only
      # when its line runs, and on 2026-09-17 that turned Logan County's
      # robots.txt decline into a filed OUTAGE because the four lines writing
      # `reason=robots` crashed on a missing `import os` — five days and an
      # 84-invocation battery after it merged, because nothing takes a refusal
      # branch until a host refuses. And a dict literal setting one key twice
      # keeps the LAST silently, which is the PyYAML behaviour that killed three
      # workflows on 2026-09-16 (#978) in a language where it is easier to
      # miss: it found a superseded "knox" anchor block and two Fond du Lac
      # rows whose urls differ. Deliberately NOT a linter — pyflakes reports 71
      # further things on this tree and none of them change what the code does.
      # Stdlib only; --selftest drives both checks against source carrying each
      # defect and source carrying its near-miss.
      - name: Every loaded name is bound and no dict key is set twice
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/validate_python_hygiene.py --selftest
          python3 scripts/validate_python_hygiene.py

      # The steward skill is the battery below, written out for a reader to run
      # locally, and CLAUDE.md has claimed since 2026-09-12 that the two agree
      # exactly. Nothing compared them until 2026-09-16, when the skill turned
      # out to be missing three gates wired into CI on the day that sentence was
      # written — so an agent following the skill ran a green battery and pushed
      # a branch this job failed, which is the one thing the skill exists to
      # prevent.
      - name: The steward skill runs the same battery this job does
        if: ${{ !cancelled() }}
        run: python3 scripts/validate_steward_mirror.py

      # CLAUDE.md states this battery's size twice — as named steps and as
      # invocations — and that pair moves whenever anything merges here. Its own
      # paragraph records the figure going stale seven times in two days, and
      # nothing measured it, so the pair was eventually re-derived by arithmetic
      # on a figure that was itself wrong and described a state no commit ever
      # had. Every one of those numbers was in git the whole time.
      - name: CLAUDE.md states the size of the battery this job runs
        if: ${{ !cancelled() }}
        run: python3 scripts/validate_gate_counts.py

      # The graph the generated pages publish: 183 county boards, 20 rostered
      # question pages and six data catalogues. Each generator's --check proves
      # its page matches what that generator produces today, which is a different
      # question from whether the graph is coherent — a dangling @id, a list
      # whose numberOfItems disagrees with its own elements, or a block that no
      # longer parses passes every one of them.
      - name: Structured data parses, resolves and counts what it says
        if: ${{ !cancelled() }}
        run: python3 scripts/validate_structured_data.py

      # The drafted Wikidata item. Its jurisdictions come from metros.json, so a
      # new instance has to reach it; nothing here edits wikidata.org. The
      # network re-check of its 20 verified ids is --verify and is deliberately
      # not scheduled — see the file it writes.
      - name: The Wikidata draft still matches the fleet manifest
        if: ${{ !cancelled() }}
        run: python3 scripts/build_wikidata_draft.py --check

      # No app may ask an ArcGIS service for f=geojson. The export unnests a
      # feature's interior rings, so a publisher's cutout becomes ground the
      # layer claims — measured 2026-09-05 at 41 of 153 live polygon layers,
      # 1,376 rings and 298.2 km². fetchArcGISAsGeoJSON refuses such a url at
      # fetch time, but that is a card a reader has to reach first, and a
      # failed fetch renders as the honest "data source didn't respond" state,
      # so nothing looks wrong. This is the static half.
      - name: No app requests the lossy ArcGIS GeoJSON export
        if: ${{ !cancelled() }}
        run: python3 scripts/validate_arcgis_format.py

      # The nesting itself, on fixtures rather than on whichever county server
      # happens to answer. Every ArcGIS response the smoke tests touch is
      # stubbed, so before this the polygon path — orphan CCW rings, collapsed
      # rings, a shell no larger than its hole — ran in CI only by accident.
      - name: Esri ring nesting behaves on fixtures
        if: ${{ !cancelled() }}
        run: node scripts/esri_rings_test.mjs

      # THE SOCIAL CARD IS THE ONE PAGE ASSET NOBODY ON THE TEAM EVER LOOKS AT,
      # because it renders in somebody else's app. Adam shared an /il/ permalink
      # into a Signal group on 2026-09-13 and the preview showed "CHICAGO
      # DISTRICT EXPLORER · chidistricts.com" under a correct districtry title —
      # the pre-rebrand card. Measured across all seven surfaces, four were
      # wrong: il, ny and ca still on the retired brand (ca carrying CHICAGO's
      # flag star), and the fleet root labelled "illinois". 97 of the site's 201
      # pages name one of those four.
      #
      # validate_instance_assets.py already checked that og-image.png EXISTS,
      # and all four existed. This checks WHAT IT IS: every surface in
      # metros.json has a manifest entry, its label still matches that entry's
      # TAG, its bytes still hash to what the renderer wrote, and it is
      # 1200x630. Node, but no browser and no network — the rendering needs
      # Playwright, the check does not.
      #
      # The label is the tag (il, ny, ca, …) rather than the place name: the
      # long names wrapped to a second line and pushed the strapline down, and
      # metros.json's own comment already calls the tag what the brand spec
      # prints in the wordmark.
      #
      # It proves PROVENANCE, not correctness: a card whose design is wrong
      # passes, and only a person looking at it catches that.
      - name: Social cards are the ones the renderer wrote
        if: ${{ !cancelled() }}
        run: node scripts/build_og_image.mjs --check

      # ADDING A STATE IS NOT ONE EDIT. The instance is a folder, and a dozen
      # other places have to learn its tag — the generator's table, the fleet
      # manifest, four hand-kept tables in four builders, and the three literal
      # per-instance lists in THIS file. Five consumers discover the fleet from
      # the tree and need nothing; the rest are lists somebody wrote once, and
      # nothing measured that they agree. Twice the miss shipped: 303 URLs went
      # unwatched when validate_card_links.py named four instances out of five,
      # and a bot PR stripped three fields from all 213 New York legislators
      # while the retention gate, pointed at il/data/app alone, reported "222
      # roster files, no field lost its records". This takes the TREE as
      # canonical — a top-level dir with index.html and data/app/ IS an
      # instance — so a sixth folder nobody registered fails here instead of
      # being quietly untested. Stdlib only.
      - name: Every instance is registered everywhere
        if: ${{ !cancelled() }}
        run: python3 scripts/validate_instance_registration.py

      # EVERY SAME-ORIGIN FILE A PAGE ASKS FOR MUST BE IN THE TREE. Michigan's
      # go-live found two of these by hand, minutes apart, in an instance that
      # had already passed this whole battery twice: mi/index.html declared 18
      # @font-face rules reading `url(fonts/*.woff2)` against an mi/fonts/ that
      # did not exist, and named an og-image.png that did not exist. The first
      # would have served the app in system fonts forever with no error and no
      # red gate; the second would have broken every social preview. Nothing
      # was going to catch either — validate_card_links.py probes ABSOLUTE urls
      # over the network monthly (a relative href "is not its subject at all",
      # in landing_test.mjs's own words) and an absolute url on our own
      # not-yet-published path is indistinguishable from a site that is down;
      # landing_test.mjs boots browsers only for the ROOT's pages; and a 404 on
      # a font throws no console error, so no smoke test fails either. Surface
      # is DISCOVERED from the tree, so a new instance is covered the day its
      # folder exists. Stdlib only.
      - name: Every same-origin asset a page names is in the tree
        if: ${{ !cancelled() }}
        run: python3 scripts/validate_instance_assets.py

      # THE COVERAGE WASH IS A CLAIM, AND ITS GATE WAS IN NO WORKFLOW. Each
      # statewide instance ships a dissolved outline of its served counties;
      # --check validates that shipped ring against the instance's hand-listed
      # INSIDE/OUTSIDE anchors, and nothing ran it. It also cannot rebuild
      # (that needs TIGERweb), so a county added to METRO_COUNTY_FIPS without
      # an anchor was green by construction — the ring simply never got asked
      # about it. That is how Wisconsin greyed out seven counties for two days
      # with every gate passing. check_anchor_registry(), added 2026-09-02 and
      # run on both the check and build paths, makes the anchor list track the
      # county list offline: one anchor per served county, no county doubled,
      # none both inside and outside. Stdlib only, no network.
      - name: Coverage ring anchors track the served-county list
        if: ${{ !cancelled() }}
        run: |
          # --check reads the shipped ring and the anchor lists and fetches
          # nothing, but validate_workflow_deps.py walks an entry point WITH its
          # function-local imports — running a script runs its functions, and it
          # cannot know which argv path CI takes. requests is real for the
          # rebuild path, so it is installed here rather than the check being
          # split into a second entry point to dodge a true dependency.
          pip install -c scripts/requirements.txt requests
          python3 scripts/build_metro_outline.py --check
          python3 wi/scripts/build_metro_outline.py --check
          python3 ia/scripts/build_metro_outline.py --check
          python3 mi/scripts/build_metro_outline.py --check

      # docs/PRESS_LIST.md carries a --check in its own header calling it the
      # drift gate, and until now nothing ran it — a generated file gated in
      # name only, which is the shape this repo keeps finding (a measurement
      # filed somewhere no pass repeats). It matters more than a doc usually
      # would: the page is the send ledger for outreach to strangers, so a
      # stale copy is what makes someone pitch the same tips inbox twice.
      # Stdlib only.
      - name: Press list matches its data
        if: ${{ !cancelled() }}
        run: python3 scripts/build_press_list.py --check

      # "N layers" is the fleet's most-repeated number and, until this gate,
      # its least watched: 32 claims across 77 documents and nothing compared
      # one against a worksheet. The adjacent gates miss it by construction —
      # build_landing_page.py generates the root page's six aria-labels from
      # len(worksheet["layers"]), and fleet_status.py diffs layer IDS against
      # the guidebook matrix weekly and WARN-only, which says nothing about a
      # number typed into a sentence. Four were wrong on introduction, two of
      # them in docs/press-list.json — the outbound press list, i.e. the number
      # a journalist would have been handed. Stdlib only.
      - name: Layer counts in prose match the worksheets
        if: ${{ !cancelled() }}
        run: python3 scripts/validate_doc_counts.py

      # That gate's pattern C reads "N for <instance>", and the bare shape
      # occurs five times in the tree with only ONE a layer count: the other
      # four count dark-mode map colours (on a line that says "layers") and a
      # press-tour DAY number. They are correct sentences, so a loosened
      # pattern fails the build on them — and a green run says nothing about
      # the guard, because the four are visible only when the pattern is
      # wrong. Six literal lines, no files read, no network.
      - name: The layer-count reader still ignores what only looks like a count
        if: ${{ !cancelled() }}
        run: python3 scripts/validate_doc_counts.py --selftest

      # Every authored page's <title> and meta description against what Google
      # shows. generate_metro_files.py already gates the six worksheet-driven
      # index.html pages and has held since 2026-09-09 — not one of them is
      # over. It cannot see the other forty pages, and on 2026-09-11 nine
      # titles and twenty-three descriptions were: a 252-character description
      # on traffic.html, and an 85-character double-question title on
      # ny/community-board.html that spent its whole tail on the brand. Surface
      # DISCOVERED, not listed. Stdlib only.
      - name: Titles and descriptions fit a search result
        if: ${{ !cancelled() }}
        run: python3 scripts/validate_serp_lengths.py

      # ONE READING OF robots.txt, and it has to agree with the readings this
      # project established by hand. Until 2026-09-12 the fleet had four
      # readers, and the one deciding fetches for the most scrapers (Iowa's,
      # 108 hosts a week) used urllib.robotparser, which keeps only the FIRST
      # `User-agent: *` group of a file and drops every later one — the
      # wyomingmi.gov misreading (#806) reproduced in code, and exactly the
      # shape Cloudflare's managed block produces above a site's own rules.
      # scripts/robots_policy.py is the RFC 9309 reading every gate and
      # scraper now imports; this runs its self-test over three saved
      # robots.txt files (wyomingmi.gov, iowacourts.gov, sheboyganwi.gov)
      # whose correct readings are on the record. Stdlib only, no network.
      #
      # It also proves HostPacer, which ENACTS a Crawl-delay the reader above
      # only reports. That test used to run as its own step against
      # ia/scripts/ia_county_chair_scraper.py, where the class was first
      # written; it moved here on 2026-09-12 when ia/scripts/validate_sources.py
      # needed the same object, because a second caller means shared machinery
      # rather than a copy. Two of its rules look right while being wrong:
      # folding a leading `www.` (or one server gets two queues and half the
      # delay it asked for) and leaving every other host's parallelism alone.
      # Threads, small delays, still no network.
      #
      # Since 2026-09-13 it also reads THIS SITE'S OWN robots.txt, which now
      # carries a Content-Signal of its own — search=yes, ai-input=yes,
      # ai-train=no, use=reference, the same reading the project already applied
      # to Sheboygan's. Nothing else in the repo looks at that file:
      # validate_card_links.py scans *.html (and llms.txt), build_sitemap.py
      # does not list robots.txt, and a Content-Signal this reader cannot parse
      # is a reservation of rights that says nothing while the file still looks
      # correct. Nine agents are asserted separately, because the failure this
      # guards is a second group that names one client and silently drops the
      # signal for the rest.
      - name: The robots.txt reader agrees with the readings established by hand
        if: ${{ !cancelled() }}
        run: python3 scripts/robots_policy.py --selftest

      # Two reports say whether a weekly roster refresh is still running, and both
      # used to take a workflow's newest completed run without asking whether it
      # was a run. GitHub records one for a workflow file it cannot START, with no
      # job and nothing scraped, and on 2026-09-23 two such runs — on a branch
      # deleted from origin, so nothing could supersede them — were being reported
      # as failing roster refreshes that would repeat every week. The predicate
      # that tells those apart is four lines long, which is exactly the kind that
      # gets simplified into being wrong.
      - name: The run-evidence predicate still tells a run from a run that never started
        if: ${{ !cancelled() }}
        run: python3 scripts/workflow_run_evidence.py --selftest

      # Over a hundred files here send a browser user-agent (115 when this was
      # measured), and CLAUDE.md's rule for that
      # (settled 2026-09-11) is that the calling file records which token was
      # refused, what the site answered, and the date. Measured 2026-09-12,
      # almost none did: 203 of 290 hosts reached by a browser-string caller
      # serve the self-identifying districtry token a full page. This --check
      # makes no requests. It re-audits user-agent-measurements.json against the
      # tree, so an entry cannot outlive the file that fetched the host — the
      # property EXPECTED_UNREACHABLE and ACCEPTED_DROPS already have, and the
      # reason either can be trusted.
      - name: User-agent measurements still describe the tree
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/probe_user_agents.py --selftest
          python3 scripts/probe_user_agents.py --check

      # THE CIRCUIT-COURT JOIN DECIDES THAT TWO DIFFERENTLY-WRITTEN NAMES ARE
      # ONE JUDGE, and until 2026-09-12 nothing tested it. It now has three
      # fallback rungs below the exact key, and the newest one — dropping a
      # generational suffix, which fold() otherwise leaves in the surname slot —
      # is one careless line away from also bridging a GIVEN name, which would
      # merge Waukesha's `J. Arthur Melvin III` with the contact page's
      # `Jack A. Melvin`. This runs the join against doctored input: three
      # recoveries that must happen, and the non-joins that must not (Melvin,
      # Walworth's Scholz/Scholtz, two judges colliding on one contact row).
      # Stdlib only, no network.
      - name: The circuit-court name join still joins only what it should
        if: ${{ !cancelled() }}
        run: python3 wi/scripts/build_wi_circuit_court_roster.py --selftest

      # THE COURT OF APPEALS JOB FORGIVES ONE FAILURE, SO BOTH HALVES OF THAT
      # DECISION ARE GATED HERE. Runs of that job die in sock.connect from some
      # of GitHub's runners and not others (issue #387), so the scraper exits 75
      # when it could not reach www.wicourts.gov at all and the workflow treats
      # that as "come back next week". A classifier that is wrong in the
      # forgiving direction is SILENT — the job goes green, the bench stops
      # being verified, and nothing says so — so --selftest names every failure
      # the scraper can meet on the side it belongs on: seven forgiven, ten kept
      # red, including a TLS failure, which arrives as URLError exactly like a
      # dropped packet and is the host answering badly rather than not answering.
      #
      # The second half is the ceiling that stops the forgiveness becoming a
      # hole: the staleness guard reads that workflow's own run history and
      # fails once 60 days pass with no success. Its --selftest is the decision
      # alone, against fixed dates — the API is never called here. Stdlib only,
      # no network on either.
      - name: The Court of Appeals job forgives only an unreachable host, and not forever
        if: ${{ !cancelled() }}
        run: |
          python3 wi/scripts/wi_coa_scraper.py --selftest
          python3 wi/scripts/wi_coa_staleness.py --selftest

      # THE LTSB FILING WATCHER'S OWN FAILURE PATHS. The monthly job is the only
      # thing that runs that check, and it runs the happy path eleven times a
      # year; without this its WARNs would first execute in the filing window
      # somebody is relying on them.
      - name: The supervisory currency check reports a new filing, a redraw and a moved count
        if: ${{ !cancelled() }}
        run: python3 wi/scripts/validate_sources.py --selftest

      # THE COUNTY BOARD SCRAPE ASKS EACH HOST'S ROBOTS.TXT BEFORE ITS FIRST
      # FETCH (2026-09-13), and this runs that decision against doctored
      # robots.txt text: a site-wide disallow refuses, an admin-only file allows
      # the board page and still refuses /admin/, a 403 on a county website
      # refuses while a 403 on an ArcGIS host does not, a 404 allows, a 5xx and
      # a 202 both refuse, a Crawl-delay is read, and the Internet Archive rung
      # re-raises rather than going round a disallow. Seven of the 74 hosts
      # publish `Disallow: /`, so the reading is load-bearing rather than
      # theoretical. Stdlib only, no network.
      #
      # pypdf IS INSTALLED FOR AN OFFLINE TEST, which looks odd and is what
      # scripts/validate_workflow_deps.py correctly insists on: it reads an
      # entry point WITH its function-local imports, because running a script
      # runs its functions, and this module reads three counties' PDFs. The
      # self-test returns before any of them, so the package is never used —
      # but a gate that trusted a comment about which code path CI takes would
      # be no gate. Constrained to the same pin the weekly workflow uses.
      - name: The county board scrape reads robots.txt the same way every time
        if: ${{ !cancelled() }}
        run: |
          pip install -c wi/scripts/requirements.txt pypdf
          python3 wi/scripts/wi_county_board_scraper.py --selftest

      # The Jasper test decides whether a county's precinct fabric is still the
      # Census 2020 fabric, and its five reconciliation causes are the
      # difference between reading a county as re-precincted and reading it as
      # buildable — measured, ten counties were false-rejected in one sweep.
      # Each cause is safe only because of a guard (exactly 17 characters; no
      # other ordinal on the stem; the roman alphabet restricted to I/V/X so
      # DIX survives), and a guard nothing exercises is a guard that erodes.
      # This runs those guards against the worked examples. Stdlib only, and no
      # network: --jasper is the networked mode and is deliberately not run here.
      - name: Precinct-fabric reconciliation causes still hold
        if: ${{ !cancelled() }}
        run: python3 scripts/isbe_precinct_fabric.py --selftest

      # The library board-page reader is the ONLY guard on what it publishes,
      # and that is a measurement rather than a caution:
      # validate_officeholder_names.py accepts both "No Overdue Fines" and
      # "Strategic Plan" as names, and a draft of this parser shipped both as
      # trustees. Its fixtures are one per shape measured on a real board page —
      # name-then-role, role-then-name, "Role: Name, term expires", a trustee
      # per heading, a board separated from the STAFF list by a bold label, and
      # an election clause after the name — plus the refusals that matter more:
      # a library whose site is a neighbour's, one page carrying two libraries'
      # boards, a board under three names, one past twelve, and the two shared
      # hosts whose pages DO say whose board they are. Stdlib only, no network.
      - name: Library board-page reader still reads its measured shapes
        if: ${{ !cancelled() }}
        run: python3 scripts/il_library_trustees_scraper.py --selftest

      # The Iowa board-chair minutes parser refuses four things, and every one
      # of them was a wrong answer first: a role claimed from BOTH sides of a
      # flattened signature block (Des Moines prints `Shane McCampbell, Chair`
      # above `Tom Broeker, Vice Chair`, so one reading names each man), a role
      # preceded by `Vice`, a role whose nearest name is 18 characters away
      # across `to authorize the`, and `presiding`, which is who gavelled a
      # meeting rather than who holds the office. Those refusals are what stand
      # between the County Supervisor card and a confidently wrong name, and
      # they live in one regex pair that any edit can loosen. This runs them
      # against the lines the counties really print — no network, and every
      # case is a literal string.
      #
      # pdfplumber is installed even though --selftest never opens a PDF, for
      # the reason the coverage-ring step gives about requests:
      # validate_workflow_deps.py walks an entry point WITH its function-local
      # imports and cannot know which argv path CI takes, and pdfplumber is a
      # real dependency of the scrape path. Installing it is the honest fix;
      # splitting the self-test into a second entry point to dodge a true
      # dependency is not.
      - name: Iowa board-chair minutes parser still refuses its traps
        if: ${{ !cancelled() }}
        run: |
          pip install -c ia/scripts/requirements.txt pdfplumber
          python3 ia/scripts/ia_county_minutes_chair_scraper.py --selftest

      # The chair builder may keep a name in the shipped file that this week's
      # scrape did not re-read, which is the one place in this pipeline where
      # data outlives its own verification. What makes that safe is a narrow
      # rule -- carry only on `unreachable`, never on a refusal, never past
      # sixty days, never across a January reorganisation, never for a name
      # that has left the county's supervisor roster -- and a rule nothing
      # exercises is a rule that loosens. Twenty-one literal cases, no network.
      - name: Iowa board-chair carry-forward rules still hold
        if: ${{ !cancelled() }}
        run: python3 ia/scripts/build_ia_county_chair.py --selftest

      # The same mechanism, one file down: Milwaukee County's 19 municipal
      # executives ship a name only where the municipality's own page witnessed
      # it, so a page that does not answer used to delete the name and ship a
      # withholding that reads exactly like an election. Nothing in the fleet
      # catches that -- this file's 19 sources are one record each, below
      # check_roster_retention's MIN_GROUP_RECORDS, so its per-source pass
      # cannot fire here at all. The carry is narrower than Iowa's because the
      # scraper splits a failed fetch three ways: carry only `unreachable`,
      # never a refusal, never a dead link, never a page that read and did not
      # witness, never past sixty days, never across an April spring election,
      # and never when the county's own layer has stopped naming that person.
      # Twenty-two literal cases, no network and no capture.
      - name: WI municipal-executive carry-forward rules still hold
        if: ${{ !cancelled() }}
        run: python3 wi/scripts/build_wi_municipal_executives.py --selftest

      # Two tables. display_name strips a leading honorific from an officer's
      # name, and a name in that file is also the key
      # ia-county-board-chairs.json joins on; the cases that matter are the
      # ones it must NOT touch, a Jr./Sr. suffix and a trailing credential the
      # county itself published. party_row_for takes the ISAC row whose NAME
      # is the officer's, because ISAC lists assistants and deputies under the
      # officer's own office label; its cases are the two that must yield no
      # party — no row matches, and two rows both match, which is same_person's
      # own stated limit showing.
      - name: Iowa officer display names and the party name-join
        if: ${{ !cancelled() }}
        run: python3 ia/scripts/build_ia_county_officers.py --selftest

      # BOTH HALVES OF THIS GATE FAIL SILENTLY AND LOOK RIGHT, which is why it
      # needs a test rather than a reading. A fetch that asks robots.txt AFTER
      # requesting the page prints exactly the same log line as one that asks
      # first; and HostPacer.hold is a @contextmanager, so `ROBOTS_PACER.hold(url)`
      # called bare builds a context manager, discards it, applies no delay and
      # records nothing -- the run then reports "no host this run stated one"
      # while a site that asked for 10 s got none. So the self-test replaces
      # requests.get with a recorder and asks the two questions a log cannot:
      # did a refused URL reach it at all, and are two fetches of a
      # delay-stating host actually spaced. Eight cases on verdicts seeded from
      # rp.classify, no network. requests is a module-scope import of the
      # scraper, pinned as the weekly workflow pins it, so the step does not
      # depend on an earlier one having installed it.
      - name: Iowa supervisor scrape asks robots.txt before it fetches, and paces what asks
        if: ${{ !cancelled() }}
        run: |
          pip install -c ia/scripts/requirements.txt requests
          python3 ia/scripts/ia_supervisor_district_scraper.py --selftest

      # THE BOUND ON THE LAST MEMBER OF A COUNCIL PAGE, which is the one no next
      # member bounds. A fixed twelve-line window stood in for one and reached
      # past the roster into riversideiowa.gov's `<div id="footer">`, shipping
      # the city hall number (319) 648-3501 as council member Lois Schneider's
      # phone -- her row publishes none, and text_lines() strips the <footer>
      # ELEMENT rather than a div named for one. The bound is now the distance
      # THAT PAGE puts between a name line and the field, per field because the
      # two differ. Fourteen cases on synthetic pages, no network; each case
      # expecting no phone also asserts the retired window WOULD have taken the
      # footer's, so a fixture that stops reproducing the defect fails rather
      # than passing quietly.
      - name: Iowa city council pages bound the last member, so a footer cannot donate a phone
        if: ${{ !cancelled() }}
        run: python3 ia/scripts/ia_city_officials_scraper.py --selftest

      # The parcel-fabric builder repairs invalid geometry before it writes, and
      # its repair had four branches nothing exercised. One of them was wrong
      # for as long as it existed: `dropped` was `len(parts) - len(polys)`,
      # which compares make_valid's TOP-LEVEL members against the flattened
      # polygons and goes negative the moment a MultiPolygon comes back inside
      # a GeometryCollection. rock-island-fire's BLACKHAWK FPD printed "dropped
      # -25" on a real rebuild and nothing caught it, because nothing looked.
      # The other three decide what gets WRITTEN rather than what gets printed —
      # a repair with no polygonal ground at all, one past the area tolerance,
      # and a zero-area input whose repair invents ground the tolerance cannot
      # measure. --selftest runs all four against doctored geometries, and the
      # reporting one against the shape that produced the -25. It reaches no
      # network and no county service, which is why it can run here while the
      # build itself cannot; requests and shapely are module-scope imports of
      # the builder, so they are installed even though nothing is fetched.
      - name: The parcel-fabric repair still refuses what it must
        if: ${{ !cancelled() }}
        run: |
          pip install -c scripts/requirements.txt requests shapely
          python3 scripts/build_parcel_fabric_districts.py --selftest

      # The engine's geometry-measure block is the app's only way to say how
      # much of one district lies in another, and it is hand written because
      # the app carries no geometry library. This runs the block AS SHIPPED in
      # Node against the fleet's own district files and holds its areas,
      # overlap shares and point weights to shapely on the same rings. Offline;
      # shapely is installed by the step above.
      - name: The geometry-measure block still agrees with shapely
        if: ${{ !cancelled() }}
        run: python3 scripts/validate_geometry_measure.py

      # Illinois's Census 2020 block populations, one file per county, which a
      # comparison of districts sums to say how many PEOPLE two districts
      # share. Each file's totals, count and extent must match index.json and
      # the state must sum to its 2020 count; then the engine's own
      # measurePointWeight sums the points inside every shipped congressional
      # and legislative district, and each map must partition the state
      # exactly with every district where its plan put it. Offline.
      - name: The block populations still sum to each district's census count
        if: ${{ !cancelled() }}
        run: python3 scripts/build_block_population.py --check

      # Nine Illinois data files carry a top-level `generated` stamp, so each
      # weekly workflow opens a bot PR whether or not an officeholder moved.
      # The stamp is right and stays; what the nine builders now print beside it
      # is a line saying whether anything ELSE moved, which is what a reviewer
      # reads instead of the diff. That line is only worth trusting if it can be
      # WRONG in the quiet direction — a helper that reported a change every week
      # would pass every count guard in the repo and tell a reviewer nothing. So
      # --selftest runs it against doctored input both ways: a week where only
      # the stamp moves must say so, a changed field must name the record, an
      # add and a remove must be counted separately, and a stated depth that is
      # too deep must REFUSE rather than compare a record's fields as if each
      # were a record. Stdlib only, no network, every case a literal.
      - name: The what-moved line still says nothing when nothing moved
        if: ${{ !cancelled() }}
        run: python3 scripts/scraper_common.py --selftest

      # The retention gate below asks whether a field is still PUBLISHED. This
      # one asks whether the value in it is still a person. On 2026-09-04 the
      # weekly municipal refresh replaced all 122 of Rock Island County's
      # officeholder names with telephone numbers, party labels and fragments of
      # the source PDF's page footer — a reader in Reynolds was shown a Village
      # President named "(309) 372-8292 Citizens" — and every guard passed: the
      # scraper's floors count records rather than read them, retention saw
      # `name` present on every record, and build_county_pages.py's person
      # enumerators list that file in NOT_COUNTY_BOARDS and never look at it. It
      # stood for fourteen days. Absolute rather than diff-based, so it keeps
      # answering after the defect reaches the base branch. Stdlib only.
      - name: Every shipped officeholder name is a name
        if: ${{ !cancelled() }}
        run: python3 scripts/validate_officeholder_names.py

      # A roster's count guard proves it still has twelve members; it proves
      # nothing about whether those twelve still carry an e-mail. On 2026-08-08
      # Cloudflare's e-mail obfuscation quietly emptied all seven of Brown
      # County's addresses and every existing guard passed, because seven rows
      # went in and seven came out. This compares each roster field against the
      # same file at the base of the change and fails when one stops being
      # published — including per county inside a shared file, which is where
      # that near-miss actually lived. Stdlib only.
      - name: Roster fields still published
        if: ${{ !cancelled() }}
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "comparing roster fields against $BASE"
          python3 scripts/check_roster_retention.py --base "$BASE"

      # A CACHE-FIRST data file that changes without a CACHE_NAME bump reaches
      # nobody who has already visited. Wisconsin added seven counties across
      # five PRs on 2026-09-02, every one rewriting the cache-first coverage
      # ring, and none bumped the cache: returning visitors got the new
      # supervisors on their cards (rosters are network-first) and the old wash
      # on the map, greying out the very counties that had just been added.
      # sw.js says to bump it; nothing checked that anyone had.
      - name: Cache-first data carries a cache bump
        if: ${{ !cancelled() }}
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "comparing cache-first data against $BASE"
          python3 scripts/check_cache_version.py --base "$BASE"

      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: "20"

      # Pinned to the version the test was authored against; installs into the
      # ephemeral workspace only (node_modules is never committed — this repo
      # has no build step).
      #
      # Chromium (~170 MB) used to be re-fetched from Playwright's CDN on every
      # run, and on 2026-08-18 that fetch hung twice — 28 and 14 minutes
      # against a normal ~23 s step — each needing a manual cancel + re-run.
      # Two guards, either sufficient alone: the browser build is CACHED keyed
      # on the pinned version (a hit skips the CDN entirely; only the apt-side
      # install-deps still runs, and the runner image pre-satisfies most of
      # it), and every phase runs under its own budget — sized in the install
      # step to fail NAMED inside that step's 15-minute cap, with apt outside
      # the retry entirely, because a timeout-killed apt orphans the dpkg lock
      # and poisons every retry (observed live in the SF fork's first cached
      # run). deploy-pages.yml and release-engine.yml run this same
      # toolchain and carry the same pair, pointing here for the story.
      - name: Cache Playwright Chromium
        if: ${{ !cancelled() }}
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.PLAYWRIGHT_VERSION }}-${{ runner.os }}

      - name: Install Playwright + Chromium
        if: ${{ !cancelled() }}
        # Backstop for a multi-phase failure day. The ladder inside is sized to
        # fail NAMED under this cap when any ONE phase is sick (budgets in the
        # run body); two-plus sick phases at once is what this cap is for.
        timeout-minutes: 15
        run: |
          # Phase budgets, sized so any SINGLE sick phase fails with a NAMED
          # error inside the step's 15-minute cap — the cap stays the
          # multi-phase backstop, never the first line of defence:
          #   npm      3 x 60s   (normally ~2 s; lock-free, retry-safe)
          #   apt      1 x 420s  (normally seconds; NEVER retried in-process —
          #            a timeout-killed apt orphans apt-get still holding
          #            /var/lib/dpkg/lock-frontend, so every in-job retry dies
          #            on the corpse's lock, proven live in the SF fork. A
          #            mirror too sick for 7 minutes needs a fresh runner,
          #            and only a re-run provides one.)
          #   browser  2 x 300s  on a cache miss only (the CDN fetch that hung
          #            28 minutes in the Chicago fork; lock-free, retry-safe)
          retry() {
            local attempts=$1 budget=$2; shift 2
            for i in $(seq 1 "$attempts"); do
              timeout "$budget" "$@" && return 0
              echo "::warning::attempt $i/$attempts of '$*' hung or failed"
              sleep 5
            done
            echo "::error::'$*' failed $attempts time(s) at ${budget}s each"
            return 1
          }
          retry 3 60 npm install "playwright@${PLAYWRIGHT_VERSION}"
          # DROP APT SOURCES THIS JOB DOES NOT USE, BEFORE install-deps TOUCHES
          # APT. On 2026-09-09 dl.google.com served a main/binary-amd64
          # Packages.gz whose SHA256 (bc1428ab...) did not match the one its own
          # Release file advertised (233e56de...), and `apt-get update` treats a
          # Hash Sum mismatch on ANY configured repo as fatal. That failed four
          # consecutive deploys across four unrelated merges, and the same step
          # in smoke-test.yml would have failed every PR the moment one ran.
          # The runner image carries the Google Chrome repo; NOTHING in these
          # workflows installs from it — install-deps takes Chromium's shared
          # libraries from Ubuntu's own archive, which fetched fine throughout,
          # and the browser build itself comes from Playwright's CDN or the
          # cache above. So a third party's publishing race stopped this site
          # deploying, over a repository it has no use for.
          #
          # This removes a repo rather than weakening a check: no
          # --allow-insecure-repositories, no --allow-unauthenticated, and
          # every remaining source is still verified normally. Both apt formats
          # are matched because Ubuntu is migrating .list to deb822 .sources,
          # and a hardcoded filename would silently stop matching. Matching on
          # CONTENT rather than filename for the same reason. It is a no-op on
          # an image that ships no such repo.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
               \( -name '*.list' -o -name '*.sources' \) \
               -exec grep -q 'dl\.google\.com' {} \; -print -delete 2>/dev/null || true
          retry 1 420 npx playwright install-deps chromium
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            retry 2 300 npx playwright install chromium
          fi

      # Static merge gate, once per instance. Each instance's validate_index.py
      # resolves data/app relative to the index it is handed, so every instance runs
      # from the repo root. Stdlib only, so this sits before the browser work
      # and fails fast.
      - name: Each instance's index validates
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/validate_index.py il/index.html
          python3 ca/scripts/validate_index.py ca/index.html
          python3 ny/scripts/validate_index.py ny/index.html
          python3 wi/scripts/validate_index.py wi/index.html
          python3 ia/scripts/validate_index.py ia/index.html
          python3 mi/scripts/validate_index.py mi/index.html

      # ONE server, EVERY instance. Until R3 this ran il alone, which is what
      # the repo had — ca and ny were separate repos with their own CI. They
      # are folders here now, and an ungated folder is worse than an ungated
      # repo: it merges through this workflow while nothing looks at it. The
      # first run of this step found the defect that proves the point — both
      # imported smoke tests read "data/app/coverage-gaps.json" relative to the
      # process CWD, correct when you ran them from their own repo root and
      # ENOENT here. Each instance keeps its own smoke test because each
      # describes a different city; what is shared is the server and the gate.
      - name: Serve app and run every instance's smoke test
        if: ${{ !cancelled() }}
        run: |
          # The access log goes to a FILE, not to this step. It is one line per
          # request and the browser work makes tens of thousands of them, which
          # on a green run buried the handful of lines anyone reads: measured on
          # this tree, 4,244 server lines against 785 from the probes, 76% of
          # them repeat fetches of six font files. It is still kept, and still
          # printed — on failure, below, which is the only time it says anything.
          python3 -m http.server 8000 > /tmp/http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/il/ >/dev/null && break
            sleep 0.5
          done
          status=0
          # Run every instance even if an early one fails, so a PR sees every broken
          # instance in one go rather than one per push.
          BASE_URL=http://localhost:8000/il/  node scripts/smoke_test.mjs     || status=1
          BASE_URL=http://localhost:8000/ca/  node ca/scripts/smoke_test.mjs  || status=1
          BASE_URL=http://localhost:8000/ny/  node ny/scripts/smoke_test.mjs  || status=1
          BASE_URL=http://localhost:8000/wi/  node wi/scripts/smoke_test.mjs  || status=1
          BASE_URL=http://localhost:8000/ia/  node ia/scripts/smoke_test.mjs  || status=1
          BASE_URL=http://localhost:8000/mi/  node mi/scripts/smoke_test.mjs  || status=1
          # The root landing page and — the part that matters — its forwarding
          # guard, which is what keeps every already-distributed share link and
          # embed snippet built from the OLD root URL reaching the app. A regex
          # typo there breaks other people's pages silently, on a page that still
          # looks right and still passes its drift check.
          BASE_URL=http://localhost:8000        node scripts/landing_test.mjs || status=1

          # Every page in the sitemap carries the same brand and the same
          # standing links. This exists because three published pages were found
          # on 2026-08-24 still serving the PRE-REBRAND skin — Inter, no theme
          # boot, no mark — having survived two consecutive stages whose whole
          # subject was the rebrand. Nothing caught them because nothing
          # COMPARED them: the composer checks the apps, the generator checks
          # generated regions, the link gate checks that links resolve, and not
          # one of them asks whether two published documents look like the same
          # product. It derives its page list from sitemap.xml and its
          # expectations from the tree, so a new page is covered the day it
          # ships and a correct change cannot fail it.
          BASE_URL=http://localhost:8000        node scripts/page_consistency_test.mjs || status=1

          # Which layers send the reader's SELECTED POINT to a government
          # server. The privacy page publishes that number per app, and until
          # 2026-09-05 it counted `loadArcGISPointGeoJSON(` call sites —
          # Illinois published 10 against a true 19, New York City "None."
          # against a true 4.
          #
          # NEITHER A REGEX NOR A STRUCTURAL READ CAN BE RIGHT. A registration
          # factory serves as many layers as it is CALLED from one occurrence,
          # and registerCountyLayer CLOSES OVER its entries, so two Illinois
          # layers are invisible even to a full walk of the live module graph.
          # And a layer that merely CARRIES an `.atPoint` hook may never fire
          # it: the hook is invoked in exactly one place, inside
          # queryFeatureAt, and the nearest-point factory and several NYC/SF
          # layers call their loader directly. Counting carriage overcounts,
          # which on this page is a false statement in the other direction.
          #
          # So the probe REPLACES every hook with a recorder, switches on every
          # layer, selects points inside the instance's own coverage, and
          # counts the hooks that FIRE. build_privacy_page.py — which has no
          # browser in its own step — reads the artifact and refuses to publish
          # when the apps have moved under it.
          BASE_URL=http://localhost:8000        node scripts/probe_point_transmission.mjs --check || status=1

          # Every text node on every sitemap page, both themes, joined against
          # what validate_contrast.py measures. That gate tests a STATED table
          # of pairs — it has to, because no regex follows `color:` through the
          # cascade to the ground four ancestors up — and the cost is that a
          # pair with no row reads as covered. Three did: traffic.html's own
          # fifteen-colour palette (2.93:1 at 12px), the sources matrix's
          # row-header band, which had no dark counterpart and put light text on
          # a light grey block (1.25:1), and --faint on two tints the table
          # covered under --muted and --ink only. All three were found by a
          # browser sweep that lived in a scratch directory; this is that sweep,
          # kept, and it asserts only that a below-floor pair is one the static
          # gate already calls short. It aborts every cross-origin request but
          # cdnjs, so it needs no third party. It takes ~38s on this tree,
          # measured 2026-09-23 over 104 page loads — 63 guide pages plus 41
          # standing for the 329 per-county ones, which are four templates and
          # fall into 41 distinct painted-element signatures. It was 4m55s
          # before the flat sleep it spent 80% of its time in became the
          # condition that sleep stood for, and ~68s before the grouping. A
          # figure here is per-page cost x a page count that moves whenever a
          # county ships, so re-measure it rather than trust it.
          BASE_URL=http://localhost:8000        node scripts/probe_contrast_pairs.mjs || status=1

          # The server's own log, only where it can explain something: a 404 on
          # an asset, or a page that never answered.
          if [ "$status" != 0 ]; then
            echo "::group::http.server access log"
            cat /tmp/http-server.log
            echo "::endgroup::"
          fi
          exit $status
