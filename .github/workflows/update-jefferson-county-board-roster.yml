name: Update Jefferson County Board roster

# Weekly refresh of the Jefferson County Board District card's member roster
# (il/data/app/jefferson-county-board-members.json, fetched by index.html).
# Re-scrapes the county's board table (district, name, phone, per-district
# e-mail, Chairman/Vice Chair role) and, if anything changed, opens a PR rather
# than committing directly to main — officeholder data should get a human look
# before it ships.
#
# Only the ROSTER is on a cron. The other half of this county's card —
# il/data/app/jefferson-county-board-districts.json — is a DISSOLVE of the county's
# own precincts per the approved composition list its Clerk sent, so it changes
# when the county reapportions (next after the 2030 census, per the list's own
# note) rather than weekly. scripts/build_jefferson_board_districts.py --check
# guards the shipped copy in this workflow (the mcdonough/stark pattern —
# offline, reading the committed precinct file, so it belongs beside the roster
# rebuild rather than in the monthly network gate). An earlier version of this
# comment claimed the check ran "on every pull request"; it ran nowhere until
# the 2026-08-24 scripts audit wired it here.
#
# THE URL IS THE SITE ROOT, NOT /government/. jeffersoncounty.illinois.gov's own
# navigation links /government/county_board/index.php, which 404s — while still
# rendering the full site chrome, so it looks like a working page. The live
# roster is at /county_board/index.php. The scraper's zero-row guard fails loudly
# if that ever flips, and its error message says exactly this.

on:
  schedule:
    - cron: "0 19 * * 4" # Thursday 19:00 UTC (county-board day: Will 13, Kendall 14, McHenry 15, Kane 16, Lake 17, Henry 18)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # FULL history, because this job regenerates sitemap.xml and
          # build_sitemap.py reads each page's lastmod from that file's own last
          # commit. Under the default depth-1 checkout git reports the single
          # fetched commit as the last commit of EVERY file, so every one of the
          # 243 entries takes today's date. Measured 2026-09-19 by building the
          # sitemap in a depth-1 clone: 243 of 243 lastmods moved, against 0 in a
          # full clone, where `build_sitemap.py --check` passes. A bot run on
          # 2026-09-17 shipped 241 wrong dates this way.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # A static, server-rendered table — no JS and no challenge — so requests
        # alone, parsed with the stdlib re module. shapely is for the boundary
        # --check below, not the scrape.
        run: pip install -c scripts/requirements.txt requests shapely

      - name: Scrape Jefferson County Board member roster
        run: python3 scripts/jefferson_county_board_scraper.py /tmp/jefferson_county_board_raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_jefferson_board_roster.py /tmp/jefferson_county_board_raw.json

      # The district boundaries change on reapportionment, not weekly — but the
      # shipped copy should never drift from what the builder derives from the
      # committed precinct file and the Clerk's composition list. Offline.
      - name: Re-check the shipped board districts against a fresh dissolve
        run: python3 scripts/build_jefferson_board_districts.py --check

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present and
      # well formed.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/jefferson-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          # Full history, for the same reason as fetch-depth: 0 above. `git fetch
          # --depth=1` RE-SHALLOWS a clone that was fetched complete (measured:
          # 512 commits down to 13), so the two have to move together — deepening
          # the checkout alone would be undone here.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add il/data/app/jefferson-county-board-members.json il/county-board il/county-board.html about.html sitemap.xml
          git commit -m "Update Jefferson County Board roster from jeffersoncounty.illinois.gov"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Jefferson County Board roster from jeffersoncounty.illinois.gov" \
              --body "Automated weekly refresh of the Jefferson County Board District card's member roster (district, name, phone, per-district e-mail, Chairman/Vice Chair role), generated by \`scripts/jefferson_county_board_scraper.py\` + \`scripts/build_jefferson_board_roster.py\`. Please review the diff before merging — this changes data about real officeholders. The county prints names SURNAME-FIRST, so the builder reads them forward with \`uninvert_name()\` imported from \`build_municipal_officials_roster.py\` — shared machinery rather than a third copy of that guard — and refuses to write if any name still carries a comma. Floors are the full board of 13: these are single-member districts, so a lost member leaves a card with no name and no count anywhere would look wrong." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
