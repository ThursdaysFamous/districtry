name: Update New Jersey legislature roster

# Weekly refresh of the New Jersey Senate + General Assembly rosters
# (nj/data/app/nj-senate-members.json and nj-assembly-members.json, fetched by
# nj/index.html's chamber cards). Rebuilds both chambers from the New Jersey
# Legislature's own member roster and, if anything changed, opens a PR rather
# than committing directly to main.
#
# The Legislature's roster page, www.njleg.state.nj.us/legislative-roster,
# carries every member's chamber, district, party and page in its own data
# block, and each member's record in the Legislature's own feed (the address
# the member's page requests) gives the name, the member's @njleg.org mailbox
# and the main district office with its telephone. One roster page and one
# feed record per member (121 requests), and nothing else is fetched.
#
# Each of the 40 legislative districts elects one senator and TWO members of
# the General Assembly, so the Assembly file keys each district to {seats: 2,
# members: [...]}; scripts/validate_chamber_rosters.py holds every seat to it.
# The builder stops on a district carrying more members than it elects.
#
# robots.txt: www.njleg.state.nj.us's (read 2026-11-10) is one `*` group with
# `Allow: /` and no Crawl-delay; the builder paces the host at one request a
# second regardless, so a run takes about two minutes. It reads the policy
# before its first fetch with the User-Agent its fetches send.
#
# THE REBUILT FILES ARE CARRIED ACROSS THE BRANCH CUT RATHER THAN FETCHED A
# SECOND TIME, the update-ilga-roster.yml pattern. A run where main changed
# those same files meanwhile errors at the checkout instead of pushing, which
# is right.
#
# NEW JERSEY IS DARK, so this job does not regenerate nj/state-legislature.html:
# build_legislator_pages.py refuses an instance metros.json does not carry, so
# that page is not built yet. Go-live adds the step in the same change that
# adds nj to metros.json — nj/WATCH.md has the list.

on:
  schedule:
    - cron: "19 21 * * 2" # Tuesday 21:19 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # requests for the shared robots.txt reader; the roster page and the feed
      # are fetched and parsed with the stdlib.
      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Rebuild New Jersey Senate + Assembly rosters
        run: python3 nj/scripts/build_nj_legislature_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, every data/app file must be present and
      # well formed, and every seat must carry a record.
      - name: Validate app + data files
        run: |
          python3 nj/scripts/validate_index.py nj/index.html
          python3 scripts/validate_chamber_rosters.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- nj/data/app/nj-senate-members.json nj/data/app/nj-assembly-members.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/nj-legislature-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut from main's current tip, with full history — see the sibling
          # workflows' own comments for why both halves matter. The two rebuilt
          # files ride across the checkout as working-tree changes.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          git add nj/data/app/nj-senate-members.json nj/data/app/nj-assembly-members.json
          git commit -m "Update New Jersey Senate + Assembly rosters from the Legislature"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update New Jersey Senate + Assembly rosters" \
              --body "Automated weekly refresh of the New Jersey Senate and General Assembly chamber cards' rosters, from the Legislature's member roster, generated by \`nj/scripts/build_nj_legislature_roster.py\`. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
