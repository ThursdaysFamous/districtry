name: Update municipal officials roster

# Weekly refresh of the Municipality card's governing-body roster
# (il/data/app/municipal-officials.json, fetched by index.html). Re-scrapes each
# sourced county's official directory and, if anything changed, opens a PR
# rather than committing directly to main — officeholder data should get a
# human look before it ships.
#
# All seven metro counties are sourced (docs/EXPANSION_GUIDE.md §3.4), plus
# every county the app has since taken on, each at the depth its county actually
# publishes:
#   Cook       — Clerk's Directory of Elected Officials JSON API (full body)
#   Will       — Clerk's Will County Directory flipbook          (full body)
#   LaSalle    — Clerk's municipal officials PDF                 (full body)
#   Winnebago  — WinGIS per-municipality officeholder layers     (full body)
#   Ogle       — Clerk's County Yearbook PDF                     (full body)
#   Stephenson — county Cities & Villages directory page         (full body)
#   DeKalb     — Clerk's Reference Yearbook PDF                  (full body)
#   Grundy     — Clerk's County Directory booklet PDF            (full body)
#   Livingston — Clerk's Yearbook PDF                            (full body)
#   Logan      — Clerk's Reference & Yearbook PDF                (full body)
#   McLean     — the three ward cities' own pages (Bloomington BEC,
#                leroy.org, lexingtonil.gov) — the county-wide source is a
#                JS-locked Airtable interface (see the scraper)
#   Sangamon   — Clerk's per-municipality officials PDFs         (full body)
#   Madison +  — East-West Gateway Public Officials Directory    (full body;
#   St. Clair    one COG document sourcing two counties at once)
#   Rock Island— Clerk's Elected Officials listing PDF           (full body)
#   Tazewell   — Clerk's FULL YEARBOOK PDF                       (full body)
#   Henry      — Clerk's Handbook of Elected & Appointed
#                Officials PDF                                   (full body)
#   Cass       — Clerk's County Directory PDF                    (full body)
#   Peoria     — Clerk's Officials & Services Directory PDF (full body; the
#                richest source in the fleet — hall address, phone, e-mail AND
#                website per municipality, every seat with its ward/district)
#   Mason      — the Clerk's OWN Google Sheet, published readable-to-
#                anyone and exported as CSV                     (full body;
#                nine municipalities, Havana's aldermen by ward. No address
#                and no home town for anyone — one Mason official's address is
#                legally protected, see build_mason_board_roster.py)
#   Whiteside  — Clerk's County Yearbook PDF                (head + clerk; the
#                yearbook publishes no trustees, and its clerk said so)
#   De Witt    — the Clerk's "Village/City Officials" Word document, sent by
#                e-mail 2026-08-17 and archived under data/source/raw/
#                (full body; all seven municipalities, appointed/acting
#                officers marked)
#   DuPage     — DMMC Membership Directory PDF                   (head only)
#   Kane       — Clerk's Government Guide PDF                    (head + clerk)
#   McHenry    — Clerk's County Yearbook page                    (head + clerk)
#   Kendall    — Clerk's Yearbook & Government Guide PDF         (head + clerk)
#   Carroll    — Clerk's County Yearbook PDF                     (head + clerk)
#   Lake       — county GIS Municipalities service        (hall contact only —
#                Lake publishes no officeholder names anywhere county-side)
#
# Four city-level payloads fill what a county source cannot: the Will ward
# cities' and Joliet's own sites (per-seat contact), Skokie's (trustee district
# assignments), and Freeport's (the whole city — Stephenson's county page is a
# village directory and omits its own county seat).
#
# Each county scrapes independently and a failure is isolated: one county's
# outage never withdraws another county's roster. A blocked source carries
# forward its shipped entries (--preserved) while every other source refreshes;
# only Cook and Will are required, because they are the two full-governing-body
# sources and building without either would ship mayors where councils belong.
# A failure raises that county's standing issue instead of reddening the run.

on:
  schedule:
    - cron: "0 14 * * 3" # Wednesday 14:00 UTC (after the CCPSA job at 13:00)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # Version-pinned via scripts/requirements.txt (constraints). pypdf reads
        # the three counties whose source is a published PDF; pdfplumber reads
        # LaSalle's, which needs word POSITIONS rather than flattened lines (see
        # its scraper); beautifulsoup4 parses McHenry's yearbook page.
        run: pip install -c scripts/requirements.txt requests beautifulsoup4 pypdf pdfplumber olefile playwright

      - name: Install Chromium for the edge-blocked sources
        # Two different blocks, both needing a real browser.
        #
        # McHenry and Kendall sit behind an edge that fingerprints the HTTP
        # client itself: with a byte-identical browser header set curl gets 200
        # where python-requests gets 403.
        #
        # DuPage (Cloudflare) keys on the client's NETWORK instead — a
        # developer machine gets 200 and this runner gets 403 for the same
        # request — which is why it passed in development and failed on its
        # first live run here. A real browser clears the challenge.
        #
        # All three still try requests first (cheap, fails fast) and fall back
        # to the Internet Archive after this.
        run: python3 -m playwright install --with-deps chromium

      - name: Scrape the Cook County Clerk directory of elected officials
        id: scrape_cook
        continue-on-error: true
        run: python3 scripts/cook_municipal_officials_scraper.py --out /tmp/cook_municipal_officials.json

      - name: Scrape the Will County Clerk directory
        id: scrape_will
        continue-on-error: true
        run: python3 scripts/will_municipal_officials_scraper.py --out /tmp/will_municipal_officials.json

      - name: Scrape the DuPage Mayors and Managers Conference directory
        id: scrape_dupage
        continue-on-error: true
        run: python3 scripts/dupage_municipal_officials_scraper.py --out /tmp/dupage_municipal_officials.json

      - name: Scrape the Kane County Clerk government guide
        id: scrape_kane
        continue-on-error: true
        run: python3 scripts/kane_municipal_officials_scraper.py --out /tmp/kane_municipal_officials.json

      - name: Scrape the McHenry County Clerk yearbook
        id: scrape_mchenry
        continue-on-error: true
        run: python3 scripts/mchenry_municipal_officials_scraper.py --out /tmp/mchenry_municipal_officials.json

      - name: Scrape the Kendall County Clerk yearbook
        id: scrape_kendall
        continue-on-error: true
        run: python3 scripts/kendall_municipal_officials_scraper.py --out /tmp/kendall_municipal_officials.json

      - name: Scrape the Lake County GIS municipalities service
        id: scrape_lake
        continue-on-error: true
        run: python3 scripts/lake_municipal_officials_scraper.py --out /tmp/lake_municipal_officials.json

      # LaSalle: the third FULL-governing-body source, and the first county
      # outside the metro. Its clerk publishes one PDF carrying every
      # municipality's whole board with ward numbers, so this county needs no
      # per-city exception. Preservable, not required: unlike Cook and Will,
      # nothing already shipped degrades if it is missing (see PRESERVABLE in
      # the builder).
      - name: Scrape the LaSalle County Clerk municipality officials PDF
        id: scrape_lasalle
        continue-on-error: true
        run: python3 scripts/lasalle_municipal_officials_scraper.py --out /tmp/lasalle_municipal_officials.json

      # Winnebago: the FOURTH full-governing-body source, and the only county in
      # the fleet that publishes municipal governing bodies AS GIS LAYERS — one
      # per municipality on WinGIS's ElectedOfficials service. Preservable for
      # the same reason as LaSalle: nothing already shipped degrades without it.
      - name: Read the WinGIS municipal officeholder layers
        id: scrape_winnebago
        continue-on-error: true
        run: python3 scripts/winnebago_municipal_officials_scraper.py /tmp/winnebago_municipal_officials.json

      # The northern frontier, added alongside those counties' board districts.
      # Ogle and Stephenson are the fifth and sixth FULL-governing-body sources;
      # Carroll is mayor-level, like the collar counties. All three are
      # preservable rather than required, for the same reason as LaSalle:
      # nothing already shipped degrades if one is missing.
      - name: Scrape the Ogle County Clerk yearbook
        id: scrape_ogle
        continue-on-error: true
        run: python3 scripts/ogle_municipal_officials_scraper.py --out /tmp/ogle_municipal_officials.json

      - name: Scrape the Stephenson County cities and villages directory
        id: scrape_stephenson
        continue-on-error: true
        run: python3 scripts/stephenson_municipal_officials_scraper.py --out /tmp/stephenson_municipal_officials.json

      - name: Scrape the Carroll County Clerk yearbook
        id: scrape_carroll
        continue-on-error: true
        run: python3 scripts/carroll_municipal_officials_scraper.py --out /tmp/carroll_municipal_officials.json

      # DeKalb: the SEVENTH full-governing-body source, and the only one that
      # dates every seat's next election. Its yearbook link is discovered from
      # the county's reference page rather than hardcoded — the PDF lives on the
      # clerk's own domain under a month-stamped path that changes annually.
      - name: Scrape the DeKalb County Clerk reference yearbook
        id: scrape_dekalb
        continue-on-error: true
        run: python3 scripts/dekalb_municipal_officials_scraper.py --out /tmp/dekalb_municipal_officials.json

      # Boone: a full-governing-body yearbook, and the one whose PDF prints a
      # RESIDENCE under almost every official. The scraper refuses those lines
      # by construction and proves it on the built payload — see its docstring.
      # Belvidere's ten ward seats are cross-checked against the county's own
      # ward service before the payload is written.
      - name: Scrape the Boone County Clerk yearbook
        id: scrape_boone
        continue-on-error: true
        run: python3 scripts/boone_municipal_officials_scraper.py --out /tmp/boone_municipal_officials.json

      # The pass-6 tranche (2026-08-01): eight counties whose sources the
      # validation pass verified publishable. All preservable — nothing
      # already shipped degrades if one is missing.
      - name: Scrape the Grundy County Clerk directory booklet
        id: scrape_grundy
        continue-on-error: true
        run: python3 scripts/grundy_municipal_officials_scraper.py --out /tmp/grundy_municipal_officials.json

      - name: Scrape the Livingston County Clerk yearbook
        id: scrape_livingston
        continue-on-error: true
        run: python3 scripts/livingston_municipal_officials_scraper.py --out /tmp/livingston_municipal_officials.json

      - name: Scrape the Logan County Clerk reference and yearbook
        id: scrape_logan
        continue-on-error: true
        run: python3 scripts/logan_municipal_officials_scraper.py --out /tmp/logan_municipal_officials.json

      - name: Scrape the McLean ward cities' own council pages
        id: scrape_mclean
        continue-on-error: true
        run: python3 scripts/mclean_municipal_officials_scraper.py --out /tmp/mclean_municipal_officials.json

      - name: Scrape the Sangamon County Clerk per-municipality PDFs
        id: scrape_sangamon
        continue-on-error: true
        run: python3 scripts/sangamon_municipal_officials_scraper.py --out /tmp/sangamon_municipal_officials.json

      # One document, two counties: EWG's Public Officials Directory covers
      # Madison and St. Clair at once, so a failure preserves both.
      - name: Scrape the East-West Gateway Public Officials Directory
        id: scrape_ewg
        continue-on-error: true
        run: python3 scripts/ewg_municipal_officials_scraper.py --out-madison /tmp/madison_municipal_officials.json --out-stclair /tmp/stclair_municipal_officials.json

      # Tazewell's Clerk yearbook, read from word POSITIONS: on many pages the
      # office titles and the officers' names extract as separate blocks, so a
      # line-based read would pair the wrong people with the wrong offices.
      - name: Scrape the Tazewell County Clerk yearbook
        id: scrape_tazewell
        continue-on-error: true
        run: python3 scripts/tazewell_municipal_officials_scraper.py --out /tmp/tazewell_municipal_officials.json

      - name: Scrape the Rock Island County Clerk elected officials listing
        id: scrape_rock_island
        continue-on-error: true
        run: python3 scripts/rock_island_municipal_officials_scraper.py --out /tmp/rock_island_municipal_officials.json

      # Henry's Handbook of Elected & Appointed Officials, which the county
      # clerk pointed at directly (2026-08-03) after this project asked whether
      # the county published one — nothing on the site's own search surfaced it.
      # The DocumentCenter id is discovered from the clerk page rather than
      # hardcoded, because CivicPlus restamps it when a document is replaced.
      - name: Scrape the Henry County Clerk handbook
        id: scrape_henry
        continue-on-error: true
        run: python3 scripts/henry_municipal_officials_scraper.py --out /tmp/henry_municipal_officials.json

      # Cass: full governing bodies for all five of its municipalities, read
      # from word POSITIONS because the office titles wrap across two printed
      # lines ("President of / Village Board") with a member's name on the first
      # and their phone on the second. The x-split is also what keeps every
      # officer's HOME address out of the payload — that column is never read.
      - name: Scrape the Cass County Clerk directory
        id: scrape_cass
        continue-on-error: true
        run: python3 scripts/cass_municipal_officials_scraper.py --out /tmp/cass_municipal_officials.json

      # Whiteside: mayor-and-clerk depth, which is all its yearbook publishes.
      # An address ships only from a row the county itself marks "(Office)";
      # three of the eleven are unmarked and ship none.
      # Peoria: the gap peoria-municipal-officials recorded "no source at any
      # rung" on 2026-08-02 — a correct finding about the places looked at and a
      # wrong conclusion about the county. Its Clerk's office named this
      # directory on request the next day.
      - name: Scrape the Peoria County officials and services directory
        id: scrape_peoria
        continue-on-error: true
        run: python3 scripts/peoria_municipal_officials_scraper.py --out /tmp/peoria_municipal_officials.json

      # Marshall and Washington are the fleet's first ARCHIVED-DOCUMENT municipal
      # sources. Neither county publishes its list on the web: Marshall's Clerk
      # sent a 5-page elected-officers table and Washington's office sent the
      # 40-page Blue Book, both by e-mail on 2026-08-03, and both are committed
      # under data/source/raw/. So these two steps cannot fail on a network blip
      # — they re-parse the archive, which makes them a PARSER regression guard
      # rather than a freshness check. Refreshing the data means asking the
      # clerk again and replacing the archived file.
      - name: Re-parse the Marshall County elected-officers table
        id: scrape_marshall
        continue-on-error: true
        run: python3 scripts/marshall_municipal_officials_scraper.py --out /tmp/marshall_municipal_officials.json

      - name: Re-parse the Washington County Blue Book
        id: scrape_washington
        continue-on-error: true
        run: python3 scripts/washington_municipal_officials_scraper.py --out /tmp/washington_municipal_officials.json

      # De Witt is the third archived-document source, same pattern as Marshall
      # and Washington: its Clerk's "Village/City Officials" Word document
      # (last updated 7/28/2025) came by e-mail on 2026-08-17 and is committed
      # under data/source/raw/, so this step is a parser regression guard, not
      # a freshness check — refreshing means asking the Clerk again.
      - name: Re-parse the De Witt County city and village officials document
        id: scrape_dewitt
        continue-on-error: true
        run: python3 scripts/dewitt_municipal_officials_scraper.py --out /tmp/dewitt_municipal_officials.json

      - name: Read the Mason County Clerk's published directory
        id: scrape_mason
        continue-on-error: true
        run: python3 scripts/mason_municipal_officials_scraper.py --out /tmp/mason_municipal_officials.json

      - name: Scrape the Whiteside County Clerk yearbook
        id: scrape_whiteside
        continue-on-error: true
        run: python3 scripts/whiteside_municipal_officials_scraper.py --out /tmp/whiteside_municipal_officials.json

      # Macoupin's directory page arrives EMPTY and fills itself from a REST
      # service mounted beside the CMS; the address was recorded from a browser
      # capture on 2026-08-20, and needs no browser now that it is known. This
      # step makes ~285 requests (one list call plus one per office, for the
      # hall contact), paced at 0.4s — about two minutes.
      - name: Read the Macoupin County Clerk's elected-officials service
        id: scrape_macoupin
        continue-on-error: true
        run: python3 scripts/macoupin_municipal_officials_scraper.py --out /tmp/macoupin_municipal_officials.json

      # Kankakee is the first RUNG-3 county: nothing the county publishes names
      # a municipal officer, so its five heads come from the KATS MPO's Policy
      # Committee minutes. The step reads one nav page, the year indexes it
      # links, and one PDF per meeting since the last municipal turnover —
      # about a dozen requests.
      - name: Read the KATS Policy Committee minutes for Kankakee's municipal heads
        id: scrape_kankakee
        continue-on-error: true
        run: python3 scripts/kankakee_municipal_officials_scraper.py --out /tmp/kankakee_municipal_officials.json

      # Freeport is the ONLY municipality in Stephenson County that its county
      # page omits — and it is the county seat, holding more than half the
      # county's municipal population. The city publishes its own governing body
      # as a WordPress person directory with schema.org markup, so it enters the
      # same way Lockport and Wilmington do: an enrichment payload that supplies
      # a municipality the county source does not carry at all.
      - name: Scrape Freeport's own elected-officials directory
        id: scrape_freeport
        continue-on-error: true
        run: python3 scripts/freeport_council_scraper.py --out /tmp/freeport_council.json

      # Galesburg, added 2026-08-22 alongside Knox County's ward layer. Unlike
      # every other enrichment here this is not refining a county directory —
      # Knox County has NO municipal source at all (its Clerk's site is dead and
      # the county's own answers 403), so the city's own council page is the
      # only directory that exists for it. It also supersedes the ward layer's
      # MEMBER column, which is correct on numbering and stale on one name.
      - name: Scrape Galesburg's own council page
        id: scrape_galesburg
        continue-on-error: true
        run: python3 scripts/galesburg_council_scraper.py --out /tmp/galesburg_council.json

      # Plano, added 2026-09-11. Kendall County's Clerk publishes a yearbook and
      # this job already reads it, but that document stops at the mayor and
      # clerk for every municipality — so Plano's four drawn wards named nobody.
      # The city's own page carries all eight council members, two per ward,
      # each as a mailto anchor followed by ", Ward N", which is the
      # plano-ward-officials gap answered from the city rather than the county.
      - name: Scrape Plano's own council page
        id: scrape_plano
        continue-on-error: true
        run: python3 scripts/plano_council_scraper.py --out /tmp/plano_council.json

      # The bounded per-city exception (docs/EXPANSION_GUIDE.md §3.4): the
      # Will ward cities' own sites carry per-seat contact the Clerk's directory
      # doesn't, and supply Lockport and Wilmington, which that directory omits
      # entirely. Contact-only for cities the county already covers.
      - name: Scrape the Will ward cities' own council pages
        id: scrape_will_cities
        continue-on-error: true
        run: python3 scripts/will_city_councils_scraper.py --out /tmp/will_city_councils.json

      # Skokie's four district trustees + two at-large are published as
      # municipality-wide by the Cook Clerk, with no district on any of them,
      # while Cook GIS carries the four district polygons. The village settles
      # it (docs/EXPANSION_GUIDE.md §3.4).
      - name: Scrape Skokie's trustee district assignments
        id: scrape_skokie
        continue-on-error: true
        run: python3 scripts/skokie_trustee_districts_scraper.py --out /tmp/skokie_trustee_districts.json

      # Joliet's own site carries per-seat phone + e-mail the Clerk's directory
      # doesn't. Its Akamai edge serves a hard WAF deny, which no rung clears —
      # this step is EXPECTED to fail and its entry preserves. Kept so the city
      # resumes automatically if the edge relaxes (docs/EXPANSION_GUIDE.md
      # Part 2.4, blocked-source taxonomy).
      - name: Scrape Joliet's council contact
        id: scrape_joliet
        continue-on-error: true
        run: python3 scripts/joliet_council_contact_scraper.py --out /tmp/joliet_council_contact.json

      # A source that blocks or breaks is an expected state, not a red build:
      # the shipped roster keeps its last good values and one standing issue
      # tracks the block (the validate-sources pattern).
      - name: Track a blocked or broken source
        if: |
          steps.scrape_cook.outcome == 'failure' || steps.scrape_will.outcome == 'failure' ||
          steps.scrape_dupage.outcome == 'failure' || steps.scrape_kane.outcome == 'failure' ||
          steps.scrape_mchenry.outcome == 'failure' || steps.scrape_kendall.outcome == 'failure' ||
          steps.scrape_lake.outcome == 'failure' || steps.scrape_will_cities.outcome == 'failure' ||
          steps.scrape_skokie.outcome == 'failure' || steps.scrape_joliet.outcome == 'failure' ||
          steps.scrape_ogle.outcome == 'failure' || steps.scrape_stephenson.outcome == 'failure' ||
          steps.scrape_carroll.outcome == 'failure' || steps.scrape_freeport.outcome == 'failure' ||
          steps.scrape_galesburg.outcome == 'failure' ||
          steps.scrape_dekalb.outcome == 'failure' || steps.scrape_grundy.outcome == 'failure' ||
          steps.scrape_livingston.outcome == 'failure' || steps.scrape_logan.outcome == 'failure' ||
          steps.scrape_mclean.outcome == 'failure' || steps.scrape_sangamon.outcome == 'failure' ||
          steps.scrape_tazewell.outcome == 'failure' || steps.scrape_henry.outcome == 'failure' ||
          steps.scrape_cass.outcome == 'failure' || steps.scrape_whiteside.outcome == 'failure' ||
          steps.scrape_peoria.outcome == 'failure' ||
          steps.scrape_marshall.outcome == 'failure' ||
          steps.scrape_washington.outcome == 'failure' ||
          steps.scrape_dewitt.outcome == 'failure' ||
          steps.scrape_mason.outcome == 'failure' ||
          steps.scrape_boone.outcome == 'failure' ||
          steps.scrape_ewg.outcome == 'failure' || steps.scrape_rock_island.outcome == 'failure' ||
          steps.scrape_macoupin.outcome == 'failure' ||
          steps.scrape_kankakee.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          COOK_OUTCOME: ${{ steps.scrape_cook.outcome }}
          WILL_OUTCOME: ${{ steps.scrape_will.outcome }}
          DUPAGE_OUTCOME: ${{ steps.scrape_dupage.outcome }}
          KANE_OUTCOME: ${{ steps.scrape_kane.outcome }}
          MCHENRY_OUTCOME: ${{ steps.scrape_mchenry.outcome }}
          KENDALL_OUTCOME: ${{ steps.scrape_kendall.outcome }}
          LAKE_OUTCOME: ${{ steps.scrape_lake.outcome }}
          WILL_CITIES_OUTCOME: ${{ steps.scrape_will_cities.outcome }}
          SKOKIE_OUTCOME: ${{ steps.scrape_skokie.outcome }}
          JOLIET_OUTCOME: ${{ steps.scrape_joliet.outcome }}
          OGLE_OUTCOME: ${{ steps.scrape_ogle.outcome }}
          STEPHENSON_OUTCOME: ${{ steps.scrape_stephenson.outcome }}
          CARROLL_OUTCOME: ${{ steps.scrape_carroll.outcome }}
          FREEPORT_OUTCOME: ${{ steps.scrape_freeport.outcome }}
          DEKALB_OUTCOME: ${{ steps.scrape_dekalb.outcome }}
          GRUNDY_OUTCOME: ${{ steps.scrape_grundy.outcome }}
          LIVINGSTON_OUTCOME: ${{ steps.scrape_livingston.outcome }}
          LOGAN_OUTCOME: ${{ steps.scrape_logan.outcome }}
          MCLEAN_OUTCOME: ${{ steps.scrape_mclean.outcome }}
          SANGAMON_OUTCOME: ${{ steps.scrape_sangamon.outcome }}
          EWG_OUTCOME: ${{ steps.scrape_ewg.outcome }}
          ROCK_ISLAND_OUTCOME: ${{ steps.scrape_rock_island.outcome }}
          # Tazewell reached the `if:` condition above without an env entry or a
          # raise_issue line, so a Tazewell-only failure ran this step and filed
          # nothing — the step's whole purpose, silently skipped. Both counties
          # are wired through now.
          TAZEWELL_OUTCOME: ${{ steps.scrape_tazewell.outcome }}
          HENRY_OUTCOME: ${{ steps.scrape_henry.outcome }}
          CASS_OUTCOME: ${{ steps.scrape_cass.outcome }}
          WHITESIDE_OUTCOME: ${{ steps.scrape_whiteside.outcome }}
          PEORIA_OUTCOME: ${{ steps.scrape_peoria.outcome }}
          MARSHALL_OUTCOME: ${{ steps.scrape_marshall.outcome }}
          WASHINGTON_OUTCOME: ${{ steps.scrape_washington.outcome }}
          DEWITT_OUTCOME: ${{ steps.scrape_dewitt.outcome }}
          MASON_OUTCOME: ${{ steps.scrape_mason.outcome }}
          BOONE_OUTCOME: ${{ steps.scrape_boone.outcome }}
          MACOUPIN_OUTCOME: ${{ steps.scrape_macoupin.outcome }}
          KANKAKEE_OUTCOME: ${{ steps.scrape_kankakee.outcome }}
        run: |
          raise_issue() {
            title="Municipal officials: $1 County source unavailable"
            existing="$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')"
            body="The weekly municipal-officials refresh could not scrape the $1 County source on $(date -u +%Y-%m-%d). The shipped roster is unchanged and still serves its last verified values. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          }
          # Full if-blocks, not `[ … ] && …`: under `set -e` a false test as the
          # last command of an AND-list fails the step, which would turn "one
          # county is blocked" into a red run instead of a filed issue.
          if [ "$COOK_OUTCOME" = "failure" ]; then raise_issue "Cook"; fi
          if [ "$WILL_OUTCOME" = "failure" ]; then raise_issue "Will"; fi
          if [ "$DUPAGE_OUTCOME" = "failure" ]; then raise_issue "DuPage"; fi
          if [ "$KANE_OUTCOME" = "failure" ]; then raise_issue "Kane"; fi
          if [ "$MCHENRY_OUTCOME" = "failure" ]; then raise_issue "McHenry"; fi
          if [ "$KENDALL_OUTCOME" = "failure" ]; then raise_issue "Kendall"; fi
          if [ "$LAKE_OUTCOME" = "failure" ]; then raise_issue "Lake"; fi
          if [ "$MARSHALL_OUTCOME" = "failure" ]; then raise_issue "Marshall"; fi
          if [ "$WASHINGTON_OUTCOME" = "failure" ]; then raise_issue "Washington"; fi
          if [ "$DEWITT_OUTCOME" = "failure" ]; then raise_issue "De Witt"; fi
          if [ "$WILL_CITIES_OUTCOME" = "failure" ]; then raise_issue "Will ward-city"; fi
          if [ "$SKOKIE_OUTCOME" = "failure" ]; then raise_issue "Skokie trustee-district"; fi
          if [ "$JOLIET_OUTCOME" = "failure" ]; then raise_issue "Joliet council-contact"; fi
          if [ "$OGLE_OUTCOME" = "failure" ]; then raise_issue "Ogle"; fi
          if [ "$STEPHENSON_OUTCOME" = "failure" ]; then raise_issue "Stephenson"; fi
          if [ "$CARROLL_OUTCOME" = "failure" ]; then raise_issue "Carroll"; fi
          if [ "$FREEPORT_OUTCOME" = "failure" ]; then raise_issue "Freeport council"; fi
          if [ "$DEKALB_OUTCOME" = "failure" ]; then raise_issue "DeKalb"; fi
          if [ "$GRUNDY_OUTCOME" = "failure" ]; then raise_issue "Grundy"; fi
          if [ "$LIVINGSTON_OUTCOME" = "failure" ]; then raise_issue "Livingston"; fi
          if [ "$LOGAN_OUTCOME" = "failure" ]; then raise_issue "Logan"; fi
          if [ "$MCLEAN_OUTCOME" = "failure" ]; then raise_issue "McLean ward-city"; fi
          if [ "$SANGAMON_OUTCOME" = "failure" ]; then raise_issue "Sangamon"; fi
          if [ "$EWG_OUTCOME" = "failure" ]; then raise_issue "Madison + St. Clair (EWG)"; fi
          if [ "$ROCK_ISLAND_OUTCOME" = "failure" ]; then raise_issue "Rock Island"; fi
          if [ "$TAZEWELL_OUTCOME" = "failure" ]; then raise_issue "Tazewell"; fi
          if [ "$HENRY_OUTCOME" = "failure" ]; then raise_issue "Henry"; fi
          if [ "$CASS_OUTCOME" = "failure" ]; then raise_issue "Cass"; fi
          if [ "$WHITESIDE_OUTCOME" = "failure" ]; then raise_issue "Whiteside"; fi
          if [ "$PEORIA_OUTCOME" = "failure" ]; then raise_issue "Peoria"; fi
          if [ "$BOONE_OUTCOME" = "failure" ]; then raise_issue "Boone"; fi
          # Mason was in the failure condition and had an outcome env but no
          # raise_issue line, so a Mason-only failure ran this step and raised
          # nothing — a guard that fires into silence. Added with Boone's.
          if [ "$MASON_OUTCOME" = "failure" ]; then raise_issue "Mason"; fi
          # Macoupin had a scrape step and an `add` line and NONE of the three
          # tracking parts, so a Macoupin-only failure never reached this step
          # and filed nothing — the same defect the Mason note above records.
          if [ "$MACOUPIN_OUTCOME" = "failure" ]; then raise_issue "Macoupin"; fi
          if [ "$KANKAKEE_OUTCOME" = "failure" ]; then raise_issue "Kankakee"; fi

      # Build on what came back. Cook and Will are required — they are the only
      # two full-governing-body sources, so building without either would ship
      # mayors where councils belong, and the builder refuses. Every OTHER
      # source is preservable: it hands the builder --preserved <id> and the
      # shipped roster, and that source's entries carry forward untouched.
      #
      # This replaces an all-ten gate that could never pass. McHenry and Kendall
      # block every fetch rung including the Archive's crawler, and DuPage and
      # Joliet 403 GitHub's runner IPs while answering a developer machine — so
      # one permanently blocked source used to withhold every other county's
      # turnover as well, freezing the whole roster indefinitely.
      - name: Rebuild roster data file
        id: build
        if: steps.scrape_cook.outcome == 'success' && steps.scrape_will.outcome == 'success'
        run: |
          inputs=(/tmp/cook_municipal_officials.json /tmp/will_municipal_officials.json)
          enrich=()
          preserved=()
          add() { # add <step-outcome> <preserve-id> <kind> <path>
            if [ "$1" = "success" ]; then
              if [ "$3" = "enrich" ]; then enrich+=("$4"); else inputs+=("$4"); fi
            else
              preserved+=("$2")
            fi
          }
          add "${{ steps.scrape_dupage.outcome }}"      dupage      county /tmp/dupage_municipal_officials.json
          add "${{ steps.scrape_kane.outcome }}"        kane        county /tmp/kane_municipal_officials.json
          add "${{ steps.scrape_mchenry.outcome }}"     mchenry     county /tmp/mchenry_municipal_officials.json
          add "${{ steps.scrape_kendall.outcome }}"     kendall     county /tmp/kendall_municipal_officials.json
          add "${{ steps.scrape_lake.outcome }}"        lake        county /tmp/lake_municipal_officials.json
          add "${{ steps.scrape_lasalle.outcome }}"     lasalle     county /tmp/lasalle_municipal_officials.json
          add "${{ steps.scrape_winnebago.outcome }}"   winnebago   county /tmp/winnebago_municipal_officials.json
          add "${{ steps.scrape_ogle.outcome }}"        ogle        county /tmp/ogle_municipal_officials.json
          add "${{ steps.scrape_stephenson.outcome }}"  stephenson  county /tmp/stephenson_municipal_officials.json
          add "${{ steps.scrape_carroll.outcome }}"     carroll     county /tmp/carroll_municipal_officials.json
          add "${{ steps.scrape_dekalb.outcome }}"      dekalb      county /tmp/dekalb_municipal_officials.json
          add "${{ steps.scrape_grundy.outcome }}"      grundy      county /tmp/grundy_municipal_officials.json
          add "${{ steps.scrape_livingston.outcome }}"  livingston  county /tmp/livingston_municipal_officials.json
          add "${{ steps.scrape_logan.outcome }}"       logan       county /tmp/logan_municipal_officials.json
          add "${{ steps.scrape_mclean.outcome }}"      mclean      county /tmp/mclean_municipal_officials.json
          add "${{ steps.scrape_sangamon.outcome }}"    sangamon    county /tmp/sangamon_municipal_officials.json
          # one scrape step, two county payloads — both preserve if it fails
          add "${{ steps.scrape_ewg.outcome }}"         madison     county /tmp/madison_municipal_officials.json
          add "${{ steps.scrape_ewg.outcome }}"         st-clair    county /tmp/stclair_municipal_officials.json
          add "${{ steps.scrape_rock_island.outcome }}" rock-island county /tmp/rock_island_municipal_officials.json
          add "${{ steps.scrape_tazewell.outcome }}"    tazewell    county /tmp/tazewell_municipal_officials.json
          add "${{ steps.scrape_henry.outcome }}"       henry       county /tmp/henry_municipal_officials.json
          add "${{ steps.scrape_cass.outcome }}"        cass        county /tmp/cass_municipal_officials.json
          add "${{ steps.scrape_whiteside.outcome }}"   whiteside   county /tmp/whiteside_municipal_officials.json
          add "${{ steps.scrape_peoria.outcome }}"      peoria      county /tmp/peoria_municipal_officials.json
          add "${{ steps.scrape_marshall.outcome }}"    marshall    county /tmp/marshall_municipal_officials.json
          add "${{ steps.scrape_washington.outcome }}"  washington  county /tmp/washington_municipal_officials.json
          add "${{ steps.scrape_dewitt.outcome }}"      dewitt      county /tmp/dewitt_municipal_officials.json
          add "${{ steps.scrape_mason.outcome }}"        mason       county /tmp/mason_municipal_officials.json
          add "${{ steps.scrape_macoupin.outcome }}"    macoupin    county /tmp/macoupin_municipal_officials.json
          add "${{ steps.scrape_boone.outcome }}"       boone       county /tmp/boone_municipal_officials.json
          add "${{ steps.scrape_kankakee.outcome }}"    kankakee    county /tmp/kankakee_municipal_officials.json
          add "${{ steps.scrape_will_cities.outcome }}" will-cities enrich /tmp/will_city_councils.json
          add "${{ steps.scrape_skokie.outcome }}"      skokie      enrich /tmp/skokie_trustee_districts.json
          add "${{ steps.scrape_joliet.outcome }}"      joliet      enrich /tmp/joliet_council_contact.json
          add "${{ steps.scrape_freeport.outcome }}"    freeport    enrich /tmp/freeport_council.json
          add "${{ steps.scrape_galesburg.outcome }}"   galesburg   enrich /tmp/galesburg_council.json
          add "${{ steps.scrape_plano.outcome }}"       plano       enrich /tmp/plano_council.json

          # The shipped roster is the preserve source, so read it BEFORE the
          # builder overwrites it in place.
          cp il/data/app/municipal-officials.json /tmp/shipped-municipal-officials.json

          argv=("${inputs[@]}")
          if [ ${#enrich[@]} -gt 0 ]; then argv+=(--enrich "${enrich[@]}"); fi
          argv+=(--preserve /tmp/shipped-municipal-officials.json)
          if [ ${#preserved[@]} -gt 0 ]; then argv+=(--preserved "${preserved[@]}"); fi

          # stderr to a file rather than a process substitution, so the log is
          # complete before it is read no matter how the build exits.
          status=0
          python3 scripts/build_municipal_officials_roster.py "${argv[@]}" \
            2>/tmp/build-log.txt || status=$?
          cat /tmp/build-log.txt >&2
          [ "$status" -eq 0 ] || exit "$status"

          # Surfaced in the PR body so a preserved source — data still shipped
          # but no longer verified this week — is never invisible to review.
          {
            echo "preserved<<PRESERVED_EOF"
            grep '^PRESERVED' /tmp/build-log.txt || echo "PRESERVED: none — every source refreshed"
            echo "PRESERVED_EOF"
          } >> "$GITHUB_OUTPUT"

      # The Cicero Public Library's elected board, from the same Cook payload
      # (the Clerk's TWNSP read carries it — see the builder's docstring).
      # Gated on the Cook scrape rather than the roster build: this file's
      # only input is Cook's, and a failed Cook scrape carries BOTH files
      # forward together.
      - name: Rebuild the Cicero library trustees file
        if: steps.scrape_cook.outcome == 'success'
        run: python3 scripts/build_cicero_library_trustees.py /tmp/cook_municipal_officials.json

      # The township card's roster, from the same Cook payload again (the raw
      # TWNSP feed rides it as `township_officials`). Same gate and for the
      # same reason: a failed Cook scrape carries all three Cook-fed files
      # forward together, and the builder refuses partial input on its own.
      # continue-on-error, deliberately: this builder's FATALs are strict on
      # purpose (completeness, one-seat-per-office, personal-domain refusals)
      # and each one means THIS file stands while a human looks — never that
      # the whole ~30-county municipal refresh should miss its week. The
      # refusal is surfaced on a standing issue below, because a green run
      # is invisible to the roster-health watchdog.
      - name: Rebuild the township officials file
        id: build_townships
        if: steps.scrape_cook.outcome == 'success'
        continue-on-error: true
        run: python3 scripts/build_township_officials.py /tmp/cook_municipal_officials.json

      - name: Track a township build refusal
        if: steps.scrape_cook.outcome == 'success' && steps.build_townships.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Township officials: the Cook build refused the write"
          existing="$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')"
          body="build_township_officials.py exited non-zero on $(date -u +%Y-%m-%d) — its guards read the TWNSP feed as changed (a township missing, a duplicated seat, a personal-domain hall contact, or an address-type change). The shipped township-officials.json is unchanged and still serves its last verified values. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      # The history page's stat tiles are MEASURED from the roster file(s)
      # this job rewrites, so regenerate it in the same run — otherwise the
      # smoke gate's `build_history_page.py --check` fails on this PR with a
      # tile that has drifted from the data it counts.
      - name: Regenerate the history page
        if: steps.build.outcome == 'success'
        run: python3 scripts/build_history_page.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present
      # and well formed. node is preinstalled on ubuntu-latest.
      - name: Validate app + data files
        if: steps.build.outcome == 'success'
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        if: steps.build.outcome == 'success'
        run: |
          if git diff --quiet -- il/data/app/ il/history.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.build.outcome == 'success' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/municipal-officials-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          git add il/data/app/municipal-officials.json il/data/app/cook-library-trustees.json il/data/app/township-officials.json il/history.html
          git commit -m "Update municipal and township officials rosters from the county clerk directories"
          git push -u origin "$branch" --force
          # Only open a PR if one isn't already open for this branch; if it is,
          # the force-push above already updated it.
          body="Automated weekly refresh of three rosters from the county clerk directories: the Municipality card's governing bodies (\`municipal-officials.json\`, rebuilt by \`scripts/build_municipal_officials_roster.py\` from every sourced county's official publication — the Cook and Will clerk directories, the DMMC directory, the Kane/McHenry/Kendall/Ogle/Carroll/Boone clerk yearbooks, LaSalle's clerk PDF, Winnebago's WinGIS officeholder layers, Stephenson's cities-and-villages page, Lake's county GIS hall contact, the Grundy/Livingston/Logan/Sangamon/Rock Island clerk documents, the East-West Gateway directory for Madison and St. Clair, Macoupin's SOE elected-officials service, and the three McLean ward cities' own pages — plus the four city-level payloads), the Township card's governing bodies (\`township-officials.json\`, \`scripts/build_township_officials.py\`, Cook's 29 townships from the same Clerk directory's TWNSP type), and the Cicero library board (\`cook-library-trustees.json\`, \`scripts/build_cicero_library_trustees.py\`, same fetch).

          Please review the diff before merging — this changes data about real officeholders.

          A source that blocked this run does not withdraw its data: its entries carry forward from the previously shipped roster, and are listed below. A preserved source is data still shipped but **not re-verified this week** — its standing issue tracks the block.

          \`\`\`
          ${{ steps.build.outputs.preserved }}
          \`\`\`"
          if [ "${{ steps.build_townships.outcome }}" = "failure" ]; then
            body="$body

          **township-officials.json carried forward**: its build refused the write this run — the standing issue \"Township officials: the Cook build refused the write\" has the reason."
          fi
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update municipal and township officials rosters from the county clerk directories" \
              --body "$body" \
              --base main \
              --head "$branch"
          else
            gh pr edit "$branch" --body "$body"
          fi
