name: Update West Virginia city councils

# Weekly refresh of the council members of the West Virginia cities whose
# wards the City Council Ward layer draws (wv/data/app/wv-city-councils.json,
# fetched by wv/index.html's City Council Ward card), rebuilt by
# wv/scripts/build_wv_city_councils.py from each city's own council page:
# today Charleston's, www.charlestonwv.gov/government/city-council. If
# anything changed it opens a PR rather than committing directly to main —
# officeholder data gets a look before it ships.
#
# Charleston elects its mayor and all 26 council members on 3 November 2026,
# so the names are expected to change once the city updates its page after
# the new council takes office.
#
# The builder FAILS rather than writing when the page stops reading the way
# it was measured on 2026-11-02: one row for each of the council's 20 ward
# seats and 6 at-large seats, and no more than three seats naming no one. The
# validate step runs its offline --check on the written file too. A red run
# is the signal that a person needs to read the page.
#
# The page prints a street address for every member, most of them homes; the
# builder keeps only telephone numbers and e-mail addresses from a member's
# row, and --check refuses a file holding anything that looks like a street
# address. A number or e-mail address printed for two or more members, or
# equal to City Hall's line, rides nobody's row.
#
# robots.txt: www.charlestonwv.gov's (read 2026-11-02) disallows nothing the
# builder reads and states no delay; the builder reads it before its fetch. A
# run is one request.
#
# WEST VIRGINIA IS DARK, so this job regenerates no page.

on:
  schedule:
    - cron: "53 19 * * 4" # Thursday 19:53 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR runs CI; see
      # update-wv-legislature-roster.yml for why.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # requests for the shared robots.txt reader; the page is fetched and
      # parsed with the stdlib.
      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Rebuild the city councils
        run: python3 wv/scripts/build_wv_city_councils.py

      - name: Validate app + data files
        run: |
          python3 wv/scripts/build_wv_city_councils.py --check
          python3 wv/scripts/validate_index.py wv/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- wv/data/app/wv-city-councils.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/wv-city-councils-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut from main's current tip, with full history; the rebuilt file is
          # carried over the checkout as an uncommitted change.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          git add wv/data/app/wv-city-councils.json
          git commit -m "Update West Virginia city council members"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update West Virginia city council members" \
              --body "Automated weekly refresh of the council members of the West Virginia cities whose wards the map draws, from each city's own council page, generated by \`wv/scripts/build_wv_city_councils.py\`. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
