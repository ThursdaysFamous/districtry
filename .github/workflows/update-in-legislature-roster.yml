name: Update Indiana legislature roster

# Weekly refresh of the Indiana Senate + House of Representatives rosters
# (in/data/app/in-senate-members.json and in-house-members.json, fetched by
# in/index.html's chamber cards). Rebuilds both chambers from the General
# Assembly's own site and, if anything changed, opens a PR rather than
# committing directly to main.
#
# iga.in.gov's legislator pages are drawn from feeds the site publishes for
# them: the list of sessions, one list of the sitting members, and one record
# per member, about 150 requests paced at one every two seconds, about six
# minutes in all.
#
# THE SITE REFUSES THIS PROJECT'S OWN NAME AND ANSWERS A BROWSER'S, measured
# 2026-11-14 and recorded in the builder, so the builder sends a browser
# identity. WHETHER IT ANSWERS GITHUB'S SERVERS WAS NOT MEASURED BEFORE THIS
# WORKFLOW'S FIRST RUN. A refusal fails the build step and writes nothing; it
# is never worked around.
#
# robots.txt: the host's policy is read before the first fetch, with the
# client the fetches send.
#
# THE REBUILT FILES ARE CARRIED ACROSS THE BRANCH CUT RATHER THAN FETCHED A
# SECOND TIME, the update-ilga-roster.yml pattern. A run where main changed
# those same files meanwhile errors at the checkout instead of pushing, which
# is right.
#
# `in/state-legislature.html` carries a GENERATED table of both rosters, and
# `about.html` and `sitemap.xml` count them, so all three are regenerated here
# and staged in the same `git add`.

on:
  schedule:
    - cron: "49 9 * * 6" # Saturday 09:49 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0
          filter: blob:none  # every commit, old file contents only on demand

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # requests, which the builder and the shared robots.txt reader fetch with.
      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Rebuild Indiana Senate + House rosters
        run: python3 in/scripts/build_in_legislature_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, every data/app file must be present and
      # well formed, and every seat must carry a record.
      - name: Validate app + data files
        run: |
          python3 in/scripts/validate_index.py in/index.html
          python3 scripts/validate_chamber_rosters.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- in/data/app/in-senate-members.json in/data/app/in-house-members.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/in-legislature-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut from main's current tip, with full history — see the sibling
          # workflows' own comments for why both halves matter. The two rebuilt
          # files ride across the checkout as working-tree changes.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          python3 scripts/build_officeholder_tables.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add in/data/app/in-senate-members.json in/data/app/in-house-members.json in/state-legislature.html about.html sitemap.xml
          git commit -m "Update Indiana Senate + House rosters from the General Assembly's own site"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Indiana Senate + House rosters" \
              --body "Automated weekly refresh of the Indiana Senate and House chamber cards' rosters, from the General Assembly's own site, generated by \`in/scripts/build_in_legislature_roster.py\`. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
