name: Update WI county board roster

# Weekly refresh of the Wisconsin county board supervisors
# (wi/data/app/county-board-members.json, read by wi/index.html's County Board
# District card). Re-scrapes ALL 72 counties — Wisconsin complete — by
# whichever of the twenty-seven carriers reaches each — 41 board
# pages, Milwaukee's, Racine's and Lincoln's own GIS layers (Milwaukee
# witnessed against the county's Legistar API; Lincoln's layer lives on a
# second county host its challenge-blocked website never links, and its
# DISTRICT KEY is witnessed by sampling the county's polygons against the
# shipped state filing — one seat is withheld where the two disagree),
# Fond du Lac through the Internet Archive, Dodge's
# constituent directory, Kenosha's and Adams's directory PDFs, Clark's Official
# Directory PDF (its link discovered by anchor text, because the county serves
# it from a content hash that changes on re-upload), Pierce's annual directory
# PDF (pinned by year, because that host allows documents and forbids pages),
# Marathon's staff-directory table with a fetch per member,
# St. Croix's own five-column Districts & Supervisors table,
# Chippewa's board-page h-cards (witnessed against its own staff directory),
# Menominee's joint County/Town board (five ward seats the state files as
# districts 1-5, plus the two supervisors it elects countywide),
# Langlade's board page plus one fetch per member (21 pages; the home address
# every one of them prints is never read),
# Barron's board.cfm table on the county's OTHER site (its canonical board
# page links it twice and names two people; each seat is two table rows with
# the district number in the row above the supervisor, and the address column
# is 28 home addresses and is never read),
# Iron's board page plus one fetch per member (14 pages; the district is on
# each member's own page and on no other county surface, and the one empty
# seat's district is elimination, gated on the vacancy count agreeing),
# Sawyer's staff directory plus one fetch per member (15 pages; CivicPlus's
# newer responsive template, not the h-card widget Door and Oconto use; its
# ward composition comes from a third county page),
# (Ashland is NOT fetched: its robots.txt disallows the whole site to every
# agent it does not name, so its 21 seats ride DOCUMENT_ROSTERS dated to the
# one read, and its reader is kept for the day the county says yes),
# Douglas's Members by District table (its district column is ordinal words),
# Florence's board list plus one fetch per member (12 pages; its one empty
# seat is filed as a member and would flip to a plausible name, so the vacancy
# is tested before the name is built and on both county surfaces; home
# addresses skipped),
# Forest's supervisors page (every card carries three headings of which only
# the first is that seat's own — the other two hold neighbouring supervisors'
# names, and the four vacancy headings leak the same way, so both the name and
# the vacancy are read per heading and never per card; home addresses skipped),
# Columbia's framed table,
# and NINE dated documents that are never re-fetched (Taylor, Lafayette
# and La Crosse behind a captcha or a challenge; Pepin, Jackson, Richland, Rusk,
# Polk and Dunn because their robots.txt disallows this client) — and, if
# anything changed, opens a PR rather than committing to
# main — officeholder data should get a human look before it ships.

on:
  schedule:
    - cron: "30 14 * * 4" # Thursday 14:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI; falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # pdfplumber is for the officer step below, which re-parses the Blue
      # Book's officer tables. pypdf is the board scraper's own: Kenosha
      # publishes its roster as the Clerk's directory PDF rather than as a
      # page, and that is a module-scope import
      # scripts/validate_workflow_deps.py checks against this line. (Taylor's
      # document needs nothing — its text is carried in the scraper itself.)
      - name: Install dependencies
        run: pip install -c wi/scripts/requirements.txt pdfplumber pypdf

      # The scraper fetches with urllib and the builder reads the shipped
      # geometry off disk; pypdf (above) is its only third-party import.
      #
      # The archive.org keys are OPTIONAL and only Fond du Lac uses them: its
      # page is Akamai-denied to this client and is read through the Internet
      # Archive, which means asking Save Page Now for a fresh copy each run.
      # Anonymous saves work but share the runner's address with every other
      # project on it, so an API key is the difference between a fresh capture
      # and falling back to whatever the crawler last took. Absent keys are not
      # an error; a copy too old to trust fails THAT COUNTY loudly instead.
      - name: Scrape the counties that publish a readable member list
        env:
          ARCHIVE_SPN_ACCESS_KEY: ${{ secrets.ARCHIVE_SPN_ACCESS_KEY }}
          ARCHIVE_SPN_SECRET_KEY: ${{ secrets.ARCHIVE_SPN_SECRET_KEY }}
        run: python3 wi/scripts/wi_county_board_scraper.py

      # Refuses to write below its floors (see the builder's MIN_* constants,
      # set to tolerate a county or two going dark on any given run) and checks
      # every county's seats against the district geometry actually shipped, so
      # the two publishers have to agree before this lands, and refuses to drop
      # a county that shipped last week.
      - name: Rebuild the county board roster
        run: python3 wi/scripts/build_wi_county_board_roster.py

      # The county card's board chair is reconciled against this roster (the
      # chair is the one county officer who is also a supervisor, and boards
      # elect their chair each April organizational meeting — a cycle the
      # Blue Book's snapshot cannot see). Re-parse the book's officer tables
      # (--officers-only skips the association's 12-minute clerk crawl) and
      # rebuild the officer roster so a chair change on a county's board page
      # lands on the county card the same week.
      - name: Re-parse the Blue Book officer tables
        run: python3 wi/scripts/wi_county_clerk_scraper.py --officers-only

      # phase 4 PR 2: the counties whose own officer pages measure open are
      # re-read weekly — office phone/e-mail/link, plus a name witness that
      # supersedes the book where a county has visibly moved past it
      - name: Scrape county officer contact pages
        run: python3 wi/scripts/wi_county_officer_contact_scraper.py

      - name: Rebuild the county officer roster
        run: python3 wi/scripts/build_wi_county_officer_roster.py

      # The history page's stat tiles are MEASURED from this data — regenerate
      # it in the same run so the smoke gate's build_history_page --check stays
      # green on this PR (a tile that drifted from the data it counts fails CI)
      - name: Regenerate the history page
        run: python3 scripts/build_history_page.py

      # The history page this job just rewrote is IN the sitemap, and the
      # sitemap's lastmod is that file's own last commit -- so regenerate it in
      # the same run, or the smoke gate's `build_sitemap.py --check` fails on
      # this PR for a date nobody typed. Stdlib only.
      - name: Regenerate the sitemap
        run: python3 scripts/build_sitemap.py

      - name: Validate app + data files
        run: python3 wi/scripts/validate_index.py wi/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- wi/data/app/county-board-members.json wi/data/app/wi-county-officers.json wi/history.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place instead of spawning a duplicate every week.
          branch="bot/wi-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          git add wi/data/app/county-board-members.json wi/data/app/wi-county-officers.json wi/history.html
          git commit -m "Update WI county board supervisors from the counties' own pages"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update WI county board supervisors from the counties' own pages" \
              --body "Automated weekly refresh of the County Board District card's roster, generated by \`wi/scripts/wi_county_board_scraper.py\` + \`build_wi_county_board_roster.py\` from each county's own board page (Kenosha's from the Clerk's own Directory of Public Officials, fetched and witnessed against that county's board page; Taylor's carried from a dated document, and its records say so). Please review the diff before merging — this changes data about real officeholders. A county missing from the diff means its page failed the scraper's count guard and was skipped; that is a page to re-read, not a flake. A \`wi-county-officers.json\` change beside it is the county card's board chair following this roster (the builder's chair reconciliation — supersede/confirm/withhold, decisions on the build log)." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
