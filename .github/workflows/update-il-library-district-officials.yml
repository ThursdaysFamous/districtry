name: Update statewide library district officials

# Weekly refresh of il/data/app/il-library-district-officials.json — the board,
# the appointed officers and the office of the 197 district-governed public
# libraries that file, joined onto the statewide library layer's polygons by
# library name in il/index.html.
#
# One job covers 72 counties. The statewide layer clips each library's service
# area to the county, so a district spanning counties draws a card in every
# county it touches while filing one Annual Financial Report, under its home
# county. Matching each card against its own county's units resolves 124 of the
# 371 district cards; indexed statewide instead, 197 filings stamp 339 of them.
#
# The publisher is the library, not the boundary's author. The layer comes from
# the Illinois Broadband Office and carries a library's name, how it is governed
# and no contact of any kind, which is what the statewide-library-officials gap
# recorded: 550 cards naming a library and nobody. Every Illinois unit of local
# government files an AFR with the Comptroller under the Fiscal Responsibility
# Report Card Act, and its Contact Information section names role-holders with
# the title the unit itself filed. The Comptroller is the collector; the library
# is the author.
#
# Only the district class is in scope. A municipal library is covered by its
# city's or village's report and has no unit to look up; a township library files
# as or within a township, and a township library's board is not the township's
# board, so reading a township's filing would name the wrong body. The scraper
# counts both classes out by reason on every run rather than leaving them
# unmatched.
#
# Scheduled clear of the other five AFR jobs, which read the same state site:
# Peoria runs Sunday 21:00, Logan Sunday 22:00, Woodford Monday 22:00, Grundy
# Friday 22:00 and Kankakee Saturday 22:00. All six pace themselves at one
# request a second and none should be competing with another for it. This is the
# longest of the six by an order of magnitude, so it takes the one hour no other
# job in the fleet occupies, nine hours ahead of Peoria's.
#
# The job is slow on purpose. It indexes all 102 Illinois counties, not the 72
# the layer draws: 180 of the 339 stamped cards carry a library filing in another
# county, and sixteen of those filing counties are outside the 72, seven of them
# counties the app does not serve at all. Indexing fewer loses exactly those. The
# list held 101 on its first run, missing St. Clair, and reported 17 of that
# county's 19 cards as libraries filed under no name anywhere in Illinois;
# unit_index now compares the list's length to 102. Then two pages per library:
# the landing page for the fiscal year that library last filed for, then the
# contact block for that year. An empty fiscal year returns a page with no
# contact block at all, and a hardcoded one silently skips a library that is a
# year behind, so the year is asked for rather than assumed. Roughly 480 paced
# requests. A partial index is the failure this scraper must never ship: a county
# missing from it unresolves every library filed there, which reads on the card
# exactly like a library that files nothing, so each county is retried and the run
# is abandoned rather than completed short.
#
# A library that stops filing is a real event, not a parse failure, and the
# builder's floors sit under the measured 197 rather than at it so one late
# filing cannot freeze the other 196. The builder also re-measures the card count
# against the shipped boundary files rather than trusting the scraper's
# arithmetic, because a library renamed in the boundary layer costs its cards and
# no key at all.

on:
  schedule:
    # Sunday 12:00 UTC — an hour ahead of the 13:00 roster wave and nine ahead
    # of the first AFR job, in the one hour band no weekly job uses.
    - cron: "0 12 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI (a PR opened with the default GITHUB_TOKEN fires no workflows).
      # Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Read each library's own AFR contact filing
        run: |
          python3 scripts/il_library_district_officials_scraper.py \
            --out /tmp/il_library_district_officials_raw.json

      - name: Rebuild roster data file
        run: |
          python3 scripts/build_il_library_district_officials.py \
            /tmp/il_library_district_officials_raw.json

      # Gate the regenerated data before it can reach a PR.
      - name: Validate app + data files
        run: |
          python3 scripts/build_il_library_district_officials.py \
            /tmp/il_library_district_officials_raw.json --check
          python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR.
          branch="bot/il-library-district-officials-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with — a workflow-scope refusal otherwise when main
          # moves mid-run.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          git add il/data/app/il-library-district-officials.json
          git commit -m "Update statewide library district officials"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update statewide library district officials" \
              --body "Automated weekly refresh of the officers, office and contact details of the 197 District-governed Illinois public libraries that file, covering 339 cards across 72 counties, generated by \`scripts/il_library_district_officials_scraper.py\` + \`scripts/build_il_library_district_officials.py\`. Each library's own Annual Financial Report filing with the Illinois Comptroller is the source, and every record names the fiscal year it was filed for and the county it files in. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
