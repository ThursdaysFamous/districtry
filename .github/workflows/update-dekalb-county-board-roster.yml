name: Update DeKalb County Board roster

# Weekly refresh of the DeKalb County Board District card's member roster
# (il/data/app/dekalb-county-board-members.json, fetched by index.html).
# Re-scrapes the county's own members page (district, name, party, phone,
# @dekalbcounty.org email) plus its chairperson table, and, if anything changed,
# opens a PR rather than committing directly to main — officeholder data should
# get a human look before it ships.
#
# WHY THIS EXISTS WHEN THE BOUNDARY GIS CARRIES OFFICEHOLDERS.
# DeKalb's District_AreaEffective2022 service declares Member1/Member2 with
# their own phone and e-mail columns. Measured, both phone columns are populated
# on 0 of 12 districts and Member2_EMail on 10 of 12, while this page carries
# party, term, 22 phones and 24 e-mails. The GIS supplies geometry; the roster
# supplies the people.
#
# Only the ROSTER is on a cron. The boundary is live from the county's ArcGIS
# Online org on every card render, so there is nothing to rebuild for it.

on:
  schedule:
    - cron: "0 14 * * 5" # Friday 14:00 UTC (staggered from CCBR at Fri 13:00)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # FULL history, because this job regenerates sitemap.xml and
          # build_sitemap.py reads each page's lastmod from that file's own last
          # commit. Under the default depth-1 checkout git reports the single
          # fetched commit as the last commit of EVERY file, so every one of the
          # 243 entries takes today's date. Measured 2026-09-19 by building the
          # sitemap in a depth-1 clone: 243 of 243 lastmods moved, against 0 in a
          # full clone, where `build_sitemap.py --check` passes. A bot run on
          # 2026-09-17 shipped 241 wrong dates this way.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # The members page is static, server-rendered WordPress — no JS is
        # needed to READ it. The browser is here for the edge, not the markup:
        # dekalbcounty.org answers with SiteGround's SG-Captcha stub (HTTP 202)
        # scored on the CALLER'S IP, and a runner address draws the stub far
        # harder than a residential one — the first scheduled run took it on all
        # six retries and failed. So this job runs the scraper's
        # requests -> playwright -> wayback ladder, same as McHenry and Kendall.
        run: pip install -c scripts/requirements.txt requests playwright

      - name: Install Chromium for Playwright
        run: python3 -m playwright install --with-deps chromium

      - name: Scrape DeKalb County Board member roster
        id: scrape
        # --engine auto walks the ladder and prints which rung carried each
        # fetch, so the run log records reachability per run rather than needing
        # a separate probe. That turned out to matter, because the question
        # "is this county blocked from CI" has no yes/no answer. Four runs on
        # 2026-08-02 + 07-31, same commit, four runner addresses: three took the
        # stub on all six attempts (one of them also held 24s on the
        # interstitial under a real Chromium, with the Archive 144 days stale),
        # and the fourth was carried by plain requests on its FIRST try in 0.9s.
        #
        # dekalbcounty.org's SG-Captcha scores the CALLER'S ADDRESS, and GitHub
        # hands out runners from a pool, so a failure here is address luck, not
        # a source change. Hence continue-on-error + a standing issue: a job
        # that loses a coin toss should not go red, and the weekly cadence
        # covers it — a scored week is followed by one that may not be. A run
        # that clears simply opens its PR as usual; nothing needs resuming.
        continue-on-error: true
        run: python3 scripts/dekalb_county_board_scraper.py /tmp/dekalb_county_board_raw.json --engine auto

      - name: Report blocked source on the standing issue
        if: steps.scrape.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="DeKalb County Board roster: refresh blocked on some runner addresses"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          num=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)
          if [ -z "$num" ]; then
            gh issue create --title "$title" --body "This week's roster scrape failed on every engine (direct requests, headless Chromium, and the Internet Archive). **This is expected to happen some weeks and not others, and it does not mean the source changed.** dekalbcounty.org serves SiteGround's SG-Captcha, which scores the CALLER'S ADDRESS (\`y=ipr:<address>\` in its own redirect) rather than sampling requests, and GitHub hands out runners from a pool — measured 2026-08-02 across four runs on one commit, three runner addresses were refused and one was carried by plain requests on its first try. So a failed run is address luck; the next scheduled run may well succeed on its own and open its PR as usual. The shipped il/data/app/dekalb-county-board-members.json keeps its last verified state (confirmed current against the live source on 2026-08-02, from CI) and stays correct until the county changes members. Act on this issue only if it keeps recurring across many weeks or an election/appointment has happened — then re-run the scraper from any host that clears the edge and refresh via scripts/build_dekalb_county_board_roster.py. Close it once runs are landing reliably. Latest failed run: $run_url"
          else
            gh issue comment "$num" --body "Refused again on $(date -u +%F) — $run_url (address luck; see the issue body)"
          fi

      - name: Rebuild roster data file
        if: steps.scrape.outcome == 'success'
        run: python3 scripts/build_dekalb_county_board_roster.py /tmp/dekalb_county_board_raw.json

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present and
      # well formed.
      - name: Validate app + data files
        if: steps.scrape.outcome == 'success'
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        if: steps.scrape.outcome == 'success'
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.scrape.outcome == 'success' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/dekalb-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          # Full history, for the same reason as fetch-depth: 0 above. `git fetch
          # --depth=1` RE-SHALLOWS a clone that was fetched complete (measured:
          # 512 commits down to 13), so the two have to move together — deepening
          # the checkout alone would be undone here.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          # docs/EAM_STATUS.md counts the districts this roster names, so a
          # county gaining or losing a member moves it and the smoke gate's
          # `build_eam_status.py --check` fails on this PR. See that script's
          # check_workflows(), which is what names this job.
          python3 scripts/build_eam_status.py
          git add il/data/app/dekalb-county-board-members.json il/county-board il/county-board.html about.html sitemap.xml docs/EAM_STATUS.md
          git commit -m "Update DeKalb County Board roster from dekalbcounty.org"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update DeKalb County Board roster from dekalbcounty.org" \
              --body "Automated weekly refresh of the DeKalb County Board District card's member roster (district, name, party, phone, published email, Board Chair role), generated by \`scripts/dekalb_county_board_scraper.py\` + \`scripts/build_dekalb_county_board_roster.py\`. Please review the diff before merging — this changes data about real officeholders. Two members publish no phone; that is the source, not a scrape failure. The Board Chair role is applied only on an unambiguous single name match against the county's chairperson table, so a chair row that disappears means the match stopped resolving and is worth checking." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
