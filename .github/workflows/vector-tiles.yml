name: Vector tiles

# Holds the vector-tile archives to the files they come from
# (docs/OPTIMIZATION_PLAYBOOK.md §10, phases 3-5): the archives the apps SHIP
# under <tag>/data/app/tiles/ against today's files, the app's own tile reader
# against the Python decoders, a fresh build of every layer a change touches,
# and every tiled layer's CARD against the card its whole file gives.
#
# ITS OWN WORKFLOW, NOT A STEP IN smoke-test.yml, because of what it costs.
# Building and gating the whole fleet took 3 min 25 s four at a time and 11
# minutes one at a time (2026-09-27, one sandbox), plus the apt install, and
# the smoke job runs on every pull request, most of which touch no boundary
# file. So this runs only when a boundary file, the probe's
# record of which files each layer draws, or the builder itself changes, beside
# the smoke job rather than inside it, and --changed-since builds only the
# layers drawing a changed file (all of them when the builder, its pins or
# layer-sources.json change).

on:
  pull_request:
    paths:
      - "*/data/app/*.json"
      - "*/data/app/tiles/**"
      - "layer-sources.json"
      - "tiger-mirror.json"
      - "scripts/mirror_tiger_tiles.py"
      - "engine/index.html/vector-tiles.txt"
      - "scripts/build_vector_tiles.py"
      - "scripts/validate_vector_tiles.py"
      - "scripts/requirements.txt"
      - "scripts/probe_tile_cards.mjs"
      # a card is the layer's own query code: an app or engine change can
      # alter what a tiled layer's card says without touching any boundary
      - "*/index.html"
      - "engine/**"
      - ".github/workflows/vector-tiles.yml"
  workflow_dispatch: {}

# the same pin smoke-test.yml carries, so the cache key and the install agree
env:
  PLAYWRIGHT_VERSION: "1.56.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # tippecanoe builds the archives; apt's is 2.49, the version the gate
      # was measured with
      - name: Install tippecanoe and the tile readers
        run: |
          # the runner image's Google Chrome apt source is unused here and once
          # served a Packages file whose hash did not match its own Release
          # file, failing every apt-get update (smoke-test.yml records it)
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
               \( -name '*.list' -o -name '*.sources' \) \
               -exec grep -q 'dl\.google\.com' {} \; -print -delete 2>/dev/null || true
          sudo apt-get update -q
          sudo apt-get install -y -q tippecanoe
          tippecanoe --version
          pip install -c scripts/requirements.txt shapely numpy mapbox-vector-tile pmtiles

      # the app's own reader (engine/index.html/vector-tiles.txt) runs in Node
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The archives the apps SHIP, held to today's files: a boundary file
      # changed without rebuilding its archive leaves the app drawing and
      # answering from the old districts. No tippecanoe needed.
      - name: Every shipped archive answers as its file does today
        run: python3 scripts/build_vector_tiles.py --committed

      # The archives mirrored from Census TIGERweb (phase 6) ship no file to be
      # held to; they are held to the record of what was fetched and built,
      # and to the app's own loader call, so the archive cannot come to hold
      # a different layer or fields from the ones the card reads. Offline.
      - name: Every mirrored archive is the one recorded, for the loader the app calls
        run: python3 scripts/mirror_tiger_tiles.py --check

      # The app's own tile reader, run as shipped, against the Python decoders
      - name: The app's tile reader decodes the shipped archives as Python does
        run: python3 scripts/validate_vector_tiles.py

      - name: Every changed layer's archive answers as its file does
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/build_vector_tiles.py --changed-since "origin/${{ github.base_ref }}"
          else
            python3 scripts/build_vector_tiles.py
          fi

      # Every layer drawn from tiles prints the same card from its tiles as
      # from its whole file (scripts/probe_tile_cards.mjs): the archive gates
      # above prove the tile holds the file's districts, and only the app's
      # own query code can say what a card makes of them.
      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.PLAYWRIGHT_VERSION }}-${{ runner.os }}

      - name: Install Playwright + Chromium
        timeout-minutes: 15
        run: |
          npm install "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install-deps chromium
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install chromium
          fi

      - name: Every tiled layer's card matches its card from the whole file
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          BASE_URL=http://localhost:8000 node scripts/probe_tile_cards.mjs
