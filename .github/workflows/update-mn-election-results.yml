# Daily refresh of Minnesota's precinct-by-precinct election results, read
# from the Secretary of State's results files
# (https://electionresultsfiles.sos.mn.gov/<YYYYMMDD>/: allracesbyprecinct.txt,
# localPrct.txt and pctstats.txt) by mn/scripts/mn_election_results_scraper.py
# and written to mn/data/app/election-results.json plus one
# mn/data/app/election-results/c<county FIPS>-<n>.json per run of up to 60 of a
# county's precincts by mn/scripts/build_mn_election_results.py.
#
# DAILY UNTIL CERTIFIED, the rule Adam set for Chicago on 2026-11-05: county
# canvassing boards check every precinct's count and the State Canvassing
# Board certifies the results on the third Tuesday after the election (24
# November 2026), so the numbers can move until then and a reader should see
# each day's count after it has been looked at. Once the shipped file says
# certified, the job reads nothing and changes nothing.
#
# CERTIFYING: when the State Canvassing Board certifies the results, run this
# workflow by hand with `certified` set to that date. The PR it opens says
# certified, and the map and the card stop saying unofficial.
#
# A PR ONLY WHEN A NUMBER MOVED: every read stamps the time it was read, so the
# change check compares the files with that stamp taken out.

name: Update Minnesota election results

on:
  schedule:
    - cron: "50 12 * * *"
  workflow_dispatch:
    inputs:
      certified:
        description: "The date the State Canvassing Board certified the results (YYYY-MM-DD); leave empty for an unofficial read"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Skip a file that is already certified
        id: state
        env:
          CERTIFIED: ${{ github.event.inputs.certified }}
        run: |
          shipped=$(python3 -c "import json;print('yes' if json.load(open('mn/data/app/election-results.json')).get('certified') else 'no')")
          if [ "$shipped" = "yes" ] && [ -z "$CERTIFIED" ]; then
            echo "The shipped results are certified; nothing to refresh."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the Secretary of State's results files
        if: steps.state.outputs.run == 'true'
        run: |
          election=$(python3 -c "import json;print(json.load(open('mn/data/app/election-results.json'))['source'].rstrip('/').rsplit('/',1)[1])")
          python3 mn/scripts/mn_election_results_scraper.py --election "$election" -o /tmp/mn_results_raw.json

      - name: Rebuild the results files
        if: steps.state.outputs.run == 'true'
        env:
          CERTIFIED: ${{ github.event.inputs.certified }}
        run: |
          date=$(python3 -c "import json;print(json.load(open('mn/data/app/election-results.json'))['electionDate'])")
          if [ -n "$CERTIFIED" ]; then
            python3 mn/scripts/build_mn_election_results.py /tmp/mn_results_raw.json --election-date "$date" --certified "$CERTIFIED"
          else
            python3 mn/scripts/build_mn_election_results.py /tmp/mn_results_raw.json --election-date "$date"
          fi

      - name: Validate app + data files
        run: python3 mn/scripts/validate_index.py mn/index.html

      - name: Check for changes other than the reading time
        id: diff
        run: |
          changed=$(python3 - <<'PY'
          import json, os, subprocess
          def strip(text):
              d = json.loads(text)
              d.pop("read", None)
              return d
          def shipped(path):
              r = subprocess.run(["git", "show", "HEAD:" + path], capture_output=True, text=True)
              return r.stdout if r.returncode == 0 else None
          paths = ["mn/data/app/election-results.json"]
          parts = "mn/data/app/election-results"
          paths += [os.path.join(parts, n) for n in sorted(os.listdir(parts))]
          old = subprocess.run(["git", "ls-tree", "--name-only", "HEAD", parts + "/"],
                               capture_output=True, text=True).stdout.split()
          moved = set(old) != set(paths[1:])
          for p in paths:
              before = shipped(p)
              if before is None or strip(before) != strip(open(p).read()):
                  moved = True
          print("true" if moved else "false")
          PY
          )
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "changed: $changed"

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/mn-election-results-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # The results pages read this file, so they are rebuilt on main's tip
          # with it and ride in the same pull request, with the sitemap whose
          # dates they move (scripts/build_results_pages.py fails a results
          # workflow that skips this).
          python3 scripts/build_results_pages.py
          python3 scripts/build_sitemap.py
          git add -A mn/data/app/election-results.json mn/data/app/election-results mn/election-results.html mn/county-commissioner sitemap.xml
          git commit -m "Update Minnesota election results from the Secretary of State"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Minnesota election results from the Secretary of State" \
              --body "Automated daily refresh of Minnesota's precinct results, generated by \`mn/scripts/mn_election_results_scraper.py\` + \`mn/scripts/build_mn_election_results.py\` from the Secretary of State's results files. Please review the diff before merging: it changes the numbers and colours the map shows. Until the file says certified, the map and every card say these are unofficial results that will change. The build fails if a precinct's votes stop adding up to the office total the file prints, or the results stop naming the 4,105 precincts the map draws." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
