name: Update at-large county board rosters

# Weekly refresh of il/data/app/il-county-commissioners.json — the boards of
# counties that elect their members AT LARGE, rendered on the COUNTY card.
#
# These counties — Monroe and Randolph (commission form, three commissioners
# each), the pass-7 at-large tier of Pike (9), Brown (7), Calhoun (5) and
# Putnam (5) — have no district geometry, so they are not county-board dispatch
# entries; their members represent every resident of the county, which is what
# the county card answers
# (docs/EXPANSION_GUIDE.md §1.5). Adding a county here adds rows, not a layer.
#
# If anything changed it opens a PR rather than committing to main:
# officeholder data should get a human look before it ships.

on:
  schedule:
    - cron: "0 16 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI (a PR opened with the default GITHUB_TOKEN fires no workflows).
      # Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # Plain server-rendered HTML, plus certifi: Gallatin's site omits its TLS
        # intermediate, so the scraper chases the issuer the certificate itself
        # names and verifies against certifi's roots plus that one certificate
        # (the same posture the Coles workflow needs, for the same reason).
        # pymupdf reads the CERTIFIED CANVASSES two of these counties are
        # sourced from: Union and Williamson both sit behind an sgcaptcha
        # gate, so their rosters come from PDF election returns rather than
        # from a page (scripts/platinum_canvass.py).
        run: pip install -c scripts/requirements.txt requests certifi pymupdf

      - name: Scrape roster
        run: python3 scripts/il_county_commissioners_scraper.py /tmp/raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_county_commissioners.py /tmp/raw.json

      # Gate the regenerated data before it can reach a PR.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR.
          branch="bot/county-commissioners-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add il/data/app/il-county-commissioners.json il/county-board il/county-board.html about.html sitemap.xml
          git commit -m "Update at-large county board rosters"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update at-large county board rosters" \
              --body "Automated weekly refresh of the at-large county boards shown on the County card (Monroe 3, Randolph 3, Pike 9, Brown 7, Calhoun 5, Putnam 5, Schuyler 7 — every one elected countywide), generated by \`scripts/il_county_commissioners_scraper.py\` + \`scripts/build_county_commissioners.py\`. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
