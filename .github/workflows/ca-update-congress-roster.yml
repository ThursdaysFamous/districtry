name: Update U.S. House (CA) roster

# Weekly refresh of the congress card's roster
# (ca/data/app/congress-roster.json, fetched by ca/index.html). Rebuilds CA's U.S.
# House reps from unitedstates/congress-legislators and, if anything changed,
# opens a PR rather than committing directly to main — officeholder data should
# get a human look before it ships.
#
# THE `ca-` PREFIX IS LOAD-BEARING. GitHub Actions reads workflows only from
# the repository ROOT's .github/workflows, so this file has to live here to run
# at all — and at the root it shares a namespace with the other two instances.
# Five basenames collided when the forks were imported as folders
# (deploy-pages, smoke-test, engine-bump, update-congress-roster,
# validate-sources), and a collision is worse than a duplicate: the root copy
# wins, so SF's refresh would look present and quietly run Chicago's.
# Every path below is instance-scoped for the same reason — `ca/scripts/…`,
# `ca/data/app/…`, and a `bot/ca-…` branch that cannot clash with
# another instance's PR branch.

on:
  schedule:
    - cron: "0 13 * * 1" # Monday 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every bot PR with
      # zero checks. Both halves matter: the create fires `pull_request`, and
      # the force-push onto the fixed bot/* branch fires `synchronize`. Falls
      # back to github.token when the secret is absent, so the workflow still
      # runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # No third-party deps: the builder downloads the canonical
      # legislators-current.json with stdlib urllib and filters it to CA.
      - name: Rebuild congress roster data file
        run: python3 ca/scripts/build_congress_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every ca/data/app file must be present
      # and well formed. node is preinstalled on ubuntu-latest.
      - name: Validate app + data files
        run: python3 ca/scripts/validate_index.py ca/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- ca/data/app/congress-roster.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/ca-congress-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          # The legislator page carries a GENERATED table of every member in
          # this roster, so regenerate it here or the smoke gate's
          # `build_officeholder_tables.py --check` fails on this PR with a
          # table naming last week's members. The sitemap follows, because that
          # page is in it and its lastmod is the file's own last commit.
          python3 scripts/build_officeholder_tables.py
          python3 scripts/build_sitemap.py
          git add ca/data/app/congress-roster.json ca/congress.html sitemap.xml
          git commit -m "Update U.S. House (CA) roster from congress-legislators"
          git push -u origin "$branch" --force
          # Only open a PR if one isn't already open for this branch; if it is,
          # the force-push above already updated it.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update U.S. House (CA) roster from congress-legislators" \
              --body "Automated weekly refresh of the congress district card's roster, generated by \`ca/scripts/build_congress_roster.py\` from unitedstates/congress-legislators. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
