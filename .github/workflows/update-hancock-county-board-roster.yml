name: Update Hancock County Board roster

# Weekly refresh of the Hancock County Board District card's member roster
# (il/data/app/hancock-county-board-members.json), fetched by index.html.
#
# THE ROSTER comes from the county's own board page,
# hancockcounty-il.gov/county-board-members/ — fifteen members across five
# districts, three each, with a party letter apiece. That is ALL the county
# publishes: no e-mail, no phone, no term, and no chairman is named anywhere,
# so no row is badged one and there is no contact floor to set.
#
# WHICH IS WHY THE COUNT IS THE GUARD. With no field to watch for emptying,
# a page reshape shows up only as a wrong NUMBER of members, so the builder
# refuses anything but 5 districts of exactly 3.
#
# TWO PARSER TRAPS ARE BAKED IN, both paid for during the build.
#   (a) The page's <meta name="description"> REPEATS District One's three
#       members verbatim. Anchoring on the first "District One" in the document
#       parses the meta tag rather than the body, and ships three members as a
#       whole county board. The body is found by scanning for the LAST
#       occurrence instead.
#   (b) The last district has no following <h2> to bound it. An unbounded
#       region runs to the end of the document and swallows the site's footer
#       navigation as members — District Five parsed 35 "members" that way,
#       most of them menu links. Each district is bounded to its own first
#       <ul>, and a per-district ceiling fails the run loudly if that stops
#       holding.
#
# NOTE ON THE GEOMETRY, which this run does NOT re-read. Hancock's districts
# are the dissolve of Census 2020 voting districts per the per-precinct County
# Board contests in the county's own results database
# (electionstats.hancockcounty-il.gov, see scripts/build_hancock_boundaries.py).
# That database is a separate surface from the board page and is not re-parsed
# weekly; the board page is. A redistricting would therefore show up here as a
# member count change or not at all, so re-run build_hancock_boundaries.py
# --check by hand if Hancock ever reapportions.
#
# If anything changed, this opens a PR rather than committing to main:
# officeholder data gets a human look before it ships.

on:
  schedule:
    - cron: "0 20 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # The board page is static HTML and the builder imports nothing heavy,
        # so requests alone is enough here.
        run: pip install -c scripts/requirements.txt requests

      - name: Scrape the board page
        run: python3 scripts/hancock_county_board_scraper.py /tmp/hancock_board_raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_hancock_county_board.py /tmp/hancock_board_raw.json

      # Gate the regenerated data before it can reach a PR.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR.
          branch="bot/hancock-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add il/data/app/hancock-county-board-members.json il/county-board il/county-board.html about.html sitemap.xml
          git commit -m "Update Hancock County Board roster from hancockcounty-il.gov"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Hancock County Board roster from hancockcounty-il.gov" \
              --body "Automated weekly refresh of the Hancock County Board District card's member roster, generated by \`scripts/hancock_county_board_scraper.py\` + \`scripts/build_hancock_county_board.py\`. Please review the diff before merging — this changes data about real officeholders. The county publishes only a name and a party per member, so the member COUNT is the only drift guard: the builder refuses anything but five districts of exactly three." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
