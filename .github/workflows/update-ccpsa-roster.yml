name: Update CCPSA District Council roster

# Weekly refresh of the CCPSA District Council card's elected-Councilor roster
# (il/data/app/ccpsa-district-councils.json, fetched by index.html). Re-scrapes
# ccpsa.chicago.gov's per-council pages and, if anything changed, opens a PR
# rather than committing directly to main — officeholder data should get a
# human look before it ships.

on:
  schedule:
    - cron: "0 13 * * 3" # Wednesday 13:00 UTC (staggered from the Monday ILGA / Tuesday CPD jobs)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # FULL history, because this job now regenerates sitemap.xml and
          # build_sitemap.py reads each page's lastmod from that file's own last
          # commit. Under the default depth-1 checkout git reports the single
          # fetched commit as the last commit of EVERY file, so every entry takes
          # today's date and `build_sitemap.py --check` passes on it anyway — the
          # measurement and the reasoning are in update-wi-circuit-court-roster.yml.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # Version-pinned via scripts/requirements.txt (constraints), but only the
        # two packages this job needs — ccpsa.chicago.gov is not Cloudflare-fronted,
        # so no Playwright/Chromium (that's CPD-only).
        run: pip install -c scripts/requirements.txt requests beautifulsoup4

      - name: Scrape CCPSA district-council Councilor rosters
        run: python3 scripts/ccpsa_scraper.py --out /tmp/ccpsa_district_councils.json

      - name: Rebuild roster data file
        run: python3 scripts/build_ccpsa_roster.py /tmp/ccpsa_district_councils.json

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present
      # and well formed. node is preinstalled on ubuntu-latest.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/ccpsa-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          # NOT depth-limited: a shallow fetch here would re-shallow the clone
          # the checkout above deepened, and the sitemap this job writes would
          # date every page today.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # REGENERATED HERE, AFTER THE CUT, AND NOT BEFORE IT. il/police-district.html
          # carries the District Council table, which is read off the roster this job
          # just rewrote, so it must be rebuilt in the same run or the smoke gate fails
          # on this job's own pull request. Building before the cut leaves shared files
          # dirty, where `git checkout -B` refuses to move onto main's new tip — the
          # failure that killed run 35391214303 on 2026-09-18.
          python3 scripts/build_officeholder_tables.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add il/data/app/ccpsa-district-councils.json il/police-district.html about.html sitemap.xml
          git commit -m "Update CCPSA District Council roster from ccpsa.chicago.gov"
          git push -u origin "$branch" --force
          # Only open a PR if one isn't already open for this branch; if it is,
          # the force-push above already updated it.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update CCPSA District Council roster from ccpsa.chicago.gov" \
              --body "Automated weekly refresh of the CCPSA District Council cards' elected-Councilor roster, generated by \`scripts/ccpsa_scraper.py\` + \`scripts/build_ccpsa_roster.py\` from ccpsa.chicago.gov's per-council pages. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
