name: Update Mercer County Board roster

# Weekly refresh of the Mercer County Board District card's member roster
# (il/data/app/mercer-county-board-members.json), fetched by index.html.
#
# TWO JOBS IN ONE RUN, and the second is the important one.
#
# 1. THE ROSTER comes from the county's own board page. It prints a plain three-column table — district, "<name> (<party>) <home town>", term-expiry — ten members, two per district, 10/10 with both party and term, the Chairman badged with his phone. Home TOWNS ship (they are how the county says who represents where); if that column ever starts printing a street address the scraper FAILS rather than shipping it.
#
# 2. THE REDISTRICTING TRIPWIRE. Mercer's board districts are the DISSOLVE of
#    its voting precincts — the Census 2020 VTDs, which still carry the county's
#    own 24 precinct names 24/24 (scripts/build_mercer_boundaries.py) — so the
#    shipped boundary is correct only while the county's election authority keeps
#    tabulating the same precincts in the same districts. The same run re-reads
#    that composition from the Clerk's live results feed at il-mercer.pollresults.net
#    and FAILS if it stops matching. A red run here means the county
#    re-precincted or redistricted and a human must re-measure against the census
#    fabric before this county ships again — the alarm working, not breakage.
#
#    The check is PARTIAL by construction and the run says so: the feed carries
#    only the most recent election, so a week covers whichever districts were on
#    that ballot. All five districts happened to be on the 2026 primary ballot; a future run may cover fewer, and it names the ones it could not check. That matters more here than most — the county's only map is a 2021 scan, so nothing else would ever show the districts moving.
#
# If anything changed, this opens a PR rather than committing to main:
# officeholder data gets a human look before it ships.

on:
  schedule:
    - cron: "0 20 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # Both surfaces are static server-rendered HTML, so requests plus the
        # stdlib re module reach them. The builder imports only CONSTANTS from
        # build_mercer_boundaries.py, whose geometry stack is function-local
        # (the De Witt seam), so no shapely here.
        run: pip install -c scripts/requirements.txt requests

      - name: Scrape the board page and re-read the district composition
        run: python3 scripts/mercer_county_board_scraper.py -o /tmp/mercer_board_raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_mercer_county_board.py /tmp/mercer_board_raw.json

      # Gate the regenerated data before it can reach a PR.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR.
          branch="bot/mercer-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          # The 73 per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_sitemap.py
          git add il/data/app/mercer-county-board-members.json il/county-board il/county-board.html sitemap.xml
          git commit -m "Update Mercer County Board roster from mercercountyil.org"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Mercer County Board roster from mercercountyil.org" \
              --body "Automated weekly refresh of the Mercer County Board District card's member roster, generated by \`scripts/mercer_county_board_scraper.py\` + \`scripts/build_mercer_county_board.py\`. Please review the diff before merging — this changes data about real officeholders. The same run re-reads the district composition from the Clerk's certified results feed and fails if it stops matching the shipped dissolve; that failure would mean the county re-precincted or redistricted, and the geometry must be re-measured before it ships again." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
