name: Update South Carolina county councils

# Weekly refresh of the South Carolina county council card's names
# (sc/data/app/sc-county-council-members.json, fetched by sc/index.html). Each
# name is the winner of that seat's most recent certified election in the State
# Election Commission's results, dated to that election, rebuilt by
# sc/scripts/build_sc_county_council_roster.py. If anything changed it opens a
# PR rather than committing directly to main — officeholder data gets a look
# before it ships. A new election reaches this file once it is CANVASS_DAYS
# old, so the 3 November 2026 general lands here about three weeks after
# election day.
#
# The same run reads each county's own council page and compares the names
# with the certified winners. A page that cannot be read, or names none of the
# winners, is printed and does not fail. A county page naming somebody else for
# a seat FAILS the run unless the difference is already recorded in
# COUNTY_SAYS, because that is the state a person has to read.
#
# It also WATCHES the council district map
# (sc/data/app/sc-county-council-districts.json), which no job rewrites: a new
# council map changes which seat a certified winner holds, so a person rebuilds
# it. The watch compares the state's live layer with the fingerprint recorded
# when the shipped file was built and opens or updates one tracking issue when
# they differ, staying green — the validate-sources pattern.
#
# THE RESULTS SITE TURNS GITHUB'S RUNNERS AWAY (measured 2026-10-11: its
# robots.txt answers HTTP 202, an access control, on 2 of 2 runs, while it serves
# the build sandbox normally), so this job often cannot rebuild. The builder then
# keeps the shipped roster unchanged, still reads every county page against it,
# and exits 75; the rebuild step reports that on one tracking issue and stays
# green. It turns RED once a new election's results have been out CANVASS_DAYS
# and nobody has read them, because from then on the names are owed a refresh —
# see `owed()` in the builder and sc/WATCH.md.
#
# SOUTH CAROLINA IS DARK, so this job regenerates no county page:
# scripts/build_county_pages.py records this roster in NOT_COUNTY_BOARDS until
# go-live adds its adapter. Go-live adds the county-page steps here in the same
# change — sc/WATCH.md has the list.

on:
  schedule:
    - cron: "7 17 * * 3" # Wednesday 17:07 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR runs CI; see
      # update-sc-legislature-roster.yml for why.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # requests is for the district-map watch only; the roster builder reads
      # with the standard library, because one county page refuses the
      # requests stack and serves the standard library (measured 2026-10-11).
      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Watch the council district map
        id: watch
        # A changed map is an expected, non-fatal state that feeds the tracking
        # issue below, and so is an unreachable layer; neither should stop the
        # roster refresh.
        continue-on-error: true
        run: |
          set +e
          out="$(python3 sc/scripts/build_sc_county_council_districts.py --watch 2>&1)"
          code=$?
          echo "$out"
          {
            echo "report<<REPORT_EOF"
            echo "$out"
            echo "REPORT_EOF"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"
          exit 0

      # Asks the six elections from the 2022 general on (about 300 requests,
      # paced half a second apart), then reads the 46 county pages. Exit 75 is
      # the results site refusing or unreadable with nothing owed yet: the shipped
      # roster is kept and the county pages were still read against it.
      - name: Rebuild county council roster
        id: rebuild
        run: |
          set +e
          python3 sc/scripts/build_sc_county_council_roster.py 2>&1 | tee rebuild.log
          code=${PIPESTATUS[0]}
          if [ "$code" = 75 ]; then
            echo "unreadable=true" >> "$GITHUB_OUTPUT"
            echo "::warning::The results site could not be read; the shipped roster was kept and the county pages were read against it."
            exit 0
          fi
          exit "$code"

      - name: Validate app + data files
        run: |
          python3 sc/scripts/build_sc_county_council_roster.py --check
          python3 sc/scripts/build_sc_county_council_districts.py --check
          python3 sc/scripts/validate_index.py sc/index.html

      - name: Open or update the district-map issue
        if: steps.watch.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.watch.outputs.report }}
        run: |
          title="South Carolina county council map changed — rebuild needed"
          {
            echo "_Automated by \`.github/workflows/update-sc-county-council-roster.yml\` on $(date -u +%Y-%m-%d). Nothing was changed in the app._"
            echo
            echo "The state's county council district layer no longer matches what \`sc/data/app/sc-county-council-districts.json\` was built from, or could not be read. A county may have redistricted, or the state re-published its layer."
            echo
            echo '```'
            echo "$REPORT"
            echo '```'
            echo
            echo "**To clear this issue:**"
            echo "1. Run \`python3 sc/scripts/build_sc_county_council_districts.py\` and read which counties changed."
            echo "2. If a county's districts changed, check that each certified winner in \`sc/data/app/sc-county-council-members.json\` still holds the seat it is listed under, and rebuild that file."
            echo "3. Bump \`sw.cache_name\` in \`sc/metro-worksheet.json\` and run \`python3 scripts/generate_metro_files.py\`, because the district file is served cache-first."
            echo
            echo "If the report says the layer could not be read, re-run this workflow before acting: one failed read is not a change."
          } > issue-body.md

          existing="$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file issue-body.md
            gh issue comment "$existing" --body "Refreshed by the weekly South Carolina council map watch — see the updated issue body."
            echo "Updated existing issue #$existing."
          else
            gh issue create --title "$title" --body-file issue-body.md
            echo "Opened a new tracking issue."
          fi

      - name: Report the unreadable results site
        if: steps.rebuild.outputs.unreadable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="South Carolina results site refused the weekly council job"
          {
            echo "_Automated by \`.github/workflows/update-sc-county-council-roster.yml\` on $(date -u +%Y-%m-%d). Nothing was changed in the app._"
            echo
            echo "The State Election Commission's results site could not be read from GitHub's runner, so the county council names were not rebuilt from the certified results. The shipped names were kept, and every county page that could be read was checked against them."
            echo
            echo "This run stays green while no new election is owed. Once a general's results have been out for three weeks and nobody has read them, the run turns red and names the election. sc/WATCH.md says what to do then."
            echo
            echo '```'
            grep -E "^(sc-council-roster|robots.txt|  county page|county pages:)" rebuild.log || true
            echo '```'
          } > issue-body.md

          existing="$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file issue-body.md
            echo "Updated existing issue #$existing."
          else
            gh issue create --title "$title" --body-file issue-body.md
            echo "Opened a new tracking issue."
          fi

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- sc/data/app/sc-county-council-members.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/sc-county-council-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut from main's current tip, with full history; the rebuilt file is
          # carried over the checkout as an uncommitted change.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # docs/EAM_STATUS.md reads this roster through build_county_pages'
          # sc_councils adapter, so a county gaining or losing a member can
          # move it; while South Carolina is dark the report does not score
          # it, and the regenerate is a no-op until go-live.
          python3 scripts/build_eam_status.py
          git add sc/data/app/sc-county-council-members.json docs/EAM_STATUS.md
          git commit -m "Update South Carolina county councils from certified election results"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update South Carolina county councils from election results" \
              --body "Automated weekly refresh of the South Carolina county council names, generated by \`sc/scripts/build_sc_county_council_roster.py\` from the State Election Commission's certified results. Each name is the winner of that seat's most recent election and is dated to it. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
