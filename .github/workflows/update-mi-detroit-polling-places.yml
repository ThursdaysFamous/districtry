# Daily refresh of each Detroit precinct's Election Day polling place, read
# from the City of Detroit Department of Elections' own precinct layer
# ("Detroit Election Precincts (Current)", ArcGIS Online item
# ef621ded941a402fa436185541316994) by
# mi/scripts/build_mi_detroit_polling_places.py, which joins it to the state's
# 2026 precinct map, places each building on the map and writes
# mi/data/app/mi-detroit-polling-places.json.
#
# DAILY, NOT WEEKLY, as Chicago's is: a polling place that moves in the last
# week before an election is exactly when a reader needs the change. On
# 2026-10-24 Adam chose to add Detroit's polling places on the same plan as
# Chicago's, checked daily until Election Day, Tuesday 2026-11-03.
#
# THE TRIPWIRES: the build fails unless the city's list and the state's
# precinct map hold exactly the same 402 precinct codes, the shipped boundary
# file holds the same 402 names, and a point inside each drawn precinct lies in
# the city's polygon with the same code. What it cannot see: a building the
# city moves without updating its layer, and an address the Census geocoder
# places on the wrong block of the right street (the card prints the city's
# address either way, and links the state's voter lookup as the final word).
#
# AFTER ELECTION DAY the city may change or retire the layer before the next
# election is set. A failed read then is expected, so the job stays green and
# changes nothing; before or on the shipped election date a failed read fails
# the job.

name: Update Detroit polling places

on:
  schedule:
    - cron: "45 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-polling:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI; falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Stdlib and curl only, like every builder under mi/scripts, so there is
      # no pip line here for scripts/validate_workflow_deps.py to hold it to.
      - name: Read the city's precinct list and rebuild the polling place file
        id: build
        continue-on-error: true
        run: python3 mi/scripts/build_mi_detroit_polling_places.py

      - name: Fail a missed read before Election Day
        if: steps.build.outcome == 'failure'
        run: |
          election=$(python3 -c "import json;print(json.load(open('mi/data/app/mi-detroit-polling-places.json'))['electionDate'])")
          today=$(TZ=America/Detroit date +%F)
          if [[ "$today" > "$election" ]]; then
            echo "The list could not be read, and the shipped election ($election) is past; nothing to refresh."
            git checkout -- mi/data/app/mi-detroit-polling-places.json
          else
            echo "The list could not be read or did not pass its checks on $today, on or before the shipped election date $election."
            exit 1
          fi

      - name: Validate app + data files
        run: python3 mi/scripts/validate_index.py mi/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- mi/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/detroit-polling-places-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          git add mi/data/app/mi-detroit-polling-places.json
          git commit -m "Update Detroit polling places from the Department of Elections' precinct list"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Detroit polling places from the Department of Elections' precinct list" \
              --body "Automated daily refresh of each Detroit precinct's Election Day polling place, generated by \`mi/scripts/build_mi_detroit_polling_places.py\` from the City of Detroit Department of Elections' own precinct layer. Please review the diff before merging — it changes where the map tells voters to go. The build fails if the city's list and the state's precinct map stop naming the same precincts on the same ground." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
