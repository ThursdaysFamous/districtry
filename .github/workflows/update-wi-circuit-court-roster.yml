name: Update WI circuit court roster

# Weekly refresh of Wisconsin's circuit-court bench
# (wi/data/app/wi-circuit-judges.json, read by wi/index.html's Circuit Court
# card). Re-scrapes wicourts.gov's judges table and contact directory and, if
# anything changed, opens a PR rather than committing to main — officeholder
# data should get a human look before it ships.
#
# This run is also the circuit MAP's redistricting tripwire: the scraper
# asserts the county set and the three statutory two-county circuits
# (Wis. Stat. 753.06 — Buffalo/Pepin, Florence/Forest, Menominee/Shawano)
# against what wicourts prints, so a statutory change to the circuit
# composition fails the scrape loudly instead of shipping a roster keyed to
# geometry that no longer matches. When that happens, re-read 753.06 by its
# per-subsection cite URLs (the chapter page lazy-loads and truncates) and
# rebuild the geometry with wi/scripts/build_wi_circuit_courts.py in the same
# change.

on:
  schedule:
    - cron: "30 15 * * 3" # Wednesday 15:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI; falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Stdlib only — wicourts.gov answers plain urllib with no challenge.
      # THE SEVENTH DATA POINT FOR THE CONNECT TIMEOUT (issue #387). Four of
      # the six runs of the two wicourts.gov workflows die inside sock.connect
      # before any HTTP byte leaves the runner — on schedule and on dispatch,
      # across four hours of the day, on both scrapers — so nothing in the
      # request explains it and no longer timeout or extra in-process retry can
      # help (2026-09-12's run spent 2 m 39 s proving that). This prints the
      # runner's egress address and one plain connect probe, so the next
      # failing run says WHICH address could not reach the host instead of
      # leaving "intermittent" as the whole finding. Every call ends in
      # `|| true`: a diagnostic must never be the thing that fails the job.
      # api.ipify.org is an IP echo — it is sent nothing but the request, and
      # the address it returns is the GitHub runner's, not a reader's.
      - name: Probe this runner's route to wicourts.gov
        run: |
          echo -n "runner egress ip: "
          curl -sS --max-time 20 https://api.ipify.org || true
          echo
          curl -sS -o /dev/null --max-time 20 \
            -H 'User-Agent: districtry-wisconsin/1.0 (+https://districtry.com/wi/)' \
            -w 'wicourts.gov http=%{http_code} host_ip=%{remote_ip} connect=%{time_connect}s total=%{time_total}s\n' \
            https://www.wicourts.gov/ || true

      - name: Scrape the wicourts.gov bench and contact directory
        run: python3 wi/scripts/wi_circuit_judges_scraper.py

      # Refuses to write below its floors (exactly 69 circuits, >= 240
      # judges, a courthouse per circuit) and keys the roster by the same
      # circuit keys the shipped geometry carries.
      - name: Rebuild the circuit court roster
        run: python3 wi/scripts/build_wi_circuit_court_roster.py

      # The history page's stat tiles are MEASURED from this data — regenerate
      # it in the same run so the smoke gate's build_history_page --check stays
      # green on this PR (a tile that drifted from the data it counts fails CI)
      - name: Regenerate the history page
        run: python3 scripts/build_history_page.py

      # The history page this job just rewrote is IN the sitemap, and the
      # sitemap's lastmod is that file's own last commit -- so regenerate it in
      # the same run, or the smoke gate's `build_sitemap.py --check` fails on
      # this PR for a date nobody typed. Stdlib only.
      - name: Regenerate the sitemap
        run: python3 scripts/build_sitemap.py

      - name: Validate app + data files
        run: python3 wi/scripts/validate_index.py wi/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- wi/data/app/wi-circuit-judges.json wi/history.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place instead of spawning a duplicate every week.
          branch="bot/wi-circuit-court-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          git add wi/data/app/wi-circuit-judges.json wi/history.html
          git commit -m "Update WI circuit court bench from wicourts.gov"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update WI circuit court bench from wicourts.gov" \
              --body "Automated weekly refresh of the Circuit Court card's bench, generated by \`wi/scripts/wi_circuit_judges_scraper.py\` + \`build_wi_circuit_court_roster.py\` from wicourts.gov's judges table and contact directory. Please review the diff before merging — this changes data about real officeholders. If the run FAILED instead of opening this PR, read the failure: the scraper asserts the statutory circuit composition, so a failure can mean the circuit map itself moved (Wis. Stat. 753.06) and the geometry needs rebuilding in the same change." \
              --base main \
              --head "$branch"
          else
            gh pr comment "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" \
              --body "Refreshed by this week's scheduled run — the branch was force-updated with the latest scrape."
          fi
