name: Update WI Court of Appeals roster

# Weekly refresh of Wisconsin's Court of Appeals bench
# (wi/data/app/wi-court-of-appeals-roster.json, read by wi/index.html's Court
# of Appeals card). Re-scrapes wicourts.gov's contact page — the CONTENT
# blocks, never the judges index's nav menu, which is a stale former-judge
# list (6 of 16 names wrong at research time) — and, if anything changed,
# opens a PR rather than committing to main.
#
# The scrape also asserts the four districts' county lists against the
# statutory composition (Wis. Stat. 752.11, hardcoded once in
# build_wi_court_of_appeals.py), so a redistricting of the appeals map fails
# this run loudly; rebuild the geometry in the same change that updates the
# table. A seat-count drop (4/4/3/5) also fails — a vacancy deserves a human
# read, not a silent ship.

on:
  schedule:
    - cron: "30 16 * * 3" # Wednesday 16:30 UTC (an hour after the circuit run)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # THE SEVENTH DATA POINT FOR THE CONNECT TIMEOUT (issue #387). Four of
      # the six runs of the two wicourts.gov workflows die inside sock.connect
      # before any HTTP byte leaves the runner — on schedule and on dispatch,
      # across four hours of the day, on both scrapers — so nothing in the
      # request explains it and no longer timeout or extra in-process retry can
      # help (2026-09-12's run spent 2 m 39 s proving that). This prints the
      # runner's egress address and one plain connect probe, so the next
      # failing run says WHICH address could not reach the host instead of
      # leaving "intermittent" as the whole finding. Every call ends in
      # `|| true`: a diagnostic must never be the thing that fails the job.
      # api.ipify.org is an IP echo — it is sent nothing but the request, and
      # the address it returns is the GitHub runner's, not a reader's.
      - name: Probe this runner's route to wicourts.gov
        run: |
          echo -n "runner egress ip: "
          curl -sS --max-time 20 https://api.ipify.org || true
          echo
          curl -sS -o /dev/null --max-time 20 \
            -H 'User-Agent: districtry-wisconsin/1.0 (+https://districtry.com/wi/)' \
            -w 'wicourts.gov http=%{http_code} host_ip=%{remote_ip} connect=%{time_connect}s total=%{time_total}s\n' \
            https://www.wicourts.gov/ || true

      - name: Scrape the wicourts.gov Court of Appeals bench
        run: python3 wi/scripts/wi_coa_scraper.py

      - name: Rebuild the Court of Appeals roster
        run: python3 wi/scripts/build_wi_coa_roster.py

      - name: Validate app + data files
        run: python3 wi/scripts/validate_index.py wi/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- wi/data/app/wi-court-of-appeals-roster.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/wi-court-of-appeals-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          git add wi/data/app/wi-court-of-appeals-roster.json
          git commit -m "Update WI Court of Appeals bench from wicourts.gov"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update WI Court of Appeals bench from wicourts.gov" \
              --body "Automated weekly refresh of the Court of Appeals card's bench, generated by \`wi/scripts/wi_coa_scraper.py\` + \`build_wi_coa_roster.py\` from wicourts.gov's contact page (the content blocks — never the stale nav list). Please review the diff before merging — this changes data about real officeholders. A FAILED run instead of this PR can mean a seat count moved (a vacancy) or the district composition itself changed (Wis. Stat. 752.11) — read the failure." \
              --base main \
              --head "$branch"
          else
            gh pr comment "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" \
              --body "Refreshed by this week's scheduled run — the branch was force-updated with the latest scrape."
          fi
