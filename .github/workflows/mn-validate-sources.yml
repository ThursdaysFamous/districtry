name: Validate layer sources (MN)

# Monthly freshness check for the data sources mn/index.html depends on.
# Unlike the roster workflows (which re-scrape the same page), this catches the
# other failure mode: a publisher silently superseding a dataset.
#
# mn/scripts/validate_sources.py never edits the app (swapping a source is a
# schema-sensitive judgement call). When it finds drift it exits with a
# WARN/FAIL status; this workflow then opens — or updates in place — a single
# tracking issue so a human reviews it. The job itself stays green: the issue
# is the signal, matching the roster pattern of "officeholder/source changes
# get a human look before they ship."
#
# THE `mn-` PREFIX IS LOAD-BEARING. GitHub Actions reads workflows only from
# the repository ROOT's .github/workflows, so this file has to live here to run
# at all — and at the root it shares one namespace with every other instance
# (the unprefixed validate-sources.yml is Illinois's). Every path below is
# instance-scoped for the same reason.
#
# THIS FILE DID NOT SHIP WITH THE INSTANCE, WHICH IS THE DEFECT ITS SIBLINGS'
# COMMENTS WERE WRITTEN TO PREVENT. Michigan's own copy records that Wisconsin
# went its first day without one (docs/WI_PHASE2_PLAN.md PR 0) and says that it
# therefore ships in the same change that creates the instance folder. Minnesota
# repeated it anyway: mn/scripts/validate_sources.py landed with PR 1 on
# 2026-09-29 and ran in no workflow for two days, through go-live. Nothing
# caught it, because no gate asks whether an instance's monthly check is wired
# — fleet_status.py flags a workflow file that exists and cannot run, and an
# absent file looks like nothing at all. The script's own docstring deferred it
# on the ground that the instance was dark and pointed at a GO-LIVE row in
# mn/WATCH.md that was never written; both are corrected alongside this file.
#
# Cron: 1st of the month 18:00 UTC. The other eight slots in use are NY 12:00,
# WI 13:00, IL and CA 14:00, IA 15:00, MI and NC 16:00, IN and KY 17:00; 18:00
# is free, and a free slot keeps the monthly issues from racing each other on
# the shared runner pool.

on:
  schedule:
    - cron: "0 18 1 * *" # 1st of the month, 18:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  validate-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        # Only requests is needed (no BeautifulSoup/Playwright); pinned via
        # mn/scripts/requirements.txt.
        run: pip install -c mn/scripts/requirements.txt requests

      - name: Validate layer sources
        id: validate
        # continue-on-error: a FAIL exit (1) must not red the job — per the
        # project's "surface for a human, don't block" convention, the tracking
        # issue below is the signal. status.txt carries ok|warn|fail.
        continue-on-error: true
        run: |
          python3 mn/scripts/validate_sources.py \
            --report source-report.md \
            --status-file status.txt
          echo "status=$(cat status.txt)" >> "$GITHUB_OUTPUT"

      - name: Open or update tracking issue
        if: steps.validate.outputs.status != 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="MN layer source drift — review needed"
          # Prepend a short header so the issue explains itself, then the report.
          {
            echo "_Automated by \`.github/workflows/mn-validate-sources.yml\` on $(date -u +%Y-%m-%d). Nothing was changed in the app — review each item, then update \`mn/index.html\` (source URLs) or re-run the relevant \`mn/scripts/build_*.py\` as needed. Close this issue once addressed; it will reopen/refresh on the next run if drift remains._"
            echo
            cat source-report.md
          } > issue-body.md

          # Search NARROWS; the exact title comparison DECIDES. `gh issue list
          # --search` ANDs the terms and can return a near-miss, and this repo
          # carries five instances' source-drift issues — taking the first
          # hit would let one instance's monthly run overwrite another's body.
          # TITLE is exported, not a command prefix: the prefix form would set
          # it for `gh` only, and the reader on the other side of the pipe is a
          # separate process.
          export TITLE="$title"
          existing="$(gh issue list --state open --search "in:title $title" --json number,title \
            | python3 -c 'import json,os,sys; t=os.environ["TITLE"]; print(next((str(i["number"]) for i in json.load(sys.stdin) if i["title"] == t), ""))')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file issue-body.md
            gh issue comment "$existing" --body "Refreshed by the monthly source-validation run — see the updated issue body for the current status."
            echo "Updated existing issue #$existing."
          else
            gh issue create --title "$title" --body-file issue-body.md
            echo "Opened a new tracking issue."
          fi
