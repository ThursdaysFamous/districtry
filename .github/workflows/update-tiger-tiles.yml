name: Update TIGER tiles

# Weekly re-mirror of the Census TIGERweb layers the apps draw from vector
# tiles (scripts/mirror_tiger_tiles.py, docs/OPTIMIZATION_PLAYBOOK.md §10
# phase 6). Opens a PR, never commits to main.
#
# A PR opens ONLY WHEN A CENSUS SET CHANGED, or when the check below needs a
# new value recorded. The script hashes each fetched set in a canonical form
# and rebuilds only a layer whose hash moved, so a quiet week writes nothing
# — and it must, because tippecanoe does not write identical bytes twice, so
# a rebuild of unchanged data would be a PR of noise. When a set does move
# (a new TIGER vintage, a corrected boundary) the layer's archive is rebuilt
# and gated by build_vector_tiles.py's own gate against the set just
# fetched, the record is rewritten, and each app whose archive was REPLACED
# gets its service-worker cache name moved on, without which a returning
# visitor would go on reading the old archive.
#
# THE CHEAP CHECK COMES FIRST (2026-10-17). Before it downloads a layer's
# shapes the script asks for every feature's attributes with no shapes: the
# layer's own fields plus the land area, water area and internal point the
# Census derives from each shape. It downloads the shapes only where that
# check's hash, or the query the script makes, differs from the record.
# Measured that day, the check took
# 7.7 MB for every mirrored set and the shapes it spares took 940.7 MB. A full
# fetch that finds the data unchanged records the check's new value, and the
# query, without rebuilding anything, so a PR can carry only those values; its
# body says how to tell. The script's own fetch-and-convert code is part of the hash, so the
# first weekly run after that code changes fetches every set whole.
#
# A RED RUN MEANS A FETCH OR A GATE FAILED: nothing is written for a layer
# that failed, and the script exits non-zero naming it.
# scripts/check_roster_workflow_health.py discovers this workflow like any
# other and reports it when it stays red.

on:
  schedule:
    - cron: "41 10 * * 0" # Sunday 10:41 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI; a PR opened with the default GITHUB_TOKEN fires no workflows.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          # "3.14", not "3.x": runner images now carry Python 3.15, and
          # shapely 2.1.2 and pyproj 3.7.2 publish no wheel for it. Only the
          # workflows that install those two pin it (2026-10-20).
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tippecanoe and the tile readers
        run: |
          # the runner image's Google Chrome apt source once served a Packages
          # file whose hash did not match its Release file (smoke-test.yml)
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
               \( -name '*.list' -o -name '*.sources' \) \
               -exec grep -q 'dl\.google\.com' {} \; -print -delete 2>/dev/null || true
          sudo apt-get update -q
          sudo apt-get install -y -q tippecanoe
          pip install -c scripts/requirements.txt shapely numpy mapbox-vector-tile pmtiles jsonschema

      - name: Re-mirror every TIGERweb layer
        timeout-minutes: 45
        run: |
          python3 scripts/mirror_tiger_tiles.py --refresh
          python3 scripts/mirror_tiger_tiles.py --check

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/tiger-tiles-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A tiger-mirror.json '*/data/app/tiles/*.pmtiles' \
                    metro-worksheet.json '*/metro-worksheet.json' '*/sw.js' '*/index.html' \
                    '*/sources.html' CLAUDE.md README.md
          git commit -m "Update the Census TIGERweb tile archives"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --title "Update the Census TIGERweb tile archives" \
              --body "Automated weekly re-mirror by \`scripts/mirror_tiger_tiles.py\`: at least one Census TIGERweb set the apps draw from tiles changed since it was last built, or the check the script runs before downloading a set's shapes needed a new value recorded. Each changed layer's archive was rebuilt and gated against the set just fetched; \`tiger-mirror.json\` records what was fetched, and each app whose archive was replaced carries a new service-worker cache name. In the \`tiger-mirror.json\` diff, a layer whose \`data_sha256\` moved was rebuilt, and one whose \`fingerprint_sha256\` or \`query\` alone moved had nothing to rebuild. Check which layers moved and by how many features before merging." \
              --base main --head "$branch"
          fi
