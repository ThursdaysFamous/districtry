name: Update Ohio legislature roster

# Weekly refresh of the Ohio Senate + House of Representatives rosters
# (oh/data/app/oh-senate-members.json and oh-house-members.json, fetched by
# oh/index.html's chamber cards). Rebuilds both chambers from each chamber's
# own site and, if anything changed, opens a PR rather than committing directly
# to main.
#
# Each chamber's member directory (www.ohiosenate.gov/members/directory and
# www.ohiohouse.gov/members/directory) gives each seat's member and party,
# and each member's own page gives the name and the Columbus office and
# telephone; neither chamber prints an e-mail address. One list page per
# chamber and one page per member (about 134 requests), and nothing else is
# fetched.
#
# robots.txt: both chambers' policies are read before the first fetch of each
# host, with the User-Agent the fetches send, and the builder paces the Senate
# at one request a second and the House at one every two seconds, so a run
# takes about four minutes.
#
# THE REBUILT FILES ARE CARRIED ACROSS THE BRANCH CUT RATHER THAN FETCHED A
# SECOND TIME, the update-ilga-roster.yml pattern. A run where main changed
# those same files meanwhile errors at the checkout instead of pushing, which
# is right.
#
# THE PAGE STEPS LANDED WITH THE GO-LIVE CHANGE (batch 2 of the state-level
# launch). `oh/state-legislature.html` carries a GENERATED table of both
# rosters, and `about.html` and `sitemap.xml` count them, so all three are
# regenerated here and staged in the same `git add`.

on:
  schedule:
    - cron: "53 20 * * 4" # Thursday 20:53 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # requests, which the builder fetches every page with and which the shared
      # robots.txt reader needs.
      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Rebuild Ohio Senate + House rosters
        run: python3 oh/scripts/build_oh_legislature_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, every data/app file must be present and
      # well formed, and every seat must carry a record.
      - name: Validate app + data files
        run: |
          python3 oh/scripts/validate_index.py oh/index.html
          python3 scripts/validate_chamber_rosters.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- oh/data/app/oh-senate-members.json oh/data/app/oh-house-members.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/oh-legislature-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut from main's current tip, with full history — see the sibling
          # workflows' own comments for why both halves matter. The two rebuilt
          # files ride across the checkout as working-tree changes.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          python3 scripts/build_officeholder_tables.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add oh/data/app/oh-senate-members.json oh/data/app/oh-house-members.json oh/state-legislature.html about.html sitemap.xml
          git commit -m "Update Ohio Senate + House rosters from each chamber's site"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Ohio Senate + House rosters" \
              --body "Automated weekly refresh of the Ohio Senate and House chamber cards' rosters, from each chamber's own member pages, generated by \`oh/scripts/build_oh_legislature_roster.py\`. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
