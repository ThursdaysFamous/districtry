name: Update Chicago SSA service providers

# Weekly refresh of the Special Service Area card's provider roster
# (il/data/app/chicago-ssa-providers.json), fetched by il/index.html.
#
# An SSA elects nobody — City Council creates one by ordinance and the Mayor
# appoints its commission — so the person-shaped thing the card can honestly
# name is the SERVICE PROVIDER AGENCY: the local non-profit the city contracts
# with to run the corridor, and the number a reader would call about it. The
# city's boundary dataset names neither the provider nor the commission, so
# this is the card's only people source.
#
# THE SOURCE IS ONE HAND-MAINTAINED HTML PAGE, which is why this runs weekly
# rather than monthly. It is not a table, not a feed, and not reachable from
# the department's landing page — you get to it through Business Assistance —
# so a move would be silent. Every parse trap it carries is enumerated in
# scripts/chicago_ssa_provider_scraper.py; the load-bearing one is a PHANTOM
# BLOCK, where an expired SSA's notice bolds its replacement's name and a
# bold-keyed parser invents an empty provider for a live area. The scraper
# pins the known phantom and FAILS on a new one rather than shipping a card
# that names nobody where the page named somebody.
#
# If anything changed, this opens a PR rather than committing to main:
# officeholder-shaped data gets a human look before it ships.

on:
  schedule:
    - cron: "0 11 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers). Falls back to github.token.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # A static server-rendered page; requests plus the stdlib re module
        # reach it. No browser engine and no geometry stack.
        run: pip install -c scripts/requirements.txt requests

      - name: Scrape the city's SSA provider list
        run: python3 scripts/chicago_ssa_provider_scraper.py --out /tmp/chicago_ssa_providers_raw.json

      # THE COMPARAND FOR THE JOIN, and a step of its own so a failure here is
      # a failed run rather than a skipped check. The builder requires it: the
      # bare-number fold is only one-to-one if no two areas fold together and
      # every provider lands on an area the city actually draws, and neither can
      # be measured without the city's own boundary list. `--fail-with-body`
      # makes an HTTP error an exit code, and the python line refuses a body
      # that is not a FeatureCollection with features — a 200 carrying an error
      # document would otherwise reach the builder as "no ref_no I can read".
      - name: Fetch the SSA boundary dataset to join against
        run: |
          curl -sS --fail-with-body --retry 3 --retry-delay 5 \
            -o /tmp/chicago_ssa_boundaries.geojson \
            "https://data.cityofchicago.org/api/v3/views/cmr6-dn8c/query.geojson"
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/chicago_ssa_boundaries.geojson"))
          n = len(d.get("features") or [])
          if d.get("type") != "FeatureCollection" or n == 0:
              sys.exit("the SSA boundary fetch returned %s with %d feature(s) — "
                       "refusing to join against it" % (d.get("type"), n))
          print("boundary dataset: %d feature(s)" % n)
          PY

      - name: Rebuild roster data file
        run: |
          python3 scripts/build_chicago_ssa_providers.py \
            --raw /tmp/chicago_ssa_providers_raw.json \
            --boundaries /tmp/chicago_ssa_boundaries.geojson

      # Gate the regenerated data before it can reach a PR.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR.
          branch="bot/chicago-ssa-providers-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with — otherwise a .github/workflows/ change landing on
          # main mid-run makes this push look like a workflow edit, which a
          # token without `workflow` scope is refused for. Measured 2026-09-02
          # on update-municipal-officials.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          git add il/data/app/chicago-ssa-providers.json
          git commit -m "Update Chicago SSA service providers from chicago.gov"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Chicago SSA service providers from chicago.gov" \
              --body "Automated weekly refresh of the Special Service Area card's provider roster, generated by \`scripts/chicago_ssa_provider_scraper.py\` + \`scripts/build_chicago_ssa_providers.py\`. Please review the diff before merging — this changes the organisation, office address and telephone a reader is told to contact about a corridor. The source is one hand-maintained HTML page rather than a dataset, so a shape change shows up here as a failed run rather than as quietly missing providers." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
