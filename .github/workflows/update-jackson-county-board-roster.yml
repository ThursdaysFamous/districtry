name: Update Jackson County Board roster

# Weekly refresh of the Jackson County Board District card's member roster
# (il/data/app/jackson-county-board-members.json), fetched by index.html.
#
# THE ROSTER comes from two county surfaces read together. The board page groups its fourteen members under "District N Board Members" headings; each member's staff-directory entry repeats the district as its own field and adds the county e-mail address — 14/14 carry one.
#
# THE HEADING IS THE AUTHORITY FOR THE DISTRICT, and that is this county's trap:
# a member's job title is their DISTRICT for twelve of the fourteen and their
# OFFICE for the other two. The Chair's and Vice Chair's cards name no district
# at all, so a parser keying on the job title drops the two most prominent
# members of the board and reports twelve seats for a fourteen-seat county.
#
# THE TWO-SURFACE CHECK: the builder compares the directory entry's own district
# against the heading that grouped the member and FAILS the run when they
# disagree, rather than choosing a winner. Two county surfaces that stop
# agreeing about which district a member sits in is a thing a human should look
# at, not a thing a parser should resolve quietly.
#
# NOT CHECKED HERE, and said plainly rather than left implied: this run does not
# re-verify the district BOUNDARIES. Jackson's are the one build in the fleet
# that resolves split precincts to census blocks off the county's adopted map
# (scripts/build_jackson_boundaries.py), and re-deriving that needs the map, the
# census fabric and shapely — an operator step, not a weekly job.
#
# If anything changed, this opens a PR rather than committing to main:
# officeholder data gets a human look before it ships.

on:
  schedule:
    - cron: "0 22 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # Both surfaces are static server-rendered HTML, so requests plus the
        # stdlib re module reach them. The builder imports only CONSTANTS from
        # build_jackson_boundaries.py, whose geometry stack is function-local
        # (the De Witt seam), so no shapely here.
        run: pip install -c scripts/requirements.txt requests

      - name: Scrape the board page and each member's directory entry
        run: python3 scripts/jackson_county_board_scraper.py -o /tmp/jackson_board_raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_jackson_county_board.py /tmp/jackson_board_raw.json

      # Gate the regenerated data before it can reach a PR.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR.
          branch="bot/jackson-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add il/data/app/jackson-county-board-members.json il/county-board il/county-board.html about.html sitemap.xml
          git commit -m "Update Jackson County Board roster from jacksoncounty-il.gov"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Jackson County Board roster from jacksoncounty-il.gov" \
              --body "Automated weekly refresh of the Jackson County Board District card's member roster, generated by \`scripts/jackson_county_board_scraper.py\` + \`scripts/build_jackson_county_board.py\`. Please review the diff before merging — this changes data about real officeholders. The run reads each member's district from the board page's grouping heading and cross-checks it against that member's own staff-directory entry, failing if the two disagree." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
