name: Update county commissioners (MN)

# Weekly refresh of the Minnesota county commissioner card's names
# (mn/data/app/mn-county-commissioners.json, fetched by mn/index.html). The
# names are the winners of each seat's most recent election in the Secretary
# of State's county races results files, each dated to that election, rebuilt
# by mn/scripts/build_mn_commissioner_roster.py. If anything changed it opens a
# PR rather than committing directly to main — officeholder data gets a look
# before it ships. A new result reaches this file once it is CANVASS_DAYS old,
# so the November 2026 general lands here about three weeks after election day.

on:
  schedule:
    - cron: "40 13 * * 2" # Tuesday 13:40 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR runs CI; see
      # update-mn-congress-roster.yml for why.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests

      # Asks every Tuesday's results directory since the 2022 general (about
      # 200 requests, paced half a second apart), then compares the winners
      # with the five county layers that publish a name.
      - name: Rebuild commissioner roster
        run: python3 mn/scripts/build_mn_commissioner_roster.py

      - name: Validate app + data files
        run: |
          python3 mn/scripts/build_mn_commissioner_roster.py --check
          python3 mn/scripts/validate_index.py mn/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- mn/data/app/mn-county-commissioners.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/mn-commissioner-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          python3 scripts/build_llms_txt.py
          python3 scripts/build_eam_status.py
          git add mn/data/app/mn-county-commissioners.json mn/county-commissioner mn/county-commissioner.html about.html sitemap.xml llms.txt docs/EAM_STATUS.md
          git commit -m "Update Minnesota county commissioners from the Secretary of State's results"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Minnesota county commissioners from election results" \
              --body "Automated weekly refresh of the Minnesota county commissioner names, generated by \`mn/scripts/build_mn_commissioner_roster.py\` from the Secretary of State's county races results files. Each name is the winner of that seat's most recent election and is dated to it. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
