name: Update Stark County Board roster

# Weekly refresh of the Stark County Board District card's member roster
# (il/data/app/stark-county-board-members.json, fetched by index.html) — and the
# weekly DRIFT CHECK on the five boundaries that county ships.
#
# STARK'S ENTIRE GIS IS ONE GOOGLE MY MAPS. The county has ~5,300 residents, no
# GIS server, no shapefiles and no open-data portal; what it has is a map its
# County Clerk maintains by hand, holding board districts, precincts, fire,
# library and park districts. The state's pointer file for Stark contains
# nothing but a link to it.
#
# That map was unusable to us for a year for exactly one reason — DATE. The
# state's pointer and companion files are from August 2020, BEFORE the late-2021
# redistricting, and the county's online minutes only begin in July 2022, so the
# adopting resolution is published nowhere reachable. No amount of further
# searching could have fixed that. What fixed it was asking: County Clerk
# Heather Hollis wrote on 2026-08-03 that "the board districts and precincts are
# correct" and that "the only thing that changed on the map is the congressional
# district". Stark is the first county in the fleet unlocked by a sentence
# rather than by a file.
#
# WHY THE BOUNDARY CHECK HERE RUNS AGAINST AN ARCHIVED COPY, unlike McDonough's.
# The source is a hand-maintained consumer map with no version history and no
# published revision date. Re-fetching it weekly would mean shipping whatever it
# said this morning, and the ONLY thing making this county buildable is a dated
# statement about one specific export — which a silent edit would invalidate
# without changing anything we could see. So the export is archived in
# data/source/raw/ and --check verifies the shipped files still match THAT, i.e.
# it guards our own pipeline rather than pretending to watch the county's.
#
# Refreshing the archive is therefore a deliberate human step, and it needs the
# clerk asked again — the URL is in scripts/build_stark_districts.py.
#
# The roster half IS live, and does watch the county: the Elected Officials page
# is ordinary HTML and gets scraped weekly like any other. Two things it guards
# that are worth reading in the log rather than the diff:
#   * Stark gives each SEAT its own mailbox (boarddist1-1 … boarddist2-4) rather
#     than publishing members' personal addresses. The builder FAILS if a
#     personal address ever appears in that slot — that would be a change in
#     county policy, not a data update.
#   * The same page also lists the Circuit Clerk, County Clerk, Sheriff, State's
#     Attorney and Treasurer under their own headings. The scraper walks
#     category by category and takes only the two District headings, so those
#     five county officers can never be filed as board members.

on:
  schedule:
    - cron: "0 19 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI (a PR opened with the default GITHUB_TOKEN fires no workflows).
      # Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # FULL history, because this job regenerates sitemap.xml and
          # build_sitemap.py reads each page's lastmod from that file's own last
          # commit. Under the default depth-1 checkout git reports the single
          # fetched commit as the last commit of EVERY file, so every one of the
          # 243 entries takes today's date. Measured 2026-09-19 by building the
          # sitemap in a depth-1 clone: 243 of 243 lastmods moved, against 0 in a
          # full clone, where `build_sitemap.py --check` passes. A bot run on
          # 2026-09-17 shipped 241 wrong dates this way.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # requests for the roster page; shapely for the boundary drift check,
        # which re-does the real geometry (clip, tiling coverage, pairwise
        # overlap, and the board-vs-precinct cross-check).
        run: pip install -c scripts/requirements.txt requests shapely

      - name: Scrape roster
        run: python3 scripts/stark_county_board_scraper.py --out /tmp/raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_stark_board_roster.py /tmp/raw.json

      # Pipeline drift check (see the header for why this reads the archive
      # rather than the live map): rebuilds all five layers from the archived
      # export and fails if any shipped file no longer matches it. This also
      # re-runs the measurement that made the county buildable — that every
      # board district is a whole-precinct union with each precinct >= 99.99%
      # inside it.
      - name: Re-check the shipped boundaries against the archived export
        run: python3 scripts/build_stark_districts.py --check

      # Gate the regenerated data before it can reach a PR.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR.
          branch="bot/stark-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          # Full history, for the same reason as fetch-depth: 0 above. `git fetch
          # --depth=1` RE-SHALLOWS a clone that was fetched complete (measured:
          # 512 commits down to 13), so the two have to move together — deepening
          # the checkout alone would be undone here.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          # docs/EAM_STATUS.md counts the districts this roster names, so a
          # county gaining or losing a member moves it and the smoke gate's
          # `build_eam_status.py --check` fails on this PR. See that script's
          # check_workflows(), which is what names this job.
          python3 scripts/build_eam_status.py
          git add il/data/app/stark-county-board-members.json il/county-board il/county-board.html about.html sitemap.xml docs/EAM_STATUS.md
          git commit -m "Update Stark County Board roster from starkco.illinois.gov"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Stark County Board roster from starkco.illinois.gov" \
              --body "Automated weekly refresh of the Stark County Board District card's member roster (2 districts of four members each, with the county's per-SEAT e-mail address, term-expiry year, and the Chair/Vice-Chair tags), generated by \`scripts/stark_county_board_scraper.py\` + \`scripts/build_stark_board_roster.py\`. The same run re-checks all five of the county's shipped boundaries against the archived Google My Maps export they were built from, including the measurement that made the county buildable — every board district being a whole-precinct union with each precinct at least 99.99% inside it. Stark publishes no member home addresses, and the builder asserts that anyway. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
