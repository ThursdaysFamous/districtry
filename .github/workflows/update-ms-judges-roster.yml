name: Update Mississippi judges

# Weekly refresh of the judges of Mississippi's four courts whose judges are
# elected from districts (ms/data/app/ms-judge-roster.json, fetched by the
# Supreme Court, Court of Appeals, chancery and circuit cards in ms/index.html),
# rebuilt by ms/scripts/build_ms_judges.py from the Judiciary's own pages on
# courts.ms.gov: four requests, the Supreme Court's page of its justices, the
# Court of Appeals' page of its judges, and the chancery and circuit lists
# (two PDFs). If anything changed it opens a PR rather than committing
# directly to main — officeholder data gets a look before it ships.
#
# The two trial lists are updated a few times a year, so most weeks change
# nothing: the file carries each list's own date and no date of reading, so an
# unchanged source rebuilds byte for byte and no PR is opened.
#
# A RED RUN IS USUALLY A LIST THAT HAS CAUGHT UP, and that is the point of it.
# The lists lag the bench, so the builder applies the changes since from the
# court's news and the Governor's announcements (CHANGES in the builder), and
# it FAILS rather than applying one over a list that already shows it: when
# the list's own date reaches the change, when the list no longer prints the
# judge who left, or when it already prints the one who arrived. A person
# then re-reads the list and deletes the entry. It also FAILS when a list
# stops reading the way it was measured (a name line that looks like an
# address, a district heading whose counties match neither map, fewer judges
# than the floors).
#
# THE PDF LISTS ALSO PRINT THE JUDGES' STAFF, WITH ADDRESSES AND TELEPHONES,
# and nothing of theirs is read or kept: the builder reads only each judge's
# name, and this job never saves what it fetched.
#
# The job was scheduled while Mississippi was dark, so that the file would be
# current on the day the instance went live.

on:
  schedule:
    - cron: "11 18 * * 4" # Thursday 18:11 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR runs CI; see
      # update-ms-legislature-roster.yml for why.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # requests for the four fetches, PyMuPDF to read the two PDF lists.
      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests pymupdf

      - name: Rebuild the judges
        run: python3 ms/scripts/build_ms_judges.py

      - name: Validate app + data files
        run: |
          python3 ms/scripts/build_ms_judges.py --check
          python3 ms/scripts/validate_index.py ms/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- ms/data/app/ms-judge-roster.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/ms-judges-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut from main's current tip, with full history; the rebuilt file is
          # carried over the checkout as an uncommitted change.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          git add ms/data/app/ms-judge-roster.json
          git commit -m "Update Mississippi judges"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Mississippi judges" \
              --body "Automated weekly refresh of the judges of Mississippi's Supreme Court, Court of Appeals, chancery and circuit courts, from the Judiciary's own pages, generated by \`ms/scripts/build_ms_judges.py\`. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
