name: Update Franklin County Board roster

# Weekly refresh of the Franklin County Board District card's member roster
# (il/data/app/franklin-county-board-members.json), fetched by index.html.
#
# TWO JOBS IN ONE RUN, and the second is the important one.
#
# 1. THE ROSTER comes from the county's own members page,
#    franklincountyil.gov/county-board-members/ — nine members grouped under
#    Districts 1, 2 and 3, with a mobile number for eight of them, one e-mail,
#    and the role the county prints beside five. THE PAGE IS A GRID AND MUST BE
#    READ AS ONE: its WP Table Builder cells carry data-y-index/data-x-index,
#    and a flattened text read pairs every role with the WRONG member, because
#    column 0's role arrives before its own row's name. Two things in it never
#    ship — its Address column, which is every member's HOME address, and party,
#    which it does not publish. Its e-mail column is Cloudflare-obfuscated, the
#    exact markup that silently emptied Brown County's seven addresses while
#    every count guard passed, so the scraper decodes it and FAILS if the markup
#    is present and nothing decodes.
#
#    THIS ROSTER IS THE PAGE AND NOT THE RETURNS. Franklin seats three members
#    per district on staggered terms, so any one canvass elected a third of the
#    board; only the county's page names all nine.
#
# 2. THE REDISTRICTING TRIPWIRE. Franklin's board districts are the DISSOLVE of
#    its voting precincts — the Census 2020 VTDs, which still carry the county's
#    own 35 precinct names 35/35, one of them through a recorded census-spelling
#    rename (scripts/build_franklin_boundaries.py) — so the shipped boundary is
#    correct only while the county's election authority keeps tabulating the same
#    precincts in the same districts. The same run re-reads two facts from the
#    Clerk's results system at platinumelectionresults.com: the county's live
#    precinct count, and the precinct count of each numbered board contest in the
#    newest board election. It FAILS if either moves. A red run here means the
#    county re-precincted or redistricted and a human must re-measure against the
#    census fabric before this county ships again — the alarm working, not
#    breakage.
#
#    The check COUNTS rather than names, and the run says so. Naming every
#    precinct would cost thirty-five requests a week instead of two, and the two
#    events it has to catch — a re-precincting or a redistricting — both move the
#    counts. The full composition rests on three certified elections that agree
#    exactly (2024 General, 2022 General, 2026 General Primary), not on this
#    weekly check.
#
# If anything changed, this opens a PR rather than committing to main:
# officeholder data gets a human look before it ships.

on:
  schedule:
    - cron: "0 19 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # Both surfaces are static server-rendered HTML, so requests plus the
        # stdlib re module reach them. The builder imports only CONSTANTS from
        # build_franklin_boundaries.py, whose geometry stack is function-local
        # (the De Witt seam), so no shapely here.
        run: pip install -c scripts/requirements.txt requests

      - name: Scrape the members page and re-check the district composition
        run: python3 scripts/franklin_county_board_scraper.py -o /tmp/franklin_board_raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_franklin_county_board.py /tmp/franklin_board_raw.json

      # Gate the regenerated data before it can reach a PR.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR.
          branch="bot/franklin-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_sitemap.py
          git add il/data/app/franklin-county-board-members.json il/county-board il/county-board.html sitemap.xml
          git commit -m "Update Franklin County Board roster from franklincountyil.gov"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Franklin County Board roster from franklincountyil.gov" \
              --body "Automated weekly refresh of the Franklin County Board District card's member roster, generated by \`scripts/franklin_county_board_scraper.py\` + \`scripts/build_franklin_county_board.py\`. Please review the diff before merging — this changes data about real officeholders. The same run re-checks the district composition against the Clerk's results system and fails if it stops matching the shipped dissolve; that failure would mean the county re-precincted or redistricted, and the geometry must be re-measured before it ships again." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
