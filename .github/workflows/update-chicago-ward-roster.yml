name: Update Chicago ward roster

# Weekly refresh of il/data/source/ward-members.json from the City of Chicago's
# own dataset (Socrata htai-wnw4). Opens a PR, never commits to main.
#
# WHAT THIS ROSTER IS FOR, AND WHAT IT IS NOT. il/index.html does NOT read this
# file: the ward card calls Socrata live on first toggle, so a reader running
# the map is never a week behind the City. This roster exists so all 50
# alderpeople appear in the served bytes of il/ward.html — measured 2026-09-15,
# none of them appeared in any page a crawler, an AI client or a reader with
# JavaScript off could read. That is why it sits in data/SOURCE rather than
# data/app, and why this job regenerates the page below.

on:
  schedule:
    - cron: "0 23 * * 2" # Tuesday 23:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI; a PR opened with the default GITHUB_TOKEN fires no workflows.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests
      - name: Fetch the City's ward roster
        run: python3 scripts/chicago_ward_scraper.py --out chicago_wards.json
      - name: Rebuild roster
        # Refuses to write on anything but exactly 50 wards, on a ward with no
        # name, or on a field that drops below its floor.
        run: python3 scripts/build_chicago_ward_roster.py chicago_wards.json
      - name: Regenerate the page that names them
        run: python3 scripts/build_officeholder_tables.py
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html
      - name: Check for changes
        id: diff
        run: |
          git diff --quiet -- il/data/source/ward-members.json il/ward.html \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/chicago-ward-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip rather than from the checkout
          # this run started with: these runs take tens of minutes, and a branch
          # that also differs from main in .github/workflows/ reads to GitHub as
          # a workflow update and is refused for a token without `workflow`
          # scope.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          python3 scripts/chicago_ward_scraper.py --out chicago_wards.json
          python3 scripts/build_chicago_ward_roster.py chicago_wards.json
          # il/ward.html carries a GENERATED table of all 50 alderpeople built
          # from the roster this job just rewrote, so regenerate it here or the
          # smoke gate's `build_officeholder_tables.py --check` fails on this PR
          # with a table naming last week's members. The sitemap follows,
          # because that page is in it and its lastmod is the file's own last
          # commit.
          python3 scripts/build_officeholder_tables.py
          python3 scripts/build_sitemap.py
          git add il/data/source/ward-members.json il/ward.html sitemap.xml
          git commit -m "Update Chicago ward roster from the City's own dataset"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --title "Update Chicago ward roster" \
              --body "Automated weekly refresh of Chicago's 50 alderpeople from the City's dataset (\`scripts/chicago_ward_scraper.py\` + \`build_chicago_ward_roster.py\`), with \`il/ward.html\`'s table regenerated from it. The map card reads Socrata live and is unaffected. Review before merging." \
              --base main --head "$branch"
          fi
