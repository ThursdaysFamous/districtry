name: Update CPD district commander/contact roster

# Weekly refresh of the Police District card's commander/CAPS/station-address
# roster (il/data/app/cpd-district-info.json, fetched by index.html). Re-scrapes
# CPD's per-district pages and, if anything changed, opens a PR rather than
# committing directly to main — officeholder data should get a human look
# before it ships.

on:
  schedule:
    - cron: "0 13 * * 2" # Tuesday 13:00 UTC (staggered from the Monday ILGA job)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write # the standing block issue below

jobs:
  update-roster:
    runs-on: ubuntu-latest
    # Two Cloudflare challenge waits plus 22 page fetches; bounded so a job that
    # sits behind an unclearable challenge dies visibly rather than grinding.
    timeout-minutes: 30
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        run: pip install -r scripts/requirements.txt

      # CPD fronts its per-district pages with Cloudflare's managed (JS)
      # challenge, which 403s a plain requests client. The scraper's default
      # --engine auto falls back to a real headless Chromium to clear it, so
      # Chromium must be present (playbook R11).
      - name: Install Chromium for Playwright
        run: python3 -m playwright install --with-deps chromium

      # A REFUSED SCRAPE IS A TRACKED STATE, NOT A RED RUN — the posture McHenry
      # and Kendall already use. CPD's managed challenge stopped clearing from
      # GitHub's runners around 2026-08-04, and for two weeks this job went red
      # every Tuesday with the builder's "resolved only 0/20+ expected
      # districts", which reads as a roster problem and was always a fetch one.
      # The scraper now exits non-zero when no district resolves, so that state
      # lands here instead: the issue below records it, the builder is skipped,
      # and il/data/app/cpd-district-info.json keeps its last good values.
      - name: Scrape CPD district commander/contact pages
        id: scrape
        continue-on-error: true
        run: python3 scripts/cpd_district_scraper.py --out /tmp/cpd_district_info.json

      - name: Report blocked source on the standing issue
        if: steps.scrape.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          title="CPD district roster: Cloudflare challenge no longer clears from CI"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="The weekly CPD scrape was refused: plain requests gets HTTP 403, and the headless-Chromium rung either reports "Cloudflare challenge did not clear" or got through to fewer than 20 of the 22 district pages (the scrape log says which). The shipped il/data/app/cpd-district-info.json keeps its last good values and stays correct until CPD changes a commander or a CAPS contact.

          What is known: the challenge is a genuine managed (JS) one rather than a hard block, and Cloudflare hands a datacenter IP a harder challenge than a residential one. The per-attempt wait was raised 20s -> 60s on 2026-07-28, which held for about three weeks, and 60s -> 120s on 2026-08-19. **If runs still fail at 120s, the wait is not the problem — do not keep doubling it.** Override without editing code by setting CPD_CHALLENGE_WAIT_S on the scrape step.

          Worth trying instead, in rough order: re-check whether CPD has begun publishing commander/CAPS contact through its ArcGIS org (swept 2026-07-09 and again 2026-08-19 — station address/phone and boundaries only); run the scraper from a non-datacenter address and commit the result; or ask CPD for the data directly. No evasion or fingerprint-spoofing — the scraper drives a real browser on purpose and that stays true.

          This issue is updated by each blocked weekly run; close it if a run goes green. Latest blocked run: $run_url"
          num=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)
          if [ -z "$num" ]; then
            gh issue create --title "$title" --body "$body"
          else
            gh issue comment "$num" --body "Still blocked as of $(date -u +%F) — $run_url"
          fi

      - name: Rebuild roster data file
        if: steps.scrape.outcome == 'success'
        run: python3 scripts/build_cpd_roster.py /tmp/cpd_district_info.json

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present
      # and well formed. node is preinstalled on ubuntu-latest.
      - name: Validate app + data files
        if: steps.scrape.outcome == 'success'
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        if: steps.scrape.outcome == 'success'
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/cpd-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          git add il/data/app/cpd-district-info.json
          git commit -m "Update CPD district commander/contact roster"
          git push -u origin "$branch" --force
          # Only open a PR if one isn't already open for this branch; if it is,
          # the force-push above already updated it.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update CPD district commander/contact roster" \
              --body "Automated weekly refresh of the Police District cards' embedded commander/CAPS/station-address roster, generated by \`scripts/cpd_district_scraper.py\` + \`scripts/build_cpd_roster.py\` from chicagopolice.org's per-district pages. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
