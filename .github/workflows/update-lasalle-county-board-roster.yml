name: Update LaSalle County Board roster

# Weekly refresh of the LaSalle County Board District card's member roster
# (il/data/app/lasalle-county-board-members.json, fetched by index.html).
# Re-scrapes the county's own CivicPlus staff directory (29 single-member
# districts with full 10-digit phones and district-office e-mails, plus the
# countywide-elected Board Chairman) and, if anything changed, opens a PR
# rather than committing directly to main — officeholder data should get a
# human look before it ships.
#
# This roster exists BECAUSE the county's board-boundary GIS is the superseded
# 2011-2021 map with a 2015-frozen roster (the 2026-07-31 validation-pass
# finding); the directory is the county's roster of record for the 2022-2031
# board. The boundary half is il/data/app/lasalle-county-board-districts.json,
# rebuilt by an operator (scripts/build_lasalle_board_districts.py) and
# drift-checked monthly in validate-sources.yml, not here.

on:
  schedule:
    - cron: "0 15 * * 0" # Sunday 15:00 UTC (staggered: Sun 13 DuPage, Sun 14 Stephenson)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI (a PR opened with the default GITHUB_TOKEN fires no workflows).
      # Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # FULL history, because this job regenerates sitemap.xml and
          # build_sitemap.py reads each page's lastmod from that file's own last
          # commit. Under the default depth-1 checkout git reports the single
          # fetched commit as the last commit of EVERY file, so every one of the
          # 243 entries takes today's date. Measured 2026-09-19 by building the
          # sitemap in a depth-1 clone: 243 of 243 lastmods moved, against 0 in a
          # full clone, where `build_sitemap.py --check` passes. A bot run on
          # 2026-09-17 shipped 241 wrong dates this way.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # The directory is plain server-rendered CivicPlus HTML (no challenge,
        # no JS rendering needed — the spam-wrapped e-mails are read verbatim
        # from the wrapper script's own source), so requests alone suffices.
        run: pip install -c scripts/requirements.txt requests

      - name: Scrape LaSalle County Board member roster
        run: python3 scripts/lasalle_county_board_scraper.py /tmp/lasalle_county_board_raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_lasalle_board_roster.py /tmp/lasalle_county_board_raw.json

      # Gate the regenerated data before it can reach a PR.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR.
          branch="bot/lasalle-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          # Full history, for the same reason as fetch-depth: 0 above. `git fetch
          # --depth=1` RE-SHALLOWS a clone that was fetched complete (measured:
          # 512 commits down to 13), so the two have to move together — deepening
          # the checkout alone would be undone here.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          # docs/EAM_STATUS.md counts the districts this roster names, so a
          # county gaining or losing a member moves it and the smoke gate's
          # `build_eam_status.py --check` fails on this PR. See that script's
          # check_workflows(), which is what names this job.
          python3 scripts/build_eam_status.py
          git add il/data/app/lasalle-county-board-members.json il/county-board il/county-board.html about.html sitemap.xml docs/EAM_STATUS.md
          git commit -m "Update LaSalle County Board roster from lasallecountyil.gov"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update LaSalle County Board roster from lasallecountyil.gov" \
              --body "Automated weekly refresh of the LaSalle County Board District card's member roster (29 districts with phones and district-office e-mails, plus the countywide-elected Chairman), generated by \`scripts/lasalle_county_board_scraper.py\` + \`scripts/build_lasalle_board_roster.py\` from the county's own directory. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
