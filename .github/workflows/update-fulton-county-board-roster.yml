name: Update Fulton County Board roster

# Weekly refresh of the Fulton County Board District card's member roster
# (il/data/app/fulton-county-board-members.json, fetched by index.html).
#
# WHAT THIS SCRAPE IS ACTUALLY DOING. The county's Members page publishes the
# board TWICE and neither half is sufficient alone:
#
#   * a photo grid grouped under "District #1/2/3" headings — the ONLY place the
#     district is stated; and
#   * hidden popup blocks, one per member, carrying the e-mail the grid omits.
#
# The scraper joins them on the member's name, so a change to either half shows
# up as a count or e-mail floor failing rather than as silently thinner data.
#
# THE TRAP TO WATCH, if this ever goes red on a "16th member": above District #1
# sits a section headed "Fulton County Board Chairman" holding a member who ALSO
# appears in his own district. It is the source of the Chair ROLE, not a seat.
# Both the scraper and the builder refuse to write more than five members into a
# district, which is the county's own stated arithmetic ("Five Fulton County
# Board members are elected in each of the three districts"), so sweeping that
# section in as a seat fails the run instead of shipping a phantom member.
#
# Names ship exactly as the county prints them, including "Karl WIlliams" with
# its capital I. Correcting an officeholder's name is not ours to do.

on:
  schedule:
    - cron: "0 20 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI (a PR opened with the default GITHUB_TOKEN fires no workflows).
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # FULL history, because this job regenerates sitemap.xml and
          # build_sitemap.py reads each page's lastmod from that file's own last
          # commit. Under the default depth-1 checkout git reports the single
          # fetched commit as the last commit of EVERY file, so every one of the
          # 243 entries takes today's date. Measured 2026-09-19 by building the
          # sitemap in a depth-1 clone: 243 of 243 lastmods moved, against 0 in a
          # full clone, where `build_sitemap.py --check` passes. A bot run on
          # 2026-09-17 shipped 241 wrong dates this way.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Scrape roster
        run: python3 scripts/fulton_county_board_scraper.py --out /tmp/raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_fulton_board_roster.py /tmp/raw.json

      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR.
          branch="bot/fulton-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          # Full history, for the same reason as fetch-depth: 0 above. `git fetch
          # --depth=1` RE-SHALLOWS a clone that was fetched complete (measured:
          # 512 commits down to 13), so the two have to move together — deepening
          # the checkout alone would be undone here.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add il/data/app/fulton-county-board-members.json il/county-board il/county-board.html about.html sitemap.xml
          git commit -m "Update Fulton County Board roster from fultoncountyil.gov"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Fulton County Board roster from fultoncountyil.gov" \
              --body "Automated weekly refresh of the Fulton County Board District card's member roster (3 districts of five members each, with party, e-mail, term-expiry year and the Chair/Vice-Chair badges), generated by \`scripts/fulton_county_board_scraper.py\` + \`scripts/build_fulton_board_roster.py\`. The county publishes the board twice over — a district-grouped photo grid and hidden per-member popups carrying the e-mails — and the scraper joins the two halves by name, so thinner data fails a floor rather than shipping quietly. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
