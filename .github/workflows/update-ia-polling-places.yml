# Weekly re-read of the polling place the Iowa Legislature's statewide list
# names for each precinct, from the Legislative Services Agency's public
# IowaPollingPlaces layer, joined to the precinct map by precinct name within
# the county by ia/scripts/build_ia_polling_places.py, which writes
# ia/data/app/ia-polling-places.json.
#
# THE LIST IS FROM 2022: every row was last updated 2022-10-17 when this was
# added on Election Day, 2026-11-03, on Adam's ask. The card says so and links
# the Secretary of State's lookup. This job exists so that a newer list, if the
# Legislature publishes one, reaches the card with its own date; an unchanged
# list writes the same bytes and opens nothing. WEEKLY, NOT DAILY: the list has
# not moved in four years.
#
# THE TRIPWIRE: the build fails if fewer than 90% of the map's precincts are
# named, so a list that empties out or is renamed wholesale cannot ship as a
# short list.

name: Update Iowa polling places

on:
  schedule:
    - cron: "23 12 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-polling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install builder dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Rebuild the polling place file from the Legislature's list
        run: python3 ia/scripts/build_ia_polling_places.py

      - name: Validate app + data files
        run: |
          python3 ia/scripts/build_ia_polling_places.py --check
          python3 ia/scripts/validate_index.py ia/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- ia/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/ia-polling-places-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp ia/data/app/ia-polling-places.json /tmp/ia-polling-places.json
          git stash
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          cp /tmp/ia-polling-places.json ia/data/app/ia-polling-places.json
          git add ia/data/app/ia-polling-places.json
          git commit -m "Update Iowa polling places from the Legislature's list"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Iowa polling places from the Legislature's list" \
              --body "Automated weekly refresh of each Iowa precinct's polling place, generated by \`ia/scripts/build_ia_polling_places.py\` from the Legislative Services Agency's IowaPollingPlaces layer. Please review the diff before merging — it changes where the map tells voters to go, and the card's date comes from the list." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
