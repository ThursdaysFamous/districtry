# Daily refresh of each North Carolina precinct's Election Day polling place,
# read from the State Board of Elections' polling place list for the election
# (dl.ncsbe.gov/ENRS/2026_11_03/polling_place_20261103.csv, re-written by the
# Board daily) and joined to the precinct map by code through the Board's
# Voting Information Project feed, by nc/scripts/build_nc_polling_places.py,
# which writes nc/data/app/nc-polling-places.json.
#
# DAILY, NOT WEEKLY: a polling place that moves in the last week before an
# election is exactly when a reader needs the change. On 2026-10-24 Adam
# chose to add North Carolina's polling places before Election Day, Tuesday
# 2026-11-03, on the model of Illinois's daily Chicago check.
#
# THE TRIPWIRE: the build fails unless every precinct on the map has exactly
# one row in the Board's list, and every row lands on a map precinct or on
# the one precinct the builder records as drawn after the map (CARVED_OUT).
# What it cannot see: a building the Board moves without re-writing its list,
# and an address the Census geocoder places on the wrong block of the right
# street (the card prints the Board's address either way, and links the
# Board's own lookup as the final word).
#
# AFTER ELECTION DAY the Board may stop publishing the list. A failed read
# then is expected, so the job stays green and changes nothing; on or before
# the shipped election date a failed read fails the job.

name: Update North Carolina polling places

on:
  schedule:
    - cron: "45 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-polling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install builder dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Rebuild the polling place file from the Board's list
        id: build
        continue-on-error: true
        run: python3 nc/scripts/build_nc_polling_places.py

      - name: Fail a missed read before Election Day
        if: steps.build.outcome == 'failure'
        run: |
          git checkout -- nc/data/app/
          election=$(python3 -c "import json;print(json.load(open('nc/data/app/nc-polling-places.json'))['electionDate'])")
          today=$(TZ=America/New_York date +%F)
          if [[ "$today" > "$election" ]]; then
            echo "The list could not be read, and the shipped election ($election) is past; nothing to refresh."
          else
            echo "The list could not be read on $today, on or before the shipped election date $election."
            exit 1
          fi

      - name: Validate app + data files
        run: |
          python3 nc/scripts/build_nc_polling_places.py --check
          python3 nc/scripts/validate_index.py nc/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- nc/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/nc-polling-places-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp nc/data/app/nc-polling-places.json /tmp/nc-polling-places.json
          git stash
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          cp /tmp/nc-polling-places.json nc/data/app/nc-polling-places.json
          git add nc/data/app/nc-polling-places.json
          git commit -m "Update North Carolina polling places from the State Board of Elections' list"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update North Carolina polling places from the State Board of Elections' list" \
              --body "Automated daily refresh of each North Carolina precinct's Election Day polling place, generated by \`nc/scripts/build_nc_polling_places.py\` from the State Board of Elections' polling place list for the election. Please review the diff before merging — it changes where the map tells voters to go. The build fails if the Board's list and the precinct map stop naming the same precincts." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
