name: Update Knox County Board roster

# Weekly refresh of the Knox County Board District card's member roster
# (il/data/app/knox-county-board-members.json), fetched by index.html.
#
# THE ROSTER IS THE ROLL CALL OF THE COUNTY'S OWN BOARD MINUTES. Knox publishes
# a member page listing all fifteen seats with district and contact details, and
# this project may not read it: knoxcountyil.gov answers 403 to every automated
# client and the Internet Archive never captured it. The same website's
# DOCUMENTS are served from its Revize CMS with no block at all, and every set
# of minutes opens with a roll call naming each seat by district. So this reads
# the county's own record of who sat, rather than a page nobody may fetch.
#
# ABSENT MEMBERS ARE MEMBERS. The scraper parses the absent list exactly like
# the present list — a seat is not vacated by missing a meeting, and reading
# only the present block would ship fourteen seats and call the county complete.
# Attendance itself never ships.
#
# THE ARCHIVE IS SPARSE, so the scraper walks months newest-first from the run
# date and takes the first that parses instead of assuming a filename. A run
# that finds nothing in thirty months fails loudly rather than writing a thin
# file — that state means the CMS moved and a human needs to look.
#
# WHAT THIS RUN DOES NOT TOUCH: the district geometry. Knox's five districts are
# built from the county's adopted 2022 map and the city of Galesburg's own
# published polygons (scripts/build_knox_board_districts.py, an operator step
# with its own --check). A redistricting would need a human read of a new map,
# not a scrape.
#
# If anything changed, this opens a PR rather than committing to main:
# officeholder data gets a human look before it ships.

on:
  schedule:
    - cron: "0 20 * * 0" # Sunday 20:00 UTC (after washington 16:00, cass 17:00, coles 18:00, warren 19:00)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI; falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # FULL history, because this job regenerates sitemap.xml and
          # build_sitemap.py reads each page's lastmod from that file's own last
          # commit. Under the default depth-1 checkout git reports the single
          # fetched commit as the last commit of EVERY file, so every one of the
          # 243 entries takes today's date. Measured 2026-09-19 by building the
          # sitemap in a depth-1 clone: 243 of 243 lastmods moved, against 0 in a
          # full clone, where `build_sitemap.py --check` passes. A bot run on
          # 2026-09-17 shipped 241 wrong dates this way.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # requests fetches the CMS; pymupdf reads the minutes' text layer. The
        # minutes are real PDFs, not a page, so there is no HTML parser here for
        # a redesign to break.
        run: pip install -c scripts/requirements.txt requests pymupdf

      - name: Read Knox County's board minutes
        run: python3 scripts/knox_county_board_scraper.py -o /tmp/knox_county_board_raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_knox_county_board_roster.py --raw /tmp/knox_county_board_raw.json

      # Gate the regenerated data before it can reach a PR.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR.
          branch="bot/knox-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          # Full history, for the same reason as fetch-depth: 0 above. `git fetch
          # --depth=1` RE-SHALLOWS a clone that was fetched complete (measured:
          # 512 commits down to 13), so the two have to move together — deepening
          # the checkout alone would be undone here.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          # docs/EAM_STATUS.md counts the districts this roster names, so a
          # county gaining or losing a member moves it and the smoke gate's
          # `build_eam_status.py --check` fails on this PR. See that script's
          # check_workflows(), which is what names this job.
          python3 scripts/build_eam_status.py
          git add il/data/app/knox-county-board-members.json il/county-board il/county-board.html about.html sitemap.xml docs/EAM_STATUS.md
          git commit -m "Update Knox County Board roster from the county's board minutes"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Knox County Board roster from the county's board minutes" \
              --body "Automated weekly refresh of the Knox County Board District card's member roster, generated by \`scripts/knox_county_board_scraper.py\` + \`scripts/build_knox_county_board_roster.py\`. Please review the diff before merging — this changes data about real officeholders. Knox's member page cannot be read by any automated client, so every name here comes from the roll call of the county's own board minutes, and each row names the meeting it came from. A changed name means either a new member or a new set of minutes; check which before merging." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
