name: Update IA county board chair roster

# Weekly refresh of which supervisor chairs each Iowa county board
# (ia/data/app/ia-county-board-chairs.json, joined by name onto the County
# Supervisor card's board block).
#
# WHY THIS IS A WEEKLY SCRAPE AND NOT AN E-MAIL TO 99 AUDITORS. The chair is
# chosen by the board's own vote at its January reorganisation, so a one-time
# answer from every county would be stale within the year. That is a different
# shape from the one-off dataset asks in docs/ASK_DRAFTS.md, and it is why the
# `ia-board-chair` gap record recorded NOT YET ASKED rather than drafting one.
# A page this app re-reads every Friday tracks a January vote; a 2026 reply
# does not.
#
# THIRTY-NINE OF NINETY-NINE, AND THE GAP STAYS OPEN for the rest. No statewide
# publisher records this at all: ISAC's member directory, which is where this
# app's supervisor names come from, has no chair field, and the auditors'
# association publishes auditors, who are not board members. So each county's
# own surfaces are the only source, and this run reads TWO of them.
#
# ROUTE ONE, THE BOARD PAGE, answers 35: 17 counties are unreachable to this
# client, 39 name no chair anywhere a machine can find, and 7 have no
# supervisor roster to gate against.
#
# ROUTE TWO, THE COUNTY'S OWN MINUTES, ships 5 more, and it exists because
# route one missed the biggest counties in the state. Of the ten largest with
# no chair, seven had a board page that never uses the word, two refused the
# client and one has no roster. Their MINUTES are a second statutory surface,
# and Iowa boards open them with an attendance line naming the chair outright
# — the Knox shape from the Illinois work. Cerro Gordo, Clinton, Dallas, Des
# Moines and Johnson answer, and JOHNSON DOES NOT SHIP: its Granicus portal's
# robots.txt names four crawlers, allows each of them everything but /JSON.php,
# and ends `User-agent: * / Disallow: /`, so it refuses `districtry` on every
# path. The scraper asks before it fetches and never requests the page; the
# parser is fine and the chair it found is correct, and what is missing is
# permission. Polk (CivicClerk portal, every file endpoint shut
# to this client), Dubuque (client-side AgendaCenter whose own AJAX endpoint
# 404s), Warren (year tabs with no document links, and no roster either),
# Pottawattamie (Cloudflare 403) and STORY do not. Story is the one worth
# reading twice: its minutes are perfectly reachable and say "with Murken
# presiding", never "chair" — and who gavelled a meeting is not who holds the
# office, so it is refused on vocabulary rather than on reach.
#
# THE TWO ROUTES ARE FLOORED SEPARATELY. Four counties is a tenth of this
# file, so a pooled floor could not see the minutes route collapse behind the
# page route's healthy number. Where the two routes disagree about a county,
# the county is DROPPED with a printed line — two surfaces a county publishes
# itself naming different chairs is the case this project asks about rather
# than resolving by preference.
#
# WHAT THIS RUN IS REALLY WATCHING is whether a role can still be paired with
# a person on 35 hand-built county pages and in four counties' minutes. Three
# structural tests decide the page route and each exists because a plausible
# answer would otherwise ship:
#
#   * CONTAINMENT — role and name must share the smallest DOM element that
#     holds no OTHER supervisor. Scott County's board page wraps each member's
#     panel in a copy of a 3,385-character navigation menu.
#   * DIRECTION — a role word standing BEFORE a name is refused when a
#     person-shaped phrase stands before IT. Shelby County publishes an EMS
#     board reading `Tim Plumb, Chairman Bryce Schaben, Vice-Chairman`, where a
#     chair word sits ONE character from a supervisor and belongs to the man in
#     front of it. This is the Franklin trap, and the earlier attempt at this
#     file walked straight into it and shipped Keokuk's vice-chairman.
#   * PROXIMITY — at most 30 characters apart. Widest true pairing measured 28
#     (Muscatine, two under the cap); tightest false one 84, exactly three
#     times that.
#
# AND ONE TEST THAT IS NOT STRUCTURAL AT ALL, which no structural test can
# replace: the page has to be the BOARD's page. Des Moines County's
# boards-and-commissions page reads `Tom Broeker, Chair` — his chairmanship of
# a different body — while the county's own minutes of 25 August 2026 open
# "with Chair Shane McCampbell, Vice-Chair Tom Broeker". All three tests above
# passed that pairing, because as a pairing it is clean. Only excluding the
# page catches it, and only an independent document found it.
#
# THE MINUTES ROUTE HAS ITS OWN VERSION OF THE FRANKLIN TRAP, and it is made
# by flattening rather than by markup. Des Moines County signs its minutes
#
#     Shane McCampbell, Chair
#     Tom Broeker, Vice Chair
#
# which flattens to `Shane McCampbell, Chair Tom Broeker, Vice Chair`, where
# the role word has a name on BOTH sides and each reading names a different
# supervisor. So every role occurrence is resolved in both directions and
# refused when they disagree; the attendance line, where the role has a name
# on one side only, is what settles the county. Two further refusals: a role
# preceded by "Vice" is never the chair, and the name must TOUCH the role —
# nothing but whitespace, a comma or "/s/" between them — because Clinton's
# "MOTION by Supervisor Irwin to authorize the Chairperson to sign" puts a
# supervisor's name 18 characters from a chair word. And two documents, not
# one: each county's two most recent minutes are read independently and must
# name the same chair.
#
# THE BUILDER RE-GATES ON THE ROSTER. A chair who is not on that county's own
# supervisor list in ia-county-officers.json is dropped, not carried forward:
# the two files refresh on separate schedules, and the card joins by NAME, so
# a chair who leaves the board stops rendering rather than sliding onto
# whoever now holds their position in the list.

on:
  schedule:
    - cron: "30 18 * * 5" # Friday 18:30 UTC (an hour after the city-officials sweep)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers). Falls back to github.token when
      # the secret is absent, so the refresh still runs — it just goes back to
      # opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # pdfplumber for the minutes route: county minutes are PDFs. It is
      # already pinned for the sheriff and county-attorney directories, so
      # this adds no new dependency to the weekly job.
      - name: Install dependencies
        run: pip install -c ia/scripts/requirements.txt requests pdfplumber

      - name: Sweep every county's own board-of-supervisors page
        run: python3 ia/scripts/ia_county_chair_scraper.py

      - name: Read the board minutes the page route misses
        run: python3 ia/scripts/ia_county_minutes_chair_scraper.py

      - name: Rebuild the chair roster (re-gated on each county's supervisors)
        run: python3 ia/scripts/build_ia_county_chair.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present,
      # well formed and cached in exactly one service-worker list.
      - name: Validate app + data files
        run: python3 ia/scripts/validate_index.py ia/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- ia/data/app/ia-county-board-chairs.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # THE PR BODY IS AN env: BLOCK SCALAR, NOT A SHELL STRING, AND THAT IS
          # LOAD-BEARING. A multi-line double-quoted string inside `run: |` puts
          # its continuation lines at column 0, which ENDS the block scalar —
          # GitHub then rejects the whole file as an invalid workflow and every
          # run instant-fails with zero jobs.
          PR_BODY: |
            Automated weekly refresh of which supervisor chairs each Iowa county board — `ia/data/app/ia-county-board-chairs.json`, generated by `ia/scripts/build_ia_county_chair.py` from `ia_county_chair_scraper.py` (each county's board page, 34 counties) and `ia_county_minutes_chair_scraper.py` (each county's own board minutes, 5 more).

            Please review the diff before merging — this changes data about real officeholders.

            **What a change here usually means.** Iowa boards elect their chair at the January reorganisation, so a swap in January is the expected event and is worth a quick look at the county's page. A swap at any other time of year is worth a closer one: it is more often a page being rebuilt than a board voting again.

            **What a COUNT change means.** Counties enter and leave this file as their pages and their minutes change shape, not as their boards change. A county appearing is a surface starting to name a chair somewhere a machine can pair; a county disappearing is the opposite, and neither is a claim that the board has or lacks a chair. The two routes are floored SEPARATELY — 30 of the 35 the board pages resolve, 3 of the 4 the minutes ship — so a route collapsing cannot hide behind the other's healthy number. A county the two routes DISAGREE about is dropped with a `CONFLICT` line in the build log, and that line is worth reading before anything else in this PR.

            **The name join is printed in the build log.** Four counties are matched across a diminutive or a shortened first name (Adams, Appanoose, Keokuk, Winneshiek), and the log prints each one as `roster <- page` so the join can be read rather than trusted.
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/ia-county-chair-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with — actions/checkout is shallow, and a meanwhile
          # change under .github/workflows/ reads as the push updating a
          # workflow, which a token without `workflow` scope is refused.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          git add ia/data/app/ia-county-board-chairs.json
          git commit -m "Update the Iowa county board chair roster from the counties' own board pages"
          git push -u origin "$branch" --force
          # Only open a PR if one isn't already open for this branch; if it is,
          # the force-push above already updated it.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update the Iowa county board chair roster from the counties' own board pages" \
              --body "$PR_BODY" \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
