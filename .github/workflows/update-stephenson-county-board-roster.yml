name: Update Stephenson County Board roster

# Weekly refresh of the Stephenson County Board District card's member roster
# (il/data/app/stephenson-county-board-members.json, fetched by index.html).
# Re-scrapes the county board page (district letter, name, phone,
# @stephensoncountyil.gov email, Chairman/Vice Chairman) and, if anything
# changed, opens a PR rather than committing directly to main — officeholder
# data should get a human look before it ships.
#
# TWO THINGS THE PAGE GETS WRONG THAT THE PIPELINE REFUSES TO PROPAGATE, so a
# diff touching either is worth reading carefully:
#   * One seat links a PREDECESSOR'S e-mail (District C's member carries
#     tmckenna@). Any mailto whose local part does not contain the member's
#     surname is dropped, not published — the alternative is putting a real,
#     wrong person's inbox on a card.
#   * District G's second seat reads "Vacant". Vacancies are counted, never
#     named.
#
# Only the ROSTER is on a cron. The other half of this county's card —
# il/data/app/stephenson-county-board-districts.json — is a RARE OPERATOR STEP, not
# a weekly one: four of its eight districts are georeferenced off the county's
# adopted vector-PDF map (scripts/build_stephenson_board_districts.py), which
# needs pymupdf and numpy and the PDFs archived in data/source/raw/. Re-run it
# when the county reapportions, or delete it if Stephenson ever publishes real
# precinct geometry.

on:
  schedule:
    - cron: "0 14 * * 0" # Sunday 14:00 UTC (staggered from DuPage at Sun 13:00)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # The board page is static, server-rendered Revize HTML — no JS and no
        # challenge — so requests alone, parsed with the stdlib re module.
        run: pip install -c scripts/requirements.txt requests

      - name: Scrape Stephenson County Board member roster
        run: python3 scripts/stephenson_county_board_scraper.py /tmp/stephenson_county_board_raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_stephenson_county_board_roster.py /tmp/stephenson_county_board_raw.json

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present and
      # well formed.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/stephenson-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_sitemap.py
          git add il/data/app/stephenson-county-board-members.json il/county-board il/county-board.html sitemap.xml
          git commit -m "Update Stephenson County Board roster from stephensoncountyil.gov"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Stephenson County Board roster from stephensoncountyil.gov" \
              --body "Automated weekly refresh of the Stephenson County Board District card's member roster (district letter, name, phone, published email, Chairman/Vice-Chairman role), generated by \`scripts/stephenson_county_board_scraper.py\` + \`scripts/build_stephenson_county_board_roster.py\`. Please review the diff before merging — this changes data about real officeholders. Note that districts are LETTERED B-I (there is no District A), that the pipeline drops any e-mail whose local part does not match the member's surname (one seat currently links its predecessor's address), and that a vacant seat is counted rather than named." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
