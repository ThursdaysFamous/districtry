name: Update city portal tiles

# Weekly re-mirror of the Chicago, New York City and San Francisco open-data
# portal layers the apps draw from vector tiles (scripts/mirror_portal_tiles.py,
# docs/OPTIMIZATION_PLAYBOOK.md §10 phase 6c). Opens a PR, never commits to main.
#
# A PR opens ONLY WHEN A PORTAL'S DATA CHANGED. The script hashes each fetched
# set in a canonical form and rebuilds only a layer whose hash moved, so a
# quiet week writes nothing — and it must, because tippecanoe does not write
# identical bytes twice, so a rebuild of unchanged data would be a PR of
# noise. When a set does move (a redrawn precinct map, a new school year's
# zones) the layer's archive is rebuilt and gated by build_vector_tiles.py's
# own gate against the set just fetched, the record is rewritten, and each app
# whose archive was REPLACED gets its service-worker cache name moved on,
# without which a returning visitor would go on reading the old archive.
#
# THESE SETS MOVE MORE OFTEN THAN THE CENSUS ONES. A school year's attendance
# zones are republished annually and a city's precincts are redrawn after a
# ward remap, so a diff here is more often real than in the TIGER job — read
# the feature counts in portal-mirror.json before merging.
#
# A RED RUN MEANS A FETCH OR A GATE FAILED: nothing is written for a layer
# that failed, and the script exits non-zero naming it.
# scripts/check_roster_workflow_health.py discovers this workflow like any
# other and reports it when it stays red.

on:
  schedule:
    - cron: "17 11 * * 0" # Sunday 11:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI; a PR opened with the default GITHUB_TOKEN fires no workflows.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install tippecanoe and the tile readers
        run: |
          # the runner image's Google Chrome apt source once served a Packages
          # file whose hash did not match its Release file (smoke-test.yml)
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
               \( -name '*.list' -o -name '*.sources' \) \
               -exec grep -q 'dl\.google\.com' {} \; -print -delete 2>/dev/null || true
          sudo apt-get update -q
          sudo apt-get install -y -q tippecanoe
          pip install -c scripts/requirements.txt shapely numpy mapbox-vector-tile pmtiles jsonschema

      - name: Re-mirror every portal layer
        timeout-minutes: 45
        run: |
          python3 scripts/mirror_portal_tiles.py --refresh
          python3 scripts/mirror_portal_tiles.py --check

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/portal-tiles-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A portal-mirror.json '*/data/app/tiles/*.pmtiles' \
                    metro-worksheet.json '*/metro-worksheet.json' '*/sw.js' '*/index.html' \
                    '*/sources.html' CLAUDE.md README.md
          git commit -m "Update the city open-data portal tile archives"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --title "Update the city open-data portal tile archives" \
              --body "Automated weekly re-mirror by \`scripts/mirror_portal_tiles.py\`: at least one Chicago, New York City or San Francisco portal set the apps draw from tiles changed since it was last built. Each changed layer's archive was rebuilt and gated against the set just fetched; \`portal-mirror.json\` records what was fetched and by which route, and each app whose archive was replaced carries a new service-worker cache name. Check the \`portal-mirror.json\` diff for which layers moved and by how many features before merging." \
              --base main --head "$branch"
          fi
