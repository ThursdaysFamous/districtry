name: Update NY congressional roster

# Weekly rebuild of ny/data/app/congress-roster.json (NY U.S. House delegation) from
# the public congress-legislators dataset. Opens a PR rather than committing to
# main (METRO_EXPANSION_PLAYBOOK §9). Stdlib only.
#
# THE `ny-` PREFIX IS LOAD-BEARING. GitHub Actions reads workflows only from
# the repository ROOT's .github/workflows, so this file has to live here to run
# at all — and at the root it shares a namespace with the other two instances.
# Five basenames collided when the forks were imported as folders
# (deploy-pages, smoke-test, engine-bump, update-congress-roster,
# validate-sources), and a collision is worse than a duplicate: the root copy
# wins, so NYC's refresh would look present and quietly run Chicago's.
# Every path below is instance-scoped for the same reason — `ny/scripts/…`,
# `ny/data/app/…`, and a `bot/ny-…` branch that cannot clash with
# another instance's PR branch.

on:
  schedule:
    - cron: "30 13 * * 1" # Monday 13:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every bot PR with
      # zero checks. Both halves matter: the create fires `pull_request`, and
      # the force-push onto the fixed bot/* branch fires `synchronize`. Falls
      # back to github.token when the secret is absent, so the workflow still
      # runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # FULL history, because this job regenerates sitemap.xml and
          # build_sitemap.py reads each page's lastmod from that file's own last
          # commit. Under the default depth-1 checkout git reports the single
          # fetched commit as the last commit of EVERY file, so every one of the
          # 243 entries takes today's date. Measured 2026-09-19 by building the
          # sitemap in a depth-1 clone: 243 of 243 lastmods moved, against 0 in a
          # full clone, where `build_sitemap.py --check` passes. A bot run on
          # 2026-09-17 shipped 241 wrong dates this way.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Rebuild congress roster
        run: python3 ny/scripts/build_congress_roster.py
      - name: Validate app + data files
        run: python3 ny/scripts/validate_index.py ny/index.html
      - name: Check for changes
        id: diff
        run: git diff --quiet -- ny/data/app/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/ny-congress-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          # Full history, for the same reason as fetch-depth: 0 above. `git fetch
          # --depth=1` RE-SHALLOWS a clone that was fetched complete (measured:
          # 512 commits down to 13), so the two have to move together — deepening
          # the checkout alone would be undone here.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # The legislator page carries a GENERATED table of every member in
          # this roster, so regenerate it here or the smoke gate's
          # `build_officeholder_tables.py --check` fails on this PR with a
          # table naming last week's members. The sitemap follows, because that
          # page is in it and its lastmod is the file's own last commit.
          python3 scripts/build_officeholder_tables.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add ny/data/app/congress-roster.json ny/congress.html about.html sitemap.xml
          git commit -m "Update NY congressional roster from congress-legislators"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --title "Update NY congressional roster" \
              --body "Automated weekly refresh of NY's U.S. House delegation (\`ny/scripts/build_congress_roster.py\`). Review before merging." \
              --base main --head "$branch"
          fi
