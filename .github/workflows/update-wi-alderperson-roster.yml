name: Update WI alderperson roster

# Weekly refresh of the aldermanic-district card's roster
# (wi/data/app/wi-alderpersons.json) — the 18 municipalities whose routes are
# verified and witnessed. The six of 2026-08-26:
#
#   * Milwaukee — the city's Legistar API (its GIS layer was retired
#     2026-09-05 when the host was found to disallow all crawling), with the
#     same data's open-data CKAN shapefile as corroboration where it answers.
#   * Madison — each alder's own /council/districtN page (the index's flat
#     pairing is a measured off-by-one trap around the vacant seat).
#   * Green Bay — the staff directory, parsed per entry container.
#   * Kenosha — the city GIS's elected-representation layer, WITNESSED
#     against the county's certified April 2026 canvass (pdfplumber,
#     positional parse); a divergence fails unless pinned with its story.
#   * Racine and Waukesha — their own council pages, readings pinned.
#
# And the twelve of 2026-09-05 — Stevens Point, Menomonie, Manitowoc,
# Sheboygan, Superior, Portage, Viroqua, Menasha, Howard (village trustees),
# Tomah, Eau Claire and Appleton — each hand-read before its parser was
# written. The first eleven came out of a robots-first sweep of all 149
# then-unrostered districted municipalities; Appleton came a day later, when
# the geometry its names ride could finally be drawn.
# Two of them, Menomonie and Viroqua, number their seats by WARD, so the run
# WITNESSES ward-is-district against LTSB's ward layer and fails those two
# rather than shipping a plausible wrong answer if a re-warding breaks it.
#
# A municipality whose page reshapes fails ITS OWN GATE AND THE WHOLE RUN, and
# that is deliberate. CORRECTED 2026-09-05: a version of this comment claimed
# the failure was isolated per municipality. It is not. `attempt()` catches
# `Exception`, every gate raises `SystemExit`, and `SystemExit` is a
# `BaseException` — so a NETWORK failure is isolated and carried forward, while
# a GATE failure ends the run. The catch is NOT widened to cover it: a page that
# has reshaped is a reading that has stopped being true, and stopping is the
# safe answer. Read the failure, fix the pinned reading, never loosen a floor to
# get green.

on:
  schedule:
    - cron: "30 15 * * 4" # Thursday 15:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -c wi/scripts/requirements.txt pdfplumber

      - name: Scrape the 18 municipalities
        run: python3 wi/scripts/wi_alderperson_scraper.py

      - name: Rebuild the alderperson roster
        run: python3 wi/scripts/build_wi_alderperson_roster.py

      - name: Validate app + data files
        run: python3 wi/scripts/validate_index.py wi/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- wi/data/app/wi-alderpersons.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/wi-alderperson-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          # docs/EAM_STATUS.md counts the municipalities this roster names, so
          # a refresh that moves a count fails the smoke gate's
          # `build_eam_status.py --check` on this PR unless it is rebuilt here
          # (#1572 went red that way on 2026-10-15).
          python3 scripts/build_eam_status.py
          git add wi/data/app/wi-alderpersons.json docs/EAM_STATUS.md
          git commit -m "Update WI alderperson roster from the municipalities' own surfaces"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update WI alderperson roster from the municipalities' own surfaces" \
              --body "Automated weekly refresh of the aldermanic-district card's roster, generated by \`wi/scripts/build_wi_alderperson_roster.py\` from \`wi_alderperson_scraper.py\` across 18 municipalities (Milwaukee Legistar with the city's open-data shapefile as corroboration, Madison district pages, Green Bay directory, Kenosha GIS + certified-canvass witness, the Racine and Waukesha council pages, and the twelve added 2026-09-05). Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
