name: Update county commissioners (NC)

# Weekly refresh of the North Carolina County card's names
# (nc/data/app/nc-county-commissioners.json, fetched by nc/index.html). The
# names are the winners of each seat's most recent election in the North
# Carolina State Board of Elections' results, each dated to that election,
# rebuilt by nc/scripts/build_nc_county_commissioners.py. If anything changed
# it opens a PR rather than committing directly to main — officeholder data
# gets a look before it ships. A general is read only once its winners have
# taken office (the first Monday in December after the election), so the
# November 2026 results land here on the first run after 7 December 2026.
# Between 3 November and then, the 2026 filing list the builder uses as a
# witness may go stale against a board that has not changed; a red run in
# that window is the builder asking for a person, not a broken source.

on:
  schedule:
    - cron: "30 15 * * 3" # Wednesday 15:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR runs CI; see
      # update-nc-congress-roster.yml for why.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Rebuild county commissioners
        run: python3 nc/scripts/build_nc_county_commissioners.py

      - name: Validate app + data files
        run: |
          python3 nc/scripts/build_nc_county_commissioners.py --check
          python3 nc/scripts/validate_index.py nc/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- nc/data/app/nc-county-commissioners.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/nc-county-commissioners-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          python3 scripts/build_llms_txt.py
          python3 scripts/build_eam_status.py
          git add nc/data/app/nc-county-commissioners.json nc/county-commissioner nc/county-commissioner.html about.html sitemap.xml llms.txt docs/EAM_STATUS.md
          git commit -m "Update North Carolina county commissioners from State Board results"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update North Carolina county commissioners from State Board results" \
              --body "Automated weekly refresh of the North Carolina county commissioner names, generated by \`nc/scripts/build_nc_county_commissioners.py\` from the North Carolina State Board of Elections' results and candidate filing lists. Each name is the winner of that seat's most recent election and is dated to it. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
