name: Update IA supervisor district roster

# Weekly refresh of ia/data/app/ia-supervisor-members.json — which supervisor
# holds each county supervisor district, read by ia/index.html's County
# Supervisor District card.
#
# PLAN 3 COUNTIES ONLY, and that is a legal distinction rather than a scoping
# convenience. Iowa Code 331.206 gives each county three choices: plan 1 elects
# at large with no districts at all, plan 2 elects COUNTYWIDE with supervisors
# merely residing in a district, and plan 3 has each district elect its own
# supervisor. Only under plan 3 does naming a district's supervisor tell a
# reader something the County card's board listing does not already tell them.
#
# THE NAMES DO NOT COME FROM THE PAGES THIS JOB READS. Every supervisor is
# carried over from ia-county-officers.json, which is gated in its own build
# against Iowa Code 331.201's legal board sizes and against the shipped
# district geometry. The scraper recovers exactly one thing — a district
# NUMBER — by proximity to names already known, which is why it needs no
# per-county HTML parser for the four-plus CMSes Iowa's counties run.
#
# A RED RUN HERE IS USUALLY A COUNTY, NOT A BUG. Roughly half the plan 3
# counties publish a keyable page; the rest refuse this client, sit behind a
# captcha, or name no district anywhere. The builder's floors are set well
# under the measured yield so that ordinary churn passes and a SYSTEMIC break
# (the proximity rule, the roster read, a blocked network) fails. Read the
# scraper's per-county skip reasons before changing any threshold.

on:
  schedule:
    - cron: "30 17 * * 6" # Saturday 17:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # FULL history, because this job regenerates sitemap.xml and
          # build_sitemap.py reads each page's lastmod from that file's own last
          # commit. Under the default depth-1 checkout git reports the single
          # fetched commit as the last commit of EVERY file, so every one of the
          # 243 entries takes today's date. Measured 2026-09-19 by building the
          # sitemap in a depth-1 clone: 243 of 243 lastmods moved, against 0 in a
          # full clone, where `build_sitemap.py --check` passes. A bot run on
          # 2026-09-17 shipped 241 wrong dates this way.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -c ia/scripts/requirements.txt requests

      - name: Scrape each plan 3 county's own board page
        run: python3 ia/scripts/ia_supervisor_district_scraper.py

      - name: Rebuild the supervisor district roster
        run: python3 ia/scripts/build_ia_supervisor_roster.py

      - name: Validate app + data files
        run: python3 ia/scripts/validate_index.py ia/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- ia/data/app/ia-supervisor-members.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR.
          branch="bot/ia-supervisor-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          # Full history, for the same reason as fetch-depth: 0 above. `git fetch
          # --depth=1` RE-SHALLOWS a clone that was fetched complete (measured:
          # 512 commits down to 13), so the two have to move together — deepening
          # the checkout alone would be undone here.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board of supervisors pages (ia/county-supervisor/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          # llms.txt COUNTS the per-county pages, so a county dropping out of
          # the roster moves that number — and this builder tolerates a county
          # going dark, so it happens on an ordinary weekly run. It did on
          # 2026-09-19: Bremer and Hamilton left on recorded robots refusals,
          # 220 per-county pages became 218, and the bot PR failed
          # build_llms_txt.py --check on a change nobody wrote. Michigan's
          # workflow has carried this step and this reason since it hit the
          # same thing; 61 of the 63 workflows that regenerate county pages
          # still do not, and no gate asks them to.
          python3 scripts/build_llms_txt.py
          git add ia/data/app/ia-supervisor-members.json ia/county-supervisor ia/county-supervisor.html about.html sitemap.xml llms.txt
          git commit -m "Update IA supervisor district roster"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update IA supervisor district roster" \
              --body "Automated weekly refresh of which supervisor holds each Iowa county supervisor district, generated by \`ia/scripts/build_ia_supervisor_roster.py\` from each plan 3 county's own board page. Names come from the already-gated \`ia-county-officers.json\`; only the district number is recovered here. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
