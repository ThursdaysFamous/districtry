name: Update Virginia legislature roster

# Weekly refresh of the Senate of Virginia + House of Delegates rosters
# (va/data/app/va-senate-members.json and va-house-members.json, fetched by
# va/index.html's chamber cards). Rebuilds both chambers from each chamber's
# own member list and member pages and — if anything changed — opens a PR
# rather than committing directly to main.
#
# The Senate comes from apps.senate.virginia.gov (its member list, then one
# page per senator) and the House from house.vga.virginia.gov (its member
# list, then one page per delegate), about 140 pages at one request a second
# per host. Neither host states a Crawl-delay (read 2026-10-29); the builder
# reads each robots.txt first and would honour one if it appeared.
#
# A seat a chamber shows as vacant ships as a vacancy record naming that
# chamber's own list; the builder never reads a member's district office,
# staff or biography, which the pages also carry.
#
# THE REBUILT FILES ARE CARRIED ACROSS THE BRANCH CUT RATHER THAN SCRAPED A
# SECOND TIME, the update-ilga-roster.yml pattern: a second pass would ask the
# chambers' servers for the same pages again for nothing. A run where main
# changed those same files meanwhile errors at the checkout instead of
# pushing, which is right.
#
# THE PAGE STEPS LANDED WITH THE GO-LIVE CHANGE.
# `va/state-legislature.html` carries a GENERATED table of both rosters, and
# `about.html` and `sitemap.xml` count them, so all three are regenerated here
# and staged in the same `git add`.

on:
  schedule:
    - cron: "7 19 * * 2" # Tuesday 19:07 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    # A few minutes at one request a second; bounded so a run that hangs dies
    # visibly rather than holding a runner for six hours.
    timeout-minutes: 60
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # requests for the builder's session (it retries a reset or a timeout).
      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Rebuild Virginia Senate + House of Delegates rosters
        run: python3 va/scripts/build_va_legislature_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, every data/app file must be present and
      # well formed, and every seat must carry a record.
      - name: Validate app + data files
        run: |
          python3 va/scripts/validate_index.py va/index.html
          python3 scripts/validate_chamber_rosters.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- va/data/app/va-senate-members.json va/data/app/va-house-members.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/va-legislature-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut from main's current tip, with full history — see the sibling
          # workflows' own comments for why both halves matter. The two rebuilt
          # files ride across the checkout as working-tree changes.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          python3 scripts/build_officeholder_tables.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add va/data/app/va-senate-members.json va/data/app/va-house-members.json va/state-legislature.html about.html sitemap.xml
          git commit -m "Update Virginia Senate + House of Delegates rosters from the General Assembly"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Virginia Senate + House of Delegates rosters" \
              --body "Automated weekly refresh of the Senate of Virginia and House of Delegates chamber cards' rosters, from each chamber's own member list and member pages, generated by \`va/scripts/build_va_legislature_roster.py\`. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
