name: Update MI legislature roster

# Weekly refresh of the Michigan Senate + House rosters
# (mi/data/app/mi-senate-members.json and mi-house-members.json, fetched by
# mi/index.html's chamber cards). Rebuilds both chambers from the Open States
# current-people export (mi.csv), enriched with each member's Capitol
# phone/e-mail from their own senate.michigan.gov profile page, and — if anything
# changed — opens a PR rather than committing directly to main.

on:
  schedule:
    - cron: "30 15 * * 2" # Tuesday 15:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # FULL history, because this job regenerates sitemap.xml and
          # build_sitemap.py reads each page's lastmod from that file's own last
          # commit. Under the default depth-1 checkout git reports the single
          # fetched commit as the last commit of EVERY file, so every one of the
          # 243 entries takes today's date. Measured 2026-09-19 by building the
          # sitemap in a depth-1 clone: 243 of 243 lastmods moved, against 0 in a
          # full clone, where `build_sitemap.py --check` passes. A bot run on
          # 2026-09-17 shipped 241 wrong dates this way.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Michigan's Legislature site carries no single listing page with every
      # member's office block the way Wisconsin's does — each of the ~149
      # current members needs its own profile-page fetch
      # (senate.michigan.gov/legislators/legislator?personID=<id>, the ids sourced
      # from the Open States CSV's own links column). The scrape runs FIRST;
      # the builder merges it field by field, so a scrape failure here fails
      # the run rather than silently shipping the bare Open States base.
      - name: Scrape the Senate's own all-senators directory
        run: python3 mi/scripts/mi_senate_scraper.py

      # Floors 45/93 against the 50/100 seats, tolerating transient vacancies.
      - name: Rebuild MI Senate + House rosters
        run: python3 mi/scripts/build_mi_legislature_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present
      # and well formed. node is preinstalled on ubuntu-latest.
      - name: Validate app + data files
        run: python3 mi/scripts/validate_index.py mi/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- mi/data/app/mi-senate-members.json mi/data/app/mi-house-members.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/mi-legislature-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          # Full history, for the same reason as fetch-depth: 0 above. `git fetch
          # --depth=1` RE-SHALLOWS a clone that was fetched complete (measured:
          # 512 commits down to 13), so the two have to move together — deepening
          # the checkout alone would be undone here.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # The legislator page carries a GENERATED table of every member in
          # this roster, so regenerate it here or the smoke gate's
          # `build_officeholder_tables.py --check` fails on this PR with a
          # table naming last week's members. The sitemap follows, because that
          # page is in it and its lastmod is the file's own last commit.
          python3 scripts/build_officeholder_tables.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add mi/data/app/mi-senate-members.json mi/data/app/mi-house-members.json mi/state-legislature.html about.html sitemap.xml
          git commit -m "Update MI Senate + House rosters from Open States"
          git push -u origin "$branch" --force
          # Only open a PR if one isn't already open for this branch; if it is,
          # the force-push above already updated it.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update MI Senate + House rosters from Open States" \
              --body "Automated weekly refresh of the Michigan legislature cards' rosters, generated by \`mi/scripts/build_mi_legislature_roster.py\` from the Open States current-people export (mi.csv) — name, party, district, e-mail and each member's own site for all 148 seats. The SENATE rows are additionally enriched by \`mi/scripts/mi_senate_scraper.py\` from the Michigan Senate's own all-senators directory (Capitol phone and office building, all 38 seats). THE HOUSE ROWS CARRY NO CAPITOL OFFICE BLOCK BY DESIGN: Open States publishes no capitol contact for any Michigan legislator, and house.mi.gov is not reachable from CI — see mi/WATCH.md. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
