name: Update Marshall County Board roster

# Weekly refresh of the Marshall County Board District card's member roster
# (il/data/app/marshall-county-board-members.json, fetched by index.html) — and,
# just as importantly, the weekly DRIFT CHECK on that county's derived district
# boundary.
#
# Marshall runs no public GIS; the shipped boundary is Census townships
# dissolved per the whole-township composition printed in the DISTRICT #n
# headings of the same roster PDF this job scrapes. The builder re-reads that
# composition every week and FAILS if it no longer matches the one compiled
# into scripts/build_marshall_board_districts.py, so a redistricting turns this
# job red instead of leaving the shipped lines quietly a cycle out of date.
#
# Marshall is the tightest binding the fleet has between a roster and the
# boundary derived from it: both are the SAME TABLE in the SAME document, so
# the county cannot publish a new roster under new districts without this check
# seeing both at once.
#
# Two things to watch in the log rather than the diff: the scraper parses the
# PDF POSITIONALLY (columns measured in points), so a re-laid-out table fails
# loudly with zero rows rather than silently mis-columning — and it deliberately
# never collects the HOME ADDRESSES the table prints for all twelve members
# (the Madison precedent).
#
# If the job fails on a composition change, the fix is to re-read the roster
# PDF, update DISTRICTS in build_marshall_board_districts.py, and regenerate
# il/data/app/marshall-county-board-districts.json.

on:
  schedule:
    - cron: "0 18 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI (a PR opened with the default GITHUB_TOKEN fires no workflows).
      # Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # pdfplumber: the roster exists only as a landscape PDF table, parsed
        # by measured column x-boundaries (see the scraper's module header).
        run: pip install -c scripts/requirements.txt requests pdfplumber

      - name: Scrape roster
        run: python3 scripts/marshall_county_board_scraper.py /tmp/raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_marshall_board_roster.py /tmp/raw.json

      # Gate the regenerated data before it can reach a PR.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR.
          branch="bot/marshall-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_sitemap.py
          git add il/data/app/marshall-county-board-members.json il/county-board il/county-board.html sitemap.xml
          git commit -m "Update Marshall County Board roster from marshallcountyillinois.gov"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Marshall County Board roster from marshallcountyillinois.gov" \
              --body "Automated weekly refresh of the Marshall County Board District card's member roster (3 districts, four members each, with phones, e-mails, officer roles and staggered term-expiry years), generated by \`scripts/marshall_county_board_scraper.py\` + \`scripts/build_marshall_board_roster.py\`. The same scrape re-checks the whole-township COMPOSITION the shipped boundary is dissolved from, so this job going red means a redistricting, not a broken scrape. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
