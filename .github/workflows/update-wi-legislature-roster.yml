name: Update WI legislature roster

# Weekly refresh of the Wisconsin Senate + Assembly rosters
# (wi/data/app/wi-senate-members.json and wi-assembly-members.json, fetched by
# wi/index.html's chamber cards). Rebuilds both chambers from the Open States
# current-people export (wi.csv) and, if anything changed, opens a PR rather
# than committing directly to main — officeholder data should get a human look
# before it ships.

on:
  schedule:
    - cron: "30 13 * * 2" # Tuesday 13:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # No third-party deps: the builder downloads wi.csv with stdlib urllib
      # and refuses to write an incomplete chamber (floors 31/94 against the
      # The legislature's own per-chamber pages carry the office fields the
      # Open States export measures 0/132 on for Wisconsin (Madison office
      # room, phones, fax, e-mail, the current session link). The scrape runs
      # FIRST; the builder merges it field by field, so a scrape failure here
      # fails the run rather than silently shipping the bare base.
      - name: Scrape the legislature's own office pages
        run: python3 wi/scripts/wi_legislature_scraper.py

      # 33/99 seats, tolerating transient vacancies).
      - name: Rebuild WI Senate + Assembly rosters
        run: python3 wi/scripts/build_wi_legislature_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present
      # and well formed. node is preinstalled on ubuntu-latest.
      - name: Validate app + data files
        run: python3 wi/scripts/validate_index.py wi/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- wi/data/app/wi-senate-members.json wi/data/app/wi-assembly-members.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/wi-legislature-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          # The legislator page carries a GENERATED table of every member in
          # this roster, so regenerate it here or the smoke gate's
          # `build_officeholder_tables.py --check` fails on this PR with a
          # table naming last week's members. The sitemap follows, because that
          # page is in it and its lastmod is the file's own last commit.
          python3 scripts/build_officeholder_tables.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add wi/data/app/wi-senate-members.json wi/data/app/wi-assembly-members.json wi/state-legislature.html about.html sitemap.xml
          git commit -m "Update WI Senate + Assembly rosters from Open States"
          git push -u origin "$branch" --force
          # Only open a PR if one isn't already open for this branch; if it is,
          # the force-push above already updated it.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update WI Senate + Assembly rosters from Open States" \
              --body "Automated weekly refresh of the Wisconsin legislature cards' rosters, generated by \`wi/scripts/build_wi_legislature_roster.py\` from the Open States current-people export (wi.csv) merged with the legislature's own per-chamber office pages (\`wi_legislature_scraper.py\` — Madison office, phones, fax, e-mail, current session link). Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
