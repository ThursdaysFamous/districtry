name: Update IA county-published city officials

# Weekly refresh of the mayors, clerks and council members NINE IOWA COUNTIES
# publish for the 98 cities inside them (ia/data/app/ia-county-city-officials.json,
# read by ia/index.html's City card).
#
# THE ROUTE THIS FILE REFRESHES WAS SITTING IN ITS OWN GAP RECORD. The
# `ia-municipal-officeholders` blocker named exactly one route as NOT YET
# PROBED — whether any of the 99 county auditors, Iowa's statutory commissioners
# of elections under Iowa Code 47.2, publishes a city-clerk list — and noted
# that seven counties' HOME pages had been fetched, "which is what a homepage
# looks like either way and settles nothing". Probed properly on 2026-09-05 it
# yields 98 cities against the eight this app could previously name.
#
# JASPER IS THE ONE TO READ BEFORE ADDING A COUNTY: its publisher is the county's
# ELECTION AUTHORITY on its own host, jaspercountyelections.iowa.gov, linked from
# jasperia.org -- a domain cited in three of this app's own data files while every
# host permuted from the auditor's MAIL domain failed. Consult the shipped data
# before permuting hostnames.
#
# THE CURRENCY GATE IS WHAT THIS RUN IS REALLY WATCHING, and it is dated rather
# than a hand list. Iowa city officers are elected in November of ODD years and
# take office the following January, so a page maintained since the last city
# election cannot still publish a term that has already ended. Three of the
# twelve counties that publish this page do — Sac (29 of 61 officials), Shelby
# (38 of 77) and Winnebago (22 of 51) — and all three show their four-year seats
# split across 2025 and 2027 where the other nine straddle 2027 and 2029: a
# page last maintained after the November 2023 election. So the builder refuses
# any county publishing one expired term, which means:
#
#   * a county that UPDATES its page starts shipping on the next run of this
#     workflow with nothing to edit anywhere, and
#   * a county that goes stale drops out the same way, loudly, via MIN_COUNTIES.
#
# The split that rule found was 0 against 29, 38 and 22 — no county sat near the
# line, which is itself evidence it measures maintenance rather than noise.
#
# THREE MARKUP TRAPS ARE GATED IN THE SCRAPER, each because a plausible-looking
# answer would otherwise ship:
#
#   * THE ROLE SITS IN TWO DIFFERENT PLACES AND THE COUNTY DECIDES WHICH.
#     SIX of the twelve put the clerk's and mayor's role in a <b> INSIDE the
#     name's own div (Boone 19, Crawford 32, Iowa 7, Jasper 40, Marion 16,
#     Winnebago 14); the other SIX put every role in a positionTitle heading.
#     "Crawford uses both" was NO DISTINCTION and is withdrawn — all six take
#     City Council from a heading and use the <b> for the non-council roles.
#     Read the div flat and the clerk becomes a person called "City Clerk
#     Sarah Miller"; key on the heading alone and, in those six, the clerk and
#     the mayor are filed as council members. The scraper reads the <b> when
#     there is one and falls back to the heading, so it needs neither to be
#     universal — which is the point, because neither is.
#   * THE SEAT FOLLOWS A <br/> IN THAT SAME DIV — 104 shipped officials carry the
#     ward or at-large seat their county states (117 across all twelve), which
#     no other Iowa source pairs with a name — so a parser reading the div's
#     text ships people whose surname appears to be "Ward".
#   * THE mailto: HREF IS EMPTY IN SOME COUNTIES AND POPULATED IN OTHERS, so the
#     address is read from the link TEXT, which is right either way. Measured
#     across the twelve: Boone (59) and Crawford (13) publish EMPTY hrefs,
#     Cerro Gordo (56), Jasper (37), Shelby (11) and Marion (8) publish POPULATED
#     ones, and the other five publish no mailto at all. An href-keyed scrape would return
#     an e-mail for nobody in two counties while every count guard still passed
#     — the shape that took Brown County's seven addresses out silently.
#
# AND THE BUILDER RE-TESTS EVERY ADDRESS against the name actually shipped:
# the officeholder's own name in the local part, or an office mailbox. The
# office test is WIDER here than in the city and county builders, because these
# are small towns whose office mailbox is the town's own name — plymouth@,
# ventura@, buckgrove@, dowcity@, cityofbussey@. It is still narrow enough to
# drop jbsauto@, mcfdmedic40@ and pst559@, and to drop Manilla's clerk Lori Jahn
# at laura@manillaia.com — a city-domain address carrying somebody else's first
# name, which is the whole reason the test runs against the SHIPPED name.
#
# THIS WORKFLOW IS EXPECTED TO GO RED, AND KNOWING WHEN IS THE POINT. Exactly
# nine counties are current and MIN_COUNTIES is 9, so ONE county letting its
# page go stale fails the build — not "a real collapse", one county. And every
# EVEN-YEAR JANUARY, when the terms elected in the previous November's city
# election begin, every one of the nine will publish terms that have just
# expired until it updates its page, so expect this to be red for days or weeks
# each cycle. That is the gate working. NEVER lower MIN_COUNTIES to get past it:
# the floor is what makes a county quietly going stale visible at all.
#
# This is 98 cities out of 939 and must never be described as a statewide
# roster: `ia-municipal-officeholders` stays open for the other 833, and the
# City card says so on every one of their cards.

on:
  schedule:
    - cron: "30 20 * * 4" # Thursday 20:30 UTC (19:30 is Cedar Rapids's)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the refresh still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -c ia/scripts/requirements.txt requests beautifulsoup4

      - name: Scrape the twelve counties' city-officials pages
        run: python3 ia/scripts/ia_county_city_officials_scraper.py

      - name: Rebuild the roster (expired-term gate, then every address re-witnessed)
        run: python3 ia/scripts/build_ia_county_city_officials.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present,
      # well formed and cached in exactly one service-worker list.
      - name: Validate app + data files
        run: python3 ia/scripts/validate_index.py ia/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- ia/data/app/ia-county-city-officials.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # THE PR BODY IS AN env: BLOCK SCALAR, NOT A SHELL STRING, AND THAT IS
          # LOAD-BEARING. A multi-line double-quoted string inside `run: |` puts
          # its continuation lines at column 0, which ENDS the block scalar —
          # GitHub then rejects the whole file as an invalid workflow and every
          # run instant-fails with zero jobs. Two Iowa refreshes shipped that
          # way and never executed a step; scripts/validate_workflow_deps.py
          # now refuses it.
          PR_BODY: |
            Automated weekly refresh of the City card's officials block for the 98 Iowa cities whose own COUNTY publishes their mayor, clerk and council — generated by `ia/scripts/build_ia_county_city_officials.py` from `ia_county_city_officials_scraper.py`.

            Please review the diff before merging — this changes data about real officeholders.

            **Three things worth reading closely here.**

            A county appearing or disappearing is the expired-term gate firing, not a scrape failure. Twelve counties publish this page; a county ships only if it publishes no term that has already ended. Sac, Shelby and Winnebago fail that test today, and if one of them starts passing it is because the county updated its page — which is the outcome this gate exists to notice.

            A name changing spelling matters more than usual: the shipped e-mail addresses are witnessed against the name they are attached to, so a scrape that slips a name will also silently re-witness an address.

            A seat (`Ward 3`, `At Large`) is published by the county and shipped on the row. It is not geometry and makes no claim about where a reader is standing — the `city-ward` layer is still only the three cities whose boundaries this app has.

            This is **98 cities out of 939** and must not be described as a statewide roster; `ia-municipal-officeholders` stays open for the other 833.
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/ia-county-city-officials-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, and if main gains a
          # .github/workflows/ change meanwhile, the branch ends up differing
          # from main THERE too — which GitHub reads as the push updating a
          # workflow and refuses for a token without `workflow` scope.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          git add ia/data/app/ia-county-city-officials.json
          git commit -m "Update the county-published Iowa city officials roster"
          git push -u origin "$branch" --force
          # Only open a PR if one isn't already open for this branch; if it is,
          # the force-push above already updated it.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update the county-published Iowa city officials roster" \
              --body "$PR_BODY" \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
