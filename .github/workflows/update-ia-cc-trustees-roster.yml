name: Update IA community college trustees roster

# Weekly refresh of the trustee elected from each director district of Iowa's
# 15 community colleges (ia/data/app/ia-cc-trustees.json, read by
# ia/index.html's CC Director District card).
#
# Iowa keeps no statewide list of these trustees, so each college's own board
# page is read, one parser per college, and a college ships only when its page
# names exactly the districts its board has. A college whose page stops
# parsing keeps its last-good seats with its own read date rather than leaving
# the file (the preserve ruling of 2026-09-19); the builder prints which.
#
# NO HOME ADDRESS IS EVER READ. Hawkeye's page prints each trustee's street
# address beside the name; the scraper reads only name, role, term, telephone
# and e-mail, and the builder refuses any field that reads as an address.

on:
  schedule:
    - cron: "30 17 * * 0" # Sunday 17:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the refresh still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # FULL history, because this job regenerates sitemap.xml and
          # build_sitemap.py reads each page's lastmod from that file's own last
          # commit. Under the default depth-1 checkout git reports the single
          # fetched commit as the last commit of EVERY file, so every entry takes
          # today's date and `build_sitemap.py --check` passes on it anyway.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -c ia/scripts/requirements.txt requests

      - name: Scrape the colleges' own board pages (robots.txt consulted first)
        run: python3 ia/scripts/ia_cc_trustee_scraper.py

      - name: Rebuild the roster (held to each college's districts, no addresses)
        run: python3 ia/scripts/build_ia_cc_trustees.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present,
      # well formed and cached in exactly one service-worker list.
      - name: Validate app + data files
        run: python3 ia/scripts/validate_index.py ia/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- ia/data/app/ia-cc-trustees.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # THE PR BODY IS AN env: BLOCK SCALAR, NOT A SHELL STRING, AND THAT IS
          # LOAD-BEARING. A multi-line double-quoted string inside `run: |` puts
          # its continuation lines at column 0, which ENDS the block scalar —
          # GitHub then rejects the whole file as an invalid workflow and every
          # run instant-fails with zero jobs.
          PR_BODY: |
            Automated weekly refresh of the community college trustees read from each Iowa college's own board page, shown on the CC Director District card. Generated by `ia/scripts/build_ia_cc_trustees.py` from `ia_cc_trustee_scraper.py`.

            Please review the diff before merging — this changes data about real officeholders.

            A college whose page stopped parsing keeps its last-good seats, and the run log says which. No field may read as a street address: Hawkeye's page prints trustees' home addresses, and the builder refuses to write one.
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/ia-cc-trustees-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # REGENERATED HERE, AFTER THE CUT, AND NOT BEFORE IT. Building before
          # the cut leaves shared files dirty, where `git checkout -B` refuses to
          # move onto main's new tip.
          python3 scripts/build_sitemap.py
          git add ia/data/app/ia-cc-trustees.json sitemap.xml
          git commit -m "Update the Iowa community college trustees from the colleges' own pages"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update the Iowa community college trustees from the colleges' own pages" \
              --body "$PR_BODY" \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
