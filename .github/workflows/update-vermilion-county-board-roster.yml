name: Update Vermilion County Board roster

# Weekly refresh of the Vermilion County Board District card's member roster
# (il/data/app/vermilion-county-board-members.json), fetched by index.html.
#
# THE COUNTY MAINTAINS ITS OWN MEMBERS PAGE and this run reads it. What makes
# the run unusual is HOW it is reached: www.vercounty.org serves the COLES
# PATTERN — its leaf certificate without the GoGetSSL RSA DV CA intermediate
# that signed it — so requests, curl and urllib all fail with "unable to get
# local issuer certificate" while every browser loads the site fine. That is a
# server misconfiguration on the county's side, NOT a refusal, and it is why
# this county's gap record said the site was unreachable for three weeks.
#
# The scraper chases the intermediate from the AIA URI the county's own leaf
# certificate names, refuses to continue unless the bytes match a pinned
# SHA-256, and then verifies the FULL chain against certifi's roots plus that
# one extra anchor. NOTHING DISABLES VERIFICATION. If the county fixes its
# chain this keeps working; if it moves to another CA the pin fails loudly,
# which is the state a human can act on.
#
# NOT READ HERE, said plainly rather than left implied: the county's own
# CountyBoardDistricts feature layer carries Name/Party/Elected/Email columns
# for three members per district. It is a 2018-vintage snapshot on an e-mail
# domain the county has retired — the Coles rule, that an attribute table on a
# boundary layer is a snapshot of whenever that layer was published. Geometry
# comes from the county's service; PEOPLE COME FROM THE PAGE.
#
# Nor does this run re-verify the district BOUNDARIES. Those are the county's
# own published polygons and are re-fetched by
# scripts/build_vermilion_boundaries.py, an operator step that needs shapely and
# the census block file — and which re-measures, in both directions, that the
# county's OTHER board-district layer is still the superseded one.
#
# If anything changed, this opens a PR rather than committing to main:
# officeholder data gets a human look before it ships.

on:
  schedule:
    - cron: "0 22 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # requests for the fetches and certifi for the trust store the AIA
        # chase extends. No shapely: the roster builder touches no geometry.
        run: pip install -c scripts/requirements.txt requests certifi

      - name: Read the county's board members page
        run: python3 scripts/vermilion_county_board_scraper.py /tmp/vermilion_board_raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_vermilion_county_board.py /tmp/vermilion_board_raw.json

      # Gate the regenerated data before it can reach a PR.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR.
          branch="bot/vermilion-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_sitemap.py
          git add il/data/app/vermilion-county-board-members.json il/county-board il/county-board.html sitemap.xml
          git commit -m "Update Vermilion County Board roster from vercounty.org"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Vermilion County Board roster from vercounty.org" \
              --body "Automated weekly refresh of the Vermilion County Board District card's member roster (27 members across 9 districts), generated by \`scripts/vermilion_county_board_scraper.py\` + \`scripts/build_vermilion_county_board.py\`. Please review the diff before merging — this changes data about real officeholders. The county's server omits the intermediate certificate that signed its leaf, so the scraper supplies it by AIA with a pinned hash rather than disabling verification; a pin failure means the county changed certificate authority and needs a human look." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
