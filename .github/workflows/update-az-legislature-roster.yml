name: Update Arizona legislature roster

# Weekly refresh of the Arizona Senate + House rosters
# (az/data/app/az-senate-members.json and az-house-members.json, fetched by
# az/index.html's chamber cards). Rebuilds both chambers from the Arizona
# Legislature's own member rosters and, if anything changed, opens a PR rather
# than committing directly to main.
#
# The Legislature prints one roster table per chamber,
# www.azleg.gov/memberroster/?body=S and ?body=H: each member's name, district,
# party, e-mail address, Capitol room and Capitol telephone. Two pages, and
# nothing else is fetched.
#
# Each of the 30 legislative districts elects one senator and TWO
# representatives, so the House file keys each district to {seats: 2,
# members: [...]}; scripts/validate_chamber_rosters.py holds every seat to it.
# The builder stops on a district carrying more members than it elects, and a
# member who has left (a row marked inactive) is not read.
#
# robots.txt: www.azleg.gov's (read 2026-11-10) `*` group disallows /search/,
# /xml/, the calendar and document-formatting paths and nothing under
# /memberroster/, and states a Crawl-delay of 120 seconds, which the builder
# honours, so a run takes about four minutes. apps.azleg.gov, whose robots.txt
# disallows every path to every client, is never read. The builder reads the
# policy before its first fetch with the User-Agent its fetches send.
#
# THE REBUILT FILES ARE CARRIED ACROSS THE BRANCH CUT RATHER THAN FETCHED A
# SECOND TIME, the update-ilga-roster.yml pattern. A run where main changed
# those same files meanwhile errors at the checkout instead of pushing, which
# is right.
#
# ARIZONA IS DARK, so this job does not regenerate az/state-legislature.html:
# build_legislator_pages.py refuses an instance metros.json does not carry, so
# that page is not built yet. Go-live adds the step in the same change that
# adds az to metros.json — az/WATCH.md has the list.

on:
  schedule:
    - cron: "43 20 * * 2" # Tuesday 20:43 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # requests for the shared robots.txt reader; the pages themselves are
      # fetched and parsed with the stdlib.
      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Rebuild Arizona Senate + House rosters
        run: python3 az/scripts/build_az_legislature_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, every data/app file must be present and
      # well formed, and every seat must carry a record.
      - name: Validate app + data files
        run: |
          python3 az/scripts/validate_index.py az/index.html
          python3 scripts/validate_chamber_rosters.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- az/data/app/az-senate-members.json az/data/app/az-house-members.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/az-legislature-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut from main's current tip, with full history — see the sibling
          # workflows' own comments for why both halves matter. The two rebuilt
          # files ride across the checkout as working-tree changes.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          git add az/data/app/az-senate-members.json az/data/app/az-house-members.json
          git commit -m "Update Arizona Senate + House rosters from the Legislature"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Arizona Senate + House rosters" \
              --body "Automated weekly refresh of the Arizona Senate and House chamber cards' rosters, from the Legislature's member rosters, generated by \`az/scripts/build_az_legislature_roster.py\`. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
