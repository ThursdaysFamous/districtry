name: Update county commissioners (OK)

# Weekly refresh of the Oklahoma county commissioner names
# (ok/data/app/ok-county-commissioners.json, fetched by ok/index.html). The
# names come from the State Election Board's Roster of State and County
# Officers, which it publishes as a PDF after each general election; the
# builder asks for this year's edition first and falls back year by year to
# 2024, so a new edition is picked up the week it is posted. If anything
# changed it opens a PR rather than committing directly to main — officeholder
# data gets a look before it ships.

on:
  schedule:
    - cron: "45 16 * * 3" # Wednesday 16:45 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR runs CI; see
      # update-ok-congress-roster.yml for why.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests pypdf

      - name: Rebuild commissioner roster
        run: python3 ok/scripts/build_ok_commissioner_roster.py

      - name: Validate app + data files
        run: |
          python3 ok/scripts/build_ok_commissioner_roster.py --check
          python3 ok/scripts/validate_index.py ok/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- ok/data/app/ok-county-commissioners.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/ok-commissioner-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp ok/data/app/ok-county-commissioners.json "$RUNNER_TEMP/roster.json"
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          cp "$RUNNER_TEMP/roster.json" ok/data/app/ok-county-commissioners.json
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          python3 scripts/build_llms_txt.py
          python3 scripts/build_eam_status.py
          git add ok/data/app/ok-county-commissioners.json ok/county-commissioner ok/county-commissioner.html about.html sitemap.xml llms.txt docs/EAM_STATUS.md
          git commit -m "Update Oklahoma county commissioners from the State Election Board's roster"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Oklahoma county commissioners from the State Election Board's roster" \
              --body "Automated weekly refresh of the Oklahoma county commissioner names, generated by \`ok/scripts/build_ok_commissioner_roster.py\` from the State Election Board's Roster of State and County Officers. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
