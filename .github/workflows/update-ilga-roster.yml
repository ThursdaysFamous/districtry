name: Update IL Senate/House roster

# Weekly refresh of the IL Senate/House district cards' roster
# (il/data/app/il-senate-members.json / il-house-members.json, fetched by
# index.html). Re-scrapes ilga.gov and, if anything changed, opens a PR
# rather than committing directly to main — officeholder data should get a
# human look before it ships.

on:
  schedule:
    - cron: "0 13 * * 1" # Monday 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # Version-pinned via scripts/requirements.txt (constraints), but only the
        # two packages this job needs — no Playwright/Chromium (that's CPD-only).
        run: pip install -c scripts/requirements.txt requests beautifulsoup4

      - name: Scrape ILGA member rosters
        run: python3 scripts/ilga_scraper.py --chamber both --out /tmp/ilga_network.json

      - name: Rebuild roster data files
        run: python3 scripts/build_il_roster.py /tmp/ilga_network.json

      # The history page's stat tiles are MEASURED from the roster file(s)
      # this job rewrites, so regenerate it in the same run — otherwise the
      # smoke gate's `build_history_page.py --check` fails on this PR with a
      # tile that has drifted from the data it counts.
      - name: Regenerate the history page
        run: python3 scripts/build_history_page.py

      # The history page this job just rewrote is IN the sitemap, and the
      # sitemap's lastmod is that file's own last commit -- so regenerate it in
      # the same run, or the smoke gate's `build_sitemap.py --check` fails on
      # this PR for a date nobody typed. Stdlib only.
      - name: Regenerate the sitemap
        run: python3 scripts/build_sitemap.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present
      # and well formed. node is preinstalled on ubuntu-latest.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/ il/history.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/ilga-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          git add il/data/app/il-senate-members.json il/data/app/il-house-members.json il/history.html
          git commit -m "Update IL Senate/House roster from ilga.gov"
          git push -u origin "$branch" --force
          # Only open a PR if one isn't already open for this branch; if it is,
          # the force-push above already updated it.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update IL Senate/House roster from ilga.gov" \
              --body "Automated weekly refresh of the IL Senate/House district cards' embedded roster, generated by \`scripts/ilga_scraper.py\` + \`scripts/build_il_roster.py\` from ilga.gov. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
