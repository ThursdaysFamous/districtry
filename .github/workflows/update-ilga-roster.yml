name: Update IL Senate/House roster

# Weekly refresh of the IL Senate/House district cards' roster
# (il/data/app/il-senate-members.json / il-house-members.json, fetched by
# index.html). Re-scrapes ilga.gov and, if anything changed, opens a PR
# rather than committing directly to main — officeholder data should get a
# human look before it ships.

on:
  schedule:
    - cron: "0 13 * * 1" # Monday 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # FULL history, because this job regenerates sitemap.xml and
          # build_sitemap.py reads each page's lastmod from that file's own last
          # commit. Under the default depth-1 checkout git reports the single
          # fetched commit as the last commit of EVERY file, so every one of the
          # 243 entries takes today's date. Measured 2026-09-19 by building the
          # sitemap in a depth-1 clone: 243 of 243 lastmods moved, against 0 in a
          # full clone, where `build_sitemap.py --check` passes.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # Version-pinned via scripts/requirements.txt (constraints), but only the
        # two packages this job needs — no Playwright/Chromium (that's CPD-only).
        run: pip install -c scripts/requirements.txt requests beautifulsoup4

      - name: Scrape ILGA member rosters
        run: python3 scripts/ilga_scraper.py --chamber both --out /tmp/ilga_network.json

      - name: Rebuild roster data files
        run: python3 scripts/build_il_roster.py /tmp/ilga_network.json

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present
      # and well formed. node is preinstalled on ubuntu-latest.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/ilga-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          # Full history for the same reason as fetch-depth: 0 above — the
          # sitemap's lastmods come from per-file git history, which a shallow
          # fetch does not carry.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # EVERY shared page is regenerated AFTER the cut, on top of main's
          # current tree. Before 2026-09-19 the history page and the sitemap ran
          # before it, which left them dirty at the checkout — and
          # `git checkout -B` ABORTS when a dirty file differs between HEAD and
          # FETCH_HEAD, so any other workflow merging a shared page mid-crawl
          # killed this run. These jobs take tens of minutes, which is what makes
          # the window wide.
          #
          # The legislator page carries a GENERATED table of every member in
          # this roster, and the history page's stat tiles are MEASURED from it,
          # so both are regenerated here or their own --check fails on this PR.
          # The sitemap follows, because those pages are in it and each lastmod
          # is the file's own last commit.
          python3 scripts/build_history_page.py
          python3 scripts/build_officeholder_tables.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add il/data/app/il-senate-members.json il/data/app/il-house-members.json il/history.html il/state-legislature.html about.html sitemap.xml
          git commit -m "Update IL Senate/House roster from ilga.gov"
          git push -u origin "$branch" --force
          # Only open a PR if one isn't already open for this branch; if it is,
          # the force-push above already updated it.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update IL Senate/House roster from ilga.gov" \
              --body "Automated weekly refresh of the IL Senate/House district cards' embedded roster, generated by \`scripts/ilga_scraper.py\` + \`scripts/build_il_roster.py\` from ilga.gov. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
