# Daily refresh of each Kentucky precinct's Election Day polling place and
# each county's voting centers, read from the State Board of Elections'
# polling location workbook for the election (linked from
# elect.ky.gov/Voters/Pages/Polling-Locations.aspx as "All Polling Locations -
# Spreadsheet", its Election Day sheet) and joined to the precinct map by the
# state's precinct code, by ky/scripts/build_ky_polling_places.py, which
# writes ky/data/app/ky-polling-places.json.
#
# DAILY, NOT WEEKLY: a polling place that moves in the last week before an
# election is exactly when a reader needs the change. Added on Election Day,
# 2026-11-03, on Adam's ask to make polling places live on every map that
# could carry them, on the model of North Carolina's daily check.
#
# THE TRIPWIRE: the build fails on a precinct code the map does not have, a
# precinct the workbook sends to two buildings, a county the workbook leaves
# out, or too few buildings placed. What it cannot see: a building the Board
# moves without re-writing the workbook, and an address the Census geocoder
# places on the wrong block of the right street (the card prints the Board's
# address either way, and links the Board's own lookup as the final word).
#
# AFTER ELECTION DAY the Board may replace or remove the workbook. A failed
# read then is expected, so the job stays green and changes nothing; on or
# before the shipped election date a failed read fails the job.

name: Update Kentucky polling places

on:
  schedule:
    - cron: "55 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-polling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install builder dependencies
        run: pip install -c scripts/requirements.txt requests openpyxl

      - name: Rebuild the polling place file from the Board's workbook
        id: build
        continue-on-error: true
        run: python3 ky/scripts/build_ky_polling_places.py

      - name: Fail a missed read before Election Day
        if: steps.build.outcome == 'failure'
        run: |
          git checkout -- ky/data/app/
          election=$(python3 -c "import json;print(json.load(open('ky/data/app/ky-polling-places.json'))['electionDate'])")
          today=$(TZ=America/New_York date +%F)
          if [[ "$today" > "$election" ]]; then
            echo "The workbook could not be read, and the shipped election ($election) is past; nothing to refresh."
          else
            echo "The workbook could not be read on $today, on or before the shipped election date $election."
            exit 1
          fi

      - name: Validate app + data files
        run: |
          python3 ky/scripts/build_ky_polling_places.py --check
          python3 ky/scripts/validate_index.py ky/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- ky/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/ky-polling-places-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp ky/data/app/ky-polling-places.json /tmp/ky-polling-places.json
          git stash
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          cp /tmp/ky-polling-places.json ky/data/app/ky-polling-places.json
          git add ky/data/app/ky-polling-places.json
          git commit -m "Update Kentucky polling places from the State Board of Elections' workbook"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Kentucky polling places from the State Board of Elections' workbook" \
              --body "Automated daily refresh of each Kentucky precinct's Election Day polling place and each county's voting centers, generated by \`ky/scripts/build_ky_polling_places.py\` from the State Board of Elections' polling location workbook for the election. Please review the diff before merging — it changes where the map tells voters to go. The build fails on a precinct code the map does not have, a precinct sent to two buildings or a county left out." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
