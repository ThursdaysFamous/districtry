name: Update McDonough County Board roster

# Weekly refresh of the McDonough County Board District card's member roster
# (il/data/app/mcdonough-county-board-members.json, fetched by index.html) — and
# the weekly DRIFT CHECK on that county's derived district boundary.
#
# McDonough's board districts are DISSOLVED from its own 27 voting precincts,
# per the composition its board page prints under each district heading. That
# page is the same one this job scrapes for the members, so a redistricting and
# a membership change arrive together and are checked together: the district
# builder re-verifies that the compiled composition is still a perfect
# partition of the precinct layer (4 + 12 + 11 = 27, every precinct named
# exactly once) and FAILS if it is not.
#
# It also re-runs the geometric cross-check that made the derivation
# trustworthy in the first place. The county DOES publish a board-district
# layer, but its attribute table is corrupt — two of its three districts carry
# an identical population AND an identical acreage to eight decimal places, the
# third has neither, and the two sum to half again the county's real
# population. So that layer is never the source; it is the independent geometry
# the derivation must agree with, and the build refuses to write below 0.97 IoU
# (it currently exceeds 0.999 on all three).
#
# THE COUNTY IS AT mcg.mcdonough.il.us, over HTTP, with no HTTPS listener. A
# nine-hostname sweep on 2026-08-02 concluded McDonough had no public website
# at all; its clerk supplied the address the next day, along with the fact that
# its GIS is hosted by Western Illinois University rather than by the county.
# Neither was guessable. Do not "fix" the scheme to https — there is nothing
# listening there.
#
# One thing to watch in the log rather than the diff: the board page prints
# every member's HOME ADDRESS, and none is collected. The scraper reads only
# the phone out of that cell, and the builder refuses to write any field whose
# name looks like an address.
#
# If this job fails on a composition change, the fix is to re-read
# http://mcg.mcdonough.il.us/members.html, update DISTRICTS in
# scripts/build_mcdonough_board_districts.py, and regenerate both
# il/data/app/mcdonough-precincts.json and
# il/data/app/mcdonough-board-districts.json.

on:
  schedule:
    - cron: "0 19 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI (a PR opened with the default GITHUB_TOKEN fires no workflows).
      # Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # FULL history, because this job regenerates sitemap.xml and
          # build_sitemap.py reads each page's lastmod from that file's own last
          # commit. Under the default depth-1 checkout git reports the single
          # fetched commit as the last commit of EVERY file, so every one of the
          # 243 entries takes today's date. Measured 2026-09-19 by building the
          # sitemap in a depth-1 clone: 243 of 243 lastmods moved, against 0 in a
          # full clone, where `build_sitemap.py --check` passes. A bot run on
          # 2026-09-17 shipped 241 wrong dates this way.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # requests for the roster page; shapely and pyproj for the boundary
        # drift check below, which does real geometry (unary_union) against
        # coordinates it must first reproject out of EPSG:3436 — the county's
        # GIS host ignores outSR on the only endpoint that returns its precinct
        # polygons at all.
        run: pip install -c scripts/requirements.txt requests shapely pyproj

      - name: Scrape roster
        run: python3 scripts/mcdonough_county_board_scraper.py --out /tmp/raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_mcdonough_board_roster.py /tmp/raw.json

      # The boundary drift check. --check rebuilds the precincts and the
      # districts from the live source and compares them to what is shipped, so
      # a re-precincting or a reapportionment turns this job red rather than
      # leaving the shipped lines quietly a cycle out of date.
      - name: Re-check the derived boundary against the county's own data
        run: |
          python3 scripts/build_mcdonough_precincts.py --check
          python3 scripts/build_mcdonough_board_districts.py --check

      # Gate the regenerated data before it can reach a PR.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR.
          branch="bot/mcdonough-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          # Full history, for the same reason as fetch-depth: 0 above. `git fetch
          # --depth=1` RE-SHALLOWS a clone that was fetched complete (measured:
          # 512 commits down to 13), so the two have to move together — deepening
          # the checkout alone would be undone here.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          # docs/EAM_STATUS.md counts the districts this roster names, so a
          # county gaining or losing a member moves it and the smoke gate's
          # `build_eam_status.py --check` fails on this PR. See that script's
          # check_workflows(), which is what names this job.
          python3 scripts/build_eam_status.py
          git add il/data/app/mcdonough-county-board-members.json il/county-board il/county-board.html about.html sitemap.xml docs/EAM_STATUS.md
          git commit -m "Update McDonough County Board roster from mcg.mcdonough.il.us"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update McDonough County Board roster from mcg.mcdonough.il.us" \
              --body "Automated weekly refresh of the McDonough County Board District card's member roster (3 districts of seven members each, with party, phone, e-mail and term-expiry year), generated by \`scripts/mcdonough_county_board_scraper.py\` + \`scripts/build_mcdonough_board_roster.py\`. The same run re-checks the precinct COMPOSITION the shipped boundary is dissolved from and the geometric agreement between that derivation and the county's own board polygons, so this job going red means a redistricting rather than a broken scrape. Member home addresses are printed on the source page and are deliberately never collected. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
