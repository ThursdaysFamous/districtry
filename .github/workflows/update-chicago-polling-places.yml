# Daily refresh of each Chicago precinct's Election Day polling place, read
# from the Chicago Board of Election Commissioners' published list (one PDF,
# linked from https://chicagoelections.gov/voting/election-day-voting, whose
# file name changes with every revision) by
# scripts/chicago_polling_places_scraper.py, and joined, placed on the map and
# written to il/data/app/chicago-polling-places.json by
# scripts/build_chicago_polling_places.py.
#
# DAILY, NOT WEEKLY: the list's own footer says "This list is subject to
# change", and a polling place that moves in the last week before an election
# is exactly when a reader needs the change. On 2026-10-23 Adam chose a daily
# check until Election Day, Tuesday 2026-11-03.
#
# THE TRIPWIRE: the build fails unless the Board's list and the Data Portal's
# precinct map (i8fv-xe4b, the map the app draws) hold exactly the same 1,291
# precincts. What it cannot see: a building the Board moves without publishing
# a new list, and an address the Census geocoder places on the wrong block of
# the right street (the card prints the Board's address either way, and links
# the Board's own lookup as the final word).
#
# AFTER ELECTION DAY the Board may stop linking a list until the next election
# is set. A failed read then is expected, so the job stays green and changes
# nothing; before or on the shipped election date a failed read fails the job.

name: Update Chicago polling places

on:
  schedule:
    - cron: "15 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-polling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        run: pip install -c scripts/requirements.txt requests pypdf

      - name: Read the Board of Elections' polling place list
        id: scrape
        continue-on-error: true
        run: python3 scripts/chicago_polling_places_scraper.py -o /tmp/chicago_polling_raw.json

      - name: Fail a missed read before Election Day
        if: steps.scrape.outcome == 'failure'
        run: |
          election=$(python3 -c "import json;print(json.load(open('il/data/app/chicago-polling-places.json'))['electionDate'])")
          today=$(TZ=America/Chicago date +%F)
          if [[ "$today" > "$election" ]]; then
            echo "The list could not be read, and the shipped election ($election) is past; nothing to refresh."
          else
            echo "The list could not be read on $today, on or before the shipped election date $election."
            exit 1
          fi

      - name: Rebuild the polling place file
        if: steps.scrape.outcome == 'success'
        run: python3 scripts/build_chicago_polling_places.py /tmp/chicago_polling_raw.json

      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/chicago-polling-places-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          git add il/data/app/chicago-polling-places.json
          git commit -m "Update Chicago polling places from the Board of Elections' list"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Chicago polling places from the Board of Elections' list" \
              --body "Automated daily refresh of each Chicago precinct's Election Day polling place, generated by \`scripts/chicago_polling_places_scraper.py\` + \`scripts/build_chicago_polling_places.py\` from the list the Chicago Board of Election Commissioners links on its Election Day Voting page. Please review the diff before merging — it changes where the map tells voters to go. The build fails if the Board's list and the city's precinct map stop naming the same precincts." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
