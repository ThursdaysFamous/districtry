name: Update Clark County Board roster

# Weekly refresh of the Clark County Board District card's member roster
# (il/data/app/clark-county-board-members.json), fetched by index.html.
#
# THE ROSTER IS THE COUNTY'S ELECTION RETURNS, NOT A BOARD PAGE. Clark's only
# board document is a SCANNED IMAGE with no text layer (clarkcountyil.org/board),
# so no scraper can read it and nothing else the county publishes names a board
# member. What the county's election authority DOES publish machine-readably is
# its certified canvasses: one text-layer "Statement of Votes Cast" per election
# at il-clark.accessliberty.com. So each member here is whoever the county
# certified as elected in the most recent GENERAL election that seated their
# district — districts 3, 4 and 7 in 2024; 1, 2, 5 and 6 in 2022, and on the
# ballot again in November 2026, which this run will pick up by itself the week
# that canvass is posted. Primaries never seat a member and are never read.
#
# THE SAME RUN IS THE RE-PRECINCTING TRIPWIRE. Clark's board districts are the
# DISSOLVE of the county's precincts (Census 2020 voting districts, which match
# the county's own 23/23 — scripts/build_clark_boundaries.py), so the boundary
# is only correct while the canvasses keep tabulating the same precincts in the
# same districts. build_clark_county_board.py re-reads every district's precinct
# list out of the canvass and FAILS the run if one stops matching the shipped
# dissolve. A red run here means the county re-precincted or redistricted and a
# human has to re-measure against the census fabric before this county ships
# again — the alarm working, not breakage.
#
# If anything changed, this opens a PR rather than committing to main:
# officeholder data gets a human look before it ships.

on:
  schedule:
    - cron: "0 20 * * 1" # Monday 20:00 UTC (after logan 17:00, marshall 18:00, mcdonough 19:00)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # FULL history, because this job regenerates sitemap.xml and
          # build_sitemap.py reads each page's lastmod from that file's own last
          # commit. Under the default depth-1 checkout git reports the single
          # fetched commit as the last commit of EVERY file, so every one of the
          # 243 entries takes today's date. Measured 2026-09-19 by building the
          # sitemap in a depth-1 clone: 243 of 243 lastmods moved, against 0 in a
          # full clone, where `build_sitemap.py --check` passes. A bot run on
          # 2026-09-17 shipped 241 wrong dates this way.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # The Clerk's past-elections page is static server-rendered HTML, so
        # requests + the stdlib re module reach it; pymupdf reads the canvass
        # PDFs' text layer. The builder imports only CONSTANTS from
        # build_clark_boundaries.py, whose geometry stack is function-local
        # (the De Witt seam), so no shapely here.
        run: pip install -c scripts/requirements.txt requests pymupdf

      - name: Read Clark County's certified canvasses
        run: python3 scripts/clark_county_board_scraper.py -o /tmp/clark_county_board_raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_clark_county_board.py /tmp/clark_county_board_raw.json

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present and
      # well formed.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/clark-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          # Full history, for the same reason as fetch-depth: 0 above. `git fetch
          # --depth=1` RE-SHALLOWS a clone that was fetched complete (measured:
          # 512 commits down to 13), so the two have to move together — deepening
          # the checkout alone would be undone here.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add il/data/app/clark-county-board-members.json il/county-board il/county-board.html about.html sitemap.xml
          git commit -m "Update Clark County Board roster from the Clerk's certified canvasses"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Clark County Board roster from the Clerk's certified canvasses" \
              --body "Automated weekly refresh of the Clark County Board District card's member roster, generated by \`scripts/clark_county_board_scraper.py\` + \`scripts/build_clark_county_board.py\`. Please review the diff before merging — this changes data about real officeholders. Clark publishes no machine-readable board page (its only board document is a scan), so every name here is whoever the county CERTIFIED as elected in the most recent general election that seated that district, and each row renders that election. The same run re-reads each district's tabulated precinct list against the shipped dissolve and fails if one stops matching — that failure means the county re-precincted or redistricted, and the geometry has to be re-measured before it ships again." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
