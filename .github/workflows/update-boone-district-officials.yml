name: Update Boone park and library district officials

# Weekly refresh of il/data/app/boone-district-officials.json — the office and
# board of Boone County's five park and library taxing bodies, joined onto the
# district polygons by name in il/index.html.
#
# THIS JOB READS SIX PUBLISHERS AND THAT IS THE POINT, not an accident of
# scope. The County Clerk's annual Year Book owns the OFFICE — address,
# telephone, fax, website, agency head — for all five bodies. It does NOT own a
# single one of their boards, measured 2026-09-05: it prints none at all for
# the three seated in Winnebago whose districts reach across the county line,
# and for the two Boone-seated bodies it prints a board that is a seat SHORT of
# what each body itself publishes. It names four Belvidere Park District
# commissioners where the district's own page names all five; Ida Public
# Library's own page lists eight trustees and the word "Open". An annual booklet prints the board
# it was handed and has no way to show an absence, so every board here is read
# from the body that maintains it. See the scraper's docstring.
#
# Each board source is fetched independently and a failure costs that one
# board, never the file: the builder refuses to write when a per-body floor is
# breached, so a source going dark leaves last week's file in place and this
# job opens no PR.
#
# The boundary half — the parcel-fabric dissolve in boone-{park,library}-
# districts.json — is an operator step (scripts/build_parcel_fabric_districts
# .py) and is not touched here. The builder DOES read those two files, because
# the roster's keys must stay exactly the districts drawn.

on:
  schedule:
    - cron: "0 22 * * 3" # Wednesday 22:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI (a PR opened with the default GITHUB_TOKEN fires no workflows).
      # Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # pdfplumber for the Clerk's yearbook and for North Suburban's linked
        # trustee PDF; requests for the four HTML/JSON board pages.
        run: pip install -c scripts/requirements.txt requests pdfplumber

      - name: Scrape the yearbook and each body's own board
        run: |
          python3 scripts/boone_district_officials_scraper.py \
            --out /tmp/boone_district_officials_raw.json

      - name: Rebuild roster data file
        id: build
        run: |
          python3 scripts/build_boone_district_officials.py \
            --input /tmp/boone_district_officials_raw.json

      # Gate the regenerated data before it can reach a PR. The builder's own
      # --check re-runs the district-name join against the shipped geometry.
      - name: Validate app + data files
        run: |
          python3 scripts/build_boone_district_officials.py --check
          python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # The build step's one-line verdict on whether anything moved
          # besides the `generated` stamp. A YAML env value, never
          # interpolated into a shell command.
          PR_BODY: |
            Automated weekly refresh of the office and board of Boone County's five park and library districts, generated by `scripts/boone_district_officials_scraper.py` + `scripts/build_boone_district_officials.py`. The office comes from the County Clerk's Year Book; all five boards come from each body's own published board page, because the yearbook does not carry three of them and is a seat short on the other two. Please review the diff before merging — this changes data about real officeholders.

            **What moved this week.** ${{ steps.build.outputs.changes }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR.
          branch="bot/boone-district-officials-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with — see update-boone-county-board-roster.yml for the
          # measured reason (a workflow-scope refusal when main moves mid-run).
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          git add il/data/app/boone-district-officials.json
          git commit -m "Update Boone park and library district officials"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Boone park and library district officials" \
              --body "$PR_BODY" \
              --base main \
              --head "$branch"
          else
            # The force-push refreshed the branch; the BODY carries this run's
            # what-moved line, so leaving it alone would put last week's
            # summary in front of a reviewer reading this week's diff. The
            # line is only worth printing if it describes the diff below it.
            gh pr edit "$branch" --body "$PR_BODY"
          fi
