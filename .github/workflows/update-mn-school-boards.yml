name: Update school boards (MN)

# Weekly refresh of the Minnesota School District cards' board member names
# (mn/data/app/mn-school-boards.json, fetched by mn/index.html). The names are
# the winners of each board's most recent elections in the Secretary of State's
# school district results files, each dated to that election, rebuilt by
# mn/scripts/build_mn_school_boards.py. If anything changed it opens
# a PR rather than committing directly to main — officeholder data gets a look
# before it ships. A new result reaches this file once it is CANVASS_DAYS old,
# so the November 2026 general lands here about three weeks after election day.

on:
  schedule:
    - cron: "10 14 * * 3" # Wednesday 14:10 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR runs CI; see
      # update-mn-congress-roster.yml for why.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests

      # Reads the Department of Education's and the Census's district layers
      # once each, then asks every Tuesday's results directory since the 2022
      # general (about 200 requests, paced half a second apart).
      - name: Rebuild school board roster
        run: python3 mn/scripts/build_mn_school_boards.py

      - name: Validate app + data files
        run: |
          python3 mn/scripts/build_mn_school_boards.py --check
          python3 mn/scripts/validate_index.py mn/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- mn/data/app/mn-school-boards.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/mn-school-boards-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          python3 scripts/build_about_page.py
          git add mn/data/app/mn-school-boards.json about.html
          git commit -m "Update Minnesota school boards from the Secretary of State's results"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Minnesota school boards from election results" \
              --body "Automated weekly refresh of the school board member names on Minnesota's School District cards, generated by \`mn/scripts/build_mn_school_boards.py\` from the Secretary of State's school district results files. Each name is the winner of that seat's most recent election and is dated to it. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
