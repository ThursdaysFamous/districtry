name: Update RUSD school board roster

# Weekly refresh of the elected school board card's Racine Unified half
# (wi/data/app/rusd-school-board-members.json) — the nine RUSD Board of
# Education members from the district's own board page.
#
# THE PAGE IS A CMS AND ITS FRAGMENTS CAN REORDER, so the scraper does not
# trust their order: each seat's own "District N Schools" label must agree
# with the "Election District N" heading above it, and a disagreement fails
# the run rather than filing every member below it under a neighbour's
# district. The vacancy is tested on BOTH surfaces — a seat with no name
# must carry a matching notice of vacancy, and a notice over a seat that has
# started naming somebody fails too, so a parse that merely lost a name can
# never publish a vacancy.
#
# The GEOMETRY is not refreshed here. It is an operator rebuild
# (wi/scripts/build_rusd_school_board_districts.py) because it moves only
# when RUSD redistricts or Racine re-wards — both wi/WATCH.md rows.

on:
  schedule:
    - cron: "30 17 * * 1" # Monday 17:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Scrape the RUSD Board of Education page
        run: python3 wi/scripts/rusd_school_board_scraper.py

      - name: Rebuild the RUSD school board roster
        run: python3 wi/scripts/build_rusd_school_board_roster.py

      - name: Validate app + data files
      # THE PAGE NAMES THESE PEOPLE AND COUNTS THEM IN ITS OWN PROSE, so it is
      # regenerated in the same run. Both generators gate on it: skip this and
      # the failure lands on THIS job's own pull request, where nobody wrote the
      # change that broke it.
      - name: Regenerate the school board page
        run: |
          python3 scripts/build_concept_pages.py
          python3 scripts/build_officeholder_tables.py

        run: python3 wi/scripts/validate_index.py wi/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- wi/data/app/rusd-school-board-members.json wi/school-board.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/rusd-school-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          git add wi/data/app/rusd-school-board-members.json wi/school-board.html
          git commit -m "Update RUSD school board roster from the district's board page"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update RUSD school board roster from the district's board page" \
              --body "Automated weekly refresh of the elected school board card's Racine Unified half, generated by \`wi/scripts/build_rusd_school_board_roster.py\` from \`rusd_school_board_scraper.py\` (the district's own Board of Education page). Please review the diff before merging — this changes data about real officeholders. A change in the VACANCY row is worth a second look: RUSD's District 2 has been empty since 2026-08-20 by the district's own notice." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
