name: Update Washington legislature roster

# Weekly refresh of the Washington Senate + House of Representatives rosters
# (wa/data/app/wa-senate-members.json and wa-house-members.json, fetched by
# wa/index.html's chamber cards). Rebuilds both chambers from the Legislature's
# own site and, if anything changed, opens a PR rather than committing
# directly to main.
#
# The Legislature's member list (https://leg.wa.gov/legislators/) gives each
# sitting member's chamber, district and party, and each member's own page the
# name, district and position, and the Olympia office and telephone; no page
# prints an e-mail address. One list page and one page per member (about 147
# requests), and nothing else is fetched. Each of the 49 districts elects one
# senator and two representatives, and the House roster carries both.
#
# robots.txt: leg.wa.gov's policy is read before the first fetch, with the
# User-Agent the fetches send (it served none on 2026-11-11, which reads as
# allow-all), and the builder paces the host at one request a second, so a run
# takes about two and a half minutes.
#
# THE REBUILT FILES ARE CARRIED ACROSS THE BRANCH CUT RATHER THAN FETCHED A
# SECOND TIME, the update-ilga-roster.yml pattern. A run where main changed
# those same files meanwhile errors at the checkout instead of pushing, which
# is right.
#
# WASHINGTON IS DARK, so this job does not regenerate wa/state-legislature.html:
# build_legislator_pages.py refuses an instance metros.json does not carry, so
# that page is not built yet. Go-live adds the step in the same change that
# adds wa to metros.json — wa/WATCH.md has the list.

on:
  schedule:
    - cron: "23 21 * * 4" # Thursday 21:23 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # requests, which the builder fetches every page with and which the shared
      # robots.txt reader needs.
      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Rebuild Washington Senate + House rosters
        run: python3 wa/scripts/build_wa_legislature_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, every data/app file must be present and
      # well formed, and every seat must carry a record.
      - name: Validate app + data files
        run: |
          python3 wa/scripts/validate_index.py wa/index.html
          python3 scripts/validate_chamber_rosters.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- wa/data/app/wa-senate-members.json wa/data/app/wa-house-members.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/wa-legislature-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut from main's current tip, with full history — see the sibling
          # workflows' own comments for why both halves matter. The two rebuilt
          # files ride across the checkout as working-tree changes.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          git add wa/data/app/wa-senate-members.json wa/data/app/wa-house-members.json
          git commit -m "Update Washington Senate + House rosters from the Legislature's site"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Washington Senate + House rosters" \
              --body "Automated weekly refresh of the Washington Senate and House chamber cards' rosters, from the Legislature's own member pages, generated by \`wa/scripts/build_wa_legislature_roster.py\`. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
