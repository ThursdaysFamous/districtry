name: Update Tazewell County Board roster

# Weekly refresh of the Tazewell County Board District card's member roster
# (il/data/app/tazewell-county-board-members.json, fetched by index.html).
#
# Tazewell publishes its board twice and the two disagree. This scrapes the
# county WEBSITE's member pages (21 e-mails, 18 phones) rather than the county
# GIS layer's member attributes, which are stale — they still seat a member
# the county's own site no longer lists and omit one who has his own page. The
# GIS is consulted only to fill a district the website leaves blank, and the
# scraper LOGS the one assignment the two surfaces still disagree about rather
# than silently picking the tidier arithmetic. Watch the run log for those
# NOTE lines: they are how a county fixing (or breaking) its own page shows up.
#
# If anything changed it opens a PR rather than committing to main:
# officeholder data should get a human look before it ships.
#
# The boundary half is live from the county GIS at runtime and is not touched
# here.

on:
  schedule:
    - cron: "0 16 * * 5" # Friday 16:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI (a PR opened with the default GITHUB_TOKEN fires no workflows).
      # Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # Plain server-rendered WordPress HTML + ArcGIS REST JSON.
        run: pip install -c scripts/requirements.txt requests

      - name: Scrape Tazewell County Board member roster
        run: python3 scripts/tazewell_county_board_scraper.py /tmp/tazewell_county_board_raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_tazewell_board_roster.py /tmp/tazewell_county_board_raw.json

      # Gate the regenerated data before it can reach a PR.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR.
          branch="bot/tazewell-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          # The 73 per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_sitemap.py
          git add il/data/app/tazewell-county-board-members.json il/county-board il/county-board.html sitemap.xml
          git commit -m "Update Tazewell County Board roster from tazewell-il.gov"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Tazewell County Board roster from tazewell-il.gov" \
              --body "Automated weekly refresh of the Tazewell County Board District card's member roster (3 districts seating 21 members, plus the countywide-elected Chairman), generated by \`scripts/tazewell_county_board_scraper.py\` + \`scripts/build_tazewell_board_roster.py\` from the county's own member pages. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
