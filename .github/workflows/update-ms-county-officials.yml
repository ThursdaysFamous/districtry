name: Update Mississippi county officials

# Weekly refresh of the Mississippi boards of supervisors and election
# commissioners (ms/data/app/ms-county-officials.json, fetched by
# ms/index.html's County and supervisor-district cards), rebuilt by
# ms/scripts/build_ms_county_officials.py from the Secretary
# of State's County Offices and Directory: two requests, the directory's index
# page on www.sos.ms.gov and the newest edition's PDF it links. If anything
# changed it opens a PR rather than committing directly to main — officeholder
# data gets a look before it ships.
#
# The directory is published once a year, so most weeks change nothing: the
# file carries the edition, the PDF's own creation date and each county's page,
# and no date of reading, so an unchanged PDF rebuilds byte for byte and no PR
# is opened. A new edition, or a corrected PDF at the same address, is what
# this job exists to catch.
#
# The builder FAILS rather than writing when the PDF stops reading the way it
# was measured: 82 county start pages in alphabetical order, five supervisors
# and five election commissioners per county in districts 1 to 5, and the
# board address and telephone floors.
# A red run is the signal that a person needs to read the new edition.
#
# MISSISSIPPI IS DARK, so this job regenerates no county page:
# scripts/build_county_pages.py records this roster in NOT_COUNTY_BOARDS until
# go-live adds its adapter.

on:
  schedule:
    - cron: "11 18 * * 3" # Wednesday 18:11 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR runs CI; see
      # update-ms-legislature-roster.yml for why.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # requests for the two fetches, PyMuPDF to read the PDF's text.
      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests pymupdf

      - name: Rebuild the boards of supervisors
        run: python3 ms/scripts/build_ms_county_officials.py

      - name: Validate app + data files
        run: |
          python3 ms/scripts/build_ms_county_officials.py --check
          python3 ms/scripts/validate_index.py ms/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- ms/data/app/ms-county-officials.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/ms-county-officials-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut from main's current tip, with full history; the rebuilt file is
          # carried over the checkout as an uncommitted change.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          git add ms/data/app/ms-county-officials.json
          git commit -m "Update Mississippi boards of supervisors and election commissioners"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Mississippi boards of supervisors and election commissioners" \
              --body "Automated weekly refresh of the Mississippi boards of supervisors and election commissioners, from the Secretary of State's County Offices and Directory, generated by \`ms/scripts/build_ms_county_officials.py\`. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
