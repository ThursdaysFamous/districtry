name: Update county commissioners and council (IN)

# Weekly refresh of the Indiana County card's names
# (in/data/app/in-county-commissioners.json and in-county-councils.json,
# fetched by in/index.html). The names are the winners of each seat's most
# recent election in the Indiana Election Division's certified results
# archive, each dated to that election, rebuilt by
# in/scripts/build_in_county_officials.py. If anything changed it opens a PR
# rather than committing directly to main — officeholder data gets a look
# before it ships. A general is read only once its winners have taken office
# (January 1 after the election), so the November 2026 results land here on
# the first run of 2027, once the Election Division has archived them.

on:
  schedule:
    - cron: "50 15 * * 3" # Wednesday 15:50 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR runs CI; see
      # update-in-congress-roster.yml for why.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Rebuild county officials
        run: python3 in/scripts/build_in_county_officials.py

      - name: Validate app + data files
        run: |
          python3 in/scripts/build_in_county_officials.py --check
          python3 in/scripts/validate_index.py in/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- in/data/app/in-county-commissioners.json in/data/app/in-county-councils.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/in-county-officials-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          python3 scripts/build_llms_txt.py
          python3 scripts/build_eam_status.py
          git add in/data/app/in-county-commissioners.json in/data/app/in-county-councils.json in/county-commissioner in/county-commissioner.html about.html sitemap.xml llms.txt docs/EAM_STATUS.md
          git commit -m "Update Indiana county commissioners and council from certified results"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Indiana county commissioners and council from certified results" \
              --body "Automated weekly refresh of the Indiana county commissioner and county council names, generated by \`in/scripts/build_in_county_officials.py\` from the Indiana Election Division's certified results archive. Each name is the winner of that seat's most recent election and is dated to it. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
