name: Update Winnebago County Board contact

# Weekly refresh of the CONTACT half of the Winnebago County Board District
# card (il/data/app/winnebago-county-board-members.json, fetched by index.html).
#
# The member and party come from WinGIS at query time and are not touched here.
# This job scrapes only what that layer declares and leaves empty on all 20
# rows: the phone and official @board.wincoil.gov e-mail the county prints on
# its own board page (base64-obfuscated behind Joomla's spam wrapper).
#
# The builder re-reads the board GIS and matches every scraped row to the member
# the card will actually show, dropping any district where the two sources
# disagree — so this can never attach one member's phone to another's name. A
# mismatch is reported in the job log and shows up as a shrinking count.

on:
  schedule:
    - cron: "0 15 * * 3" # Wednesday 15:00 UTC (after CCPSA 13:00, municipal 14:00)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI; falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # FULL history, because this job regenerates sitemap.xml and
          # build_sitemap.py reads each page's lastmod from that file's own last
          # commit. Under the default depth-1 checkout git reports the single
          # fetched commit as the last commit of EVERY file, so every one of the
          # 243 entries takes today's date. Measured 2026-09-19 by building the
          # sitemap in a depth-1 clone: 243 of 243 lastmods moved, against 0 in a
          # full clone, where `build_sitemap.py --check` passes. A bot run on
          # 2026-09-17 shipped 241 wrong dates this way.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # Static server-rendered Joomla — no JS, no challenge.
        run: pip install -c scripts/requirements.txt requests

      - name: Scrape the Winnebago County Board page
        run: python3 scripts/winnebago_county_board_scraper.py /tmp/winnebago_county_board_raw.json

      - name: Rebuild contact file (name-matched against the county GIS)
        run: python3 scripts/build_winnebago_county_board_roster.py /tmp/winnebago_county_board_raw.json

      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged PR is refreshed in place by
          # the force-push below instead of spawning a duplicate every week.
          branch="bot/winnebago-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          # Full history, for the same reason as fetch-depth: 0 above. `git fetch
          # --depth=1` RE-SHALLOWS a clone that was fetched complete (measured:
          # 512 commits down to 13), so the two have to move together — deepening
          # the checkout alone would be undone here.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_sitemap.py
          git add il/data/app/winnebago-county-board-members.json il/county-board il/county-board.html sitemap.xml
          git commit -m "Update Winnebago County Board contact from wincoil.gov"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Winnebago County Board contact from wincoil.gov" \
              --body "Automated weekly refresh of the phone and official @board.wincoil.gov e-mail on the Winnebago County Board District card, generated by \`scripts/winnebago_county_board_scraper.py\` + \`scripts/build_winnebago_county_board_roster.py\`. The member and party are NOT in this file — they come from the county GIS at query time — so this diff only ever changes contact. Every row was name-matched against that GIS at build time; a district that disappears here means the two county sources disagreed about who holds the seat, which is worth a look." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
