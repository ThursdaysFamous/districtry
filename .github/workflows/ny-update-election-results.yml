# Daily check of New York City's election results by election district, read
# from the Board of Elections in the City of New York's election night results
# pages at https://enr.boenyc.gov/ by ny/scripts/nyc_election_results_scraper.py
# and written to ny/data/app/election-results.json plus one
# ny/data/app/election-results/ad<Assembly District>.json per Assembly District
# by ny/scripts/build_nyc_election_results.py.
#
# DAILY UNTIL CERTIFIED, the rule Adam set for Chicago on 2026-11-05: the
# Board certifies its results in early December, so the numbers can move until
# then and a reader should see each day's count after it has been looked at.
# Once the shipped file says certified, the job reads nothing and changes
# nothing.
#
# ONE PAGE A DAY UNTIL THE BOARD PUBLISHES AGAIN: reading every contest means
# about 1,300 pages, so the job first reads the home page's "Page Creation"
# time and reads the rest only when it differs from the time the shipped file
# records (boardAsOf).
#
# CERTIFYING: when the Board certifies the results, run this workflow by hand
# with `certified` set to that date. The PR it opens says certified, and the
# map and the card stop saying unofficial.
#
# A PR ONLY WHEN A NUMBER MOVED: every read stamps the time it was read, so the
# change check compares the files with that stamp taken out.

name: Update New York City election results

on:
  schedule:
    - cron: "50 13 * * *"
  workflow_dispatch:
    inputs:
      certified:
        description: "The date the Board of Elections certified the results (YYYY-MM-DD); leave empty for an unofficial read"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Skip a file that is certified or unchanged at the Board
        id: state
        env:
          CERTIFIED: ${{ github.event.inputs.certified }}
        run: |
          shipped=$(python3 -c "import json;print('yes' if json.load(open('ny/data/app/election-results.json')).get('certified') else 'no')")
          recorded=$(python3 -c "import json;print(json.load(open('ny/data/app/election-results.json')).get('boardAsOf') or '')")
          current=$(python3 ny/scripts/nyc_election_results_scraper.py --as-of-only)
          echo "The Board's results are as of '$current'; the shipped file records '$recorded'."
          if [ "$shipped" = "yes" ] && [ -z "$CERTIFIED" ]; then
            echo "The shipped results are certified; nothing to refresh."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$current" ] && [ "$current" = "$recorded" ] && [ -z "$CERTIFIED" ]; then
            echo "The Board has not published since the shipped read; nothing to refresh."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the Board of Elections' results pages
        if: steps.state.outputs.run == 'true'
        run: |
          date=$(python3 -c "import json;print(json.load(open('ny/data/app/election-results.json'))['electionDate'])")
          python3 ny/scripts/nyc_election_results_scraper.py --date "$date" -o /tmp/nyc_results_raw.json

      - name: Rebuild the results files
        if: steps.state.outputs.run == 'true'
        env:
          CERTIFIED: ${{ github.event.inputs.certified }}
        run: |
          date=$(python3 -c "import json;print(json.load(open('ny/data/app/election-results.json'))['electionDate'])")
          if [ -n "$CERTIFIED" ]; then
            python3 ny/scripts/build_nyc_election_results.py /tmp/nyc_results_raw.json --election-date "$date" --certified "$CERTIFIED"
          else
            python3 ny/scripts/build_nyc_election_results.py /tmp/nyc_results_raw.json --election-date "$date"
          fi

      - name: Validate app + data files
        run: python3 ny/scripts/validate_index.py ny/index.html

      - name: Check for changes other than the reading time
        id: diff
        run: |
          changed=$(python3 - <<'PY'
          import json, os, subprocess
          def strip(text):
              d = json.loads(text)
              d.pop("read", None)
              return d
          def shipped(path):
              r = subprocess.run(["git", "show", "HEAD:" + path], capture_output=True, text=True)
              return r.stdout if r.returncode == 0 else None
          paths = ["ny/data/app/election-results.json"]
          parts = "ny/data/app/election-results"
          paths += [os.path.join(parts, n) for n in sorted(os.listdir(parts))]
          old = subprocess.run(["git", "ls-tree", "--name-only", "HEAD", parts + "/"],
                               capture_output=True, text=True).stdout.split()
          moved = set(old) != set(paths[1:])
          for p in paths:
              before = shipped(p)
              if before is None or strip(before) != strip(open(p).read()):
                  moved = True
          print("true" if moved else "false")
          PY
          )
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "changed: $changed"

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/ny-election-results-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # The results pages read this file, so they are rebuilt on main's tip
          # with it and ride in the same pull request, with the sitemap whose
          # dates they move (scripts/build_results_pages.py fails a results
          # workflow that skips this).
          python3 scripts/build_results_pages.py
          python3 scripts/build_sitemap.py
          git add -A ny/data/app/election-results.json ny/data/app/election-results ny/election-results.html sitemap.xml
          git commit -m "Update New York City election results from the Board of Elections"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update New York City election results from the Board of Elections" \
              --body "Automated refresh of New York City's results by election district, generated by \`ny/scripts/nyc_election_results_scraper.py\` + \`ny/scripts/build_nyc_election_results.py\` from the Board of Elections' election night results pages. Please review the diff before merging: it changes the numbers and colours the map shows. Until the file says certified, the map and every card say these are unofficial results that will change. The build fails if a page's election districts stop adding to its Total row, a contest falls into no group, votes are counted in an election district the map does not draw, or a district the map draws is in no contest." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
