name: Update WI town board roster

# Weekly refresh of the town board on the County Subdivision card
# (wi/data/app/wi-town-boards.json): the chairperson and supervisors of each
# Wisconsin town, as each county's own list of town officials prints them.
# No state agency lists town boards, so this reads one document per county —
# most of them the county clerk's yearly Official Directory — through one small
# parser per county under wi/scripts/town_boards/.
#
# WHAT A WEEKLY RUN IS FOR: the directories are reissued after each April town
# election and corrected during the year, and the file names a new edition
# only when somebody reads it. Most weeks nothing changes and no PR opens.
#
# A COUNTY WHOSE READ FAILS KEEPS ITS LAST GOOD RECORD with the day it was last
# read, so one county's changed link or layout is that county's red line in the
# log and never a deletion. The builder refuses outright when a county that has
# never been read fails, or a county's parse names fewer towns than its floor,
# and a red run that leaves last week's file alone is the right outcome.

on:
  schedule:
    - cron: "45 17 * * 4" # Thursday 17:45 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install the PDF reader
        run: pip install -c scripts/requirements.txt pdfplumber

      - name: Read each county's list of town officials
        run: python3 wi/scripts/wi_town_board_scraper.py

      - name: Rebuild the town board roster
        run: python3 wi/scripts/build_wi_town_boards.py

      - name: Validate app + data files
        run: python3 wi/scripts/validate_index.py wi/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- wi/data/app/wi-town-boards.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/wi-town-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut from main's current tip so the branch differs from main in the
          # data file alone (see update-wi-municipal-executive-roster.yml).
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          git add wi/data/app/wi-town-boards.json
          git commit -m "Update WI town board roster from the counties' lists of town officials"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update WI town board roster from the counties' lists of town officials" \
              --body "Automated weekly refresh of the town board on the County Subdivision card, generated by \`wi/scripts/build_wi_town_boards.py\` from \`wi_town_board_scraper.py\`. Names, roles and the telephone numbers each county prints beside a member, which ship whosever line they are under Adam's ruling of 2026-10-17; home addresses and e-mails do not ship. A county whose \`readOn\` did not move this run was not re-read and kept its last good record; the run log says why. Please review before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
