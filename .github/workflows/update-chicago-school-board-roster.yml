name: Update Chicago school board roster

# Weekly refresh of il/data/app/school-board-members.json from the Chicago
# Board of Education's OWN member index at cpsboe.org. Opens a PR, never
# commits to main.
#
# WHY THIS JOB EXISTS. The file was HAND-CURATED, and the card's own provenance
# note said it had to be, "because no machine-readable roster is published for
# this board". Measured 2026-09-23 that was false — the Board publishes every
# seat as a semantic list with a bio page and a cps.edu address each — and the
# hand-kept file had drifted with nothing re-reading it: District 9a shipped the
# bare string VACANT where the Board names its VICE PRESIDENT, and District 10b
# named a member the Board's own news says resigned in March 2026.

on:
  schedule:
    - cron: "0 11 * * 4" # Thursday 11:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI; a PR opened with the default GITHUB_TOKEN fires no workflows.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # FULL history, because this job regenerates sitemap.xml and
          # build_sitemap.py reads each page's lastmod from that file's own last
          # commit. Under a depth-1 checkout git reports the single fetched
          # commit as the last commit of every file, so every entry takes
          # today's date.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests
      - name: Fetch the Board's own member index
        # Twenty-two paced requests behind robots.txt: the index, then each
        # member's own bio page, which is the second witness the builder holds
        # the index to and which carries the cps.edu address.
        run: python3 scripts/cps_board_scraper.py --out cps_board.json
      - name: Rebuild roster
        # Refuses to write when the two witnesses disagree about a name, an
        # office or a district; when a district the shipped boundary draws is
        # named by nobody (a list that omits a seat is behind, never a statement
        # that the seat is empty); when the Board seats other than one
        # president; or when a name is not a name.
        run: python3 scripts/build_chicago_school_board_roster.py cps_board.json
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html
      - name: Check for changes
        id: diff
        run: |
          git diff --quiet -- il/data/app/school-board-members.json \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/chicago-school-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip rather than from the checkout
          # this run started with: these runs take tens of minutes, and a branch
          # that also differs from main in .github/workflows/ reads to GitHub as
          # a workflow update and is refused for a token without `workflow`
          # scope. Full history for the same reason as fetch-depth: 0 above.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          python3 scripts/cps_board_scraper.py --out cps_board.json
          python3 scripts/build_chicago_school_board_roster.py cps_board.json
          # il/school-board.html carries a GENERATED table of every seat built
          # from the roster this job just rewrote, so regenerate it here or the
          # smoke gate's `build_officeholder_tables.py --check` fails on this PR
          # with a table naming last week's members. about.html counts those
          # same people, and the sitemap follows because that page's lastmod is
          # its own last commit.
          python3 scripts/build_officeholder_tables.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add il/data/app/school-board-members.json il/school-board.html about.html sitemap.xml
          git commit -m "Update Chicago school board roster from the Board's own index"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --title "Update Chicago school board roster" \
              --body "Automated weekly refresh of the Chicago Board of Education's twenty sub-district members and its city-wide President from the Board's own member index (\`scripts/cps_board_scraper.py\` + \`build_chicago_school_board_roster.py\`), with \`il/school-board.html\`'s table regenerated from it. Review before merging." \
              --base main --head "$branch"
          fi
