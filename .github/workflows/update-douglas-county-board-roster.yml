name: Update Douglas County Board roster

# Weekly refresh of the Douglas County Board District card's member roster
# (il/data/app/douglas-county-board-members.json), fetched by index.html.
#
# THE COUNTY PUBLISHES NO BOARD MEMBERS PAGE AT ALL — no member list, no district pages, nothing in its navigation — so the roster is assembled from the two county documents that each answer half of it, found through the WordPress backend behind its Next.js site rather than hardcoded.
#
#   * THE ANNUAL COUNTY YEARBOOK names the seven people and gives each a county
#     e-mail address. This is what the county maintains as PEOPLE.
#   * THE CERTIFIED ELECTION SUMMARY REPORTS say which numbered district each of
#     them won, in the county's own numbering — the same numbering its GIS
#     district layer uses.
#
# THE YEARBOOK'S OWN NUMBERS ARE NOT DISTRICT NUMBERS, and that is this county's
# trap. It lists members "1. Tom Hettinger", "2. Bibby Appleby", which reads
# exactly like a district column; the certified returns put Hettinger in
# District 3 and Appleby in District 2, so taking list position as district
# would misplace SIX of the seven. Its per-member precinct lists cannot recover
# the district either — they carry at least one error.
#
# THE JOIN IS THE GUARD: the two documents are matched on surname, and the
# builder FAILS when they stop naming the same seven people rather than
# preferring one. Two county documents that disagree about who is on the board
# is a thing a human should see.
#
# NOT CHECKED HERE, said plainly rather than left implied: this run does not
# re-verify the district BOUNDARIES. Those are the county's own published
# polygons and are re-fetched by scripts/build_douglas_boundaries.py, an
# operator step that needs shapely and the census fabric.
#
# If anything changed, this opens a PR rather than committing to main:
# officeholder data gets a human look before it ships.

on:
  schedule:
    - cron: "0 21 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # Both surfaces are PDFs listed by a WordPress media API, so this needs
        # requests plus pymupdf. The builder imports only CONSTANTS from
        # build_douglas_boundaries.py, whose geometry stack is function-local
        # (the De Witt seam), so no shapely here.
        run: pip install -c scripts/requirements.txt requests pymupdf

      - name: Read the county yearbook and its certified election summaries
        run: python3 scripts/douglas_county_board_scraper.py -o /tmp/douglas_board_raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_douglas_county_board.py /tmp/douglas_board_raw.json

      # Gate the regenerated data before it can reach a PR.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR.
          branch="bot/douglas-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add il/data/app/douglas-county-board-members.json il/county-board il/county-board.html about.html sitemap.xml
          git commit -m "Update Douglas County Board roster from douglascountyil.gov"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Douglas County Board roster from douglascountyil.gov" \
              --body "Automated weekly refresh of the Douglas County Board District card's member roster, generated by \`scripts/douglas_county_board_scraper.py\` + \`scripts/build_douglas_county_board.py\`. Please review the diff before merging — this changes data about real officeholders. The county publishes no board members page, so the roster is assembled from its annual Yearbook (people and e-mail) and its certified election summary reports (district numbers), joined on surname; the run fails if the two documents stop naming the same seven people." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
