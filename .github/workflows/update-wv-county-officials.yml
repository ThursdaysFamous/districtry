name: Update West Virginia county officials

# Weekly refresh of every West Virginia county's commission and its other
# elected officers (wv/data/app/wv-county-officials.json, fetched by
# wv/index.html's County card), rebuilt by
# wv/scripts/build_wv_county_officials.py from the Secretary of State's
# directory of county officials at apps.sos.wv.gov/elections/Officials/. If
# anything changed it opens a PR rather than committing directly to main —
# officeholder data gets a look before it ships.
#
# The directory is published by year. The builder reads the newest year whose
# directory lists all 55 counties, so most weeks change nothing and open no PR;
# what this job exists to catch is a new year's directory becoming complete,
# and every county's names move together in one reviewed PR.
#
# The builder FAILS rather than writing when the directory stops reading the
# way it was measured on 2026-10-29: one record for each of the 55 counties,
# a commission of three (five in Berkeley and Jefferson) in every county, and
# the floors the build applies. The validate step runs its offline --check on
# the written file too. A red run is the signal that a person needs to read
# the directory.
#
# A telephone or e-mail address printed for two or more commissioners is the
# commission's and ships only as the commission's own; a mailing address ships
# only as the commission's office where two commissioners print the same one;
# fax numbers never ship. An e-mail address whose domain cannot receive mail is
# withheld through scripts/undeliverable.py rather than corrected.
#
# robots.txt: apps.sos.wv.gov's (read 2026-10-29) disallows nothing the builder
# reads and states no delay; the builder reads it before its first fetch and
# paces every fetch at one second. A run is about 560 requests, some ten
# minutes.
#
# WEST VIRGINIA IS DARK, so this job regenerates no county page:
# scripts/build_county_pages.py records this roster in NOT_COUNTY_BOARDS until
# go-live adds its adapter.

on:
  schedule:
    - cron: "53 19 * * 3" # Wednesday 19:53 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR runs CI; see
      # update-wv-legislature-roster.yml for why.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # requests for the shared robots.txt reader; the directory's pages are
      # fetched and parsed with the stdlib.
      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Rebuild the county commissions and officers
        run: python3 wv/scripts/build_wv_county_officials.py

      - name: Validate app + data files
        run: |
          python3 wv/scripts/build_wv_county_officials.py --check
          python3 wv/scripts/validate_index.py wv/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- wv/data/app/wv-county-officials.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/wv-county-officials-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut from main's current tip, with full history; the rebuilt file is
          # carried over the checkout as an uncommitted change.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          git add wv/data/app/wv-county-officials.json
          git commit -m "Update West Virginia county commissions and officers"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update West Virginia county commissions and officers" \
              --body "Automated weekly refresh of every West Virginia county's commission and its other elected officers, from the Secretary of State's directory of county officials, generated by \`wv/scripts/build_wv_county_officials.py\`. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
