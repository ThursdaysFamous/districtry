name: Watch Mason County Board roster source

# Mason is the one county whose roster this repo does NOT scrape, and this job
# is what stands in for the scrape.
#
# Its board roster exists only as a scanned PDF. The scan carries a text layer,
# but that layer is written in a non-embedded font whose encoding does not
# survive extraction — pdfplumber and pdftotext both return line noise
# ("xRF# ISgH tlgP") rather than failing. Noise that PARSES is worse than no
# text at all: a scraper would not error, it would ship confident garbage under
# real officeholders' names. So il/data/app/mason-county-board-members.json is
# transcribed by hand (see scripts/build_mason_board_roster.py), and this job
# checks the two things a machine still can:
#
#   1. the county board page still links THAT EXACT PDF — Mason publishes
#      through WordPress, so a new roster lands at a new upload path and the old
#      URL keeps serving the old file with a 200 forever; and
#   2. the PDF's bytes still hash to the recorded fingerprint.
#
# On either change it opens or updates a single tracking ISSUE and stays green
# — the validate-sources pattern. It never edits the roster, because a scan
# cannot be re-read automatically: the output of this job is a request for a
# person, not a diff.
#
# To clear the issue: read the new PDF, update MEMBERS (and, if the composition
# lines moved, DISTRICTS in scripts/build_mason_board_districts.py), rebuild
# both files, and update KNOWN_SHA256 in scripts/mason_roster_watch.py.

on:
  schedule:
    - cron: "0 18 * * 2"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  watch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # "3.14", not "3.x": runner images now carry Python 3.15, and
          # shapely 2.1.2 and pyproj 3.7.2 publish no wheel for it. Only the
          # workflows that install those two pin it (2026-10-20).
          python-version: "3.14"

      - name: Install dependencies
        # shapely is for the LAST step, not the watcher: this job also re-checks
        # the derived district boundary (build_mason_board_districts.py --check),
        # which is real geometry against live Census townships. The watcher and
        # the roster --check need only requests.
        run: pip install -c scripts/requirements.txt requests shapely

      - name: Check the roster source
        id: watch
        # A change is an expected, non-fatal state that feeds the tracking
        # issue below; only a hard failure (the URL no longer returning a PDF
        # at all) should redden the run.
        continue-on-error: true
        run: |
          set +e
          out="$(python3 scripts/mason_roster_watch.py 2>&1)"
          code=$?
          echo "$out"
          {
            echo "report<<REPORT_EOF"
            echo "$out"
            echo "REPORT_EOF"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"
          exit 0

      # Also re-assert that the transcription still produces the shipped file
      # byte for byte — the guard against someone editing data/app by hand.
      - name: Verify the shipped roster matches the transcribed table
        run: |
          python3 scripts/build_mason_board_roster.py --check
          python3 scripts/build_mason_board_districts.py --check

      - name: Open or update the tracking issue
        if: steps.watch.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.watch.outputs.report }}
        run: |
          title="Mason County Board roster source changed — re-read needed"
          {
            echo "_Automated by \`.github/workflows/watch-mason-roster-source.yml\` on $(date -u +%Y-%m-%d). Nothing was changed in the app._"
            echo
            echo "Mason's roster is a **scanned PDF whose text layer extracts as line noise**, so it is transcribed by hand rather than scraped — an automated re-read would ship confident garbage under real officeholders' names. This job only watches the source; the re-read is a human step."
            echo
            echo '```'
            echo "$REPORT"
            echo '```'
            echo
            echo "**To clear this issue:**"
            echo "1. Open the roster PDF linked from <https://masoncountyil.gov/county-board/> and read it."
            echo "2. Update \`MEMBERS\` in \`scripts/build_mason_board_roster.py\` (and \`TRANSCRIBED\`)."
            echo "3. If the \"District n - …\" composition lines moved, update \`DISTRICTS\` in \`scripts/build_mason_board_districts.py\` too."
            echo "4. Rebuild both \`il/data/app/mason-county-board-*.json\` files and update \`KNOWN_SHA256\` in \`scripts/mason_roster_watch.py\`."
            echo
            echo "_Reminder: Mason ships no residence data at all, not even the home town — one member's address is legally protected and a town-for-seven roster would single her out._"
          } > issue-body.md

          existing="$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file issue-body.md
            gh issue comment "$existing" --body "Refreshed by the weekly Mason source watch — see the updated issue body."
            echo "Updated existing issue #$existing."
          else
            gh issue create --title "$title" --body-file issue-body.md
            echo "Opened a new tracking issue."
          fi
