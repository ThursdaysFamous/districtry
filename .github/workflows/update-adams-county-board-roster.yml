name: Update Adams County Board roster

# Weekly refresh of the Adams County Board District card's member roster
# (il/data/app/adams-county-board-members.json), fetched by index.html.
#
# THE ROSTER IS THE COUNTY'S ELECTION RETURNS, NOT A BOARD PAGE, and here that
# is forced rather than chosen. adamscountyil.gov is a flat Akamai WAF deny —
# 403 AkamaiGHost on every path, UA and protocol tried, refused identically from
# a second network — and the Internet Archive never captured the board page, so
# no client of ours will ever read the county's own member list. What the county
# publishes machine-readably is its certified canvasses, on
# platinumelectionresults.com as county id 54.
#
# THE ROSTER IS DELIBERATELY PARTIAL AND THE CARD SAYS SO. Adams seats 21 over 7
# districts and staggers them two-then-one: its 2018 general elected TWO per
# district under an explicit "(Vote for not more than TWO)", its 2020 primary
# ONE under "(Vote for ONE)". So the November 2024 general names one member per
# district and the other fourteen seats were filled in November 2022 — a canvass
# the vendor returns as an empty one-page placeholder, that Clarity does not
# carry, and that the county itself publishes only behind the same WAF.
#
# THIS RUN IS THE BACKFILL TRIPWIRE. The scraper re-fetches the 2022 slug every
# week and records it as EMPTY rather than skipping it, so the week that file
# appears this job opens a PR carrying fourteen new members instead of the gap
# quietly persisting. Nothing here has to know the schedule: the builder walks
# canvasses newest-first and takes each contest's printed seat count.
#
# If anything changed, this opens a PR rather than committing to main:
# officeholder data gets a human look before it ships.

on:
  schedule:
    - cron: "0 20 * * 6" # Saturday 20:00 UTC (after county-commissioners 16:00, white 17:00, jodaviess 18:00, clinton 19:00)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows, which
      # left every roster PR with zero checks. Falls back to github.token when
      # the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # requests fetches the vendor's report endpoint; pymupdf reads the
        # canvasses' text layer. The reports are real PDFs, not HTML, so there
        # is no parser here that a page redesign can break.
        run: pip install -c scripts/requirements.txt requests pymupdf

      - name: Read Adams County's certified canvasses
        run: python3 scripts/adams_county_board_scraper.py -o /tmp/adams_county_board_raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_adams_county_board_roster.py --raw /tmp/adams_county_board_raw.json

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present and
      # well formed.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/adams-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          # The 73 per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_sitemap.py
          git add il/data/app/adams-county-board-members.json il/county-board il/county-board.html sitemap.xml
          git commit -m "Update Adams County Board roster from the county's certified canvasses"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Adams County Board roster from the county's certified canvasses" \
              --body "Automated weekly refresh of the Adams County Board District card's member roster, generated by \`scripts/adams_county_board_scraper.py\` + \`scripts/build_adams_county_board_roster.py\`. Please review the diff before merging — this changes data about real officeholders. Adams's own board page is a flat Akamai deny, so every name here is whoever the county CERTIFIED as elected in the most recent general election that seated that district, and each row renders that election. The roster is partial by construction: Adams staggers three seats per district, and the November 2022 canvass that filled fourteen of them is not published anywhere readable. If this PR suddenly carries fourteen extra members, that canvass appeared — check it before merging." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
