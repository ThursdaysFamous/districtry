name: Probe election results sites from a runner (temporary)

# One-off measurement for the fleetwide election-results survey (Adam,
# 2026-11-05: "Check from github on the sites that turned you away").
# Each site answered our own reader with HTTP 403 from a Claude Code sandbox.
# This asks the same question from a GitHub runner, with the same reader:
# robots.txt first through scripts/robots_policy.py, then ONE page, and only
# where robots.txt allows it. Our own token only, on both HTTP stacks the
# project uses; no browser identity. Nothing is committed. Delete after use.

on:
  push:
    branches: [claude/project-thread-eo4cl3]
    paths: [.github/workflows/probe-results-sites.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -c scripts/requirements.txt requests
      - name: Read robots.txt, then one page
        run: |
          python3 - <<'PY'
          import sys, time, urllib.request, requests
          sys.path.insert(0, "scripts")
          import robots_policy as rp
          from scraper_common import UA_ROSTER_BOT as UA
          URLS = [
              "https://www.sfelections.org/results/20261103w/index.html",
              "https://www.michigan.gov/sos/elections/election-results-and-data",
              "https://sos.tn.gov/elections/results",
              "https://results.okelections.us/OKER/?elecDate=20261103",
              "https://enr.sos.mo.gov/",
              "https://results.enr.clarityelections.com/AR/elections.json",
              "https://results.enr.clarityelections.com/KY/elections.json",
              "https://www.cookcountyclerkil.gov/elections/results-and-election-data",
              "https://elections.wi.gov/elections/election-results",
          ]
          s = requests.Session(); s.headers["User-Agent"] = UA
          for url in URLS:
              gate = rp.RobotsGate(s, UA, timeout=20)
              ok, why = gate.allows(url)
              print("\n" + url)
              print("  robots:", "allows" if ok else "REFUSES", "-", why[:160])
              if not ok:
                  continue
              try:
                  r = s.get(url, timeout=25)
                  print("  requests+token: HTTP %s, %d bytes" % (r.status_code, len(r.content)))
              except Exception as e:
                  print("  requests+token: error", repr(e)[:120])
              time.sleep(2)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": UA}), timeout=25) as r:
                      print("  stdlib+token: HTTP %s, %d bytes" % (r.status, len(r.read())))
              except urllib.error.HTTPError as e:
                  print("  stdlib+token: HTTP %s" % e.code)
              except Exception as e:
                  print("  stdlib+token: error", repr(e)[:120])
              time.sleep(2)
          PY
