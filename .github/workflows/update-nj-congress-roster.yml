name: Update U.S. House (New Jersey) roster

# Weekly refresh of the New Jersey congress card's roster
# (nj/data/app/congress-roster.json, fetched by nj/index.html). Rebuilds
# New Jersey's 12 U.S. House reps from unitedstates/congress-legislators and,
# if anything changed, opens a PR rather than committing directly to main —
# officeholder data should get a human look before it ships.
#
# NEW JERSEY IS DARK, so this job is shorter than its served siblings by
# exactly the steps a served instance owes: there is no nj/congress.html to
# regenerate (build_legislator_pages.py refuses an instance metros.json does
# not carry, so the page is not built yet), nj/ is not in the sitemap, and
# about.html does not count this instance. Go-live adds those steps in the same
# change that adds nj to metros.json — nj/WATCH.md carries the list.
#
# THE MAP THESE MEMBERS ARE JOINED TO IS THE ONE THE NEW JERSEY REDISTRICTING
# COMMISSION DREW IN DECEMBER 2021, which TIGERweb's layer 4 (the 119th
# Congress) and layer 0 (the 120th) both carry for New Jersey, so it does not
# change on 3 January 2027. nj/scripts/build_legislative_boundaries.py refuses
# to build if the two layers stop agreeing.

on:
  schedule:
    - cron: "19 21 * * 1" # Monday 21:19 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # No third-party deps: the builder downloads the canonical
      # legislators-current.json with stdlib urllib and filters it to New Jersey (the
      # state code comes from nj/data/state/state.json, which is why that
      # directory ships in the repo while being excluded from the Pages deploy).
      - name: Rebuild congress roster data file
        run: python3 nj/scripts/build_congress_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present
      # and well formed.
      - name: Validate app + data files
        run: python3 nj/scripts/validate_index.py nj/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- nj/data/app/congress-roster.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/nj-congress-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with: a branch that also differs from main in
          # .github/workflows/ reads to GitHub as the push updating a workflow
          # and is refused for a token without `workflow` scope. Full history,
          # because `git fetch --depth=1` RE-SHALLOWS a clone that was fetched
          # complete.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          python3 nj/scripts/build_congress_roster.py
          git add nj/data/app/congress-roster.json
          git commit -m "Update U.S. House (New Jersey) roster from congress-legislators"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update U.S. House (New Jersey) roster from congress-legislators" \
              --body "Automated weekly refresh of the New Jersey congress district card's roster, generated by \`nj/scripts/build_congress_roster.py\` from unitedstates/congress-legislators. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
