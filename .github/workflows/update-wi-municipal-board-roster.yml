name: Update WI at-large municipal boards

# Weekly refresh of the governing bodies of the Wisconsin municipalities that
# elect their WHOLE board at large (wi/data/app/wi-municipal-boards.json, read by
# wi/index.html's City or Village card). Re-scrapes each municipality's own
# source and, if anything changed, opens a PR rather than committing to main.
#
# WHY THESE MUNICIPALITIES ARE NOT IN THE ALDERPERSON JOB. That roster is keyed
# by DISTRICT. A council elected citywide has none, so seating its members under
# numbers would tell a reader they were elected in a way they were not.
#
# ONE MUNICIPALITY'S BAD DAY COSTS THAT MUNICIPALITY. The scraper catches per
# city and the builder carries a city it could not read forward from the shipped
# file with a `carriedFrom` date the card states — "preserve data we have already
# fetched" (Adam, 2026-09-19). So a run where one host is down still refreshes
# the other, and the diff's third interesting shape is a municipality that
# started carrying.
#
# THIS RUN IS ALSO OSHKOSH'S ROBOTS MEASUREMENT. Its policy cannot be read from a
# Claude Code sandbox, where both Python stacks fail the handshake and curl does
# not; the chain inspected there was that sandbox's own re-signing egress
# gateway, not the city's (wi/WATCH.md). Nothing lowers a security level to get
# past it. A runner is the vantage this job actually crawls from, so its own log
# is the answer: the robots line for www.ci.oshkosh.wi.us either reads a policy
# or does not, and the city's rows appear or are recorded as that run's failure.

on:
  schedule:
    - cron: "0 19 * * 4" # Thursday 19:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Scrape the at-large municipal boards
        run: python3 wi/scripts/wi_municipal_board_scraper.py

      - name: Rebuild the at-large municipal board roster
        run: python3 wi/scripts/build_wi_municipal_boards.py

      - name: Validate app + data files
        run: python3 wi/scripts/validate_index.py wi/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- wi/data/app/wi-municipal-boards.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/wi-municipal-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut from main's CURRENT tip rather than this run's shallow checkout:
          # a branch that also differs under .github/workflows/ reads to GitHub
          # as a workflow update and is refused for a token without `workflow`
          # scope (measured 2026-09-02 on update-municipal-officials).
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          git add wi/data/app/wi-municipal-boards.json
          git commit -m "Update the WI at-large municipal board roster from each municipality's own source"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update the WI at-large municipal board roster from each municipality's own source" \
              --body "Automated weekly refresh of the City or Village card's at-large governing-body rows, generated by \`wi/scripts/build_wi_municipal_boards.py\` from \`wi_municipal_board_scraper.py\`. Every seat here is elected by the whole municipality, so a number beside a name is a SEAT and not a district — the card says so in words, and nothing is keyed on the number. The diff's interesting rows are a name that changed (an April election or a resignation), a contact column that emptied, and a \`carriedFrom\` date, which means that municipality's source did not answer this run and its last-good rows were kept rather than deleted. Check the run log's robots line for a municipality that declined. Please review before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
