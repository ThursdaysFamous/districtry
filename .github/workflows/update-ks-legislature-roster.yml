name: Update Kansas legislature roster

# Weekly refresh of the Kansas Senate + House of Representatives rosters
# (ks/data/app/ks-senate-members.json and ks-house-members.json, fetched by
# ks/index.html's chamber cards). Rebuilds both chambers from the Legislature's own member feed
# and, if anything changed, opens a PR rather than committing directly to
# main.
#
# The Kansas Legislature's website reads its member lists from a JSON feed it
# publishes beside them (kslegislature.gov/li/api/...): one list per chamber
# and one record per member, with district, party, Capitol office, telephone,
# e-mail address and web page.
#
# robots.txt: kslegislature.gov's policy is read before the first fetch, with
# the User-Agent the fetches send, and a stated Crawl-delay is honoured; the
# feed is paced at one request a second regardless.
#
# THE REBUILT FILES ARE CARRIED ACROSS THE BRANCH CUT RATHER THAN FETCHED A
# SECOND TIME, the update-ilga-roster.yml pattern. A run where main changed
# those same files meanwhile errors at the checkout instead of pushing, which
# is right.
#
# THE PAGE STEPS LANDED WITH THE GO-LIVE CHANGE (batch 3 of the state-level
# launch). `ks/state-legislature.html` carries a GENERATED table of both
# rosters, and `about.html` and `sitemap.xml` count them, so all three are
# regenerated here and staged in the same `git add`.

on:
  schedule:
    - cron: "31 23 * * 2" # Tuesday 23:31 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # requests, which the shared robots.txt reader can use; the builder itself
      # fetches with the standard library.
      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Rebuild Kansas Senate + House rosters
        run: python3 ks/scripts/build_ks_legislature_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, every data/app file must be present and
      # well formed, and every seat must carry a record.
      - name: Validate app + data files
        run: |
          python3 ks/scripts/validate_index.py ks/index.html
          python3 scripts/validate_chamber_rosters.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- ks/data/app/ks-senate-members.json ks/data/app/ks-house-members.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/ks-legislature-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut from main's current tip, with full history — see the sibling
          # workflows' own comments for why both halves matter. The two rebuilt
          # files ride across the checkout as working-tree changes.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          python3 scripts/build_officeholder_tables.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add ks/data/app/ks-senate-members.json ks/data/app/ks-house-members.json ks/state-legislature.html about.html sitemap.xml
          git commit -m "Update Kansas Senate + House rosters from the Legislature's own member feed"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Kansas Senate + House rosters" \
              --body "Automated weekly refresh of the Kansas Senate and House chamber cards' rosters, from the Legislature's own member feed, generated by \`ks/scripts/build_ks_legislature_roster.py\`. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
