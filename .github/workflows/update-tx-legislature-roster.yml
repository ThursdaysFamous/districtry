name: Update Texas legislature roster

# Weekly refresh of the Texas Senate + House of Representatives rosters
# (tx/data/app/tx-senate-members.json and tx-house-members.json, fetched by
# tx/index.html's chamber cards). Rebuilds both chambers from each chamber's
# own site and, if anything changed, opens a PR rather than committing directly
# to main.
#
# The Senate's member list (senate.texas.gov/members.php) and each senator's
# own page give the name, the party and the Capitol address and telephone. The
# House's member list (house.texas.gov/members) carries every seat as JSON,
# and each member's own page gives the name and the Capitol address and
# telephone. Neither chamber publishes an e-mail address, and the House
# publishes no party. One list page and one page per member (about 183
# requests), and nothing else is fetched.
#
# robots.txt: senate.texas.gov's `*` group (read 2026-11-11) disallows only
# paths this job never reads, and house.texas.gov's allows every path; the
# builder paces the Senate at one request a second and the House at one every
# three seconds regardless (the House site slows down when asked faster), so a
# run takes about ten minutes. It reads each policy before its first fetch with the
# User-Agent its fetches send.
#
# THE REBUILT FILES ARE CARRIED ACROSS THE BRANCH CUT RATHER THAN FETCHED A
# SECOND TIME, the update-ilga-roster.yml pattern. A run where main changed
# those same files meanwhile errors at the checkout instead of pushing, which
# is right.
#
# TEXAS IS DARK, so this job does not regenerate tx/state-legislature.html:
# build_legislator_pages.py refuses an instance metros.json does not carry, so
# that page is not built yet. Go-live adds the step in the same change that
# adds tx to metros.json — tx/WATCH.md has the list.

on:
  schedule:
    - cron: "33 20 * * 2" # Tuesday 20:33 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # requests for the shared robots.txt reader; the roster page and the feed
      # are fetched and parsed with the stdlib.
      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Rebuild Texas Senate + House rosters
        run: python3 tx/scripts/build_tx_legislature_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, every data/app file must be present and
      # well formed, and every seat must carry a record.
      - name: Validate app + data files
        run: |
          python3 tx/scripts/validate_index.py tx/index.html
          python3 scripts/validate_chamber_rosters.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- tx/data/app/tx-senate-members.json tx/data/app/tx-house-members.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/tx-legislature-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut from main's current tip, with full history — see the sibling
          # workflows' own comments for why both halves matter. The two rebuilt
          # files ride across the checkout as working-tree changes.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          git add tx/data/app/tx-senate-members.json tx/data/app/tx-house-members.json
          git commit -m "Update Texas Senate + House rosters from each chamber's site"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Texas Senate + House rosters" \
              --body "Automated weekly refresh of the Texas Senate and House chamber cards' rosters, from each chamber's own member pages, generated by \`tx/scripts/build_tx_legislature_roster.py\`. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
