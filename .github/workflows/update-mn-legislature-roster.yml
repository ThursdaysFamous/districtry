name: Update Minnesota legislature roster

# Weekly refresh of the Minnesota Senate + House of Representatives rosters
# (mn/data/app/mn-senate-members.json and mn-house-members.json, fetched by
# mn/index.html's chamber cards). Rebuilds both chambers from each chamber's
# own site and, if anything changed, opens a PR rather than committing
# directly to main.
#
# The Senate's site (www.mnsenate.gov) draws its member list from one feed it
# publishes beside it; the House's member list (www.house.mn.gov/members) is
# one page, of which only the tab of sitting members is read. Two requests in
# all.
#
# robots.txt: each host's policy is read before its first fetch, with the
# User-Agent the fetches send, and a stated Crawl-delay is honoured.
#
# THE REBUILT FILES ARE CARRIED ACROSS THE BRANCH CUT RATHER THAN FETCHED A
# SECOND TIME, the update-ilga-roster.yml pattern. A run where main changed
# those same files meanwhile errors at the checkout instead of pushing, which
# is right.
#
# `mn/state-legislature.html` carries a GENERATED table of both rosters, and
# `about.html` and `sitemap.xml` count them, so all three are regenerated here
# and staged in the same `git add`.

on:
  schedule:
    - cron: "37 9 * * 4" # Thursday 09:37 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # requests, which the builder and the shared robots.txt reader fetch with.
      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Rebuild Minnesota Senate + House rosters
        run: python3 mn/scripts/build_mn_legislature_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, every data/app file must be present and
      # well formed, and every seat must carry a record.
      - name: Validate app + data files
        run: |
          python3 mn/scripts/validate_index.py mn/index.html
          python3 scripts/validate_chamber_rosters.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- mn/data/app/mn-senate-members.json mn/data/app/mn-house-members.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/mn-legislature-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut from main's current tip, with full history — see the sibling
          # workflows' own comments for why both halves matter. The two rebuilt
          # files ride across the checkout as working-tree changes.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          python3 scripts/build_officeholder_tables.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add mn/data/app/mn-senate-members.json mn/data/app/mn-house-members.json mn/state-legislature.html about.html sitemap.xml
          git commit -m "Update Minnesota Senate + House rosters from each chamber's own site"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Minnesota Senate + House rosters" \
              --body "Automated weekly refresh of the Minnesota Senate and House chamber cards' rosters, from each chamber's own site, generated by \`mn/scripts/build_mn_legislature_roster.py\`. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
