name: Update Lee County Board roster

# Weekly refresh of the Lee County Board District card's member roster
# (il/data/app/lee-county-board-members.json, fetched by index.html). Re-scrapes
# the Clerk's Member Contact List (district, name, party, the year the seat is
# next on the ballot, county e-mail) and, if anything changed, opens a PR rather
# than committing directly to main — officeholder data should get a human look
# before it ships.
#
# ONLY THE ROSTER IS ON A CRON, and unlike Carroll's or Ogle's there is no
# operator half to pair it with: Lee DRAWS its four board districts, so the
# geometry comes live from the county's own GIS
# (gis.leecountyil.gov/leecogis, Election/County_Board_Districts) on first
# toggle. Nothing to rebuild when the county reapportions — the layer follows.
#
# WHY A PDF PARSER FOR A PAGE URL. /419/Member-Contact-List looks like an HTML
# page and the CMS serves a PDF at it. That document is the only place Lee
# publishes its membership; the County Board landing page names the Chair and
# Vice-Chair and nobody else.
#
# WHY pdfplumber AND NOT pypdf. pypdf flattens the document into a block of
# twenty name rows followed by twenty e-mail addresses IN A DIFFERENT ORDER,
# because the e-mail column is a separate text object. Pairing those by sequence
# would silently mis-assign addresses to people. The words carry x/y positions,
# so the scraper reads the row exactly as printed — the same reason LaSalle's
# municipal directory needs positional parsing.

on:
  schedule:
    - cron: "0 16 * * 2" # Tuesday 16:00 UTC (staggered from the Tue 13:00/14:00/15:00 jobs)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # The document is served to an ordinary browser UA with no challenge, so
        # requests alone — plus pdfplumber for the positional read.
        run: pip install -c scripts/requirements.txt requests pdfplumber

      - name: Scrape Lee County Board member roster
        run: python3 scripts/lee_county_board_scraper.py --out /tmp/lee_county_board_raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_lee_county_board_roster.py /tmp/lee_county_board_raw.json

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present and
      # well formed.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/lee-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_sitemap.py
          git add il/data/app/lee-county-board-members.json il/county-board il/county-board.html sitemap.xml
          git commit -m "Update Lee County Board roster from leecountyil.com"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Lee County Board roster from leecountyil.com" \
              --body "Automated weekly refresh of the Lee County Board District card's member roster (district, name, party, the year the seat is next on the ballot, county e-mail), generated by \`scripts/lee_county_board_scraper.py\` + \`scripts/build_lee_county_board_roster.py\`. Please review the diff before merging — this changes data about real officeholders.

          Two things to know when reading the diff. The source is a PDF read by WORD POSITION, because a line-flattened read pairs each member with the wrong e-mail; the scraper's floor is the full board of 20 for that reason, since a member lost to a column split is invisible in the output. And the Board Chair carries no title in the document — he is identified by his row holding the county's shared \`leecochair@countyoflee.org\` address instead of a personal one, which is the county's own marker rather than an inference about who presides." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
