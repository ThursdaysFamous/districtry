name: Update MPS school board roster

# Weekly refresh of the MPS school board card's roster
# (wi/data/app/mps-school-board-members.json) — the nine Milwaukee Board of
# School Directors (at-large president + districts 1-8) from the district's
# own directors page, WITNESSED against the board index's committee lists:
# two surfaces the district maintains separately must name the same
# directors, so a stale page or a reshaped parse fails the run loudly rather
# than shipping quietly. The seats' contact links are the board's one shared
# contact form; the builder collapses them to a board-level link and keeps
# them per-member automatically if the district ever splits them.

on:
  schedule:
    - cron: "30 15 * * 1" # Monday 15:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Scrape the directors page (with the committee witness)
        run: python3 wi/scripts/mps_school_board_scraper.py

      - name: Rebuild the MPS school board roster
        run: python3 wi/scripts/build_mps_school_board_roster.py

      - name: Validate app + data files
        run: python3 wi/scripts/validate_index.py wi/index.html

      # THE PAGE NAMES THESE PEOPLE AND COUNTS THEM IN ITS OWN PROSE, so it is
      # regenerated in the same run. Both generators gate on it: skip this and
      # the failure lands on THIS job's own pull request, where nobody wrote the
      # change that broke it.
      - name: Regenerate the school board page
        run: |
          python3 scripts/build_concept_pages.py
          python3 scripts/build_officeholder_tables.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- wi/data/app/mps-school-board-members.json wi/school-board.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/mps-school-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          python3 scripts/build_about_page.py
          git add wi/data/app/mps-school-board-members.json wi/school-board.html about.html
          git commit -m "Update MPS school board roster from the district's directors page"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update MPS school board roster from the district's directors page" \
              --body "Automated weekly refresh of the MPS school board card's roster, generated by \`wi/scripts/build_mps_school_board_roster.py\` from \`mps_school_board_scraper.py\` (the district's own directors page, witnessed against the board index's committee lists). Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
