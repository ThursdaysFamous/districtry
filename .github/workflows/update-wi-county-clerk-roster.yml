name: Update WI county clerk roster

# Weekly refresh of Wisconsin's 72 county clerks
# (wi/data/app/wi-county-clerks.json, read by wi/index.html's County card).
# Two open sources cross-gate each other — WEC's own surfaces sit behind a
# Cloudflare challenge (measured; an access control, never defeated):
#
#   * the Wisconsin Blue Book's county-clerks table (a state publication —
#     names, the A/D/I/R party-or-appointed code, county websites), and
#   * wisconsincountyclerks.org, the clerks' own association (one page per
#     county: name, office address, hours, phone, fax, e-mail).
#
# Where the two disagree on a name, the association's ships (the Blue Book is
# an April 2025 snapshot; an appointed replacement post-dates it), the party
# code is withheld rather than pinned on the wrong person, and the divergence
# prints in the build log — read it on review.
#
# THE CRAWL IS SLOW ON PURPOSE: the association's robots.txt sets
# Crawl-delay 10 and the scraper honors it, so the 72-page pass takes ~12
# minutes. That is the cost of being a polite client of the source that
# makes this roster possible.

on:
  schedule:
    - cron: "30 14 * * 5" # Friday 14:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -c wi/scripts/requirements.txt pdfplumber

      - name: Scrape the Blue Book table and the clerks' association
        run: python3 wi/scripts/wi_county_clerk_scraper.py

      - name: Rebuild the county clerk roster
        run: python3 wi/scripts/build_wi_county_clerk_roster.py

      # phase 4 PR 2: the counties whose own officer pages measure open are
      # re-read weekly — office phone/e-mail/link, plus a name witness that
      # supersedes the book where a county has visibly moved past it
      - name: Scrape county officer contact pages
        run: python3 wi/scripts/wi_county_officer_contact_scraper.py

      - name: Rebuild the county officer roster
        # phase 4: the scraper above also parses the Blue Book's other
        # county-officer tables into its second intermediate; this builder
        # gates the chair-seats witness and the Menominee pin, reconciles
        # the board chair against the weekly board roster, and merges the
        # contact scrape (the Thursday workflow rebuilds this file too —
        # whichever runs after a change ships it)
        run: python3 wi/scripts/build_wi_county_officer_roster.py

      # The history page's stat tiles are MEASURED from this data — regenerate
      # it in the same run so the smoke gate's build_history_page --check stays
      # green on this PR (a tile that drifted from the data it counts fails CI)
      - name: Regenerate the history page
        run: python3 scripts/build_history_page.py

      # The history page this job just rewrote is IN the sitemap, and the
      # sitemap's lastmod is that file's own last commit -- so regenerate it in
      # the same run, or the smoke gate's `build_sitemap.py --check` fails on
      # this PR for a date nobody typed. Stdlib only.
      - name: Regenerate the sitemap
        run: python3 scripts/build_sitemap.py

      - name: Validate app + data files
        run: python3 wi/scripts/validate_index.py wi/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- wi/data/app/wi-county-clerks.json wi/data/app/wi-county-officers.json wi/history.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/wi-county-clerk-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          git add wi/data/app/wi-county-clerks.json wi/data/app/wi-county-officers.json wi/history.html
          git commit -m "Update WI county clerks from the Blue Book and the clerks' association"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update WI county clerks from the Blue Book and the clerks' association" \
              --body "Automated weekly refresh of the County card's clerk roster, generated by \`wi/scripts/wi_county_clerk_scraper.py\` + \`build_wi_county_clerk_roster.py\` from the Wisconsin Blue Book's county-clerks table cross-gated against wisconsincountyclerks.org. Please review the diff before merging — this changes data about real officeholders, and the build log prints any county where the two sources disagree on the name (the association's ships; the party code is withheld there)." \
              --base main \
              --head "$branch"
          else
            gh pr comment "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" \
              --body "Refreshed by this week's scheduled run — the branch was force-updated with the latest scrape."
          fi
