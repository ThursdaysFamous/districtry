name: Update Florida legislature roster

# Weekly refresh of the Florida Senate + House of Representatives rosters
# (fl/data/app/fl-senate-members.json and fl-house-members.json, fetched by
# fl/index.html's chamber cards). Rebuilds both chambers from each chamber's
# own site and, if anything changed, opens a PR rather than committing directly
# to main.
#
# The Senate's member list (www.flsenate.gov/Senators/) gives each seat's
# senator and party, and each senator's own page gives the name, the
# senator's own e-mail address and the Tallahassee office and telephone. The
# House's member list (www.flhouse.gov, representatives.aspx) gives each
# seat's member and party, and each member's contact page gives the name and
# the Capitol office and telephone; the House publishes no e-mail address. One
# list page per chamber and one page per member (about 162 requests), and
# nothing else is fetched.
#
# robots.txt: both chambers' policies are read before the first fetch of each
# host, with the User-Agent the fetches send, and the builder paces the Senate
# at one request a second and the House at one every two seconds, so a run
# takes about six minutes.
#
# THE REBUILT FILES ARE CARRIED ACROSS THE BRANCH CUT RATHER THAN FETCHED A
# SECOND TIME, the update-ilga-roster.yml pattern. A run where main changed
# those same files meanwhile errors at the checkout instead of pushing, which
# is right.
#
# FLORIDA IS DARK, so this job does not regenerate fl/state-legislature.html:
# build_legislator_pages.py refuses an instance metros.json does not carry, so
# that page is not built yet. Go-live adds the step in the same change that
# adds fl to metros.json — fl/WATCH.md has the list.

on:
  schedule:
    - cron: "47 20 * * 3" # Wednesday 20:47 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # requests, which the builder fetches every page with and which the shared
      # robots.txt reader needs.
      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Rebuild Florida Senate + House rosters
        run: python3 fl/scripts/build_fl_legislature_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, every data/app file must be present and
      # well formed, and every seat must carry a record.
      - name: Validate app + data files
        run: |
          python3 fl/scripts/validate_index.py fl/index.html
          python3 scripts/validate_chamber_rosters.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- fl/data/app/fl-senate-members.json fl/data/app/fl-house-members.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/fl-legislature-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut from main's current tip, with full history — see the sibling
          # workflows' own comments for why both halves matter. The two rebuilt
          # files ride across the checkout as working-tree changes.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          git add fl/data/app/fl-senate-members.json fl/data/app/fl-house-members.json
          git commit -m "Update Florida Senate + House rosters from each chamber's site"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Florida Senate + House rosters" \
              --body "Automated weekly refresh of the Florida Senate and House chamber cards' rosters, from each chamber's own member pages, generated by \`fl/scripts/build_fl_legislature_roster.py\`. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
