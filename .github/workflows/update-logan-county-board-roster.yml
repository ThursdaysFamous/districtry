name: Update Logan County Board roster

# Weekly refresh of the Logan County Board District card's member roster
# (il/data/app/logan-county-board-members.json, fetched by index.html).
# Re-scrapes the county's own Joomla board page (six two-member
# districts with Chair/Vice-Chair tags and per-member phone + e-mail) and, if anything changed, opens a PR
# rather than committing directly to main — officeholder data should get a
# human look before it ships.
#
# The boundary half is the live TCRPC district layer the entry already
# reads; nothing here touches geometry. This roster's existence retired the
# entry's rule-4 branch-3 honesty floor (gap logan-county-board-members).

on:
  schedule:
    - cron: "0 17 * * 1" # Monday 17:00 UTC (after Woodford at 16:00)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI (a PR opened with the default GITHUB_TOKEN fires no workflows).
      # Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # Plain server-rendered Joomla HTML; requests alone suffices.
        run: pip install -c scripts/requirements.txt requests

      - name: Scrape Logan County Board member roster
        run: python3 scripts/logan_county_board_scraper.py /tmp/logan_county_board_raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_logan_board_roster.py /tmp/logan_county_board_raw.json

      # Gate the regenerated data before it can reach a PR.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR.
          branch="bot/logan-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          git fetch --depth=1 origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add il/data/app/logan-county-board-members.json il/county-board il/county-board.html about.html sitemap.xml
          git commit -m "Update Logan County Board roster from logancountyil.gov"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Logan County Board roster from logancountyil.gov" \
              --body "Automated weekly refresh of the Logan County Board District card's member roster (six districts, two members each, with the Chair and Vice Chair tagged and per-member phones and e-mails), generated by \`scripts/logan_county_board_scraper.py\` + \`scripts/build_logan_board_roster.py\` from the county's own directory. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
