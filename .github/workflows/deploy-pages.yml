name: Deploy to GitHub Pages

# Publishes only the files the app actually serves — index.html, sw.js,
# manifest.webmanifest, CNAME, .nojekyll, icons/, and il/data/app/*.json — instead
# of the whole branch. The classic "Deploy from a branch" flow shipped the entire
# tree to the CDN: the scrapers/builders (scripts/), the docs (docs/), and ~5 MB
# of build-only geometry (data/source/ raw zips+xlsx and the three full-precision
# data/*.geojson originals that il/data/app/*.json is simplified from). None of that
# is fetched at runtime, so this assembles a curated site directory and uploads
# that as the Pages artifact.
#
# ONE-TIME OWNER SETUP REQUIRED: this workflow only takes effect once the repo's
# Pages *source* is switched from "Deploy from a branch" to "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source). Until then the classic
# branch deploy keeps serving the live site and this job's final deploy step will
# fail (harmless — no outage, the classic deploy is still authoritative). After
# the flip, this becomes the deploy path and the custom domain (CNAME) is
# preserved by shipping the CNAME file in the artifact.
#
# The exclude list below is the ONLY thing standing between "app files" and "app
# files + 5 MB of build inputs". Keep data/app in and data/source + data/*.geojson
# out when either moves.
#
# NO ENGINE ASSEMBLY (retired in R2.1 — docs/DEV_PROCESS_ASSESSMENT.md). This
# deploy used to splice the fenced ENGINE blocks from a hash-pinned release
# before publishing, because the engine had to reach sibling REPOS byte-identically.
# The fleet is consolidating into this one repo, so there is one copy of the
# engine and parity is true because there is nothing to keep in sync. The tree
# that is committed is the tree that ships — and that also means a fence edit
# now reaches production instead of being silently overwritten at deploy time.
# The gates still run here on exactly the bytes being published.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Least-privilege token set the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-progress deploy finish rather than
# cancelling it mid-publish (which could leave the site half-updated).
concurrency:
  group: pages
  cancel-in-progress: false

# One pin, two consumers: the npm install and the browser-cache key below must
# name the same Playwright version, or a bump re-downloads Chromium forever
# against a stale cache key. Defined once so they cannot drift.
env:
  PLAYWRIGHT_VERSION: "1.56.1"

# Two jobs (the standard Pages layout): `assemble` carries no environment, so
# it runs on ANY ref — which is what lets a corruption drill (and any future
# branch verification) actually exercise the hash gate; the github-pages
# environment's branch protection rejects non-main jobs before a single step
# runs, so a one-job layout can never fail at sha256sum on a branch. `deploy`
# keeps the environment gate and only runs for main. (Ported from the NYC
# fork, which hit exactly this in its Phase 1.5 drill.)
jobs:
  assemble:
    runs-on: ubuntu-latest
    # A CEILING ON THE WHOLE JOB, added 2026-08-18 after three runs in two days
    # sat "in_progress" long enough to look hung — 57 minutes, then 35, then 16,
    # every one of them on the Playwright install below. THEY WERE NOT UNBOUNDED
    # HANGS, which is the thing worth knowing: the install's first retry ladder
    # was bounded but could stack ~30 minutes of grinding that reports nothing
    # and, on deploy-pages, holds the Pages concurrency slot so every
    # later deploy queues behind it. A bounded-but-half-hour step is
    # indistinguishable from a hang to anyone watching, and the only thing that
    # caught all three was comparing the live site against the repo by hand.
    # This makes that state VISIBLE — a red run a human can act on — instead of
    # silent. The install step now sizes its phase budgets to fail NAMED under
    # its own 15-minute cap, so this ceiling guards the OTHER steps and true
    # catastrophes, not the install's ordinary sick days.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The gates run on exactly the bytes about to be published. There is no
      # splice step any more (R2.1): the committed tree IS the deployed tree,
      # so this re-runs the merge gate and the fence lint against it rather
      # than against an assembled copy that only existed inside this job.
      - name: Static merge gate + fence lint on the tree being published
        run: |
          python3 scripts/validate_index.py il/index.html
          python3 scripts/check_engine_parity.py il/index.html
          python3 scripts/check_engine_parity.py il/sw.js
          python3 scripts/compose_app.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Same pinned toolchain as smoke-test.yml. The behaviour gate re-runs
      # here because the assembled tree (committed files + spliced engine) is
      # what actually ships — smoke-test.yml only covered the committed tree.
      # The cache + timeout/retry pair mirrors smoke-test.yml, which carries
      # the full story (the 2026-08-18 CDN hangs).
      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.PLAYWRIGHT_VERSION }}-${{ runner.os }}

      # No apt step: the runner image already carries every library Chromium
      # loads, so this proves Chromium starts instead. smoke-test.yml carries
      # the story (Ubuntu's mirror at 40 KB/s on 2026-10-22).
      - name: Install Playwright + Chromium
        timeout-minutes: 15
        run: |
          retry() {
            local attempts=$1 budget=$2; shift 2
            for i in $(seq 1 "$attempts"); do
              timeout "$budget" "$@" && return 0
              echo "::warning::attempt $i/$attempts of '$*' hung or failed"
              sleep 5
            done
            echo "::error::'$*' failed $attempts time(s) at ${budget}s each"
            return 1
          }
          retry 3 60 npm install "playwright@${PLAYWRIGHT_VERSION}"
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            retry 2 300 npx playwright install chromium
          fi
          if ! timeout 60 node -e "require('playwright').chromium.launch().then(b => b.close())"; then
            echo "::error::Chromium does not start with the libraries on this runner image; restore 'npx playwright install-deps chromium' to this step"
            exit 1
          fi

      - name: Behaviour gate on the assembled tree (serve + smoke test)
        env:
          BASE_URL: http://localhost:8000/il/
        run: |
          python3 -m http.server 8000 &
          server_pid=$!
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/il/ >/dev/null && break
            sleep 0.5
          done
          node scripts/smoke_test.mjs
          status=$?
          kill "$server_pid" 2>/dev/null || true
          exit $status

      # NEVER put a `#` comment between two backslash-continued lines. Bash joins
      # the continuation FIRST, so the comment swallows the rest of the logical
      # line: rsync ran with its excludes and NO SOURCE OR DESTINATION, exited 1
      # on a usage error, and the remaining `--exclude='sf' … ./ _site/` lines
      # were parsed as a separate command. That is how this deploy broke on the
      # R3 part-1 merge — the gates all passed, the site simply stopped
      # publishing. Explanations go ABOVE the command, or in a variable.
      #
      # Two things this list is load-bearing for:
      #
      # 1. App files only. It is the ONLY thing standing between "app files" and
      #    "app files + 5 MB of build inputs". Keep il/data/app IN and
      #    il/data/source + il/data/*.geojson OUT when either moves. wi/data/source
      #    joined that list when the Wisconsin Elections Commission's polling
      #    workbook was committed there — a 318 KB .xlsx build input the app
      #    never serves.
      #
      # 2. Imported instances are NOT published yet. sf/ and nyc/ live in this
      #    repo so they can share the engine and the tooling, but each still
      #    serves from its own domain and carries its own canonical. Publishing
      #    them here before that cutover would put a second live copy of each app
      #    on this origin. Drop an instance from EXCLUDES when its domain moves
      #    (R5) — that is the switch that makes it live.
      - name: Assemble site (app files only — drop scripts/docs/raw data)
        run: |
          mkdir _site
          EXCLUDES=(
            .git .github .claude scripts docs
            # The short-link lookup runs on Deno Deploy, not on this site.
            services
            il/data/source il/icons/source 'il/data/*.geojson'
            ny/data/source ny/icons/source 'ny/data/*.geojson'
            ca/data/source ca/icons/source 'ca/data/*.geojson'
            ny/scripts ny/docs ny/.github ca/scripts ca/docs ca/.github
            wi/data/state wi/data/source wi/scripts 'wi/data/*.geojson'
            ia/data/state ia/data/source ia/scripts
            mi/data/state mi/data/source mi/scripts
            mn/data/state mn/data/source mn/scripts
            ky/data/state ky/data/source ky/scripts
            in/data/state in/data/source in/scripts 'in/data/*.geojson'
            nc/data/state nc/data/source nc/scripts
            ok/data/state ok/data/source ok/scripts
            sc/data/state sc/data/source sc/scripts
            tn/data/state tn/data/source tn/scripts
            ar/data/state ar/data/source ar/scripts
            ms/data/state ms/data/source ms/scripts
            la/data/state la/data/source la/scripts
            mo/data/state mo/data/source mo/scripts
            # Georgia arrives dark: the whole folder is excluded until
            # go-live, and metros.json deliberately carries no ga entry until
            # then (validate_instance_registration.py holds the two together).
            # THE BLANKET `<tag>/**` FORM IS LOAD-BEARING, not a style: it is
            # what dark_instances() reads, and four generators import that to
            # tell a dark folder from an unregistered one. It goes live only on
            # the operator's word.
            'ga/**'
            # Virginia arrives dark the same way, with no va entry in
            # metros.json until the operator's word.
            'va/**'
            # West Virginia arrives dark the same way, with no wv entry in
            # metros.json until the operator's word.
            'wv/**'
            fonts/barlow-fontface.css
            # Search Console counts the traffic report reads when it rebuilds
            # elsewhere; nothing on this site fetches them. Written as a full
            # path ON PURPOSE: an rsync --exclude with no slash matches a
            # BASENAME at any depth, so a bare "data" here would silently
            # unpublish il/data/app, wi/data/app and every other instance's
            # runtime files while every guard below still passed.
            data/search-performance.json
            # Any dot-prefixed .mjs, which in this tree is only ever an
            # ad-hoc browser harness (.gitignore's reason block names the
            # convention). Those ignore patterns protect only names that follow
            # them, and on 2026-10-01 `.courtprobe.tmp.mjs` followed neither,
            # rode a merge into main and was served at the site root. Matched by
            # BASENAME on purpose — an rsync pattern with no slash matches at any
            # depth, and no legitimate file here is a dot-prefixed .mjs.
            '.*.mjs'
            node_modules package.json package-lock.json
            engine metros.json metro-worksheet.json point-transmission.json
            layer-sources.json layer-load.json layer-codes.json tiger-mirror.json portal-mirror.json
            user-agent-measurements.json robots-verdicts.json
            schema CLAUDE.md
            _site
          )
          args=()
          for e in "${EXCLUDES[@]}"; do args+=(--exclude="$e"); done
          rsync -a "${args[@]}" ./ _site/
          # A published tree with no il/index.html is the failure this step must
          # never pass silently — it is exactly what the broken form produced.
          test -f _site/il/index.html || { echo "::error::assemble produced no il/index.html"; exit 1; }
          test -f _site/index.html    || { echo "::error::assemble produced no root redirect stub"; exit 1; }
          # The fleet privacy page is generated and lives at the ROOT, and every
          # app links it with a `../` hop. An assemble that drops it turns that
          # link into a 404 on all three apps at once.
          test -f _site/privacy.html  || { echo "::error::assemble produced no root privacy.html"; exit 1; }
          # The landing page embeds the coverage map in an iframe, and the map
          # in turn fetches each instance's own outline from its data/app. An
          # assemble that drops either publishes a front door with a 404 in the
          # middle of it. The outline paths are READ OUT OF the generated map
          # rather than listed here, so adding a state cannot leave this guard
          # behind — it checks whatever the map actually asks for.
          # NB the loop is NOT `grep | while read`: a pipeline's last stage runs
          # in a subshell, so an `exit 1` in there would abandon the subshell and
          # let the step pass — a guard that cannot fail.
          test -f _site/coverage-map.html || { echo "::error::assemble produced no root coverage-map.html"; exit 1; }
          missing=""
          for outline in $(grep -oE '"[a-z]{2}/data/app/[a-z0-9-]+\.json"' _site/coverage-map.html | tr -d '"' | sort -u); do
            test -f "_site/$outline" || missing="$missing $outline"
          done
          if [ -n "$missing" ]; then
            echo "::error::the coverage map fetches outline(s) the assemble did not publish:$missing"
            exit 1
          fi
          # robots.txt and llms.txt. Neither is excluded above and both ship
          # today, and neither has a loud failure mode, which is why they are
          # asserted rather than assumed. robots.txt carries the site's
          # Content-Signal — search=yes, ai-input=yes, ai-train=no,
          # use=reference — and that line IS the reservation of rights: if the
          # file stops being served, the reservation silently stops existing
          # while every page on the site still looks correct. llms.txt is the
          # guide robots.txt points a client at, so a dropped one turns a
          # published pointer into a 404. Both are generated or gated
          # (scripts/build_llms_txt.py --check, scripts/robots_policy.py
          # --selftest), and neither gate can see what the deploy publishes.
          test -f _site/robots.txt || { echo "::error::assemble produced no robots.txt — the Content-Signal reservation would not be served"; exit 1; }
          test -f _site/llms.txt   || { echo "::error::assemble produced no llms.txt — robots.txt points clients at it"; exit 1; }
          # Every app fetches ../fleet-outlines.json to decide which app a
          # selected point belongs to; without it no reader is handed off.
          test -f _site/fleet-outlines.json || { echo "::error::assemble produced no fleet-outlines.json — the apps could not hand a reader to a sibling"; exit 1; }
          # The installed app. The apps and the front door link the ONE manifest
          # at the root, whose start_url is the launcher at /app/, which registers its own
          # worker; the five icons are the manifest's, three for the app and one
          # for each long-press shortcut. An assemble that drops
          # any of them leaves every page looking right in a browser tab while
          # a phone that installs districtry opens to a 404 or a blank icon.
          # .well-known/assetlinks.json is the Google Play app's: without it
          # the app still opens, with an address bar across the top.
          for installed in manifest.webmanifest app/index.html app/sw.js favicon-192.png icon-512.png icon-maskable-512.png shortcut-locate-192.png shortcut-report-192.png .well-known/assetlinks.json; do
            test -f "_site/$installed" || { echo "::error::assemble produced no $installed — the installed app needs it"; exit 1; }
          done
          grep -q '^Content-Signal:' _site/robots.txt || { echo "::error::the published robots.txt carries no Content-Signal line"; exit 1; }
          # The FLOSS/fund manifest and its wellKnown proof. rsync -a copies
          # dotfolders (which is why .git/.github/.claude are excluded above),
          # so both ship today — but neither has a loud failure mode. A dropped
          # funding.json 404s a URL published to a funding directory, and a
          # dropped .well-known stops the manifest VERIFYING while the manifest
          # itself still serves and still looks right: the spec resolves that
          # file to decide whether this project may solicit funding on behalf of
          # the hosts it names. Both are asserted rather than assumed.
          test -f _site/funding.json || { echo "::error::assemble produced no root funding.json"; exit 1; }
          test -f _site/.well-known/funding-manifest-urls || { echo "::error::assemble dropped .well-known/funding-manifest-urls — the funding manifest cannot verify without it"; exit 1; }
          for unpublished in engine; do
            test ! -e "_site/$unpublished" || { echo "::error::$unpublished leaked into the published tree"; exit 1; }
          done
          # R5: ny/, ca/, wi/, ia/, mi/, mn/, ky/, in/, nc/, ok/, sc/, tn/, ar/, ms/, la/ and
          # (as of Missouri's go-live PR) mo/ are LIVE now — chidistricts.com's subdomains forward to /ny and /ca, so
          # an assemble that drops any of them serves a 404 to every redirected
          # visitor or every reader of districtry.com/<tag>/. The old guard
          # asserted their ABSENCE; publishing them means asserting their
          # PRESENCE, or the same silent failure the il/index.html check
          # exists to prevent happens to the siblings.
          for published in ny ca wi ia mi mn ky in nc ok sc tn ar ms la mo; do
            test -f "_site/$published/index.html" || { echo "::error::assemble produced no $published/index.html"; exit 1; }
          done
          echo "Published tree:" && find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Only main deploys; a branch dispatch stops after `assemble` (that run's
    # verdict IS the verification) instead of dying on the github-pages
    # environment's branch protection.
    if: github.ref == 'refs/heads/main'
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify-indexnow:
    # Best-effort recrawl ping to the IndexNow engines (Bing/Yandex/Seznam/
    # Naver — not Google). scripts/indexnow_submit.py's own rule is "run only
    # AFTER a deploy where the key file is already live": `needs: deploy` is
    # exactly that, since deploy-pages@v4 completes only once the Pages
    # deployment reports success — including the very first deploy that ships
    # the key file itself. Job-level continue-on-error because a rejected ping
    # must never redden a successful deploy, and this job runs after `deploy`
    # completes so it can never hold the `pages` concurrency slot. The script
    # is stdlib-only (validate_workflow_deps.py holds it to that, since this
    # workflow installs nothing).
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/indexnow_submit.py
