name: Update Wayne County Board roster

# Weekly refresh of the Wayne County Board District card's member roster
# (il/data/app/wayne-county-board-members.json), fetched by index.html.
#
# TWO JOBS IN ONE RUN, and the second is the important one.
#
# 1. THE ROSTER comes from the county's own board page, one paragraph per
#    district: a "DISTRICT N:" heading, the precincts that make it up, and
#    two member lines (a Chairman or Vice Chairman gets a trailing role). No
#    e-mail, phone, party or term is published, so none ships.
#
# 2. THE REDISTRICTING TRIPWIRE. Wayne's board districts are the DISSOLVE of
#    its voting precincts (Census 2020 VTDs, scripts/build_wayne_boundaries.py),
#    composed from the SAME board page this scrape re-reads — so the shipped
#    boundary is correct only while that page keeps naming the same seven
#    districts over the same precincts. The same run re-reads the precinct
#    list per district and FAILS if it stops matching, EXCEPT District 7:
#    the page has never named Fairfield 1 or Fairfield 2, which the shipped
#    composition places there from the county's certified 2024 General
#    instead, so District 7 is checked as a subset rather than an exact
#    match (see scripts/build_wayne_county_board.py). A red run here means
#    the county redistricted or re-precincted and a human must re-derive the
#    composition before this county ships again.
#
#    WHAT THE CHECK CANNOT SEE: a change to Fairfield's own district, since
#    nothing here re-reads the certified canvass every week. That is a
#    stated limit, not an oversight.
#
# If anything changed, this opens a PR rather than committing to main:
# officeholder data gets a human look before it ships.

on:
  schedule:
    - cron: "0 21 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          # FULL history, because this job regenerates sitemap.xml and
          # build_sitemap.py reads each page's lastmod from that file's own last
          # commit. Under the default depth-1 checkout git reports the single
          # fetched commit as the last commit of EVERY file, so every one of the
          # 243 entries takes today's date. Measured 2026-09-19 by building the
          # sitemap in a depth-1 clone: 243 of 243 lastmods moved, against 0 in a
          # full clone, where `build_sitemap.py --check` passes. A bot run on
          # 2026-09-17 shipped 241 wrong dates this way.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install scraper dependencies
        # The board page is a static server-rendered response, so requests plus
        # the stdlib re module reach it. The builder imports only CONSTANTS
        # from build_wayne_boundaries.py, whose geometry stack is
        # function-local (the De Witt seam), so no shapely here.
        run: pip install -c scripts/requirements.txt requests

      - name: Scrape the board page
        run: python3 scripts/wayne_county_board_scraper.py -o /tmp/wayne_board_raw.json

      - name: Rebuild roster data file
        run: python3 scripts/build_wayne_county_board.py /tmp/wayne_board_raw.json

      # Gate the regenerated data before it can reach a PR.
      - name: Validate app + data files
        run: python3 scripts/validate_index.py il/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- il/data/app/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR.
          branch="bot/wayne-county-board-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with. actions/checkout is shallow, these runs take tens
          # of minutes, and if main gains a .github/workflows/ change meanwhile,
          # the branch ends up differing from main THERE too — which GitHub reads
          # as the push updating a workflow and refuses for a token without
          # `workflow` scope. Measured 2026-09-02 on update-municipal-officials.
          # Re-cutting leaves this branch differing from main in its data file(s)
          # alone; the rebuilt files are carried across, and a run where main
          # touched those same files errors instead of pushing, which is right.
          # Full history, for the same reason as fetch-depth: 0 above. `git fetch
          # --depth=1` RE-SHALLOWS a clone that was fetched complete (measured:
          # 512 commits down to 13), so the two have to move together — deepening
          # the checkout alone would be undone here.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          # The per-county board pages (il/county-board/) are GENERATED from
          # the roster this job just rewrote, so regenerate them here or the
          # smoke gate's `build_county_pages.py --check` fails on this PR with a
          # page naming last week's members. The sitemap follows, because those
          # pages are in it and its lastmod is each file's own last commit.
          python3 scripts/build_county_pages.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          # docs/EAM_STATUS.md counts the districts this roster names, so a
          # county gaining or losing a member moves it and the smoke gate's
          # `build_eam_status.py --check` fails on this PR. See that script's
          # check_workflows(), which is what names this job.
          python3 scripts/build_eam_status.py
          git add il/data/app/wayne-county-board-members.json il/county-board il/county-board.html about.html sitemap.xml docs/EAM_STATUS.md
          git commit -m "Update Wayne County Board roster from waynecountyil.gov"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Wayne County Board roster from waynecountyil.gov" \
              --body "Automated weekly refresh of the Wayne County Board District card's member roster, generated by \`scripts/wayne_county_board_scraper.py\` + \`scripts/build_wayne_county_board.py\`. Please review the diff before merging — this changes data about real officeholders. The same run re-reads the county's own board page's per-district precinct list and fails if it stops matching the shipped dissolve (District 7 checked as the known page/canvass subset); that failure would mean the county redistricted or re-precincted, and the geometry must be re-derived before it ships again." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
