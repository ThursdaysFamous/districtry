name: Update Nebraska legislature roster

# Weekly refresh of the Nebraska Legislature roster
# (ne/data/app/ne-legislature-members.json, fetched by
# ne/index.html's chamber card). Rebuilds the roster from the Legislature's own
# pages and, if anything changed, opens a PR rather than committing
# directly to main.
#
# Nebraska's Legislature has one chamber of 49 senators, elected on a ballot
# that names no party. Its senator list (nebraskalegislature.gov) links each
# district's senator page, which gives the e-mail address at leg.ne.gov and
# the one telephone the page prints.
#
# robots.txt: nebraskalegislature.gov's policy is read before the first fetch, with the
# User-Agent the fetches send, and a stated Crawl-delay is honoured; the
# builder paces the host regardless.
#
# THE REBUILT FILES ARE CARRIED ACROSS THE BRANCH CUT RATHER THAN FETCHED A
# SECOND TIME, the update-ilga-roster.yml pattern. A run where main changed
# those same files meanwhile errors at the checkout instead of pushing, which
# is right.
#
# THE PAGE STEPS LANDED WITH THE GO-LIVE CHANGE (batch 4 of the state-level
# launch). `ne/state-legislature.html` carries a GENERATED table of the roster, and
# `about.html` and `sitemap.xml` count them, so all three are
# regenerated here and staged in the same `git add`.

on:
  schedule:
    - cron: "13 22 * * 4" # Thursday 22:13 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # requests, which the shared robots.txt reader can use; the builder itself
      # fetches with the standard library.
      - name: Install dependencies
        run: pip install -c scripts/requirements.txt requests

      - name: Rebuild Nebraska Legislature roster
        run: python3 ne/scripts/build_ne_legislature_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, every data/app file must be present and
      # well formed, and every seat must carry a record.
      - name: Validate app + data files
        run: |
          python3 ne/scripts/validate_index.py ne/index.html
          python3 scripts/validate_chamber_rosters.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- ne/data/app/ne-legislature-members.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          branch="bot/ne-legislature-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut from main's current tip, with full history — see the sibling
          # workflows' own comments for why both halves matter. The two rebuilt
          # files ride across the checkout as working-tree changes.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          python3 scripts/build_officeholder_tables.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add ne/data/app/ne-legislature-members.json ne/state-legislature.html about.html sitemap.xml
          git commit -m "Update Nebraska Legislature roster from the Legislature's own site"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update Nebraska Legislature roster" \
              --body "Automated weekly refresh of the Nebraska chamber card's roster, from the Legislature's own site, generated by \`ne/scripts/build_ne_legislature_roster.py\`. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
