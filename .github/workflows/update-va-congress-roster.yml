name: Update U.S. House (Virginia) roster

# Weekly refresh of the Virginia congress card's roster
# (va/data/app/congress-roster.json, fetched by va/index.html). Rebuilds
# Virginia's 11 U.S. House members from unitedstates/congress-legislators and,
# if anything changed, opens a PR rather than committing directly to main —
# officeholder data should get a human look before it ships.
#
# THE PAGE STEPS LANDED WITH THE GO-LIVE CHANGE. While the instance was
# dark no page read this file. `va/congress.html` now carries a GENERATED
# table of this roster, and `about.html` and `sitemap.xml` count it, so all
# three are regenerated here and staged in the same `git add` — otherwise this
# workflow's own bot PR fails those pages' `--check` on numbers the PR is not
# about.
#
# THE MAP THESE MEMBERS ARE JOINED TO IS THE 2021 MAP, AND IT STAYS PAST
# 3 JANUARY 2027: the Supreme Court of Virginia blocked the 2026 redraw on
# 8 May 2026, so the members seated in January are elected from the same map.
# va/scripts/build_legislative_boundaries.py carries the measurement, and
# va/WATCH.md the date the map must be re-read.

on:
  schedule:
    - cron: "7 19 * * 1" # Monday 19:07 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # Pushed and PR-opened as BOT_PR_TOKEN so the resulting PR actually runs
      # CI. A PR opened with the default GITHUB_TOKEN fires no workflows
      # (GitHub suppresses recursive triggers), which left every roster PR with
      # zero checks. Falls back to github.token when the secret is absent, so
      # the workflow still runs — it just goes back to opening unchecked PRs.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # No third-party deps: the builder downloads the canonical
      # legislators-current.json with stdlib urllib and filters it to Virginia
      # (the state code comes from va/data/state/state.json, which is why that
      # directory ships in the repo).
      - name: Rebuild congress roster data file
        run: python3 va/scripts/build_congress_roster.py

      # Gate the regenerated data before it can reach a PR: the app must still
      # parse and carry every layer, and every data/app file must be present
      # and well formed.
      - name: Validate app + data files
        run: python3 va/scripts/validate_index.py va/index.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- va/data/app/congress-roster.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
        run: |
          # Fixed branch (not per-run): an unmerged roster PR is refreshed in
          # place by the force-push below instead of spawning a duplicate PR
          # every week.
          branch="bot/va-congress-roster-update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cut the branch from main's CURRENT tip, not from the checkout this
          # run started with: a branch that also differs from main in
          # .github/workflows/ reads to GitHub as the push updating a workflow
          # and is refused for a token without `workflow` scope. Full history,
          # because `git fetch --depth=1` RE-SHALLOWS a clone that was fetched
          # complete.
          git fetch origin main
          git checkout -B "$branch" FETCH_HEAD
          python3 va/scripts/build_congress_roster.py
          python3 scripts/build_officeholder_tables.py
          python3 scripts/build_about_page.py
          python3 scripts/build_sitemap.py
          git add va/data/app/congress-roster.json va/congress.html about.html sitemap.xml
          git commit -m "Update U.S. House (Virginia) roster from congress-legislators"
          git push -u origin "$branch" --force
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Update U.S. House (Virginia) roster from congress-legislators" \
              --body "Automated weekly refresh of the Virginia congress district card's roster, generated by \`va/scripts/build_congress_roster.py\` from unitedstates/congress-legislators. Please review the diff before merging — this changes data about real officeholders." \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch; force-push refreshed it."
          fi
